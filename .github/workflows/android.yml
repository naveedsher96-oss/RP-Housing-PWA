name: Android app

# Builds the Roshan RPHS Android app (android-app/).
# - Pull requests: checks that the app builds.
# - Run manually (Actions > Android app > Run workflow) on main: the signed
#   .aab to upload to Play Console (Internal testing first).

on:
  pull_request:
    paths:
      - 'android-app/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:
    inputs:
      version_code:
        description: 'Version code (must be higher than the last one uploaded to Play). Leave empty for automatic.'
        required: false
      version_name:
        description: 'Version name shown to users'
        required: false
        default: '2.0.0'

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android app
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4
      - name: Pick version
        env:
          INPUT_CODE: ${{ github.event.inputs.version_code }}
          INPUT_NAME: ${{ github.event.inputs.version_name }}
        run: |
          echo "RPHS_VERSION_CODE=${INPUT_CODE:-$(( ${{ github.run_number }} + 100 ))}" >> "$GITHUB_ENV"
          echo "RPHS_VERSION_NAME=${INPUT_NAME:-2.0.0}" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: android-app/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - name: Copy app settings into the Android project
        run: npx cap sync android

      - name: Check the app builds
        if: github.event_name == 'pull_request'
        working-directory: android-app/android
        run: ./gradlew --no-daemon assembleRelease

      - name: Build signed Play bundle
        if: github.event_name == 'workflow_dispatch'
        working-directory: android-app/android
        env:
          RPHS_KEYSTORE_BASE64: ${{ secrets.RPHS_KEYSTORE_BASE64 }}
          RPHS_KEYSTORE_PASSWORD: ${{ secrets.RPHS_KEYSTORE_PASSWORD }}
          RPHS_KEY_ALIAS: ${{ secrets.RPHS_KEY_ALIAS }}
          RPHS_KEY_PASSWORD: ${{ secrets.RPHS_KEY_PASSWORD }}
        run: |
          if [ -z "$RPHS_KEYSTORE_BASE64" ]; then
            echo "::error::The RPHS_KEYSTORE_BASE64 secret is missing. Add the upload key in Settings > Secrets and variables > Actions."
            exit 1
          fi
          export RPHS_KEYSTORE_FILE="$RUNNER_TEMP/upload.keystore"
          printf '%s' "$RPHS_KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -d > "$RPHS_KEYSTORE_FILE"
          ./gradlew --no-daemon bundleRelease
          rm -f "$RPHS_KEYSTORE_FILE"
          echo "Built version code $RPHS_VERSION_CODE ($RPHS_VERSION_NAME)" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: rphs-play-bundle-${{ env.RPHS_VERSION_CODE }}
          path: android-app/android/app/build/outputs/bundle/release/*.aab
