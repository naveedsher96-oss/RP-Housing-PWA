        });
        logAudit('fund', ref.id, 'create', `Fund "${title}" (${category}) started`);
        await broadcastNotification(`New Fund: ${title}`, `${purpose.slice(0, 140)} — open the Funds tab to contribute.`, 'funds');
        closeModal();
        loadFunds();
      } catch(err) {
        toast("Error starting fund: " + err.message);
      }
    });
  };

  window.openFundDetailModal = function(fundId) {
    const f = fundsList.find(item => item.id === fundId);
    if (!f) return;
    const isAdmin = currentUserProfile.role === 'admin';
    const status = f.status || 'active';
    const collected = fundVerifiedTotal(f.id);
    const acct = fundSummary(f.id, fundContribsList, fundExpensesList, fundTransfersList);
    const transfers = accountTransfers(fundTransfersList, 'fund', f.id);
    const spending = fundExpensesList
      .filter(x => expenseSource(x) === 'fund' && x.fundId === f.id)
      .sort((a, b) => String(b.expenseDate || '').localeCompare(String(a.expenseDate || '')));

    document.getElementById('modal-body').innerHTML = `
      <div style="display:flex; justify-content:space-between; align-items:center; gap:10px; padding-right:44px; margin-bottom:12px;">
        <span style="font-family:var(--font-display); font-size:19px; font-weight:600; color:var(--accent-2);">${escapeHtml(f.title || 'Fund')}</span>
        <span class="badge ${status}">${escapeHtml(statusLabel(status))}</span>
      </div>
      ${f.category ? `<div style="font-size:13px; color:var(--text-muted); margin-bottom:8px;">Category: <strong style="color:var(--accent-2);">${escapeHtml(f.category)}</strong></div>` : ''}
      <div style="font-size:13.5px; line-height:1.6; margin-bottom:14px; white-space:pre-wrap;">${escapeHtml(f.purpose || '')}</div>

      <div style="background:var(--bg-elevated-2); border:1px solid var(--border); border-radius:10px; padding:14px; margin-bottom:14px;">
        <div style="display:flex; justify-content:space-between; margin-bottom:8px;"><span style="font-size:13px; color:var(--text-muted);">Collected (verified)</span><span class="amount" style="color:var(--success);">${formatMoney(collected)}</span></div>
        <div style="display:flex; justify-content:space-between; margin-bottom:8px;"><span style="font-size:13px; color:var(--text-muted);">Spent from this fund</span><span class="amount" style="color:var(--danger);">${formatMoney(acct.spent)}</span></div>
        ${acct.transferredIn ? `<div style="display:flex; justify-content:space-between; margin-bottom:8px;"><span style="font-size:13px; color:var(--text-muted);">Transferred in</span><span class="amount" style="color:var(--success);">${formatMoney(acct.transferredIn)}</span></div>` : ''}
        ${acct.transferredOut ? `<div style="display:flex; justify-content:space-between; margin-bottom:8px;"><span style="font-size:13px; color:var(--text-muted);">Transferred out</span><span class="amount" style="color:var(--danger);">${formatMoney(acct.transferredOut)}</span></div>` : ''}
        <div style="display:flex; justify-content:space-between; margin-bottom:8px; padding-top:8px; border-top:1px solid var(--border);"><span style="font-size:13px; font-weight:700;">Balance</span><span class="amount" style="color:${balanceColor(acct.balance)};">${formatMoney(acct.balance)}</span></div>
        ${target > 0 ? `
          <div style="display:flex; justify-content:space-between; margin-bottom:4px;"><span style="font-size:13px; color:var(--text-muted);">Target</span><span style="font-size:13.5px; font-family:var(--font-mono);">${formatMoney(target)}</span></div>
          <div class="progress"><div class="fill" style="width:${pct}%;"></div></div>
          <div style="text-align:right; font-size:13px; color:var(--text-faint);">${pct}% reached</div>
        ` : ''}
        <div style="display:flex; justify-content:space-between; margin-bottom:4px;"><span style="font-size:13px; color:var(--text-muted);">Started</span><span style="font-size:13.5px;">${escapeHtml(formatDate(f.createdAt))} by ${escapeHtml(f.createdBy || 'Management')}</span></div>
        ${f.deadline ? `<div style="display:flex; justify-content:space-between;"><span style="font-size:13px; color:var(--text-muted);">Deadline</span><span style="font-size:13.5px;">${escapeHtml(formatDate(f.deadline))}</span></div>` : ''}
      </div>

      ${status === 'active' ? `
        <form id="contrib-form" style="margin-bottom:16px;">
          <label>Contribute — Amount (PKR)</label>
          <input type="number" id="contrib-amount" placeholder="e.g. 2000" required min="1" />
          <label>Payment Method</label>
          <select id="contrib-method" required>
            ${PAYMENT_METHODS.map(m => `<option value="${m}">${m}</option>`).join('')}
          </select>
          <label>Payment Date</label>
          <input type="date" id="contrib-date" value="${new Date().toISOString().slice(0,10)}" required />
          <label>Payment Proof (PNG, JPEG or PDF — optional)</label>
          <input type="file" id="contrib-file" accept="image/png,image/jpeg,application/pdf" />
          <label>Transaction Reference (optional)</label>
          <input type="text" id="contrib-ref" placeholder="e.g. bank / wallet transaction ID" />
          <button type="submit" class="btn primary block" style="margin-top:14px;">Submit Contribution</button>
        </form>
      ` : ''}

      ${isAdmin && status === 'active' ? `
        <button class="btn secondary block" onclick="openRecordContributionModal('${f.id}')" style="margin-bottom:10px;">+ Record Cash / Offline Contribution</button>
        <button class="btn danger block" onclick="closeFund('${f.id}')" style="margin-bottom:16px;">Close This Fund</button>
      ` : ''}

      <div class="section-title" style="font-size:15px; margin-bottom:8px;">${isAdmin ? 'Contributions' : 'My Contributions'}</div>
      <div id="fund-contribs">
        ${contribs.length ? contribs.map(c => `
          <div style="background:var(--bg-elevated-2); border:1px solid var(--border-soft); border-radius:10px; padding:12px; margin-bottom:8px;">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:4px;">
              <span style="font-size:13px; font-weight:700;">${isAdmin ? escapeHtml(c.name || 'Resident') + ' — ' + escapeHtml(c.house || 'N/A') : formatMoney(c.amount)}</span>
              <span class="badge ${c.status || 'submitted'}">${escapeHtml(statusLabel(c.status || 'submitted'))}</span>
            </div>
            ${isAdmin ? `<div style="font-size:13px; font-family:var(--font-mono); margin-bottom:4px;">${formatMoney(c.amount)}</div>` : ''}
            <div style="font-size:13px; color:var(--text-faint);">${escapeHtml(formatDate(c.createdAt))}${c.paymentRef ? ' · Ref: ' + escapeHtml(c.paymentRef) : ''}</div>
            ${c.status === 'rejected' && c.rejectedReason ? `<div style="font-size:13px; color:var(--danger); margin-top:4px;">Rejected: ${escapeHtml(c.rejectedReason)}</div>` : ''}
            ${c.proofData ? `<button class="btn sm secondary" style="margin-top:8px;" onclick="viewProofFile('contrib', '${c.id}')">View Proof</button>` : ''}
            ${isAdmin && c.status === 'submitted' ? `
              <div style="display:flex; gap:8px; margin-top:8px;">
                <button class="btn sm primary" onclick="verifyContribution('${c.id}')">Verify</button>
                <button class="btn sm danger" onclick="rejectContribution('${c.id}')">Reject</button>
              </div>
            ` : ''}
          </div>
        `).join('') : `<div style="font-size:13px; color:var(--text-muted);">No contributions ${isAdmin ? 'received' : 'made'} yet.</div>`}
      </div>

      <div class="section-title" style="font-size:15px; margin:16px 0 8px;">Spending From This Fund</div>
      <div id="fund-spending">
        ${spending.length ? spending.map(x => `
          <div style="background:var(--bg-elevated-2); border:1px solid var(--border-soft); border-radius:10px; padding:12px; margin-bottom:8px;">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:4px;">
              <span style="font-size:13px; font-weight:700;">${escapeHtml(x.category || 'Other')}</span>
              <span style="font-family:var(--font-mono); font-size:13px; color:var(--danger);">${formatMoney(x.amount)}</span>
            </div>
            <div style="font-size:13px; white-space:pre-wrap; margin-bottom:4px;">${escapeHtml(x.description || '')}</div>
            <div style="font-size:13px; color:var(--text-faint);">${escapeHtml(x.expenseDate || '')} · Entered by ${escapeHtml(x.enteredBy || 'Management')}</div>
          </div>
        `).join('') : `<div style="font-size:13px; color:var(--text-muted);">Nothing has been spent from this fund yet.</div>`}
      </div>

      <div class="section-title" style="font-size:15px; margin:16px 0 8px;">Transfers</div>
      <div id="fund-transfers">${renderTransferRows(transfers, 'fund', f.id)}</div>
    `;
    openModal();

    const contribForm = document.getElementById('contrib-form');
    if (contribForm) {
      contribForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const submitBtn = e.target.querySelector('button[type="submit"]');
        submitBtn.disabled = true;
        try {
          const amount = Number(document.getElementById('contrib-amount').value.trim());
          if (!amount || amount <= 0) throw new Error("Please enter a valid amount.");
          const file = document.getElementById('contrib-file').files[0];
          const proof = file ? await readProofFile(file) : null;
          const paymentRef = document.getElementById('contrib-ref').value.trim();
          const paymentMethod = document.getElementById('contrib-method').value;
          const paymentDate = document.getElementById('contrib-date').value;

          await db.collection('fund_contributions').add({
            fundId: f.id,
            fundTitle: f.title,
            category: f.category || 'Other',
            uid: auth.currentUser.uid,
            name: currentUserProfile.name,
            house: currentUserProfile.house || '',
            amount,
            currency: 'PKR',
            paymentRef,
            paymentMethod,
            paymentDate,
            proofData: proof ? proof.dataUrl : '',
            proofType: proof ? proof.type : '',
            proofName: proof ? proof.name : '',
            status: 'submitted',
            createdAt: firebase.firestore.FieldValue.serverTimestamp()
          });
          await notifyAdmins(`Fund Contribution (${f.title})`, `${currentUserProfile.name} (${currentUserProfile.house || 'N/A'}) submitted ${formatMoney(amount)}${proof ? ' with payment proof' : ''}.`, 'info');
          closeModal();
          loadFunds();
        } catch(err) {
          toast("Error submitting contribution: " + err.message);
          submitBtn.disabled = false;
        }
      });
    }
  };

  window.openRecordContributionModal = async function(fundId) {
    const f = fundsList.find(item => item.id === fundId);
    if (!f || currentUserProfile.role !== 'admin') return;

    let residents = [];
    try {
      const snap = await db.collection('users').where('approved', '==', true).get();
      residents = snap.docs.map(doc => ({ uid: doc.id, ...doc.data() })).filter(r => r.suspended !== true);
    } catch(e) {
      console.error("Error loading residents:", e);
    }

    document.getElementById('modal-body').innerHTML = `
      <div style="font-family:var(--font-display); font-size:20px; font-weight:600; margin-bottom:4px;">Record Contribution</div>
      <div style="font-size:13px; color:var(--text-muted); margin-bottom:14px;">Fund: <strong>${escapeHtml(f.title)}</strong></div>
      <form id="record-contrib-form">
        <label>Resident</label>
        ${pickerHtml('record-contrib-resident', residents
          .slice().sort((a, b) => (a.role === 'resident') === (b.role === 'resident') ? String(a.name || '').localeCompare(String(b.name || '')) : (a.role === 'resident' ? -1 : 1))
          .map(r => ({ value: r.uid, label: (r.name || 'Resident') + (r.uid === auth.currentUser.uid ? ' (you)' : ''), sub: r.house || 'House not set', tag: r.role !== 'resident' ? r.role : '', avatarClass: r.role !== 'resident' ? 'staff' : '', group: r.role === 'resident' ? 'Residents' : 'Management' })),
          { placeholder: 'Choose a resident', searchPlaceholder: 'Search by name or house…' })}
        <label>Amount (PKR)</label>
        <input type="number" id="record-contrib-amount" placeholder="e.g. 5000" required min="1" />
        <label>Payment Method</label>
        <select id="record-contrib-method" required>
          ${PAYMENT_METHODS.map(m => `<option value="${m}" ${m === 'Cash' ? 'selected' : ''}>${m}</option>`).join('')}
        </select>
        <label>Payment Date</label>
        <input type="date" id="record-contrib-date" value="${new Date().toISOString().slice(0,10)}" required />
        <label>Reference / Note (optional)</label>
        <input type="text" id="record-contrib-ref" placeholder="e.g. Cash received at office" />
        <button type="submit" class="btn primary block" style="margin-top:16px;">Record as Verified</button>
      </form>
    `;
    openModal();

    document.getElementById('record-contrib-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const uid = document.getElementById('record-contrib-resident').value;
      const amount = Number(document.getElementById('record-contrib-amount').value);
      const paymentRef = document.getElementById('record-contrib-ref').value.trim();
      const paymentMethod = document.getElementById('record-contrib-method').value;
      const paymentDate = document.getElementById('record-contrib-date').value;
      const r = residents.find(item => item.uid === uid);
      if (!amount || amount <= 0) { toast("Please enter a valid amount."); return; }

      try {
        await db.collection('fund_contributions').add({
          fundId: f.id,
          fundTitle: f.title,
          category: f.category || 'Other',
          uid,
          name: r ? r.name : '',
          house: r ? (r.house || '') : '',
          amount,
          currency: 'PKR',
          paymentRef,
          paymentMethod,
          paymentDate,
          proofData: '',
          proofType: '',
          proofName: '',
          status: 'verified',
          recordedBy: currentUserProfile.name,
          verifiedAt: firebase.firestore.FieldValue.serverTimestamp(),
          verifiedBy: currentUserProfile.name,
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });
        await sendNotification(uid, `Contribution Recorded (${f.title})`, `Management recorded your contribution of ${formatMoney(amount)}. Thank you for supporting the community!`, 'success');
        closeModal();
        loadFunds();
      } catch(err) {
        toast("Error recording contribution: " + err.message);
      }
    });
  };

  window.verifyContribution = async function(contribId) {
    const c = fundContribsList.find(item => item.id === contribId);
    if (!c || currentUserProfile.role !== 'admin') return;
    if (!(await confirmSheet({ title: 'Verify this contribution?', body: `${formatMoney(c.amount)} from ${c.name}`, okLabel: 'Verify' }))) return;

    try {
      await db.collection('fund_contributions').doc(contribId).update({
        status: 'verified',
        verifiedAt: firebase.firestore.FieldValue.serverTimestamp(),
        verifiedBy: currentUserProfile.name
      });
      logAudit('contribution', contribId, 'update', `Contribution verified — ${c.name} ${formatMoney(c.amount)} (${c.fundTitle})`);
      await sendNotification(c.uid, `Contribution Verified (${c.fundTitle})`, `Your contribution of ${formatMoney(c.amount)} has been verified. Thank you for supporting the community!`, 'success');
      closeModal();
      loadFunds();
    } catch(err) {
      toast("Error verifying contribution: " + err.message);
    }
  };

  window.rejectContribution = async function(contribId) {
    const c = fundContribsList.find(item => item.id === contribId);
    if (!c || currentUserProfile.role !== 'admin') return;
    const reason = await promptSheet({ title: 'Reject this contribution?', body: `${c.name || ''} · ${formatMoney(c.amount)}`, label: 'Reason they will see', multiline: true, required: true, okLabel: 'Reject', danger: true });
    if (reason === null) return;

    try {
      await db.collection('fund_contributions').doc(contribId).update({
        status: 'rejected',
        rejectedReason: reason.trim()
      });
      logAudit('contribution', contribId, 'update', `Contribution rejected — ${c.name} ${formatMoney(c.amount)}: ${reason.trim()}`);
      await sendNotification(c.uid, `Contribution Rejected (${c.fundTitle})`, `Reason: ${reason.trim()}. Please contact management or submit again.`, 'error');
      closeModal();
      loadFunds();
    } catch(err) {
      toast("Error rejecting contribution: " + err.message);
    }
  };

  window.closeFund = async function(fundId) {
    const f = fundsList.find(item => item.id === fundId);
    if (!f || currentUserProfile.role !== 'admin') return;
    if (!(await confirmSheet({ title: `Close "${f.title}"?`, body: 'Residents will no longer be able to contribute.', okLabel: 'Close fund', danger: true }))) return;

    try {
      await db.collection('funds').doc(fundId).update({ status: 'closed' });
      logAudit('fund', fundId, 'update', `Fund "${f.title}" closed — total ${formatMoney(fundVerifiedTotal(f.id))}`);
      await broadcastNotification(`Fund Closed: ${f.title}`, `Total collected: ${formatMoney(fundVerifiedTotal(f.id))}. Thank you to everyone who contributed.`, 'funds');
      closeModal();
      loadFunds();
    } catch(err) {

  // --- ADMIN DASHBOARD ---
  const CHART_COLORS = ['#F2A93B', '#34B398', '#6E8FF2', '#E5615A', '#FFC670', '#9AA0C3', '#B37FEB', '#5AD8A6'];

  function svgDonut(segments, centerLabel, centerValue) {
    const total = segments.reduce((s, x) => s + x.value, 0);
    if (!total) return '<div style="text-align:center; color:var(--text-muted); font-size:13px; padding:20px 0;">No data yet.</div>';
    const R = 54, C = 2 * Math.PI * R;
    let offset = 0;
    const rings = segments.map((seg, i) => {
      const frac = seg.value / total;
      const dash = frac * C;
      const el = `<circle r="${R}" cx="70" cy="70" fill="none" stroke="${seg.color || CHART_COLORS[i % CHART_COLORS.length]}" stroke-width="18" stroke-dasharray="${dash} ${C - dash}" stroke-dashoffset="${-offset}" transform="rotate(-90 70 70)"></circle>`;
      offset += dash;
      return el;
    }).join('');
    const legend = segments.map((seg, i) => `
      <div style="display:flex; align-items:center; gap:7px; font-size:13px; margin-bottom:5px;">
        <span style="width:10px; height:10px; border-radius:3px; background:${seg.color || CHART_COLORS[i % CHART_COLORS.length]}; flex-shrink:0;"></span>
        <span style="color:var(--text-muted); flex:1;">${escapeHtml(seg.label)}</span>
        <span style="font-weight:600;">${seg.money === false ? seg.value : formatMoney(seg.value)}</span>
      </div>`).join('');
    return `
      <div style="display:flex; align-items:center; gap:16px; flex-wrap:wrap;">
        <svg width="140" height="140" viewBox="0 0 140 140" style="flex-shrink:0;">
          ${rings}
          <text x="70" y="65" text-anchor="middle" fill="var(--text-muted)" font-size="10">${escapeHtml(centerLabel || '')}</text>
          <text x="70" y="82" text-anchor="middle" fill="var(--text)" font-size="13" font-weight="700">${escapeHtml(centerValue || '')}</text>
        </svg>
        <div style="flex:1; min-width:130px;">${legend}</div>
      </div>`;
  }

  // Maintenance Bills donut: same colours as the status pills everywhere else.
  function billStatusSegments(paid, due, review) {
    return [
      { label: 'Paid', value: paid, money: false, color: '#3CC2A2' },
      { label: 'Due / overdue', value: due, money: false, color: '#EF6B63' },
      { label: 'In review', value: review, money: false, color: '#7D9BF5' }
    ].filter(s => s.value > 0);
  }

  function svgBars(data) {
    if (!data.length || !data.some(d => d.value > 0)) return '<div style="text-align:center; color:var(--text-muted); font-size:13px; padding:20px 0;">No data yet.</div>';
    const max = Math.max(...data.map(d => d.value), 1);
    const W = 300, H = 130, bw = Math.min(34, (W - 10) / data.length - 10);
    const bars = data.map((d, i) => {
      const x = 10 + i * ((W - 10) / data.length);
      const h = Math.round((d.value / max) * 88);
      return `
        <rect x="${x}" y="${108 - h}" width="${bw}" height="${h}" rx="4" fill="var(--accent)" opacity="0.9"></rect>
        <text x="${x + bw / 2}" y="${102 - h}" text-anchor="middle" fill="var(--text-muted)" font-size="8.5">${d.value ? Math.round(d.value / 1000) + 'k' : ''}</text>
        <text x="${x + bw / 2}" y="${H - 8}" text-anchor="middle" fill="var(--text-faint)" font-size="9">${escapeHtml(d.label)}</text>`;
    }).join('');
    return `<svg width="100%" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">${bars}</svg>`;
  }

  function loadDashboard() {
    if (!db || !isStaff()) return;
    Promise.all([
      db.collection('users').get(),
      db.collection('bills').get(),
      db.collection('fund_contributions').get(),

      billsLoaded = true;
      pendingResidents = usersSnap.docs.map(doc => ({ uid: doc.id, ...doc.data() }))
        .filter(u => u.role === 'resident' && u.approved === false && u.membershipStatus !== 'rejected');

      const expenses = expSnap.docs.map(d => d.data()).filter(x => !x.isDeleted);
      const tickets = ticketsSnap.docs.map(d => d.data()).filter(t => !t.isDeleted);

  function renderDashboard(d) {
    const el = document.getElementById('dashboard-body');
    if (!el) return;

    const residents = d.users.filter(u => u.role === 'resident' && u.approved === true && u.suspended !== true).length;
    const pendingApprovals = d.users.filter(u => u.role === 'resident' && u.approved === false && u.membershipStatus !== 'rejected').length;

    const paidBills = d.bills.filter(b => b.status === 'paid');
    const unpaidBills = d.bills.filter(b => b.status === 'unpaid');
    const inReviewBills = d.bills.filter(b => b.status === 'submitted');
    const billed = d.bills.reduce((s, b) => s + Number(b.amount || 0), 0);
    const collectedBills = paidBills.reduce((s, b) => s + Number(b.amount || 0), 0);
    const verifiedContribs = d.contribs.filter(c => c.status === 'verified');
    const contribTotal = verifiedContribs.reduce((s, c) => s + Number(c.amount || 0), 0);
    const spentTotal = d.expenses.reduce((s, x) => s + Number(x.amount || 0), 0);
    const openTickets = d.tickets.filter(t => ['pending', 'in-progress'].includes(t.status)).length;
    const billsAcct = billsAccountSummary(d.bills, d.expenses, d.transfers);
    const fundsAcct = allFundsSummary(d.contribs, d.expenses, d.transfers);

    // last 6 months collections (paid bills + verified contributions)
    const months = [];
    const now = new Date();
    for (let i = 5; i >= 0; i--) {
      const dt = new Date(now.getFullYear(), now.getMonth() - i, 1);
      months.push({ key: dt.getFullYear() + '-' + String(dt.getMonth() + 1).padStart(2, '0'), label: dt.toLocaleString('en', { month: 'short' }), value: 0 });
    }
    const addToMonth = (dateVal, amount) => {
      const dt = toDate(dateVal) || (typeof dateVal === 'string' && dateVal ? new Date(dateVal) : null);
      if (!dt || isNaN(dt)) return;
      const key = dt.getFullYear() + '-' + String(dt.getMonth() + 1).padStart(2, '0');
      const m = months.find(x => x.key === key);
      if (m) m.value += Number(amount || 0);
    };
    paidBills.forEach(b => addToMonth(b.paidAt || b.paymentDate, b.amount));
    verifiedContribs.forEach(c => addToMonth(c.paymentDate || c.createdAt, c.amount));

    // spend by category
    const spendCats = {};
    d.expenses.forEach(x => { const k = x.category || 'Other'; spendCats[k] = (spendCats[k] || 0) + Number(x.amount || 0); });
    const spendSegs = Object.entries(spendCats).map(([label, value]) => ({ label, value })).sort((a, b) => b.value - a.value).slice(0, 7);

    // contributions by category
    const contribCats = {};
    verifiedContribs.forEach(c => { const k = c.category || 'Other'; contribCats[k] = (contribCats[k] || 0) + Number(c.amount || 0); });
    const contribSegs = Object.entries(contribCats).map(([label, value]) => ({ label, value })).sort((a, b) => b.value - a.value).slice(0, 7);

    const stat = (label, value, color) => `
      <div style="background:var(--bg-elevated); border:1px solid var(--border); border-radius:var(--radius-sm); padding:12px 14px;">
        <div style="font-size:13px; color:var(--text-muted); margin-bottom:4px;">${label}</div>
        <div style="font-family:var(--font-display); font-size:18px; font-weight:700; color:${color || 'var(--text)'};">${value}</div>
      </div>`;

    el.innerHTML = `
      ${renderStaffNeedsYou(d, { pendingApprovals, inReview: inReviewBills.length, openTickets })}
      ${renderSummariesCard()}
      <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:14px;">
        ${stat('Approved Residents', residents)}
        ${stat('Pending Approvals', pendingApprovals, pendingApprovals ? 'var(--warning)' : 'var(--text)')}
        ${stat('Open Complaints', openTickets, openTickets ? 'var(--info)' : 'var(--text)')}
        ${stat('Proofs In Review', inReviewBills.length, inReviewBills.length ? 'var(--warning)' : 'var(--text)')}
        ${stat('Total Collected', formatMoney(collectedBills + contribTotal), 'var(--success)')}
        ${stat('Total Spent', formatMoney(spentTotal), 'var(--danger)')}
        ${stat('Bills Account Balance', formatMoney(billsAcct.balance), balanceColor(billsAcct.balance))}
        ${stat('Funds Balance', formatMoney(fundsAcct.balance), balanceColor(fundsAcct.balance))}
      </div>

      <div class="card" style="cursor:default; margin-bottom:14px;">
        <div style="font-weight:700; font-size:14px; margin-bottom:10px;">Monthly Collections — last 6 months</div>
        ${svgBars(months)}
      </div>

      <div class="card" style="cursor:default; margin-bottom:14px;">
        <div style="font-weight:700; font-size:14px; margin-bottom:10px;">Maintenance Bills</div>
        ${svgDonut(billStatusSegments(paidBills.length, unpaidBills.length, inReviewBills.length), 'Billed', 'PKR ' + Math.round(billed / 1000) + 'k')}
      </div>

      <div class="card" style="cursor:default; margin-bottom:14px;">
        <div style="font-weight:700; font-size:14px; margin-bottom:10px;">Contributions by Category (verified)</div>
        ${svgDonut(contribSegs, 'Collected', 'PKR ' + Math.round(contribTotal / 1000) + 'k')}
      </div>

      <div class="card" style="cursor:default;">
        <div style="font-weight:700; font-size:14px; margin-bottom:10px;">Spending by Category</div>
        ${svgDonut(spendSegs, 'Spent', 'PKR ' + Math.round(spentTotal / 1000) + 'k')}
      </div>
    `;
  }

  // --- MONTHLY FINANCIAL SUMMARIES ---
  // monthly_summaries/{YYYY-MM} is written by the postMonthlyFinancialSummary
  // Cloud Function on the 1st (and by admin's "Generate" via
  // settings/monthlySummary.runRequest). Everyone signed in can read them.
  function findSummary(month) {
    return monthlySummaries.find(s => s.month === month || s.id === month);
  }

  async function getSummary(month) {
    const cached = findSummary(month);
    if (cached) return cached;
    const doc = await db.collection('monthly_summaries').doc(month).get();
    if (!doc.exists) throw new Error(`No summary has been generated for ${monthLabel(month)} yet.`);
    const s = { id: doc.id, ...doc.data() };
    monthlySummaries.push(s);
    return s;
  }

  // 96500 -> "96.5k", 1250000 -> "1.25M"
  function kAmount(n) {
    n = Number(n || 0);
    const a = Math.abs(n);
    if (a >= 1e6) return (n / 1e6).toFixed(2).replace(/\.?0+$/, '') + 'M';
    if (a >= 1000) return (n / 1000).toFixed(1).replace(/\.0$/, '') + 'k';
    return String(Math.round(n));
  }

        </div>
        <div style="font-size:13px; color:var(--text-faint); margin-bottom:8px;">Posted automatically on the 1st of every month: what came in, what was spent and the closing balances. Amounts in PKR.</div>
        ${rows.length ? rows.map(s => `
          <div style="display:flex; justify-content:space-between; align-items:center; gap:10px; padding:9px 0; border-top:1px solid var(--border);">

                <span>Net <b style="color:${netColor(s.totals ? s.totals.net : 0)};">${s.totals && s.totals.net < 0 ? '−' : '+'}${kAmount(Math.abs(s.totals ? s.totals.net : 0))}</b></span>

  window.downloadMonthlySummaryPDF = async function(month) {
    try {
      const [{ jsPDF }, s] = await Promise.all([ensureJsPDF(), getSummary(month)]);
      const b = s.bills || {}, c = s.contributions || {}, x = s.expenses || {}, bal = s.balances || {};
      const period = s.period || monthLabel(s.month);
      const doc = new jsPDF();
      const pageH = doc.internal.pageSize.getHeight();
      let y = 0;
      const header = () => {
        doc.setFont("helvetica", "bold"); doc.setFontSize(16);
        doc.text("Roshan Pakistan Housing Society", 105, 16, { align: "center" });
        doc.setFont("helvetica", "normal"); doc.setFontSize(11);
        doc.text(`Monthly Financial Summary - ${period}`, 105, 23, { align: "center" });
        doc.setFontSize(9);
        doc.text(`Balances as of ${s.asOf || formatDate(s.generatedAt)}  |  ${s.members || 0} approved members  |  Downloaded ${formatDate(new Date())}`, 105, 29, { align: "center" });
        doc.line(15, 33, 195, 33);
        y = 42;
      };
      const room = h => { if (y + h > pageH - 14) { doc.addPage(); header(); } };
      const heading = t => { room(16); y += 3; doc.setFont("helvetica", "bold"); doc.setFontSize(11.5); doc.text(t, 15, y); y += 7; };
      const cols = (defs, values, bold) => {
        room(7);
        doc.setFont("helvetica", bold ? "bold" : "normal"); doc.setFontSize(8.5);
        defs.forEach((col, i) => doc.text(String(values[i] === undefined || values[i] === null ? '' : values[i]).slice(0, col.max || 80), col.x, y, { align: col.align || 'left' }));
        y += 6;
      };
      const rule = () => { doc.setDrawColor(200); doc.line(15, y - 4, 195, y - 4); doc.setDrawColor(0); };
      const kv = (k, v, bold) => cols([{ x: 15 }, { x: 195, align: 'right' }], [k, v], bold);
      header();

      heading("At a Glance");
      kv("Collected (bills paid + verified contributions)", formatMoney(s.totals && s.totals.in));
      kv("Spent", formatMoney(s.totals && s.totals.out));
      kv("Net for the month", `${s.totals && s.totals.net < 0 ? '-' : '+'}${formatMoney(Math.abs(s.totals ? s.totals.net : 0))}`, true);
      kv("Bills account balance", formatMoney(bal.bills && bal.bills.balance), true);
      kv("Community funds balance", formatMoney(bal.funds && bal.funds.balance), true);
      kv("Outstanding (unpaid bills)", `${formatMoney(b.outstandingAmount)} on ${b.outstandingCount || 0} bill(s) from ${b.owingHouses || 0} house(s)`);

      heading("Collected");
      kv(`Maintenance bills paid (${b.collectedCount || 0})`, formatMoney(b.collectedAmount));
      kv(`Bills issued for ${period} (${b.issuedCount || 0})`, formatMoney(b.issuedAmount));
      kv(`Fund contributions verified (${c.count || 0})`, formatMoney(c.amount));
      (c.byFund || []).forEach(f => kv(`    ${f.label}`, formatMoney(f.value)));

      heading("Spent by Category");
      if (!(x.byCategory || []).length) cols([{ x: 15 }], ['No expenses recorded this month.']);
      (x.byCategory || []).forEach(r => kv(r.label, formatMoney(r.value)));
      (x.bySource || []).forEach(r => kv(`Paid from ${r.label}`, formatMoney(r.value)));
      rule(); kv("Total spent", formatMoney(x.amount), true);

      if ((x.items || []).length) {
        heading("Expense Details");
        const EXP_COLS = [{ x: 15, max: 10 }, { x: 36, max: 15 }, { x: 68, max: 36 }, { x: 138, max: 20 }, { x: 195, align: 'right' }];
        cols(EXP_COLS, ['Date', 'Category', 'Description', 'Paid From', 'Amount'], true);
        rule();
        x.items.forEach(i => cols(EXP_COLS, [i.date, i.category, i.description, i.source, formatMoney(i.amount)]));
      }

      if ((s.transfers || []).length) {
        heading("Transfers Between Accounts");
        const TR_COLS = [{ x: 15, max: 10 }, { x: 36, max: 20 }, { x: 78, max: 20 }, { x: 120, max: 24 }, { x: 195, align: 'right' }];
        cols(TR_COLS, ['Date', 'From', 'To', 'Note', 'Amount'], true);
        rule();
        s.transfers.forEach(t => cols(TR_COLS, [t.date, t.from, t.to, t.note, formatMoney(t.amount)]));
      }

      heading("Closing Balances");
      const bb = bal.bills || {}, fb = bal.funds || {};
      kv("Bills account: collected to date", formatMoney(bb.collected));
      kv("  less expenses paid from Bills account", `- ${formatMoney(bb.spent)}`);
      if (bb.transferredIn) kv("  plus transfers in", `+ ${formatMoney(bb.transferredIn)}`);
      if (bb.transferredOut) kv("  less transfers out", `- ${formatMoney(bb.transferredOut)}`);
      kv("Bills account balance", formatMoney(bb.balance), true);
      y += 2;
      kv("Funds: verified contributions to date", formatMoney(fb.collected));
      kv("  less expenses paid from funds", `- ${formatMoney(fb.spent)}`);
      if (fb.transferredIn) kv("  plus transfers in", `+ ${formatMoney(fb.transferredIn)}`);
      if (fb.transferredOut) kv("  less transfers out", `- ${formatMoney(fb.transferredOut)}`);
      kv("Community funds balance", formatMoney(fb.balance), true);
      (bal.perFund || []).forEach(f => kv(`    ${f.title}`, formatMoney(f.balance)));

      room(14);
      y += 4;
      doc.setFont("helvetica", "italic"); doc.setFontSize(8);
      doc.text("Collections are counted in the month the payment was made/verified; expenses in the month of the expense date. Balances are running totals since records began. Cancelled and archived entries are excluded.", 15, y, { maxWidth: 180 });

      const fileName = `RPHS_Monthly_Summary_${s.month}.pdf`;
      doc.save(fileName);
      logExport('monthly_summary', fileName);
    } catch (err) {
      toast("Error generating summary PDF: " + err.message);
    }
  };

    try {
      await db.collection('settings').doc('monthlySummary').set({
        runRequest: { month, by: currentUserProfile.name, at: firebase.firestore.FieldValue.serverTimestamp() }
      }, { merge: true });
      logAudit('settings', 'monthlySummary', 'update', `Monthly summary for ${label} ${regenerate ? 'regeneration' : 'generation'} requested`);
      closeModal();
      toast(`Generating the ${label} summary… it will appear in Announcements and the Dashboard in a few seconds.`);

  // --- MONEY SOURCES ---
  // Every expense is paid from one of two pools: the Bills account (all verified
  // maintenance bill payments) or a specific community Fund. Legacy expenses
  // without a `source` are treated as Bills-account spending.
  const sumAmounts = (arr) => arr.reduce((s, x) => s + Number(x.amount || 0), 0);

  function expenseSource(x) {
    return x && x.source === 'fund' && x.fundId ? 'fund' : 'bills';
  }

  function expenseSourceLabel(x) {
    return expenseSource(x) === 'fund' ? `Fund: ${x.fundTitle || 'Community Fund'}` : 'Bills account';
  }

  // Transfers move money between pools without touching bills or contributions:
  // { fromType: 'bills'|'fund', fromFundId, toType: 'bills'|'fund', toFundId, amount, note }
  function transferEnd(t, end) {
    const type = t[end + 'Type'] === 'fund' ? 'fund' : 'bills';
    return { type, fundId: type === 'fund' ? (t[end + 'FundId'] || '') : '', title: t[end + 'FundTitle'] || 'Fund' };
  }

  function transferEndLabel(t, end) {
    const e = transferEnd(t, end);
    return e.type === 'fund' ? `Fund: ${e.title}` : 'Bills account';
  }

  function isAccount(end, type, fundId) {
    return end.type === type && (type === 'bills' || end.fundId === fundId);
  }

  function transferTotals(transfers, type, fundId) {
    const live = (transfers || []).filter(t => !t.isDeleted);
    return {
      transferredIn: sumAmounts(live.filter(t => isAccount(transferEnd(t, 'to'), type, fundId))),
      transferredOut: sumAmounts(live.filter(t => isAccount(transferEnd(t, 'from'), type, fundId)))
    };
  }

  function accountTransfers(transfers, type, fundId) {
    return (transfers || [])
      .filter(t => !t.isDeleted && (isAccount(transferEnd(t, 'from'), type, fundId) || isAccount(transferEnd(t, 'to'), type, fundId)))
      .sort((a, b) => String(b.transferDate || '').localeCompare(String(a.transferDate || '')));
  }

  function billsAccountSummary(bills, expenses, transfers) {
    const collected = sumAmounts(bills.filter(b => !b.isDeleted && b.status === 'paid'));
    const spent = sumAmounts(expenses.filter(x => !x.isDeleted && expenseSource(x) === 'bills'));
    const tr = transferTotals(transfers, 'bills');
    return { collected, spent, ...tr, balance: collected - spent + tr.transferredIn - tr.transferredOut };
  }

  function fundSummary(fundId, contribs, expenses, transfers) {
    const collected = sumAmounts(contribs.filter(c => !c.isDeleted && c.fundId === fundId && c.status === 'verified'));
    const spent = sumAmounts(expenses.filter(x => !x.isDeleted && expenseSource(x) === 'fund' && x.fundId === fundId));
    const tr = transferTotals(transfers, 'fund', fundId);
    return { collected, spent, ...tr, balance: collected - spent + tr.transferredIn - tr.transferredOut };
  }

  // All funds together: fund-to-fund transfers count as both in and out, so they net to zero.
  function allFundsSummary(contribs, expenses, transfers) {
    const collected = sumAmounts(contribs.filter(c => !c.isDeleted && c.status === 'verified'));
    const spent = sumAmounts(expenses.filter(x => !x.isDeleted && expenseSource(x) === 'fund'));
    const live = (transfers || []).filter(t => !t.isDeleted);
    const transferredIn = sumAmounts(live.filter(t => transferEnd(t, 'to').type === 'fund'));
    const transferredOut = sumAmounts(live.filter(t => transferEnd(t, 'from').type === 'fund'));
    return { collected, spent, transferredIn, transferredOut, balance: collected - spent + transferredIn - transferredOut };
  }

  function balanceBreakdown(s) {
    const parts = [`${formatMoney(s.collected)} collected`, `${formatMoney(s.spent)} spent`];
    if (s.transferredIn) parts.push(`${formatMoney(s.transferredIn)} transferred in`);
    if (s.transferredOut) parts.push(`${formatMoney(s.transferredOut)} transferred out`);
    return parts.join(' · ');
  }

  function renderTransferRows(transfers, viewType, viewFundId) {
    if (!transfers.length) return '<div style="font-size:13px; color:var(--text-muted);">No transfers yet.</div>';
    return transfers.map(t => {
      const outgoing = isAccount(transferEnd(t, 'from'), viewType, viewFundId);
      return `
        <div style="background:var(--bg-elevated-2); border:1px solid var(--border-soft); border-radius:10px; padding:12px; margin-bottom:8px;">
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:4px;">
            <span style="font-size:13px; font-weight:700;">${outgoing ? 'To' : 'From'} ${escapeHtml(transferEndLabel(t, outgoing ? 'to' : 'from'))}</span>
            <span style="font-family:var(--font-mono); font-size:13px; color:${outgoing ? 'var(--danger)' : 'var(--success)'};">${outgoing ? '−' : '+'}${formatMoney(t.amount)}</span>
          </div>
          <div style="font-size:13px; white-space:pre-wrap; margin-bottom:4px;">${escapeHtml(t.note || '')}</div>
          <div style="font-size:13px; color:var(--text-faint);">${escapeHtml(t.transferDate || '')} · By ${escapeHtml(t.enteredBy || 'Management')}</div>
        </div>`;
    }).join('');
  }

  function balanceColor(v) {
    return v < 0 ? 'var(--danger)' : 'var(--success)';
  }

  // --- EXPENSES (STAFF) ---
  // Fetches expenses plus everything needed to compute source balances
  // (paid bills, funds, verified contributions) and stores them in
  // expensesList / expenseSources.
  function fetchExpenseData() {
    return Promise.all([
      db.collection('expenses').get(),
      db.collection('bills').get(),
      db.collection('funds').get(),
      db.collection('fund_contributions').get(),
      db.collection('transfers').get()
    ]).then(([expSnap, billsSnap, fundsSnap, contribsSnap, transfersSnap]) => {
      expensesList = expSnap.docs
        .map(doc => ({ id: doc.id, ...doc.data() }))
        .filter(x => !x.isDeleted)
        .sort((a, b) => String(b.expenseDate || '').localeCompare(String(a.expenseDate || '')));
      expenseSources = {
        bills: billsSnap.docs.map(d => ({ id: d.id, ...d.data() })).filter(b => !b.isDeleted),
        funds: fundsSnap.docs.map(d => ({ id: d.id, ...d.data() })).filter(f => !f.isDeleted),
        contribs: contribsSnap.docs.map(d => ({ id: d.id, ...d.data() })).filter(c => !c.isDeleted),
        transfers: transfersSnap.docs.map(d => ({ id: d.id, ...d.data() })).filter(t => !t.isDeleted)
      };
    });
  }

  function loadExpenses() {
    if (!db || !isStaff()) return;
    fetchExpenseData()
      .then(renderExpensesList)
      .catch(e => { console.error("Error loading expenses:", e); showLoadError('expenses-list', e); });
  }

  function renderExpenseFilterBar() {
    const f = expenseFilter;
    const cats = [...new Set([...EXPENSE_CATEGORIES, ...expensesList.map(x => x.category || 'Other')])];
    return `
      <div class="filter-bar">
        <label>Filter Expenses</label>
        <div style="display:flex; gap:8px;">
          <select onchange="setExpenseFilter('month', this.value)" style="flex:1; min-width:0;">
            <option value="all" ${f.month==='all'?'selected':''}>All months</option>

          </select>
          <select onchange="setExpenseFilter('category', this.value)" style="flex:1; min-width:0;">
            <option value="all" ${f.category==='all'?'selected':''}>All categories</option>
            ${cats.map(c => `<option value="${escapeHtml(c)}" ${f.category===c?'selected':''}>${escapeHtml(c)}</option>`).join('')}
          </select>
        </div>
        <div style="display:flex; gap:8px; margin-top:8px;">
          <select onchange="setExpenseFilter('source', this.value)" style="flex:1; min-width:0;">
            <option value="all" ${f.source==='all'?'selected':''}>Bills account + Funds</option>

    `;
