<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<title>Roshan Pakistan Housing Society</title>
<meta name="theme-color" content="#10142A" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Roshan RPHS" />
<meta name="mobile-web-app-capable" content="yes" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<!-- Firebase Compatibility SDKs -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-messaging-compat.js"></script>

<!-- jsPDF for Admin PDF Export -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
  :root{
    --bg:#10142A;
    --bg-elevated:#171C3B;
    --bg-elevated-2:#1E2447;
    --bg-elevated-3:#242B54;
    --accent:#F2A93B;
    --accent-2:#FFC670;
    --accent-soft:rgba(242,169,59,0.14);
    --text:#F1F2F9;
    --text-muted:#9AA0C3;
    --text-faint:#6B7099;
    --success:#34B398;
    --success-soft:rgba(52,179,152,0.14);
    --danger:#E5615A;
    --danger-soft:rgba(229,97,90,0.14);
    --warning:#F2A93B;
    --warning-soft:rgba(242,169,59,0.14);
    --info:#6E8FF2;
    --info-soft:rgba(110,143,242,0.14);
    --border:rgba(255,255,255,0.08);
    --border-soft:rgba(255,255,255,0.05);
    --radius:16px;
    --radius-sm:10px;
    --shadow:0 8px 30px rgba(0,0,0,0.35);
    --font-display:'Fraunces', serif;
    --font-body:'Manrope', -apple-system, BlinkMacSystemFont, sans-serif;
    --font-mono:'JetBrains Mono', monospace;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    background:
      radial-gradient(circle at 20% -10%, rgba(242,169,59,0.10), transparent 45%),
      radial-gradient(circle at 90% 0%, rgba(110,143,242,0.08), transparent 40%),
      var(--bg);
    color:var(--text);
    font-family:var(--font-body);
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  #app{
    max-width:520px;
    margin:0 auto;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    position:relative;
    padding-bottom:calc(78px + env(safe-area-inset-bottom));
  }
  a{color:inherit;}
  button{font-family:inherit;}
  ::selection{background:var(--accent-soft);}

  .topbar{
    position:sticky; top:0; z-index:30;
    padding:calc(16px + env(safe-area-inset-top)) 18px 14px;
    background:linear-gradient(180deg, rgba(16,20,42,0.97), rgba(16,20,42,0.88) 70%, rgba(16,20,42,0));
    backdrop-filter:blur(10px);
    display:flex; align-items:center; gap:10px;
    border-bottom:1px solid var(--border-soft);
  }
  .brand-mark{
    width:42px; height:42px; border-radius:12px;
    background:#fff;
    box-shadow:0 0 0 1px rgba(255,255,255,0.08), 0 0 18px 2px rgba(242,169,59,0.45);
    display:flex; align-items:center; justify-content:center;
    flex:none; padding:4px; overflow:hidden;
  }
  .brand-mark img{ width:100%; height:100%; object-fit:contain; display:block; }
  .brand-text{flex:1; min-width:0;}
  .brand-text .name{font-family:var(--font-display); font-weight:600; font-size:16.5px; line-height:1.2; letter-spacing:0.1px;}
  .brand-text .sub{font-size:11.5px; color:var(--text-muted); margin-top:2px; display:flex; align-items:center; gap:6px;}
  .role-pill{
    font-size:10.5px; font-weight:700; letter-spacing:0.4px; text-transform:uppercase;
    padding:2px 8px; border-radius:20px; background:var(--accent-soft); color:var(--accent-2);
    border:1px solid rgba(242,169,59,0.3);
  }

  .notif-bell-btn{
    position:relative; background:var(--bg-elevated-2); border:1px solid var(--border);
    border-radius:10px; width:38px; height:38px; display:flex; align-items:center;
    justify-content:center; cursor:pointer; font-size:18px; color:var(--text);
  }
  .notif-badge{
    position:absolute; top:-4px; right:-4px; background:var(--danger); color:#fff;
    font-size:10px; font-weight:800; border-radius:10px; padding:2px 5px; min-width:16px; text-align:center;
  }

  .push-banner{
    background:var(--accent-soft); border:1px solid rgba(242,169,59,0.3);
    border-radius:12px; padding:12px 14px; margin-bottom:16px; display:flex;
    align-items:center; justify-content:space-between; gap:10px;
  }

  main{flex:1; padding:18px 18px 10px;}
  .section-title{
    font-family:var(--font-display); font-weight:600; font-size:22px; margin:4px 0 4px;
    display:flex; align-items:center; justify-content:space-between; gap:10px;
  }
  .section-sub{color:var(--text-muted); font-size:13px; margin:0 0 18px; line-height:1.5;}
  .card{
    background:var(--bg-elevated); border:1px solid var(--border);
    border-radius:var(--radius); padding:16px; margin-bottom:12px;
    box-shadow:var(--shadow); position:relative; cursor:pointer;
  }

  .ticket-no{
    font-family:var(--font-mono); font-size:11px; color:var(--accent-2);
    background:var(--accent-soft); padding:2px 6px; border-radius:4px; font-weight:600;
  }

  .badge{
    display:inline-flex; align-items:center; gap:5px; font-size:10.5px; font-weight:700; letter-spacing:.3px;
    text-transform:uppercase; padding:3px 9px; border-radius:20px; white-space:nowrap;
  }
  .badge.pending{background:var(--warning-soft); color:var(--accent-2);}
  .badge.assigned{background:var(--info-soft); color:var(--info);}
  .badge.in-progress{background:var(--info-soft); color:var(--info);}
  .badge.resolved{background:var(--success-soft); color:var(--success);}
  .badge.closed{background:rgba(255,255,255,0.1); color:var(--text-muted);}
  .badge.notice{background:var(--accent-soft); color:var(--accent-2);}
  .badge.unpaid{background:var(--warning-soft); color:var(--accent-2);}
  .badge.paid{background:var(--success-soft); color:var(--success);}
  .badge.overdue{background:var(--danger-soft); color:var(--danger);}
  .badge.cancelled{background:rgba(255,255,255,0.1); color:var(--text-muted);}
  .badge.submitted{background:var(--info-soft); color:var(--info);}
  .badge.verified{background:var(--success-soft); color:var(--success);}
  .badge.rejected{background:var(--danger-soft); color:var(--danger);}
  .badge.active{background:var(--success-soft); color:var(--success);}

  .stat-strip{display:flex; gap:8px; margin-bottom:14px;}
  .stat-box{flex:1; background:var(--bg-elevated); border:1px solid var(--border); border-radius:var(--radius-sm); padding:10px 12px;}
  .stat-box .k{font-size:10.5px; text-transform:uppercase; letter-spacing:.4px; color:var(--text-faint); font-weight:700;}
  .stat-box .v{font-family:var(--font-mono); font-size:15px; font-weight:600; margin-top:4px;}

  .chip-row{display:flex; gap:8px; margin-bottom:14px; overflow-x:auto;}
  .chip{font-size:12px; font-weight:700; padding:6px 12px; border-radius:20px; border:1px solid var(--border); background:var(--bg-elevated-2); color:var(--text-muted); cursor:pointer; white-space:nowrap;}
  .chip.active{background:var(--accent-soft); color:var(--accent-2); border-color:rgba(242,169,59,0.35);}

  .amount{font-family:var(--font-mono); font-size:19px; font-weight:600; color:var(--text);}
  .due-card{background:linear-gradient(180deg, var(--bg-elevated-2), var(--bg-elevated)); border:1px solid rgba(242,169,59,0.28); border-radius:var(--radius); padding:16px; margin-bottom:14px;}
  .filter-bar{background:var(--bg-elevated); border:1px solid var(--border); border-radius:var(--radius-sm); padding:12px 14px; margin-bottom:14px;}
  .filter-bar label{margin-top:0;}

  input[type="file"]{width:100%; padding:10px 12px; margin-top:6px; background:var(--bg-elevated-2); border:1px solid var(--border); border-radius:var(--radius-sm); color:var(--text-muted); font-size:12.5px; font-family:var(--font-body);}
  input[type="file"]::file-selector-button{background:var(--bg-elevated-3); color:var(--text); border:1px solid var(--border); border-radius:8px; padding:6px 12px; margin-right:10px; font-size:12px; font-weight:700; cursor:pointer;}
  .proof-thumb{max-width:100%; border-radius:var(--radius-sm); border:1px solid var(--border); display:block; margin:8px 0;}
  .progress{height:8px; background:var(--bg-elevated-2); border:1px solid var(--border-soft); border-radius:6px; overflow:hidden; margin:8px 0 6px;}
  .progress .fill{height:100%; background:linear-gradient(90deg, var(--accent), var(--accent-2)); border-radius:6px;}

  .btn{
    font-family:inherit; font-weight:700; font-size:13.5px; border:none; border-radius:12px;
    padding:12px 16px; cursor:pointer; display:inline-flex; align-items:center; justify-content:center; gap:8px;
  }
  .btn.primary{background:linear-gradient(180deg, var(--accent-2), var(--accent)); color:#251400; box-shadow:0 4px 16px rgba(242,169,59,0.35);}
  .btn.secondary{background:var(--bg-elevated-2); color:var(--text); border:1px solid var(--border);}
  .btn.danger{background:var(--danger); color:#fff;}
  .btn.sm{padding:6px 12px; font-size:11.5px; border-radius:8px;}
  .btn.block{width:100%;}

  label{display:block; font-size:12px; font-weight:700; color:var(--text-muted); margin:14px 0 6px; text-transform:uppercase; letter-spacing:.3px;}
  input[type=text], input[type=email], input[type=password], select, textarea{
    width:100%; background:var(--bg); border:1px solid var(--border); color:var(--text);
    border-radius:10px; padding:12px 13px; font-family:inherit; font-size:14.5px; outline:none;
  }
  textarea{resize:vertical; min-height:80px;}

  .modal-overlay{
    position:fixed; top:0; left:0; right:0; bottom:0; z-index:100;
    background:rgba(10,12,24,0.85); backdrop-filter:blur(8px);
    display:none; align-items:center; justify-content:center; padding:20px;
  }
  .modal-overlay.active{ display:flex; }
  .modal-card{
    background:var(--bg-elevated); border:1px solid var(--border);
    border-radius:var(--radius); padding:24px; max-width:480px; width:100%;
    box-shadow:var(--shadow); position:relative; max-height:85vh; overflow-y:auto;
  }
  .modal-close{
    position:absolute; top:16px; right:16px; background:var(--bg-elevated-2);
    color:var(--text-muted); border:1px solid var(--border); border-radius:50%;
    width:32px; height:32px; display:flex; align-items:center; justify-content:center;
    cursor:pointer; font-size:16px; font-weight:bold;
  }

  nav.tabbar{
    position:fixed; bottom:0; left:0; right:0; z-index:40;
    display:flex; justify-content:center;
    padding-bottom:env(safe-area-inset-bottom);
    background:linear-gradient(0deg, rgba(16,20,42,0.98), rgba(16,20,42,0.9));
    border-top:1px solid var(--border-soft); backdrop-filter:blur(10px);
  }
  .tabbar-inner{ max-width:520px; width:100%; display:flex; justify-content:space-around; padding:8px 6px; }
  .tab-btn{ background:none; border:none; color:var(--text-faint); cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:4px; padding:6px 4px; flex:1; }
  .tab-btn.active{color:var(--accent-2);}
  .tab-btn .lbl{font-size:11px; font-weight:700;}

  .onboard-wrap{min-height:100vh; display:flex; flex-direction:column; justify-content:center; padding:32px 24px; max-width:480px; margin:0 auto;}
  .onboard-title{font-family:var(--font-display); font-size:26px; font-weight:600; text-align:center; margin-bottom:6px;}
  .onboard-sub{text-align:center; color:var(--text-muted); font-size:13.5px; margin-bottom:24px;}
  .toggle-auth-mode{text-align:center; margin-top:16px; font-size:13px; color:var(--accent-2); cursor:pointer; text-decoration:underline;}
</style>
</head>
<body>

<div id="app"></div>

<!-- Modal Container -->
<div id="modal-view" class="modal-overlay">
  <div class="modal-card">
    <button class="modal-close" onclick="closeModal()">✕</button>
    <div id="modal-body"></div>
  </div>
</div>

<script>
(function(){
  "use strict";

  function escapeHtml(str) {
    if (!str) return '';
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#039;');
  }

  const firebaseConfig = {
    apiKey: "AIzaSyA5jR_KvDtN52sIUQiYffXL_1pcoN5vNpk",
    authDomain: "rp-housing-society.firebaseapp.com",
    projectId: "rp-housing-society",
    storageBucket: "rp-housing-society.firebasestorage.app",
    messagingSenderId: "964175352040",
    appId: "1:964175352040:web:a5aadfe8bf9a6d53af395d",
    measurementId: "G-ZKW41KY8QX"
  };

  let db = null;
  let auth = null;
  let messaging = null;

  try {
    if (typeof firebase !== 'undefined') {
      if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
      db = firebase.firestore();
      auth = firebase.auth();

      firebase.messaging.isSupported().then(supported => {
        if (supported) {
          messaging = firebase.messaging();
          initPushMessaging();
        }
      }).catch(err => console.log("Messaging unsupported:", err));
    }
  } catch(e) {
    console.error("Firebase Init Error:", e);
  }

  // Application State Variables
  let currentUserProfile = null;
  let registrationInProgress = false;
  let isAuthModeLogin = true;
  let activeTab = 'notices';
  let notifications = [];
  let pendingResidents = [];
  let allResidents = [];
  let noticesList = [];
  let pollsList = [];
  let ticketsList = [];
  let billsList = [];
  let billFilterStatus = 'all';
  let societySettings = null;
  let fundsList = [];
  let fundContribsList = [];
  let ticketFilterMonth = 'all';
  let ticketFilterStatus = 'all';

  const appEl = document.getElementById('app');

  // Observer
  if (auth) {
    auth.onAuthStateChanged(async (user) => {
      if (registrationInProgress) return; 

      if (user) {
        try {
          const userDoc = await db.collection('users').doc(user.uid).get();
          if (userDoc.exists) {
            currentUserProfile = { uid: user.uid, email: user.email, ...userDoc.data() };
            saveDeviceToken();
          } else {
            currentUserProfile = null;
            await auth.signOut();
          }
        } catch(e) {
          console.error("Failed fetching user profile:", e);
        }
      } else {
        currentUserProfile = null;
      }
      render();
    });
  }

  function initPushMessaging() {
    if (!messaging) return;
    if (Notification.permission === 'granted') {
      saveDeviceToken();
    }
    messaging.onMessage((payload) => {
      new Notification(payload.notification.title, {
        body: payload.notification.body,
        icon: '/icon-192.png'
      });
      loadNotifications();
    });
  }

  function saveDeviceToken() {
    if (!messaging || !currentUserProfile || !auth.currentUser) return;
    messaging.getToken().then((currentToken) => {
      if (currentToken && db) {
        db.collection('fcm_tokens').doc(auth.currentUser.uid).set({
          token: currentToken,
          uid: auth.currentUser.uid,
          name: currentUserProfile.name,
          role: currentUserProfile.role,
          updatedAt: firebase.firestore.FieldValue.serverTimestamp()
        }, { merge: true }).catch(err => console.error("FCM Token Save Error:", err));
      }
    }).catch((err) => console.log('Push token registration error:', err));
  }

  function render() {
    if (!auth || !auth.currentUser || !currentUserProfile) {
      renderOnboarding();
      return;
    }

    // EMAIL VERIFICATION GUARD
    if (currentUserProfile.role === 'resident' && !auth.currentUser.emailVerified) {
      renderEmailVerificationScreen();
      return;
    }

    // MANDATORY BIODATA GATE (if resident has not submitted biodata yet)
    if (currentUserProfile.role === 'resident' && !currentUserProfile.biodataSubmitted) {
      renderBiodataFormScreen();
      return;
    }

    // HARDENED PENDING APPROVAL GUARD
    if (currentUserProfile.role === 'resident' && currentUserProfile.approved !== true) {
      renderPendingApprovalScreen();
      return;
    }

    const unreadCount = notifications.filter(n => !n.read).length;
    const isAdmin = currentUserProfile.role === 'admin';

    appEl.innerHTML = `
      <header class="topbar">
        <div class="brand-mark">
          <img src="icon-192.png" alt="Logo" onerror="this.style.display='none'">
        </div>
        <div class="brand-text">
          <div class="name">Roshan Housing Society</div>
          <div class="sub">
            <span>${escapeHtml(currentUserProfile.name)} ${currentUserProfile.house ? '(' + escapeHtml(currentUserProfile.house) + ')' : ''}</span>
            <span class="role-pill">${escapeHtml(currentUserProfile.role)}</span>
          </div>
        </div>
        <button class="notif-bell-btn" onclick="openNotificationsModal()" title="Notifications">
          🔔
          ${unreadCount > 0 ? `<span class="notif-badge">${unreadCount}</span>` : ''}
        </button>
        <button class="btn sm" id="logout-btn" style="background:var(--bg-elevated-2); color:var(--text-muted);">Logout</button>
      </header>

      <main style="padding-bottom:20px;">
        ${('Notification' in window && Notification.permission !== 'granted') ? `
          <div class="push-banner">
            <span style="font-size:12.5px; font-weight:600; color:var(--accent-2);">Enable push notifications for instant alerts!</span>
            <button class="btn sm primary" onclick="requestPushPermission()">Enable</button>
          </div>
        ` : ''}

        ${renderContent()}
      </main>

      <nav class="tabbar">
        <div class="tabbar-inner">
          <button class="tab-btn ${activeTab==='notices'?'active':''}" data-tab="notices">
            <span class="lbl">Announcements</span>
          </button>
          <button class="tab-btn ${activeTab==='polls'?'active':''}" data-tab="polls">
            <span class="lbl">Polls</span>
          </button>
          <button class="tab-btn ${activeTab==='tickets'?'active':''}" data-tab="tickets">
            <span class="lbl">Complaints</span>
          </button>
          <button class="tab-btn ${activeTab==='bills'?'active':''}" data-tab="bills">
            <span class="lbl">Bills</span>
          </button>
          <button class="tab-btn ${activeTab==='funds'?'active':''}" data-tab="funds">
            <span class="lbl">Funds</span>
          </button>
          <button class="tab-btn ${activeTab==='biodata'?'active':''}" data-tab="biodata">
            <span class="lbl">${isAdmin ? 'Residents' : 'Profile'}</span>
          </button>
          ${isAdmin ? `
            <button class="tab-btn ${activeTab==='approvals'?'active':''}" data-tab="approvals">
              <span class="lbl">Approvals</span>
            </button>
          ` : ''}
        </div>
      </nav>
    `;

    bindGlobalEvents();
    loadData();
  }

  function renderEmailVerificationScreen() {
    appEl.innerHTML = `
      <div class="onboard-wrap">
        <div class="onboard-title">Verify Your Email</div>
        <div class="onboard-sub">A verification link has been sent to <strong>${escapeHtml(auth.currentUser.email)}</strong>. Please verify your email to proceed.</div>
        
        <div class="card" style="text-align:center; padding:20px; cursor:default;">
          <div style="font-size:36px; margin-bottom:10px;">📧</div>
          <div style="font-size:13.5px; color:var(--text-muted);">Check your inbox and spam folder. Once verified, click below.</div>
        </div>

        <button class="btn primary block" id="check-verification-btn" style="margin-top:16px;">I Have Verified My Email</button>
        <button class="btn secondary block" id="resend-verification-btn" style="margin-top:8px;">Resend Email Link</button>
        <button class="btn danger block" id="logout-verification-btn" style="margin-top:8px;">Sign Out</button>
      </div>
    `;

    document.getElementById('check-verification-btn').addEventListener('click', async () => {
      await auth.currentUser.reload();
      if (auth.currentUser.emailVerified) {
        render();
      } else {
        alert("Email is not verified yet. Please check your inbox.");
      }
    });

    document.getElementById('resend-verification-btn').addEventListener('click', async () => {
      try {
        await auth.currentUser.sendEmailVerification();
        alert("Verification email resent!");
      } catch(err) {
        alert("Error sending verification email: " + err.message);
      }
    });

    document.getElementById('logout-verification-btn').addEventListener('click', () => auth.signOut());
  }

  function renderBiodataFormScreen() {
    appEl.innerHTML = `
      <div class="onboard-wrap" style="max-width:520px; padding:20px 16px;">
        <div class="onboard-title">Complete Resident Biodata</div>
        <div class="onboard-sub">Please fill out your official society resident record to proceed.</div>

        <div class="card" style="cursor:default; padding:20px;">
          <form id="biodata-form">
            <label>Full Name</label>
            <input type="text" id="bio-name" value="${escapeHtml(currentUserProfile.name || '')}" required />

            <label>CNIC Number (e.g. 35202-1234567-1)</label>
            <input type="text" id="bio-cnic" placeholder="35202-1234567-1" required />

            <label>Cell Number</label>
            <input type="text" id="bio-phone" value="${escapeHtml(currentUserProfile.phone || '')}" placeholder="+92 300 1234567" required />

            <label>House / Plot Number</label>
            <input type="text" id="bio-house" value="${escapeHtml(currentUserProfile.house || '')}" placeholder="House 42, Block B" required />

  // --- SUBCOLLECTION NOTIFICATION SYSTEM ---
  async function sendNotification(targetUid, title, body, type = 'info') {
    if (!db || !targetUid) return;
    try {
      await db.collection('users')
        .doc(targetUid)
        .collection('notifications')
        .add({
          title: title,
          body: body,
          text: body,
          type: type,
          read: false,
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });
    } catch (err) {
      console.error("Targeted Notification failed:", err);
    }
  }

  async function broadcastNotification(title, body) {
    if (!db) return;
    try {
      const snap = await db.collection('users').where('approved', '==', true).get();
      const batchPromises = snap.docs.map(userDoc => sendNotification(userDoc.id, title, body, 'notice'));
      await Promise.all(batchPromises);
    } catch (e) {
      console.error("Broadcast failed:", e);
    }
  }

  function loadNotifications() {
    if (db && auth.currentUser) {
      db.collection('users')
        .doc(auth.currentUser.uid)
        .collection('notifications')
        .orderBy('createdAt', 'desc')
        .limit(20)
        .get()
        .then(snapshot => {
          notifications = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
          renderUnreadBadge();
        })
        .catch(err => console.error("Notifs load error:", err));
    }
  }

  function renderUnreadBadge() {
    const unreadCount = notifications.filter(n => !n.read).length;
    const bellBtn = document.querySelector('.notif-bell-btn');
    if (bellBtn) {
      const existingBadge = bellBtn.querySelector('.notif-badge');
      if (existingBadge) existingBadge.remove();
      if (unreadCount > 0) {
        bellBtn.innerHTML += `<span class="notif-badge">${unreadCount}</span>`;
      }
    }
  }

    document.getElementById('modal-body').innerHTML = `
      <div style="font-family:var(--font-display); font-size:20px; font-weight:600; margin-bottom:12px;">Notifications</div>
      ${notifications.length ? notifications.map(n => `
        <div style="background:var(--bg-elevated-2); border:1px solid var(--border); padding:10px 12px; border-radius:10px; margin-bottom:8px;">
          ${n.title ? `<div style="font-weight:700; font-size:13px; color:var(--accent-2);">${escapeHtml(n.title)}</div>` : ''}
          <div style="font-size:13px; color:var(--text); line-height:1.4;">${escapeHtml(n.text || n.body)}</div>

      `).join('') : '<div style="color:var(--text-muted); text-align:center; padding:20px;">No notifications yet.</div>'}
    `;
    document.getElementById('modal-view').classList.add('active');

    // Mark as read in batch
    const unreadDocs = notifications.filter(n => !n.read);
    if (unreadDocs.length && db && auth.currentUser) {
      const batch = db.batch();
      unreadDocs.forEach(n => {
        const ref = db.collection('users').doc(auth.currentUser.uid).collection('notifications').doc(n.id);
        batch.update(ref, { read: true });
      });
      await batch.commit().catch(e => console.error("Error marking notifs read:", e));

  // --- POLLS ---
  function loadPolls() {
    if (!db) return;
    db.collection('polls').orderBy('createdAt', 'desc').get().then(snapshot => {

  function renderPollsList() {
    const listEl = document.getElementById('polls-list');
    if (!listEl) return;
    if (!pollsList.length) {
      listEl.innerHTML = '<div class="card" style="text-align:center; color:var(--text-muted);">No active polls available.</div>';
      return;
    }

    const userId = auth.currentUser.uid;

    listEl.innerHTML = pollsList.map(poll => {
      const votes = poll.votes || {};
      const hasVoted = userId in votes;
      const userVote = votes[userId];
      const options = poll.options || [];
      
      const totalVotes = Object.keys(votes).length;

      // Tally counts
      const counts = options.map((opt, idx) => {
        let count = 0;
        Object.values(votes).forEach(v => { if (v === idx) count++; });
        return count;
      });

      return `
        <div class="card" style="cursor:default;">
          <div style="font-weight:700; font-size:16px; color:var(--accent-2); margin-bottom:6px;">${escapeHtml(poll.question)}</div>
          <div style="font-size:12px; color:var(--text-muted); margin-bottom:14px;">Total Votes: ${totalVotes}</div>

          <div style="display:flex; flex-direction:column; gap:8px;">
            ${options.map((opt, idx) => {
              const count = counts[idx];
              const pct = totalVotes > 0 ? Math.round((count / totalVotes) * 100) : 0;
              const isSelected = userVote === idx;

              return `
                <div style="background:var(--bg-elevated-2); border:1px solid ${isSelected ? 'var(--accent)' : 'var(--border)'}; border-radius:10px; padding:10px 12px; position:relative; overflow:hidden;">
                  <div style="position:absolute; top:0; left:0; bottom:0; width:${pct}%; background:var(--accent-soft); z-index:0;"></div>
                  <div style="display:flex; justify-content:space-between; align-items:center; position:relative; z-index:1;">
                    <span style="font-size:13.5px; font-weight:${isSelected?'700':'500'};">${escapeHtml(opt)}</span>
                    <div style="display:flex; align-items:center; gap:10px;">
                      <span style="font-size:12px; color:var(--text-muted);">${pct}% (${count})</span>
                      ${!hasVoted ? `<button class="btn sm primary" onclick="votePoll('${poll.id}', ${idx})">Vote</button>` : ''}
                    </div>
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        </div>
      `;
    }).join('');
  }

  window.votePoll = async function(pollId, optionIndex) {
    if (!db || !auth.currentUser) return;
    try {
      const ref = db.collection('polls').doc(pollId);
      await db.runTransaction(async (transaction) => {
        const doc = await transaction.get(ref);
        if (!doc.exists) throw "Poll does not exist!";
        const data = doc.data();
        const votes = data.votes || {};
        votes[auth.currentUser.uid] = optionIndex;
        transaction.update(ref, { votes: votes });
      });
      loadPolls();
    } catch(err) {
      alert("Error casting vote: " + err);
    }
  };

  function monthKey(date) {
    if (!date) return '';
    return date.getFullYear() + '-' + String(date.getMonth() + 1).padStart(2, '0');
  }

  function monthLabel(key) {
    const [y, m] = key.split('-');
    const names = ['January','February','March','April','May','June','July','August','September','October','November','December'];
    return names[Number(m) - 1] + ' ' + y;
  }

  function toDate(value) {
    if (!value) return null;
    if (typeof value.toDate === 'function') return value.toDate();
    const d = new Date(value);
    return isNaN(d.getTime()) ? null : d;
  }

  function formatDate(value) {
    const d = toDate(value);
    return d ? d.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' }) : 'N/A';
  }

  function lastTwelveMonths() {
    const keys = [];
    const now = new Date();
    for (let i = 0; i < 12; i++) {
      keys.push(monthKey(new Date(now.getFullYear(), now.getMonth() - i, 1)));
    }
    return keys;
  }

  function renderTicketFilterBar() {
    return `
      <div class="filter-bar">
        <label>Filter Complaints (Admin)</label>
        <div style="display:flex; gap:8px;">
          <select id="ticket-filter-month" onchange="setTicketFilters()" style="flex:1;">
            <option value="all" ${ticketFilterMonth==='all'?'selected':''}>All months</option>
            ${lastTwelveMonths().map(k => `<option value="${k}" ${ticketFilterMonth===k?'selected':''}>${monthLabel(k)}</option>`).join('')}
          </select>
          <select id="ticket-filter-status" onchange="setTicketFilters()" style="flex:1;">
            <option value="all" ${ticketFilterStatus==='all'?'selected':''}>All statuses</option>
            <option value="pending" ${ticketFilterStatus==='pending'?'selected':''}>Pending</option>
            <option value="in-progress" ${ticketFilterStatus==='in-progress'?'selected':''}>In Progress</option>

  function filteredTickets() {
    return ticketsList.filter(t => {
      if (ticketFilterStatus !== 'all' && (t.status || 'pending') !== ticketFilterStatus) return false;
      if (ticketFilterMonth !== 'all') {
        const d = toDate(t.createdAt);
        if (!d || monthKey(d) !== ticketFilterMonth) return false;
      }
      return true;
    });
  }

  window.setTicketFilters = function() {
    const monthEl = document.getElementById('ticket-filter-month');
    const statusEl = document.getElementById('ticket-filter-status');
    if (monthEl) ticketFilterMonth = monthEl.value;
    if (statusEl) ticketFilterStatus = statusEl.value;
    renderTicketsList();
  };

  window.downloadTicketsReportPDF = function() {
    const list = filteredTickets();
    if (!list.length) {
      alert("No complaints match the current filter.");
      return;
    }

    try {
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF();

      doc.setFont("helvetica", "bold");
      doc.setFontSize(16);
      doc.text("Roshan Pakistan Housing Society", 105, 18, { align: "center" });
      doc.setFontSize(12);
      doc.setFont("helvetica", "normal");
      doc.text("Complaints Report", 105, 26, { align: "center" });
      doc.setFontSize(10);
      doc.text(`Period: ${ticketFilterMonth === 'all' ? 'All months' : monthLabel(ticketFilterMonth)}   |   Status: ${ticketFilterStatus === 'all' ? 'All' : ticketFilterStatus}`, 105, 33, { align: "center" });
      doc.text(`Generated: ${new Date().toLocaleString('en-GB')}   |   Total: ${list.length}`, 105, 39, { align: "center" });
      doc.line(15, 44, 195, 44);

      let y = 52;
      doc.setFontSize(10);
      doc.setFont("helvetica", "bold");
      doc.text("Ticket", 15, y);
      doc.text("Date", 45, y);
      doc.text("House", 72, y);
      doc.text("Category", 112, y);
      doc.text("Status", 168, y);
      y += 6;
      doc.setFont("helvetica", "normal");

      list.forEach(t => {
        if (y > 275) {
          doc.addPage();
          y = 20;
        }
        doc.text(String(t.ticketNo || '-'), 15, y);
        doc.text(formatDate(t.createdAt), 45, y);
        doc.text(doc.splitTextToSize(String(t.house || 'N/A'), 38), 72, y);
        doc.text(doc.splitTextToSize(String(t.category || '-'), 54), 112, y);
        doc.text(String(t.status || 'pending'), 168, y);
        y += 8;
      });

      doc.save(`Complaints_Report_${ticketFilterMonth === 'all' ? 'All' : ticketFilterMonth}.pdf`);
    } catch(err) {
      alert("Error generating report: " + err.message);
    }
  };

  window.downloadTicketPDF = function(ticketId) {
    const t = ticketsList.find(item => item.id === ticketId);
    if (!t) return;

    try {
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF();

      doc.setFont("helvetica", "bold");
      doc.setFontSize(18);
      doc.text("Roshan Pakistan Housing Society", 105, 20, { align: "center" });
      doc.setFontSize(12);
      doc.setFont("helvetica", "normal");
      doc.text("Official Complaint Record", 105, 28, { align: "center" });
      doc.line(20, 35, 190, 35);

      let y = 48;
      const addRow = (label, val) => {
        doc.setFont("helvetica", "bold");
        doc.text(label + ":", 25, y);
        doc.setFont("helvetica", "normal");
        doc.text(String(val || 'N/A'), 75, y);
        y += 10;
      };

      addRow("Ticket Number", t.ticketNo);
      addRow("Lodged On", formatDate(t.createdAt));
      addRow("Resident", t.name);
      addRow("House / Plot", t.house);
      addRow("Category", t.category);
      addRow("Status", t.status || 'pending');
      addRow("Assigned Dept", t.department);

      y += 5;
      doc.setFont("helvetica", "bold");
      doc.text("Description:", 25, y);
      y += 8;
      doc.setFont("helvetica", "normal");
      doc.text(doc.splitTextToSize(t.description || 'N/A', 160), 25, y);

      doc.save(`Complaint_${(t.ticketNo || 'Record').replace(/\s+/g, '_')}.pdf`);
    } catch(err) {
      alert("Error generating PDF: " + err.message);
    }
  };

  // --- MAINTENANCE BILLS ---
  function formatMoney(amount) {
    return 'PKR ' + Number(amount || 0).toLocaleString('en-PK');
  }

  function billStatus(b) {
    const status = b.status || 'unpaid';
    if (status === 'unpaid') {
      const due = toDate(b.dueDate);
      if (due && due < new Date(new Date().toDateString())) return 'overdue';
    }
    return status;
  }

  function loadBills() {
    if (!db || !auth.currentUser) return;
    const isAdmin = currentUserProfile.role === 'admin';
    const query = isAdmin
      ? db.collection('bills')
      : db.collection('bills').where('uid', '==', auth.currentUser.uid);

    query.get().then(snapshot => {
      billsList = snapshot.docs
        .map(doc => ({ id: doc.id, ...doc.data() }))
        .sort((a, b) => {
          const da = toDate(a.createdAt), dbb = toDate(b.createdAt);
          return (dbb ? dbb.getTime() : 0) - (da ? da.getTime() : 0);
        });
      renderBillsList();
    }).catch(e => console.error("Error loading bills:", e));

    loadSocietySettings().then(renderBankCard);
  }

  async function loadSocietySettings() {
    if (societySettings !== null) return societySettings;
    try {
      const doc = await db.collection('settings').doc('society').get();
      societySettings = doc.exists ? doc.data() : {};
    } catch(e) {
      console.error("Error loading society settings:", e);
      societySettings = {};
    }
    return societySettings;
  }

  window.setBillFilter = function(filter) {
    billFilterStatus = filter;
    document.querySelectorAll('.chip-row .chip').forEach(chip => {
      chip.classList.toggle('active', chip.getAttribute('data-filter') === filter);
    });
    renderBillsList();

  function renderBillsList() {
    const listEl = document.getElementById('bills-list');
    if (!listEl) return;
    const isAdmin = currentUserProfile.role === 'admin';

    const summaryEl = document.getElementById('bills-summary');
    if (summaryEl) {
      const outstanding = billsList.filter(b => billStatus(b) !== 'paid' && billStatus(b) !== 'cancelled').reduce((s, b) => s + Number(b.amount || 0), 0);
      const collected = billsList.filter(b => billStatus(b) === 'paid').reduce((s, b) => s + Number(b.amount || 0), 0);
      const billed = billsList.filter(b => billStatus(b) !== 'cancelled').reduce((s, b) => s + Number(b.amount || 0), 0);

      summaryEl.innerHTML = isAdmin ? `
        <div class="stat-strip">
          <div class="stat-box"><div class="k">Billed</div><div class="v">${formatMoney(billed)}</div></div>
          <div class="stat-box"><div class="k">Collected</div><div class="v" style="color:var(--success);">${formatMoney(collected)}</div></div>
          <div class="stat-box"><div class="k">Outstanding</div><div class="v" style="color:var(--accent-2);">${formatMoney(outstanding)}</div></div>
        </div>
      ` : `
        <div class="due-card">
          <div style="font-size:11px; text-transform:uppercase; letter-spacing:.4px; color:var(--text-faint); font-weight:700;">Total Outstanding</div>
          <div style="font-family:var(--font-mono); font-size:28px; font-weight:600; color:var(--accent-2); margin:6px 0 2px;">${formatMoney(outstanding)}</div>
          <div style="font-size:12px; color:var(--text-muted);">${billsList.filter(b => billStatus(b) === 'unpaid' || billStatus(b) === 'overdue').length} unpaid bill(s) · ${escapeHtml(currentUserProfile.house || 'N/A')}</div>
        </div>
      `;
    }

    const list = billFilterStatus === 'all' ? billsList : billsList.filter(b => billStatus(b) === billFilterStatus);

    if (!list.length) {
      listEl.innerHTML = `<div class="card" style="text-align:center; color:var(--text-muted);">${billsList.length ? 'No bills match the selected filter.' : 'No maintenance bills issued yet.'}</div>`;
      return;
    }

    listEl.innerHTML = list.map(b => {
      const status = billStatus(b);
      return `
        <div class="card" onclick="openBillDetailModal('${b.id}')">
          <div style="display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:6px;">
            <div>
              <span class="ticket-no">${escapeHtml(b.billNo || 'BILL')}</span>
              <span style="font-weight:700; font-size:15px; color:var(--accent-2); margin-left:6px;">${escapeHtml(b.category || 'Maintenance')}</span>
            </div>
            <span class="badge ${status}">${escapeHtml(status)}</span>
          </div>
          <div style="display:flex; justify-content:space-between; align-items:flex-end; margin:10px 0 6px;">
            <div class="amount">${formatMoney(b.amount)}</div>

  // --- PAYMENT PROOF (UPLOAD + VERIFY) ---
  const PROOF_MAX_PDF_BYTES = 650 * 1024;

  function readProofFile(file) {
    return new Promise((resolve, reject) => {
      if (!file) return reject(new Error("Please choose a file."));
      const isImage = file.type === 'image/png' || file.type === 'image/jpeg';
      const isPdf = file.type === 'application/pdf';
      if (!isImage && !isPdf) return reject(new Error("Only PNG, JPEG or PDF files are allowed."));

      if (isPdf) {
        if (file.size > PROOF_MAX_PDF_BYTES) return reject(new Error("PDF is too large (max 650 KB). Please upload a screenshot image instead."));
        const reader = new FileReader();
        reader.onload = () => resolve({ dataUrl: reader.result, type: 'pdf', name: file.name });
        reader.onerror = () => reject(new Error("Could not read the file."));
        reader.readAsDataURL(file);
        return;
      }

      const img = new Image();
      const url = URL.createObjectURL(file);
      img.onload = () => {
        URL.revokeObjectURL(url);
        const maxSide = 1280;
        const scale = Math.min(1, maxSide / Math.max(img.width, img.height));
        const canvas = document.createElement('canvas');
        canvas.width = Math.round(img.width * scale);
        canvas.height = Math.round(img.height * scale);
        canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
        const dataUrl = canvas.toDataURL('image/jpeg', 0.75);
        if (dataUrl.length > 950 * 1024) return reject(new Error("Image is too large even after compression. Please crop it and try again."));
        resolve({ dataUrl, type: 'image', name: file.name });
      };
      img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("Could not read the image file.")); };
      img.src = url;
    });
  }

  function proofSectionHtml(kind, record) {
    if (!record.proofData) return '';

      <div style="margin-bottom:14px;">
        <label style="margin-top:0;">Payment Proof ${record.proofName ? '(' + escapeHtml(record.proofName) + ')' : ''}</label>
        ${record.proofType === 'image'
          ? `<img class="proof-thumb" src="${record.proofData}" alt="Payment proof" onclick="viewProofFile('${kind}', '${record.id}')" style="cursor:pointer;" />`
          : `<button class="btn sm secondary" style="margin-top:6px;" onclick="viewProofFile('${kind}', '${record.id}')">Open PDF Proof</button>`}
        ${record.paymentRef ? `<div style="font-size:12.5px; color:var(--text-muted); margin-top:6px;">Transaction Ref: <span style="font-family:var(--font-mono);">${escapeHtml(record.paymentRef)}</span></div>` : ''}
        ${record.proofUploadedAt ? `<div style="font-size:11.5px; color:var(--text-faint); margin-top:2px;">Uploaded: ${escapeHtml(formatDate(record.proofUploadedAt))}</div>` : ''}
      </div>

  window.viewProofFile = function(kind, id) {
    const record = kind === 'bill'
      ? billsList.find(item => item.id === id)
      : fundContribsList.find(item => item.id === id);
    if (!record || !record.proofData) return;
    try {
      const parts = record.proofData.split(',');
      const mime = parts[0].match(/data:([^;]+)/)[1];
      const bytes = atob(parts[1]);
      const arr = new Uint8Array(bytes.length);
      for (let i = 0; i < bytes.length; i++) arr[i] = bytes.charCodeAt(i);
      window.open(URL.createObjectURL(new Blob([arr], { type: mime })), '_blank');
    } catch(err) {
      alert("Could not open the proof file: " + err.message);
    }
  };

  // --- COMMUNITY FUNDS ---
  function loadFunds() {
    if (!db || !auth.currentUser) return;
    Promise.all([
      db.collection('funds').get(),
      db.collection('fund_contributions').get()
    ]).then(([fundsSnap, contribsSnap]) => {
      fundsList = fundsSnap.docs
        .map(doc => ({ id: doc.id, ...doc.data() }))
        .sort((a, b) => {
          const da = toDate(a.createdAt), dbb = toDate(b.createdAt);
          return (dbb ? dbb.getTime() : 0) - (da ? da.getTime() : 0);
        });
      fundContribsList = contribsSnap.docs
        .map(doc => ({ id: doc.id, ...doc.data() }))
        .sort((a, b) => {
          const da = toDate(a.createdAt), dbb = toDate(b.createdAt);
          return (dbb ? dbb.getTime() : 0) - (da ? da.getTime() : 0);
        });
      renderFundsList();
    }).catch(e => console.error("Error loading funds:", e));
  }

  function fundVerifiedTotal(fundId) {
    return fundContribsList.filter(c => c.fundId === fundId && c.status === 'verified').reduce((s, c) => s + Number(c.amount || 0), 0);

    const listEl = document.getElementById('funds-list');

    listEl.innerHTML = fundsList.map(f => {
      const status = f.status || 'active';

      const target = Number(f.targetAmount || 0);
      const pct = target > 0 ? Math.min(100, Math.round(collected / target * 100)) : 0;
      const contributors = new Set(fundContribsList.filter(c => c.fundId === f.id && c.status === 'verified').map(c => c.uid)).size;

      return `

          <div style="display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:6px;">
            <span style="font-weight:700; font-size:15px; color:var(--accent-2);">${escapeHtml(f.title || 'Fund')}</span>
            <span class="badge ${status}">${escapeHtml(status)}</span>
          </div>
          <div style="font-size:12.5px; color:var(--text-muted); line-height:1.5; margin-bottom:8px;">${escapeHtml((f.purpose || '').slice(0, 120))}${(f.purpose || '').length > 120 ? '…' : ''}</div>
          ${target > 0 ? `
            <div class="progress"><div class="fill" style="width:${pct}%;"></div></div>
            <div style="display:flex; justify-content:space-between; font-size:12px;">
              <span style="font-family:var(--font-mono); color:var(--success);">${formatMoney(collected)}</span>
              <span style="color:var(--text-faint);">${pct}% of ${formatMoney(target)}</span>
            </div>
          ` : `<div style="font-size:12.5px;"><span style="color:var(--text-faint);">Collected:</span> <span style="font-family:var(--font-mono); color:var(--success);">${formatMoney(collected)}</span></div>`}
          <div style="font-size:11.5px; color:var(--text-faint); margin-top:6px;">${contributors} contributor(s) · Started ${escapeHtml(formatDate(f.createdAt))}${isAdmin && pendingCount ? ` · <span style="color:var(--info);">${pendingCount} awaiting verification</span>` : ''}${!isAdmin && myPending ? ' · <span style="color:var(--info);">Your contribution is under review</span>' : ''}</div>
        </div>
      `;
    }).join('');
  }

  window.openCreateFundModal = function() {
    if (currentUserProfile.role !== 'admin') return;

    document.getElementById('modal-body').innerHTML = `
      <div style="font-family:var(--font-display); font-size:20px; font-weight:600; margin-bottom:12px;">Start a Community Fund</div>
      <form id="fund-form">
        <label>Fund Title</label>
        <input type="text" id="fund-title" placeholder="e.g. Mosque Renovation Fund" required />
        <label>What is this fund for & why is it needed?</label>
        <textarea id="fund-purpose" placeholder="Explain the purpose and why the society needs it..." required></textarea>
        <label>Target Amount (PKR, optional)</label>
        <input type="text" id="fund-target" placeholder="e.g. 250000" />
        <button type="submit" class="btn primary block" style="margin-top:16px;">Start Fund & Notify Residents</button>
      </form>
    `;
    document.getElementById('modal-view').classList.add('active');

    document.getElementById('fund-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const title = document.getElementById('fund-title').value.trim();
      const purpose = document.getElementById('fund-purpose').value.trim();
      const target = Number(document.getElementById('fund-target').value.trim() || 0);
      if (document.getElementById('fund-target').value.trim() && (!target || target <= 0)) {
        alert("Please enter a valid target amount or leave it blank.");
        return;
      }

      try {
        await db.collection('funds').add({
          title,
          purpose,
          targetAmount: target,
          status: 'active',
          createdBy: currentUserProfile.name,
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });
        await broadcastNotification(`New Fund: ${title}`, `${purpose.slice(0, 140)} — open the Funds tab to contribute.`);
        closeModal();
        loadFunds();
      } catch(err) {
        alert("Error starting fund: " + err.message);
      }
    });
  };

  window.openFundDetailModal = function(fundId) {
    const f = fundsList.find(item => item.id === fundId);
    if (!f) return;
    const isAdmin = currentUserProfile.role === 'admin';
    const status = f.status || 'active';
    const collected = fundVerifiedTotal(f.id);
    const target = Number(f.targetAmount || 0);
    const pct = target > 0 ? Math.min(100, Math.round(collected / target * 100)) : 0;
    const contribs = fundContribsList.filter(c => c.fundId === f.id && (isAdmin || c.uid === auth.currentUser.uid));

    document.getElementById('modal-body').innerHTML = `
      <div style="display:flex; justify-content:space-between; align-items:center; gap:10px; padding-right:44px; margin-bottom:12px;">
        <span style="font-family:var(--font-display); font-size:19px; font-weight:600; color:var(--accent-2);">${escapeHtml(f.title || 'Fund')}</span>
        <span class="badge ${status}">${escapeHtml(status)}</span>
      </div>
      <div style="font-size:13.5px; line-height:1.6; margin-bottom:14px; white-space:pre-wrap;">${escapeHtml(f.purpose || '')}</div>

      <div style="background:var(--bg-elevated-2); border:1px solid var(--border); border-radius:10px; padding:14px; margin-bottom:14px;">
        <div style="display:flex; justify-content:space-between; margin-bottom:8px;"><span style="font-size:13px; color:var(--text-muted);">Collected (verified)</span><span class="amount" style="color:var(--success);">${formatMoney(collected)}</span></div>
        ${target > 0 ? `
          <div style="display:flex; justify-content:space-between; margin-bottom:4px;"><span style="font-size:13px; color:var(--text-muted);">Target</span><span style="font-size:13.5px; font-family:var(--font-mono);">${formatMoney(target)}</span></div>
          <div class="progress"><div class="fill" style="width:${pct}%;"></div></div>
          <div style="text-align:right; font-size:11.5px; color:var(--text-faint);">${pct}% reached</div>
        ` : ''}
        <div style="display:flex; justify-content:space-between;"><span style="font-size:13px; color:var(--text-muted);">Started</span><span style="font-size:13.5px;">${escapeHtml(formatDate(f.createdAt))} by ${escapeHtml(f.createdBy || 'Management')}</span></div>
      </div>

      ${status === 'active' && !isAdmin ? `
        <form id="contrib-form" style="margin-bottom:16px;">
          <label>Contribute — Amount (PKR)</label>
          <input type="text" id="contrib-amount" placeholder="e.g. 2000" required />
          <label>Payment Proof (PNG, JPEG or PDF — optional)</label>
          <input type="file" id="contrib-file" accept="image/png,image/jpeg,application/pdf" />
          <label>Transaction Reference (optional)</label>
          <input type="text" id="contrib-ref" placeholder="e.g. bank / wallet transaction ID" />
          <button type="submit" class="btn primary block" style="margin-top:14px;">Submit Contribution</button>
        </form>
      ` : ''}

      ${isAdmin && status === 'active' ? `<button class="btn danger block" onclick="closeFund('${f.id}')" style="margin-bottom:16px;">Close This Fund</button>` : ''}

      <div class="section-title" style="font-size:15px; margin-bottom:8px;">${isAdmin ? 'Contributions' : 'My Contributions'}</div>
      <div id="fund-contribs">
        ${contribs.length ? contribs.map(c => `
          <div style="background:var(--bg-elevated-2); border:1px solid var(--border-soft); border-radius:10px; padding:12px; margin-bottom:8px;">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:4px;">
              <span style="font-size:13px; font-weight:700;">${isAdmin ? escapeHtml(c.name || 'Resident') + ' — ' + escapeHtml(c.house || 'N/A') : formatMoney(c.amount)}</span>
              <span class="badge ${c.status || 'submitted'}">${escapeHtml(c.status === 'submitted' ? 'in review' : (c.status || 'in review'))}</span>
            </div>
            ${isAdmin ? `<div style="font-size:13px; font-family:var(--font-mono); margin-bottom:4px;">${formatMoney(c.amount)}</div>` : ''}
            <div style="font-size:11.5px; color:var(--text-faint);">${escapeHtml(formatDate(c.createdAt))}${c.paymentRef ? ' · Ref: ' + escapeHtml(c.paymentRef) : ''}</div>
            ${c.status === 'rejected' && c.rejectedReason ? `<div style="font-size:12px; color:var(--danger); margin-top:4px;">Rejected: ${escapeHtml(c.rejectedReason)}</div>` : ''}
            ${c.proofData ? `<button class="btn sm secondary" style="margin-top:8px;" onclick="viewProofFile('contrib', '${c.id}')">View Proof</button>` : ''}
            ${isAdmin && c.status === 'submitted' ? `
              <div style="display:flex; gap:8px; margin-top:8px;">
                <button class="btn sm primary" onclick="verifyContribution('${c.id}')">Verify</button>
                <button class="btn sm danger" onclick="rejectContribution('${c.id}')">Reject</button>
              </div>
            ` : ''}
          </div>
        `).join('') : `<div style="font-size:12.5px; color:var(--text-muted);">No contributions ${isAdmin ? 'received' : 'made'} yet.</div>`}
      </div>
    `;
    document.getElementById('modal-view').classList.add('active');

    const contribForm = document.getElementById('contrib-form');
    if (contribForm) {
      contribForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const submitBtn = e.target.querySelector('button[type="submit"]');
        submitBtn.disabled = true;
        try {
          const amount = Number(document.getElementById('contrib-amount').value.trim());
          if (!amount || amount <= 0) throw new Error("Please enter a valid amount.");
          const file = document.getElementById('contrib-file').files[0];
          const proof = file ? await readProofFile(file) : null;
          const paymentRef = document.getElementById('contrib-ref').value.trim();

          await db.collection('fund_contributions').add({
            fundId: f.id,
            fundTitle: f.title,
            uid: auth.currentUser.uid,
            name: currentUserProfile.name,
            house: currentUserProfile.house || '',
            amount,
            currency: 'PKR',
            paymentRef,
            proofData: proof ? proof.dataUrl : '',
            proofType: proof ? proof.type : '',
            proofName: proof ? proof.name : '',
            status: 'submitted',
            createdAt: firebase.firestore.FieldValue.serverTimestamp()
          });
          await notifyAdmins(`Fund Contribution (${f.title})`, `${currentUserProfile.name} (${currentUserProfile.house || 'N/A'}) submitted ${formatMoney(amount)}${proof ? ' with payment proof' : ''}.`, 'info');
          closeModal();
          loadFunds();
        } catch(err) {
          alert("Error submitting contribution: " + err.message);
          submitBtn.disabled = false;
        }
      });
    }
  };

  window.verifyContribution = async function(contribId) {
    const c = fundContribsList.find(item => item.id === contribId);
    if (!c || currentUserProfile.role !== 'admin') return;
    if (!confirm(`Verify contribution of ${formatMoney(c.amount)} from ${c.name}?`)) return;

    try {
      await db.collection('fund_contributions').doc(contribId).update({
        status: 'verified',
        verifiedAt: firebase.firestore.FieldValue.serverTimestamp(),
        verifiedBy: currentUserProfile.name
      });
      await sendNotification(c.uid, `Contribution Verified (${c.fundTitle})`, `Your contribution of ${formatMoney(c.amount)} has been verified. Thank you for supporting the community!`, 'success');
      closeModal();
      loadFunds();
    } catch(err) {
      alert("Error verifying contribution: " + err.message);
    }
  };

  window.rejectContribution = async function(contribId) {
    const c = fundContribsList.find(item => item.id === contribId);
    if (!c || currentUserProfile.role !== 'admin') return;
    const reason = prompt("Reason for rejecting this contribution:");
    if (reason === null) return;
    if (!reason.trim()) { alert("A reason is required to reject a contribution."); return; }

    try {
      await db.collection('fund_contributions').doc(contribId).update({
        status: 'rejected',
        rejectedReason: reason.trim()
      });
      await sendNotification(c.uid, `Contribution Rejected (${c.fundTitle})`, `Reason: ${reason.trim()}. Please contact management or submit again.`, 'error');
      closeModal();
      loadFunds();
    } catch(err) {
      alert("Error rejecting contribution: " + err.message);
    }
  };

  window.closeFund = async function(fundId) {
    const f = fundsList.find(item => item.id === fundId);
    if (!f || currentUserProfile.role !== 'admin') return;
    if (!confirm(`Close "${f.title}"? Residents will no longer be able to contribute.`)) return;

    try {
      await db.collection('funds').doc(fundId).update({ status: 'closed' });
      await broadcastNotification(`Fund Closed: ${f.title}`, `Total collected: ${formatMoney(fundVerifiedTotal(f.id))}. Thank you to everyone who contributed.`);
      closeModal();
      loadFunds();
    } catch(err) {
      alert("Error closing fund: " + err.message);
    }
  };

  // --- RESIDENTS DIRECTORY (ADMIN) ---
  function loadAllResidents() {
    if (!db) return;
    db.collection('users').where('approved', '==', true).get().then(snapshot => {
      allResidents = snapshot.docs.map(doc => ({ uid: doc.id, ...doc.data() }));
      renderResidentsList();
    }).catch(e => console.error("Error loading residents:", e));
  }

  function renderResidentsList() {
    const listEl = document.getElementById('residents-list');
    if (!listEl) return;
    if (!allResidents.length) {
      listEl.innerHTML = '<div class="card" style="text-align:center; color:var(--text-muted);">No approved residents found.</div>';
      return;
    }

    listEl.innerHTML = allResidents.map(r => `
      <div class="card" style="cursor:default;">
        <div style="display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:6px;">
          <div>
            <div style="font-weight:700; font-size:15px; color:var(--accent-2);">${escapeHtml(r.name)}</div>
            <div style="font-size:12.5px; color:var(--text-muted);">House: ${escapeHtml(r.house || 'N/A')}</div>
          </div>
          <button class="btn sm secondary" onclick="downloadResidentPDF('${r.uid}')">PDF Card</button>
        </div>
        <div style="font-size:12px; color:var(--text-muted); margin-top:4px;">CNIC: ${escapeHtml(r.cnic || 'N/A')} | Phone: ${escapeHtml(r.phone || 'N/A')}</div>
        <div style="font-size:12px; color:var(--text-muted);">Blood Group: ${escapeHtml(r.bloodGroup || 'N/A')} (${escapeHtml(r.occupancyType || 'N/A')})</div>
      </div>
    `).join('');
  }

  window.downloadResidentPDF = function(uid) {
    const r = allResidents.find(item => item.uid === uid);
    if (!r) return;

    try {
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF();

      doc.setFont("helvetica", "bold");
      doc.setFontSize(18);
      doc.text("Roshan Pakistan Housing Society", 105, 20, { align: "center" });

      doc.setFontSize(12);
      doc.setFont("helvetica", "normal");
      doc.text("Official Resident Biodata Record", 105, 28, { align: "center" });

      doc.line(20, 35, 190, 35);

      let y = 48;
      const addRow = (label, val) => {
        doc.setFont("helvetica", "bold");
        doc.text(label + ":", 25, y);
        doc.setFont("helvetica", "normal");
        doc.text(String(val || 'N/A'), 75, y);
        y += 10;
      };

      addRow("Full Name", r.name);
      addRow("House / Plot", r.house);
      addRow("CNIC Number", r.cnic);
      addRow("Phone Number", r.phone);
      addRow("Email Address", r.email);
      addRow("Blood Group", r.bloodGroup);
      addRow("Occupancy Type", r.occupancyType);

      y += 5;
      doc.setFont("helvetica", "bold");
      doc.text("Family Members / Dependents:", 25, y);
      y += 8;
      doc.setFont("helvetica", "normal");
      const splitFamily = doc.splitTextToSize(r.familyDetails || 'N/A', 160);
      doc.text(splitFamily, 25, y);

      doc.save(`Resident_${(r.house || 'Biodata').replace(/\s+/g, '_')}.pdf`);
    } catch(err) {
      alert("Error generating PDF: " + err.message);
    }
  };

  // --- APPROVALS ---
  function loadPendingResidents() {
    if (!db) return;
    db.collection('users').where('approved', '==', false).get().then(snapshot => {
      pendingResidents = snapshot.docs.map(doc => ({ uid: doc.id, ...doc.data() }));
      renderApprovalsList();
    }).catch(e => console.error("Error loading approvals:", e));
  }

  function renderApprovalsList() {
    const listEl = document.getElementById('approvals-list');
    if (!listEl) return;
    if (!pendingResidents.length) {
      listEl.innerHTML = '<div class="card" style="text-align:center; color:var(--text-muted);">No pending registration requests.</div>';
      return;
    }

    listEl.innerHTML = pendingResidents.map(r => `
      <div class="card" style="cursor:default;">
        <div style="font-weight:700; font-size:15px; color:var(--accent-2);">${escapeHtml(r.name)}</div>
        <div style="font-size:12.5px; color:var(--text-muted);">House: ${escapeHtml(r.house || 'N/A')}</div>
        <div style="font-size:12.5px; color:var(--text-muted);">Phone: ${escapeHtml(r.phone || 'N/A')}</div>
        <div style="font-size:12.5px; color:var(--text-muted);">Email: ${escapeHtml(r.email || 'N/A')}</div>
        <div style="font-size:12.5px; color:var(--text-muted);">Biodata Status: ${r.biodataSubmitted ? 'Submitted' : 'Pending'}</div>

        <div style="display:flex; gap:10px; margin-top:12px;">
          <button class="btn sm primary block" onclick="approveUser('${r.uid}')">Approve</button>
          <button class="btn sm danger block" onclick="rejectUser('${r.uid}')">Reject</button>
        </div>
      </div>
    `).join('');
  }

  window.approveUser = async function(uid) {
    try {
      await db.collection('users').doc(uid).update({ approved: true });
      await sendNotification(uid, "Account Approved", "Your account has been approved! You can now access your portal.", "success");
      loadPendingResidents();
    } catch(e) { alert("Error approving user: " + e.message); }
  };

  window.rejectUser = async function(uid) {
    if (!confirm("Are you sure you want to delete this registration request?")) return;
    try {
      await db.collection('users').doc(uid).delete();
      loadPendingResidents();
    } catch(e) { alert("Error deleting user: " + e.message); }
  };

})();
</script>
</body>
</html>
