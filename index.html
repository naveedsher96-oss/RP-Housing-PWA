<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Roshan Pakistan Housing Society</title>
<meta name="theme-color" content="#10142A" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Roshan RPHS" />
<meta name="mobile-web-app-capable" content="yes" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<!-- Firebase Compatibility SDKs -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-messaging-compat.js"></script>

<!-- jsPDF is loaded on demand by ensureJsPDF() -->

<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
  :root{
    --bg:#10142A;
    --bg-elevated:#171C3B;
    --bg-elevated-2:#1E2447;
    --bg-elevated-3:#242B54;
    --accent:#F2A93B;
    --accent-2:#FFC670;
    --accent-soft:rgba(242,169,59,0.14);
    --text:#F1F2F9;
    --text-muted:#9AA0C3;
    --text-faint:#6B7099;
    --success:#34B398;
    --success-soft:rgba(52,179,152,0.14);
    --danger:#E5615A;
    --danger-soft:rgba(229,97,90,0.14);
    --warning:#F2A93B;
    --warning-soft:rgba(242,169,59,0.14);
    --info:#6E8FF2;
    --info-soft:rgba(110,143,242,0.14);
    --border:rgba(255,255,255,0.08);
    --border-soft:rgba(255,255,255,0.05);
    --radius:16px;
    --radius-sm:10px;
    --shadow:0 8px 30px rgba(0,0,0,0.35);
    --font-display:'Fraunces', serif;
    --font-body:'Manrope', -apple-system, BlinkMacSystemFont, sans-serif;
    --font-mono:'Manrope', -apple-system, BlinkMacSystemFont, sans-serif;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    background:
      radial-gradient(circle at 20% -10%, rgba(242,169,59,0.10), transparent 45%),
      radial-gradient(circle at 90% 0%, rgba(110,143,242,0.08), transparent 40%),
      var(--bg);
    color:var(--text);
    font-family:var(--font-body);
    font-size:15px;
    font-variant-numeric:tabular-nums;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    background-attachment:fixed;
  }
  html.text-lg body{zoom:1.12;}
  #app{
    max-width:520px;
    margin:0 auto;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    position:relative;
    padding-bottom:calc(84px + env(safe-area-inset-bottom));
  }
  #app.no-tabbar{padding-bottom:0;}
  a{color:inherit;}
  button{font-family:inherit;}
  ::selection{background:var(--accent-soft);}

  .topbar{
    position:sticky; top:0; z-index:30;
    padding:calc(16px + env(safe-area-inset-top)) 18px 14px;
    background:linear-gradient(180deg, rgba(16,20,42,0.97), rgba(16,20,42,0.88) 70%, rgba(16,20,42,0));
    backdrop-filter:blur(10px);
    display:flex; align-items:center; gap:10px;
    border-bottom:1px solid var(--border-soft);
  }
  .brand-mark{
    width:42px; height:42px; border-radius:12px;
    background:#fff;
    box-shadow:0 0 0 1px rgba(255,255,255,0.08), 0 0 18px 2px rgba(242,169,59,0.45);
    display:flex; align-items:center; justify-content:center;
    flex:none; padding:4px; overflow:hidden;
  }
  .brand-mark img{ width:100%; height:100%; object-fit:contain; display:block; }
  .brand-text{flex:1; min-width:0;}
  .brand-text .name{font-family:var(--font-display); font-weight:600; font-size:16.5px; line-height:1.2; letter-spacing:0.1px;}
  .brand-text .sub{font-size:13px; color:var(--text-muted); margin-top:2px; display:flex; align-items:center; gap:6px;}
  .role-pill{
    font-size:13px; font-weight:700; letter-spacing:0.4px; text-transform:uppercase;
    padding:2px 8px; border-radius:20px; background:var(--accent-soft); color:var(--accent-2);
    border:1px solid rgba(242,169,59,0.3);
  }

  .notif-bell-btn{
    position:relative; background:var(--bg-elevated-2); border:1px solid var(--border);
    border-radius:10px; width:38px; height:38px; display:flex; align-items:center;
    justify-content:center; cursor:pointer; font-size:18px; color:var(--text);
  }
  .notif-badge{
    position:absolute; top:-4px; right:-4px; background:var(--danger); color:#fff;
    font-size:13px; font-weight:800; border-radius:10px; padding:2px 5px; min-width:16px; text-align:center;
  }

  .push-banner{
    background:var(--accent-soft); border:1px solid rgba(242,169,59,0.3);
    border-radius:12px; padding:12px 14px; margin-bottom:16px; display:flex;
    align-items:center; justify-content:space-between; gap:10px;
  }
  .offline-banner{
    background:var(--warning-soft); border:1px solid rgba(242,169,59,0.35); color:var(--accent-2);
    border-radius:12px; padding:9px 14px; margin-bottom:14px; font-size:13px; font-weight:600; text-align:center;
  }

  .notif-item{background:var(--bg-elevated-2); border:1px solid var(--border); padding:10px 12px 10px 16px; border-radius:10px; margin-bottom:8px; position:relative; cursor:pointer;}
  .notif-item.unread{border-color:rgba(242,169,59,0.35); background:linear-gradient(180deg, rgba(242,169,59,0.08), var(--bg-elevated-2));}
  .notif-item.unread::before{content:''; position:absolute; left:6px; top:16px; width:6px; height:6px; border-radius:50%; background:var(--accent);}
  .notif-item .meta{display:flex; justify-content:space-between; gap:8px; font-size:13px; color:var(--text-faint); margin-top:6px;}
  .notif-cat{font-size:13px; font-weight:700; text-transform:uppercase; letter-spacing:.4px; color:var(--text-muted);}
  .mute-row{display:flex; justify-content:space-between; align-items:center; padding:9px 0; border-bottom:1px solid var(--border); font-size:13px;}
  .mute-row:last-child{border-bottom:none;}
  .switch{position:relative; width:40px; height:22px; border-radius:11px; background:rgba(255,255,255,0.14); border:none; cursor:pointer; transition:background .15s; flex:none;}
  .switch::after{content:''; position:absolute; top:3px; left:3px; width:16px; height:16px; border-radius:50%; background:#fff; transition:left .15s;}
  .switch.on{background:var(--success);}
  .switch.on::after{left:21px;}

  main{flex:1; padding:18px 18px 10px;}
  .section-title{
    font-family:var(--font-display); font-weight:600; font-size:22px; margin:4px 0 4px;
    display:flex; align-items:center; justify-content:space-between; gap:10px;
  }
  .section-sub{color:var(--text-muted); font-size:13px; margin:0 0 18px; line-height:1.5;}
  .card{
    background:var(--bg-elevated); border:1px solid var(--border);
    border-radius:var(--radius); padding:16px; margin-bottom:12px;
    box-shadow:var(--shadow); position:relative; cursor:pointer;
  }

  .ticket-no{
    font-family:var(--font-mono); font-size:13px; color:var(--accent-2);
    background:var(--accent-soft); padding:2px 6px; border-radius:4px; font-weight:600;
  }

  .badge{
    display:inline-flex; align-items:center; gap:5px; font-size:13px; font-weight:700;
    padding:3px 10px; border-radius:20px; white-space:nowrap;
  }
  .badge.pending{background:var(--warning-soft); color:var(--accent-2);}
  .badge.assigned{background:var(--info-soft); color:var(--info);}
  .badge.in-progress{background:var(--info-soft); color:var(--info);}
  .badge.resolved{background:var(--success-soft); color:var(--success);}
  .badge.closed{background:rgba(255,255,255,0.1); color:var(--text-muted);}
  .badge.notice{background:var(--accent-soft); color:var(--accent-2);}
  .badge.unpaid{background:var(--warning-soft); color:var(--accent-2);}
  .badge.paid{background:var(--success-soft); color:var(--success);}
  .badge.overdue{background:var(--danger-soft); color:var(--danger);}
  .badge.cancelled{background:rgba(255,255,255,0.1); color:var(--text-muted);}
  .badge.submitted{background:var(--info-soft); color:var(--info);}
  .badge.verified{background:var(--success-soft); color:var(--success);}
  .badge.rejected{background:var(--danger-soft); color:var(--danger);}
  .badge.active{background:var(--success-soft); color:var(--success);}

  .stat-strip{display:flex; gap:8px; margin-bottom:14px;}
  .stat-box{flex:1; background:var(--bg-elevated); border:1px solid var(--border); border-radius:var(--radius-sm); padding:10px 12px;}
  .stat-box .k{font-size:13px; text-transform:uppercase; letter-spacing:.4px; color:var(--text-faint); font-weight:700;}
  .stat-box .v{font-family:var(--font-mono); font-size:15px; font-weight:600; margin-top:4px;}

  .chip-row{display:flex; gap:8px; margin-bottom:14px; overflow-x:auto;}
  .chip{font-size:13px; font-weight:700; padding:6px 12px; border-radius:20px; border:1px solid var(--border); background:var(--bg-elevated-2); color:var(--text-muted); cursor:pointer; white-space:nowrap;}
  .chip.active{background:var(--accent-soft); color:var(--accent-2); border-color:rgba(242,169,59,0.35);}

  .amount{font-family:var(--font-mono); font-size:19px; font-weight:600; color:var(--text);}
  .due-card{background:linear-gradient(180deg, var(--bg-elevated-2), var(--bg-elevated)); border:1px solid rgba(242,169,59,0.28); border-radius:var(--radius); padding:16px; margin-bottom:14px;}
  .filter-bar{background:var(--bg-elevated); border:1px solid var(--border); border-radius:var(--radius-sm); padding:12px 14px; margin-bottom:14px;}
  .filter-bar label{margin-top:0;}

  input[type="file"]{width:100%; padding:10px 12px; margin-top:6px; background:var(--bg-elevated-2); border:1px solid var(--border); border-radius:var(--radius-sm); color:var(--text-muted); font-size:13px; font-family:var(--font-body);}
  input[type="file"]::file-selector-button{background:var(--bg-elevated-3); color:var(--text); border:1px solid var(--border); border-radius:8px; padding:6px 12px; margin-right:10px; font-size:13px; font-weight:700; cursor:pointer;}
  .proof-thumb{max-width:100%; border-radius:var(--radius-sm); border:1px solid var(--border); display:block; margin:8px 0;}
  .progress{height:8px; background:var(--bg-elevated-2); border:1px solid var(--border-soft); border-radius:6px; overflow:hidden; margin:8px 0 6px;}
  .progress .fill{height:100%; background:linear-gradient(90deg, var(--accent), var(--accent-2)); border-radius:6px;}

  .btn{
    font-family:inherit; font-weight:700; font-size:13.5px; border:none; border-radius:12px;
    padding:12px 16px; cursor:pointer; display:inline-flex; align-items:center; justify-content:center; gap:8px;
  }
  .btn.primary{background:linear-gradient(180deg, var(--accent-2), var(--accent)); color:#251400; box-shadow:0 4px 16px rgba(242,169,59,0.35);}
  .btn.secondary{background:var(--bg-elevated-2); color:var(--text); border:1px solid var(--border);}
  .btn.danger{background:var(--danger); color:#fff;}
  .btn.sm{padding:6px 12px; font-size:13px; border-radius:8px;}
  .btn.block{width:100%;}

  label{display:block; font-size:13px; font-weight:700; color:var(--text-muted); margin:14px 0 6px; text-transform:uppercase; letter-spacing:.3px;}
  input[type=text], input[type=search], input[type=number], input[type=date], input[type=email], input[type=password], select, textarea{
    width:100%; background:var(--bg); border:1px solid var(--border); color:var(--text);
    border-radius:10px; padding:12px 13px; font-family:inherit; font-size:14.5px; outline:none;
  }
  textarea{resize:vertical; min-height:80px;}
  input:focus, select:focus, textarea:focus{ border-color:rgba(242,169,59,0.6); box-shadow:0 0 0 3px var(--accent-soft); }
  select{
    appearance:none; -webkit-appearance:none; color-scheme:dark; cursor:pointer; padding-right:40px;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='%23FFC670' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'/></svg>");
    background-repeat:no-repeat; background-position:right 13px center;
  }
  select option, select optgroup{ background:var(--bg-elevated); color:var(--text); font-family:var(--font-body); font-size:14px; padding:10px 12px; }
  select optgroup{ color:var(--text-faint); font-weight:700; font-size:13px; text-transform:uppercase; letter-spacing:.4px; }
  select option:checked{ background:var(--bg-elevated-3); color:var(--accent-2); }

  /* Custom picker: styled, searchable replacement for a native <select> */
  .picker{ position:relative; }
  .picker-trigger{
    width:100%; display:flex; align-items:center; gap:12px; text-align:left; cursor:pointer;
    background:var(--bg); border:1px solid var(--border); border-radius:10px; padding:10px 13px;
    color:var(--text); font-family:inherit; transition:border-color .15s, box-shadow .15s;
  }
  .picker-trigger:focus-visible, .picker.open .picker-trigger{ outline:none; border-color:rgba(242,169,59,0.6); box-shadow:0 0 0 3px var(--accent-soft); }
  .picker-avatar{
    width:36px; height:36px; border-radius:50%; flex-shrink:0; display:flex; align-items:center; justify-content:center;
    font-size:13px; font-weight:800; letter-spacing:.3px; color:#251400;
    background:linear-gradient(180deg, var(--accent-2), var(--accent));
  }
  .picker-avatar.all{ background:var(--info); color:#fff; font-size:15px; }
  .picker-avatar.staff{ background:linear-gradient(180deg, #8FA7F5, var(--info)); color:#fff; }
  .picker-avatar.cat{ background:var(--bg-elevated-3); color:var(--accent-2); font-size:16px; }
  .picker-text{ flex:1; min-width:0; display:flex; flex-direction:column; gap:2px; }
  .picker-main{ font-size:14.5px; font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .picker-sub{ font-size:13px; color:var(--text-muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .picker-chev{ flex-shrink:0; width:24px; height:24px; display:flex; align-items:center; justify-content:center; color:var(--accent-2); transition:transform .18s; }
  .picker.open .picker-chev{ transform:rotate(180deg); }
  .picker-panel{
    display:none; margin-top:6px; background:var(--bg-elevated-2); border:1px solid var(--border);
    border-radius:12px; overflow:hidden; box-shadow:0 10px 30px rgba(0,0,0,0.4);
  }
  .picker.open .picker-panel{ display:block; animation:pickerIn .16s ease-out; }
  @keyframes pickerIn{ from{ opacity:0; transform:translateY(-4px); } to{ opacity:1; transform:none; } }
  .picker-search-wrap{ padding:10px 10px 6px; }
  .picker-search{
    width:100%; background:var(--bg); border:1px solid var(--border); border-radius:9px; color:var(--text);
    padding:10px 12px 10px 36px; font-family:inherit; font-size:14px; outline:none;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='%239AA0C3' stroke-width='2.2' stroke-linecap='round'><circle cx='11' cy='11' r='7'/><line x1='20' y1='20' x2='16.5' y2='16.5'/></svg>");
    background-repeat:no-repeat; background-position:12px center;
  }
  .picker-list{ max-height:280px; overflow-y:auto; padding:4px 6px 8px; }
  .picker-group{
    display:flex; justify-content:space-between; align-items:center; padding:10px 10px 4px;
    font-size:13px; font-weight:800; text-transform:uppercase; letter-spacing:.5px; color:var(--text-faint);
  }
  .picker-opt{
    width:100%; display:flex; align-items:center; gap:12px; text-align:left; cursor:pointer;
    background:none; border:none; border-radius:9px; padding:9px 10px; color:var(--text); font-family:inherit;
  }
  .picker-opt:hover, .picker-opt:focus-visible{ background:var(--bg-elevated-3); outline:none; }
  .picker-opt.selected{ background:var(--accent-soft); }
  .picker-opt .picker-avatar{ width:34px; height:34px; font-size:13px; }
  .picker-opt .picker-main{ font-size:14px; font-weight:600; }
  .picker-check{ flex-shrink:0; width:20px; color:var(--accent-2); font-weight:800; opacity:0; }
  .picker-opt.selected .picker-check{ opacity:1; }
  .picker-tag{
    flex-shrink:0; font-size:13px; font-weight:800; text-transform:uppercase; letter-spacing:.4px;
    padding:3px 7px; border-radius:6px; background:var(--info-soft); color:var(--info);
  }
  .picker-empty{ text-align:center; color:var(--text-muted); font-size:13px; padding:18px 10px; }

  .modal-overlay{
    position:fixed; top:0; left:0; right:0; bottom:0; z-index:100;
    background:rgba(10,12,24,0.7); backdrop-filter:blur(6px);
    display:none; align-items:flex-end; justify-content:center; padding:0;
  }
  .modal-overlay.active{ display:flex; }
  .modal-card{
    background:var(--bg-elevated); border:1px solid var(--border); border-bottom:none;
    border-radius:24px 24px 0 0; padding:10px 20px calc(24px + env(safe-area-inset-bottom)); max-width:520px; width:100%;
    box-shadow:0 -10px 40px rgba(0,0,0,0.45); position:relative; max-height:90vh; overflow-y:auto;
    animation:sheetUp .22s ease-out;
  }
  @keyframes sheetUp{ from{ transform:translateY(30px); opacity:0; } to{ transform:none; opacity:1; } }
  .modal-head{ position:sticky; top:-10px; z-index:5; display:flex; align-items:center; justify-content:flex-end; gap:10px; margin:0 -20px 6px; padding:6px 14px 6px; background:var(--bg-elevated); }
  .modal-head::before{ content:''; position:absolute; left:50%; top:4px; transform:translateX(-50%); width:42px; height:5px; border-radius:3px; background:var(--bg-elevated-3); }
  .modal-close{
    position:relative; flex-shrink:0; background:var(--bg-elevated-2);
    color:var(--text-muted); border:1px solid var(--border); border-radius:50%;
    width:38px; height:38px; display:flex; align-items:center; justify-content:center;
    cursor:pointer; font-size:16px; font-weight:bold; margin-top:10px;
  }
  .modal-close:hover{ color:var(--text); border-color:var(--accent-2); }

  nav.tabbar{
    position:fixed; bottom:0; left:0; right:0; z-index:40;
    display:flex; justify-content:center;
    padding-bottom:env(safe-area-inset-bottom);
    background:linear-gradient(0deg, rgba(23,28,59,0.99), rgba(23,28,59,0.95));
    border-top:1px solid var(--border); backdrop-filter:blur(10px);
  }
  .tabbar-inner{ max-width:520px; width:100%; display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); padding:6px 4px 8px; }
  .tab-btn{ background:none; border:none; color:var(--text-faint); cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:3px; padding:4px 2px; min-width:0; font-family:inherit; }
  .tab-btn .pill{ display:flex; align-items:center; justify-content:center; width:52px; height:30px; border-radius:15px; }
  .tab-btn svg{ width:22px; height:22px; }
  .tab-btn.active{color:var(--accent-2);}
  .tab-btn.active .pill{background:var(--accent-soft);}
  .tab-btn .lbl{font-size:11px; font-weight:700; line-height:1.15; text-align:center;}
  .ico-svg{ width:20px; height:20px; flex:none; }
  .top-back{ background:var(--bg-elevated-2); color:var(--text); border:1px solid var(--border); border-radius:12px; width:40px; height:40px; display:flex; align-items:center; justify-content:center; cursor:pointer; flex:none; }
  .top-back svg{ width:20px; height:20px; }
  .more-user{ display:flex; align-items:center; gap:12px; margin-bottom:14px; }
  .more-user .av{ width:44px; height:44px; border-radius:50%; background:var(--bg-elevated-3); color:var(--accent-2); font-weight:800; display:flex; align-items:center; justify-content:center; flex:none; }
  .more-grid{ display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px; }
  .more-grid button{ position:relative; background:var(--bg-elevated-2); border:1px solid var(--border); border-radius:14px; padding:14px 4px; color:var(--text); font-family:inherit; font-weight:700; font-size:13px; line-height:1.25; display:flex; flex-direction:column; align-items:center; gap:8px; cursor:pointer; text-align:center; min-width:0; }
  .more-grid button svg{ width:24px; height:24px; color:var(--accent-2); }
  .more-grid button.active{ border-color:rgba(242,169,59,0.5); background:var(--accent-soft); }
  .more-grid .cnt, .cnt-dot{ position:absolute; top:7px; right:7px; font-size:11.5px; font-weight:800; background:var(--danger); color:#fff; border-radius:9px; padding:1px 6px; }
  .more-list{ margin-top:14px; border:1px solid var(--border); border-radius:14px; overflow:hidden; }

<script>
(function(){
  "use strict";

        <span style="display:inline-block; background:#FDFDF8; border-radius:20px; padding:14px 20px; box-shadow:0 6px 24px rgba(0,0,0,0.35);"><img src="logo.png" alt="Roshan Pakistan" style="width:110px; max-width:40vw; height:auto; display:block;" onerror="this.parentElement.style.display='none'" /></span>

  try {
    if (typeof firebase === 'undefined') {

  // --- OFFLINE & PERFORMANCE ---
  // Firestore keeps a local copy of everything the user has read, so tabs open
  // instantly and still work (read-only) without signal.
  function enableOfflineData() {
    if (!db || typeof db.enablePersistence !== 'function') return;
    db.enablePersistence({ synchronizeTabs: true }).catch(err => {
      console.log('Offline data unavailable:', err && err.code ? err.code : err);
    });
  }

  function registerAppServiceWorker() {
    if (!('serviceWorker' in navigator) || location.protocol === 'file:') return;

  }

  // Shows locally cached data straight away, then replaces it with the live
  // result. handler(snapshot, fromCache) may run twice; an error is only thrown
  // when nothing at all could be shown.
  async function fetchFast(query, handler) {
    let shown = false;
    try {
      const cached = await query.get({ source: 'cache' });
      if (cached && !cached.empty) { shown = true; handler(cached, true); }
    } catch (_) { /* no cache yet */ }
    try {
      const live = await query.get();
      handler(live, false);
    } catch (e) {
      if (!shown) throw e;
      console.log('Using cached data:', e && e.message ? e.message : e);
    }
  }

  // Long lists render PAGE_SIZE cards at a time with a "Show more" button.
  const PAGE_SIZE = 25;
  const pageShown = {};
  const pageRenderers = {};
  function pageOf(key, items, rerender) {
    pageRenderers[key] = rerender;
    return items.slice(0, pageShown[key] || PAGE_SIZE);
  }
  function showMoreButton(key, total) {
    const shown = Math.min(total, pageShown[key] || PAGE_SIZE);
    if (shown >= total) return '';
    return `<button class="btn secondary" style="width:100%; margin-top:6px;" onclick="showMore('${key}')">Show more (${total - shown} remaining)</button>`;
  }
  window.showMore = function(key) {
    pageShown[key] = (pageShown[key] || PAGE_SIZE) + PAGE_SIZE;
    if (pageRenderers[key]) pageRenderers[key]();
  };

  let jsPdfLoading = null;
  function ensureJsPDF() {
    if (window.jspdf && window.jspdf.jsPDF) return Promise.resolve(window.jspdf);
    if (!jsPdfLoading) {
      jsPdfLoading = new Promise((resolve, reject) => {
        const s = document.createElement('script');
        s.src = 'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';
        s.onload = () => window.jspdf && window.jspdf.jsPDF ? resolve(window.jspdf) : reject(new Error('PDF library failed to load'));
        s.onerror = () => { jsPdfLoading = null; reject(new Error('PDF library could not be downloaded. Check your connection and try again.')); };
        document.head.appendChild(s);
      });
    }
    return jsPdfLoading;
  }

  function renderOfflineBanner() {
    const el = document.getElementById('offline-banner');
    if (!el) return;
    el.style.display = navigator.onLine === false ? 'block' : 'none';
  }
  window.addEventListener('online', () => { renderOfflineBanner(); if (currentUserProfile) loadData(); });
  window.addEventListener('offline', renderOfflineBanner);

  // Application State Variables
  let currentUserProfile = null;
  let registrationInProgress = false;
  let authMode = 'login'; // 'login' | 'register' | 'reset'
  let authMessage = null; // { type: 'error'|'success'|'info', text }
  let wasSignedIn = false;
  let manualSignOut = false;
  let activeTab = 'dashboard';
  let navStack = []; // previous tabs, for the Back button
  let notifications = [];
  let pendingResidents = [];
  let allResidents = [];
  let noticesList = [];
  let noticeComments = {}; // announcementId -> comments[] (oldest first)
  let openCommentThreads = new Set();
  let pollsList = [];
  let ticketsList = [];
  let billsList = [];
  let billFilterStatus = null; // null = the role's default chip (see currentBillFilter)
  let billsLoaded = false;
  let billSearch = '';
  let billFilterMonth = 'all';
  let expenseFilter = { month: 'all', category: 'all', source: 'all' };
  let residentSearch = '';
  let societySettings = null;
  let recurringSettings = null;
  let recurringExempt = [];
  let monthlySummaries = [];
  let fundsList = [];
  let fundContribsList = [];
  let ticketFilterMonth = 'all';
  let ticketFilterStatus = 'all';
  let expensesList = [];
  let expenseSources = { bills: [], funds: [], contribs: [], transfers: [] };
  let fundExpensesList = [];
  let fundTransfersList = [];
  let billsAccountData = { loaded: false, expenses: [], transfers: [] };
  let volunteersList = [];
  let decisionsList = [];
  let auditList = [];
  let archivedRecords = [];
  let boardMembersCount = null;

  const FUND_CATEGORIES = ['Zakat', 'Khairat / Sadaqat', 'Welfare', 'Mosque', 'Sanitation', 'Funeral', 'Maintenance', 'Development', 'Other'];
  const PAYMENT_METHODS = ['Bank Transfer', 'EasyPaisa', 'JazzCash', 'Cash'];
  const EXPENSE_CATEGORIES = ['Utilities', 'Welfare', 'Maintenance', 'Sanitation', 'Security', 'Mosque', 'Events', 'Other'];

  function isStaff() {
    return currentUserProfile && ['admin', 'board', 'superadmin'].includes(currentUserProfile.role);
  }
  function isBoard() { return currentUserProfile && (currentUserProfile.role === 'board' || currentUserProfile.boardMember === true); }
  function isSuperAdmin() { return currentUserProfile && (currentUserProfile.role === 'superadmin' || currentUserProfile.superAdmin === true); }
  function roleLabel() {
    const extras = [];
    if (currentUserProfile.superAdmin === true && currentUserProfile.role !== 'superadmin') extras.push('super admin');
    if (currentUserProfile.boardMember === true && currentUserProfile.role !== 'board') extras.push('board');
    return currentUserProfile.role + (extras.length ? ' + ' + extras.join(' + ') : '');
  }

  // Immutable audit trail: every significant mutation is journaled here.
  function logAudit(entityType, entityId, action, details) {
    if (!db || !currentUserProfile) return Promise.resolve();
    return db.collection('audit_log').add({
      entityType,
      entityId: entityId || '',
      action,
      details: details || '',
      performedBy: currentUserProfile.name,
      performedByUid: auth.currentUser ? auth.currentUser.uid : '',
      role: currentUserProfile.role,
      timestamp: firebase.firestore.FieldValue.serverTimestamp()
    }).catch(err => console.error("Audit log write failed:", err));
  }

  async function getBoardMembersCount() {
    if (boardMembersCount !== null) return boardMembersCount;
    try {
      const [roleSnap, flagSnap] = await Promise.all([
        db.collection('users').where('role', '==', 'board').get(),
        db.collection('users').where('boardMember', '==', true).get()
      ]);
      const seen = {};
      roleSnap.docs.concat(flagSnap.docs).forEach(d => { seen[d.id] = d.data(); });
      boardMembersCount = Object.values(seen).filter(u => u.approved !== false).length;
    } catch(e) {
      console.error("Error counting board members:", e);
      boardMembersCount = 0;
    }
    return boardMembersCount;
  }

  const appEl = document.getElementById('app');

  // Observer
  if (auth) {
    auth.onAuthStateChanged(async (user) => {
      if (registrationInProgress) return; 

      if (user) {
        try {
          const userDoc = await db.collection('users').doc(user.uid).get();
          if (userDoc.exists) {
            currentUserProfile = { uid: user.uid, email: user.email, ...userDoc.data() };
            wasSignedIn = true;
            saveDeviceToken();
          } else {
            currentUserProfile = null;
            authMessage = { type: 'error', text: 'No resident record was found for this account. Please register or contact the administrator.' };
            await auth.signOut();
            return;
          }
        } catch(e) {
          console.error("Failed fetching user profile:", e);
          currentUserProfile = null;
          authMessage = { type: 'error', text: friendlyAuthError(e) };
          try { await auth.signOut(); } catch(_) {}
          return;
        }
      } else {
        currentUserProfile = null;
        notifications = [];
        notifsLoadedAt = 0;
        if (wasSignedIn) {
          authMessage = manualSignOut
            ? { type: 'success', text: 'You have been signed out successfully.' }
            : { type: 'info', text: 'Your session has expired. Please sign in again.' };
          wasSignedIn = false;
          manualSignOut = false;
          authMode = 'login';
        }
      }
      render();
    });

    // Never leave the user on a blank/loading screen: if the auth state has not
    // resolved in time (slow or blocked network), fall through to the sign-in screen.
    setTimeout(() => {
      if (initialRenderDone) return;
      authMessage = { type: 'info', text: 'Connection is slow. Please check your internet and sign in again.' };
      render();
    }, BOOT_TIMEOUT_MS);

  function initPushMessaging() {
    if (!messaging) return;
    if (Notification.permission === 'granted') {
      saveDeviceToken();
    }
    messaging.onMessage((payload) => {
      new Notification(payload.notification.title, {
        body: payload.notification.body,
        icon: 'icon-192.png'
      });
      loadNotifications(true);
    });
  }

  function saveDeviceToken() {
    if (!messaging || !currentUserProfile || !auth.currentUser) return;
    if (!FCM_VAPID_KEY) { console.log('FCM VAPID key not configured; push disabled.'); return; }
    navigator.serviceWorker.register('firebase-messaging-sw.js')
      .then(reg => messaging.getToken({ vapidKey: FCM_VAPID_KEY, serviceWorkerRegistration: reg }))
      .then((currentToken) => {
      if (currentToken && db) {
        db.collection('fcm_tokens').doc(auth.currentUser.uid).set({
          token: currentToken,
          uid: auth.currentUser.uid,
          name: currentUserProfile.name,
          role: currentUserProfile.role,
          updatedAt: firebase.firestore.FieldValue.serverTimestamp()
        }, { merge: true }).catch(err => console.error("FCM Token Save Error:", err));
      }
    }).catch((err) => console.log('Push token registration error:', err));
  }

  // --- BIOMETRIC (FINGERPRINT) SIGN-IN ---
  // The saved login is encrypted with a non-extractable AES key kept in IndexedDB and is
  // only used after the device's fingerprint/face check (WebAuthn platform authenticator).
  function bufToB64(buf) { return btoa(String.fromCharCode(...new Uint8Array(buf))); }
  function b64ToBuf(b64) { return Uint8Array.from(atob(b64), c => c.charCodeAt(0)).buffer; }
  function bioSupported() { return !!(window.PublicKeyCredential && navigator.credentials && window.isSecureContext && window.crypto && crypto.subtle); }
  function bioEnrolled() { try { return !!localStorage.getItem('bioCred'); } catch(_) { return false; } }

  function bioDB() {
    return new Promise((resolve, reject) => {
      const rq = indexedDB.open('rphs-bio', 1);
      rq.onupgradeneeded = () => rq.result.createObjectStore('keys');
      rq.onsuccess = () => resolve(rq.result);
      rq.onerror = () => reject(rq.error);
    });
  }
  async function bioStoreKey(key) {
    const d = await bioDB();
    return new Promise((resolve, reject) => {
      const tx = d.transaction('keys', 'readwrite');
      tx.objectStore('keys').put(key, 'aes');
      tx.oncomplete = resolve;
      tx.onerror = () => reject(tx.error);
    });
  }
  async function bioGetKey() {
    const d = await bioDB();
    return new Promise((resolve, reject) => {
      const rq = d.transaction('keys').objectStore('keys').get('aes');
      rq.onsuccess = () => resolve(rq.result || null);
      rq.onerror = () => reject(rq.error);
    });
  }
  async function bioDelKey() {
    const d = await bioDB();
    return new Promise((resolve) => {
      const tx = d.transaction('keys', 'readwrite');
      tx.objectStore('keys').delete('aes');
      tx.oncomplete = resolve;
      tx.onerror = resolve;
    });
  }

  async function enableBiometricSignIn(email, password) {
    const cred = await navigator.credentials.create({ publicKey: {
      challenge: crypto.getRandomValues(new Uint8Array(32)),
      rp: { name: 'Roshan Housing Society' },
      user: { id: crypto.getRandomValues(new Uint8Array(16)), name: email, displayName: email },
      pubKeyCredParams: [{ type:'public-key', alg:-7 }, { type:'public-key', alg:-257 }],
      authenticatorSelection: { authenticatorAttachment:'platform', userVerification:'required' },
      timeout: 60000
    }});
    const key = await crypto.subtle.generateKey({ name:'AES-GCM', length:256 }, false, ['encrypt','decrypt']);
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const ct = await crypto.subtle.encrypt({ name:'AES-GCM', iv }, key, new TextEncoder().encode(JSON.stringify({ email, password })));
    await bioStoreKey(key);
    localStorage.setItem('bioCred', JSON.stringify({ id: bufToB64(cred.rawId), iv: bufToB64(iv), ct: bufToB64(ct) }));
  }

  async function biometricSignIn() {
    const rec = JSON.parse(localStorage.getItem('bioCred'));
    await navigator.credentials.get({ publicKey: {
      challenge: crypto.getRandomValues(new Uint8Array(32)),
      allowCredentials: [{ type:'public-key', id: b64ToBuf(rec.id) }],
      userVerification: 'required',
      timeout: 60000
    }});
    const key = await bioGetKey();
    if (!key) throw new Error('Fingerprint data is missing on this device. Please sign in with your password.');
    const pt = await crypto.subtle.decrypt({ name:'AES-GCM', iv: b64ToBuf(rec.iv) }, key, b64ToBuf(rec.ct));
    const { email, password } = JSON.parse(new TextDecoder().decode(pt));
    await auth.signInWithEmailAndPassword(email, password);
  }

  function drawFamilySection(containerId) {
    const st = familyStates[containerId];
    const el = document.getElementById(containerId);
    let html = `
      <div class="fam-sect-title">Family Members Living With You</div>
      <div class="fam-hint">Tick a box only for the family members who live with you, then fill their details.</div>`;

    FAMILY_SINGLES.forEach(([key, label]) => {

      html += `

          </label>
          ${on ? `<div>${famFieldsHTML(containerId + '-' + key, label + "'s", st[key], false)}</div>` : ''}
        </div>`;
    });

    FAMILY_MULTIS.forEach(([key, label]) => {
      const on = st[key].length > 0;
      html += `
        <div class="fam-member">
          <label class="fam-head" style="margin:0; text-transform:none; font-size:14px; color:var(--text); letter-spacing:0;">
            <input type="checkbox" data-fam-toggle="${key}" ${on ? 'checked' : ''}> ${label}(s)
          </label>
          ${on ? st[key].map((m, i) => `<div>${famFieldsHTML(containerId + '-' + key + '-' + i, label + ' ' + (i+1) + ' \u2014', m, true)}</div>`).join('') : ''}

        </div>`;
    });

    html += `
      <label>Other Dependents (optional)</label>
      <textarea id="${containerId}-other" rows="2" placeholder="Anyone else living with you (e.g. brother, domestic staff)...">${escapeHtml(st.other)}</textarea>`;

    el.innerHTML = html;

    el.querySelectorAll('[data-fam-toggle]').forEach(cb => {
      cb.addEventListener('change', (e) => {
        syncFamilyInputs(containerId);
        const key = e.target.getAttribute('data-fam-toggle');
        if (FAMILY_SINGLES.some(([k]) => k === key)) {
          st[key] = e.target.checked ? { name:'', cnic:'', bloodGroup:'' } : null;
        } else {
          st[key] = e.target.checked ? [{ name:'', cnic:'', bloodGroup:'' }] : [];
        }
        drawFamilySection(containerId);
      });
    });
    el.querySelectorAll('[data-fam-add]').forEach(btn => {
      btn.addEventListener('click', () => {
        syncFamilyInputs(containerId);
        st[btn.getAttribute('data-fam-add')].push({ name:'', cnic:'', bloodGroup:'' });
        drawFamilySection(containerId);
      });
    });
  }

  function readFamMember(idBase) {
    const nameEl = document.getElementById(idBase + '-name');
    if (!nameEl) return null;
    return {
      name: nameEl.value.trim(),
      cnic: document.getElementById(idBase + '-cnic').value.trim(),
      bloodGroup: document.getElementById(idBase + '-blood').value
    };
  }

  function syncFamilyInputs(containerId) {
    const st = familyStates[containerId];
    FAMILY_SINGLES.forEach(([key]) => {
      if (st[key]) st[key] = readFamMember(containerId + '-' + key) || st[key];
    });
    FAMILY_MULTIS.forEach(([key]) => {
      st[key] = st[key].map((m, i) => readFamMember(containerId + '-' + key + '-' + i) || m);
    });
    const otherEl = document.getElementById(containerId + '-other');
    if (otherEl) st.other = otherEl.value.trim();
  }

  function familySummaryText(family, other) {
    family = family || {};
    const parts = [];
    const fmt = (label, m) => label + ': ' + m.name + (m.bloodGroup ? ' (' + m.bloodGroup + ')' : '') + (m.cnic ? ', CNIC ' + m.cnic : '');
    FAMILY_SINGLES.forEach(([key, label]) => { if (family[key] && family[key].name) parts.push(fmt(label, family[key])); });
    FAMILY_MULTIS.forEach(([key, label]) => (family[key] || []).forEach((m, i) => { if (m.name) parts.push(fmt(label + ' ' + (i+1), m)); }));
    if (other) parts.push('Other: ' + other);
    return parts.join('\n') || 'None';
  }

  function collectFamilySection(containerId) {
    syncFamilyInputs(containerId);
    const st = familyStates[containerId];
    const check = (label, m, cnicOptional) => {
      if (!m.name) throw new Error('Please enter the name for ' + label + ' (or untick the box).');
      if (!m.bloodGroup) throw new Error('Please select the blood group for ' + label + '.');
      if (!cnicOptional && !m.cnic) throw new Error('Please enter the CNIC for ' + label + '.');
    };
    FAMILY_SINGLES.forEach(([key, label]) => { if (st[key]) check(label, st[key], false); });
    FAMILY_MULTIS.forEach(([key, label]) => st[key].forEach((m, i) => check(label + ' ' + (i+1), m, true)));
    const family = { father: st.father, mother: st.mother, spouse: st.spouse, sons: st.sons, daughters: st.daughters };
    return { family, otherDependents: st.other, familyDetails: familySummaryText(family, st.other) };
  }

        return 'No account was found with this email. Please register first or check the email address.';

        return 'Network problem — could not reach the server. Please check your internet connection and try again.';

      case 'auth/user-disabled':

          await biometricSignIn();
        } catch(err) {
          bioBtn.disabled = false;
          bioBtn.textContent = '🔒 Sign in with Fingerprint';
          if (err && (err.code === 'auth/wrong-password' || err.code === 'auth/invalid-credential' || err.code === 'auth/user-not-found')) {
            localStorage.removeItem('bioCred');
            bioDelKey();
            showAuthMessage('error', 'Your saved fingerprint login is out of date (password changed). Please sign in with your password to re-enable it.');
            renderOnboarding();
          } else if (err && err.name === 'NotAllowedError') {
            showAuthMessage('info', 'Fingerprint sign-in was cancelled.');
          } else {
            showAuthMessage('error', friendlyAuthError(err));
          }
        }
      });
    }

    const forgotBtn = document.getElementById('forgot-password-btn');
    if (forgotBtn) {
      forgotBtn.addEventListener('click', () => {
        authMode = 'reset';
        authMessage = null;
        renderOnboarding();
      });
    }

    document.getElementById('auth-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('auth-email').value.trim();
      const submitBtn = document.getElementById('auth-submit-btn');
      const originalLabel = submitBtn.textContent;

      function setLoading(label) {
        submitBtn.disabled = true;
        submitBtn.textContent = label;
      }
      function clearLoading() {
        submitBtn.disabled = false;
        submitBtn.textContent = originalLabel;
      }

      if (isReset) {
        setLoading('Sending reset email…');
        try {
          await auth.sendPasswordResetEmail(email);
          authMode = 'login';
          authMessage = { type: 'success', text: 'Password reset email sent to ' + email + '. Check your inbox (and spam folder), then sign in with your new password.' };
          renderOnboarding();
        } catch(err) {
          clearLoading();
          showAuthMessage('error', friendlyAuthError(err));
        }
        return;
      }

      const password = document.getElementById('auth-password').value.trim();

      if (isLogin) {
        setLoading('Signing in…');
        try {
          await auth.signInWithEmailAndPassword(email, password);
          authMessage = null;
          // Successful sign-in: onAuthStateChanged loads the profile and renders the app.
          if (bioSupported() && !bioEnrolled()) {
            setTimeout(async () => {
              try {
                if (await confirmSheet({ title: 'Use fingerprint sign-in?', body: 'Sign in faster on this device with your fingerprint.', okLabel: 'Turn on' })) {
                  await enableBiometricSignIn(email, password);
                  toast('Fingerprint sign-in enabled. Next time, tap "Sign in with Fingerprint".');
                }
              } catch(bioErr) { console.log('Biometric enrollment skipped:', bioErr); }
            }, 900);
          }
        } catch(err) {
          clearLoading();
          showAuthMessage('error', friendlyAuthError(err));
        }
      } else {
        const name = document.getElementById('auth-name').value.trim();
        const house = document.getElementById('auth-house').value.trim();
        const phone = document.getElementById('auth-phone').value.trim();

        registrationInProgress = true;
        setLoading('Creating account…');

        try {
          const cred = await auth.createUserWithEmailAndPassword(email, password);

          await db.collection('users').doc(cred.user.uid).set({
            name,
            email,
            role: 'resident',
            house,
            phone,
            approved: false,
            biodataSubmitted: false,
            createdAt: firebase.firestore.FieldValue.serverTimestamp()
          });

          currentUserProfile = {
            uid: cred.user.uid,
            email,
            name,
            house,
            phone,
            role: 'resident',
            approved: false,
            biodataSubmitted: false
          };

          registrationInProgress = false;
          wasSignedIn = true;
          authMessage = null;

          try {
            await cred.user.sendEmailVerification();
          } catch (verificationError) {
            console.error("Verification email dispatch failed:", verificationError);
            toast("Account created! However, sending the verification email failed. Please use 'Resend Email Link' on the next screen.");
          }

          render();

        } catch(err) {
          registrationInProgress = false;
          clearLoading();
          showAuthMessage('error', friendlyAuthError(err));
        }
      }
    });
  }

  // --- NAVIGATION ---
  // Bottom bar: 4 screens per role + "More" (a sheet with a block for every
  // tab from drawerItemsForRole()). The top-left button and the phone's Back
  // button share goBack(): close an open sheet, else previous screen, else the
  // Dashboard, else ask before closing the app.
  function bottomTabsForRole() {
    const role = currentUserProfile.role;
    if (role === 'admin') return ['dashboard', 'bills', 'tickets', 'biodata'];
    if (role === 'board') return ['dashboard', 'board', 'notices', 'bills'];
    if (role === 'superadmin') return ['dashboard', 'approvals', 'biodata', 'archive'];
    return ['dashboard', 'notices', 'bills', 'tickets'];
  }

  function isHomeScreen() { return activeTab === 'dashboard' && !navStack.length; }

  // Bottom bar / More: top-level jump, so Back returns to the Dashboard.
  window.selectTab = function(tab) {
    navStack = [];
    closeModal();
    if (activeTab === tab) { window.scrollTo(0, 0); return; }
    activeTab = tab;
    render();
    window.scrollTo(0, 0);
  };

  // In-page links (e.g. a dashboard tile): remembered, so Back returns here.
  window.goTab = function(tab) {
    closeModal();
    if (activeTab === tab) return;
    navStack.push(activeTab);
    activeTab = tab;
    render();
    window.scrollTo(0, 0);
  };

  window.goBack = function() {
    if (uiSheetOpen()) { closeUiSheet(null); return; }
    const modal = document.getElementById('modal-view');
    if (modal && modal.classList.contains('active')) { closeModal(); return; }
    if (!currentUserProfile || !auth || !auth.currentUser) return;
    if (navStack.length) { activeTab = navStack.pop(); render(); window.scrollTo(0, 0); return; }
    if (activeTab !== 'dashboard') { activeTab = 'dashboard'; render(); window.scrollTo(0, 0); return; }
    uiConfirm({ title: 'Close the app?', body: 'You will stay logged in. Open RPHS again from your home screen any time.', okLabel: 'Close app' })
      .then(ok => { if (ok) closeApp(); });
  };

  // The phone's Back button: keep one extra history entry so Back lands in
  // popstate instead of leaving the app; closing steps out of the app's history.
  let closingApp = false;
  function closeApp() {
    closingApp = true;
    try { window.close(); } catch (_) {}
    history.go(-1);
  }
  function armBackButton() {
    try {
      if (!history.state || history.state.rphs !== 'guard') history.pushState({ rphs: 'guard' }, '');
    } catch (_) {}
  }
  window.addEventListener('popstate', () => {
    if (closingApp) return;
    armBackButton();
    if (currentUserProfile) window.goBack();
  });
  try { history.replaceState({ rphs: 'base' }, ''); armBackButton(); } catch (_) {}

  // Red count badges on More blocks (only when the number is already loaded).
  function moreBadgeCount(tab) {
    if (tab === 'approvals') return pendingResidents.length || 0;
    if (tab === 'board' && isBoard()) {
      return decisionsList.filter(d => !d.isDeleted && (d.status || 'pending') === 'pending' && !(d.votes || []).some(v => v.uid === auth.currentUser.uid)).length || 0;

  // Push banner: shown on the Dashboard only, and hidden for 7 days on "Not now".
  function showPushBanner() {
    if (!('Notification' in window) || Notification.permission === 'granted' || Notification.permission === 'denied') return false;

  // --- MAIN SHEET ---
  // Every screen that fills #modal-body opens it through openModal() so the
  // sheet starts scrolled to the top and the phone's Back button closes it.
  function openModal() {
    const view = document.getElementById('modal-view');
    view.classList.add('active');
    const card = view.querySelector('.modal-card');
    if (card) card.scrollTop = 0;
    armBackButton();

  // --- TOAST ---
  let toastTimer = null;
  function toast(message, kind) {
    const msg = String(message == null ? '' : message);
    const bad = kind === 'bad' || (kind == null && /^(error|failed|could not|unable|cannot|can't|invalid|not allowed|please |no |only |you have already|a reason|there are no)/i.test(msg.trim()));
    const old = document.querySelector('.ui-toast');
    if (old) old.remove();
    clearTimeout(toastTimer);
    const el = document.createElement('div');
    el.className = 'ui-toast' + (bad ? ' bad' : '');
    el.setAttribute('role', bad ? 'alert' : 'status');
    el.innerHTML = `${icon(bad ? 'alert' : 'check2')}<span>${escapeHtml(msg)}</span>`;
    el.addEventListener('click', () => el.remove());
    document.body.appendChild(el);
    toastTimer = setTimeout(() => el.remove(), Math.min(8000, 2600 + msg.length * 35));
  }
  window.toast = toast;

  // --- CONFIRM / REASON SHEETS ---
  // A second sheet (#ui-sheet) that can stack over an open #modal-view.
  let uiSheetResolve = null;
  function closeUiSheet(result) {
    const view = document.getElementById('ui-sheet');
    if (!view.classList.contains('active')) return;
    view.classList.remove('active');
    const done = uiSheetResolve;
    uiSheetResolve = null;
    if (done) done(result);
  }
  function openUiSheet(html, onReady) {
    if (uiSheetResolve) closeUiSheet(null);
    const view = document.getElementById('ui-sheet');
    document.getElementById('ui-sheet-body').innerHTML = html;
    view.classList.add('active');
    view.querySelector('.modal-card').scrollTop = 0;
    armBackButton();
    return new Promise(resolve => { uiSheetResolve = resolve; if (onReady) onReady(view); });
  }
  document.getElementById('ui-sheet').addEventListener('click', (e) => {
    if (e.target.id === 'ui-sheet') closeUiSheet(null);
  });
  document.getElementById('ui-sheet-close').addEventListener('click', () => closeUiSheet(null));
  function uiSheetOpen() { return document.getElementById('ui-sheet').classList.contains('active'); }

  // confirmSheet('Delete this?') or confirmSheet({ title, body, okLabel, danger }) -> Promise<boolean>
  function confirmSheet(opts) {
    if (typeof opts === 'string') opts = { body: opts };
    const o = Object.assign({ title: 'Are you sure?', body: '', okLabel: 'OK', cancelLabel: 'Cancel', danger: false }, opts);
    return openUiSheet(`
      <div class="ui-sheet-title">${escapeHtml(o.title)}</div>
      ${o.body ? `<div class="ui-sheet-body">${escapeHtml(o.body)}</div>` : ''}
      <div class="ui-sheet-actions">
        <button class="btn ${o.danger ? 'danger' : 'primary'} block" data-ui="ok">${escapeHtml(o.okLabel)}</button>
        <button class="btn secondary block" data-ui="cancel">${escapeHtml(o.cancelLabel)}</button>
      </div>
    `, view => {
      view.querySelector('[data-ui="ok"]').onclick = () => closeUiSheet(true);
      view.querySelector('[data-ui="cancel"]').onclick = () => closeUiSheet(false);
    }).then(r => r === true);
  }
  window.confirmSheet = confirmSheet;
  const uiConfirm = confirmSheet;

  // promptSheet({ title, body, label, placeholder, value, okLabel, danger, required, multiline, type })
  // -> Promise<string|null> (null when cancelled).
  function promptSheet(opts) {
    if (typeof opts === 'string') opts = { title: opts };
    const o = Object.assign({ title: '', body: '', label: '', placeholder: '', value: '', okLabel: 'Save', cancelLabel: 'Cancel', danger: false, required: false, multiline: false, type: 'text' }, opts);
    const field = o.multiline
      ? `<textarea id="ui-sheet-input" placeholder="${escapeHtml(o.placeholder)}">${escapeHtml(o.value)}</textarea>`
      : `<input id="ui-sheet-input" type="${escapeHtml(o.type)}" ${o.type === 'number' ? 'inputmode="decimal"' : ''} placeholder="${escapeHtml(o.placeholder)}" value="${escapeHtml(o.value)}" />`;
    return openUiSheet(`
      ${o.title ? `<div class="ui-sheet-title">${escapeHtml(o.title)}</div>` : ''}
      ${o.body ? `<div class="ui-sheet-body">${escapeHtml(o.body)}</div>` : ''}
      <form id="ui-sheet-form">
        ${o.label ? `<label for="ui-sheet-input">${escapeHtml(o.label)}</label>` : ''}
        ${field}
        <div id="ui-sheet-err" style="display:none; color:var(--danger); font-size:13.5px; font-weight:600; margin-top:6px;"></div>
        <div class="ui-sheet-actions">
          <button type="submit" class="btn ${o.danger ? 'danger' : 'primary'} block">${escapeHtml(o.okLabel)}</button>
          <button type="button" class="btn secondary block" data-ui="cancel">${escapeHtml(o.cancelLabel)}</button>
        </div>
      </form>
    `, view => {
      const input = view.querySelector('#ui-sheet-input');
      view.querySelector('[data-ui="cancel"]').onclick = () => closeUiSheet(null);
      view.querySelector('#ui-sheet-form').onsubmit = (ev) => {
        ev.preventDefault();
        const v = input.value.trim();
        if (o.required && !v) {
          const err = view.querySelector('#ui-sheet-err');
          err.textContent = 'Please fill this in.';
          err.style.display = 'block';
          input.focus();
          return;
        }
        closeUiSheet(v);
      };
      setTimeout(() => { try { input.focus(); } catch (_) {} }, 60);
    }).then(r => (typeof r === 'string' ? r : null));
  }
  window.promptSheet = promptSheet;

  // menuSheet(title, [{ label, icon, danger, run }]) for the ⋯ buttons on cards.
  const menuActions = [];
  function menuSheet(title, items) {
    menuActions.length = 0;
    items.filter(Boolean).forEach(it => menuActions.push(it));
    openUiSheet(`
      ${title ? `<div class="ui-sheet-title" style="font-size:18px;">${escapeHtml(title)}</div>` : ''}
      <div class="menu-list">
        ${menuActions.map((it, i) => `<button class="${it.danger ? 'danger' : ''}" data-mi="${i}">${icon(it.icon || 'grid')}<span>${escapeHtml(it.label)}</span></button>`).join('')}
      </div>
    `, view => {
      view.querySelectorAll('[data-mi]').forEach(btn => {
        btn.onclick = () => {
          const it = menuActions[Number(btn.dataset.mi)];
          closeUiSheet(null);
          if (it && it.run) setTimeout(() => it.run(), 30);
        };
      });
    });
  }
