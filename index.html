<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<title>Roshan Pakistan Housing Society</title>
<meta name="theme-color" content="#10142A" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Roshan RPHS" />
<meta name="mobile-web-app-capable" content="yes" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<!-- Firebase Compatibility SDKs -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-messaging-compat.js"></script>

<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
  :root{
    --bg:#10142A;
    --bg-elevated:#171C3B;
    --bg-elevated-2:#1E2447;
    --bg-elevated-3:#242B54;
    --accent:#F2A93B;
    --accent-2:#FFC670;
    --accent-soft:rgba(242,169,59,0.14);
    --text:#F1F2F9;
    --text-muted:#9AA0C3;
    --text-faint:#6B7099;
    --success:#34B398;
    --success-soft:rgba(52,179,152,0.14);
    --danger:#E5615A;
    --danger-soft:rgba(229,97,90,0.14);
    --warning:#F2A93B;
    --warning-soft:rgba(242,169,59,0.14);
    --info:#6E8FF2;
    --info-soft:rgba(110,143,242,0.14);
    --border:rgba(255,255,255,0.08);
    --border-soft:rgba(255,255,255,0.05);
    --radius:16px;
    --radius-sm:10px;
    --shadow:0 8px 30px rgba(0,0,0,0.35);
    --font-display:'Fraunces', serif;
    --font-body:'Manrope', -apple-system, BlinkMacSystemFont, sans-serif;
    --font-mono:'JetBrains Mono', monospace;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    background:
      radial-gradient(circle at 20% -10%, rgba(242,169,59,0.10), transparent 45%),
      radial-gradient(circle at 90% 0%, rgba(110,143,242,0.08), transparent 40%),
      var(--bg);
    color:var(--text);
    font-family:var(--font-body);
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  #app{
    max-width:520px;
    margin:0 auto;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    position:relative;
    padding-bottom:calc(78px + env(safe-area-inset-bottom));
  }
  a{color:inherit;}
  button{font-family:inherit;}
  ::selection{background:var(--accent-soft);}

  /* Top App Bar */
  .topbar{
    position:sticky; top:0; z-index:30;
    padding:calc(16px + env(safe-area-inset-top)) 18px 14px;
    background:linear-gradient(180deg, rgba(16,20,42,0.97), rgba(16,20,42,0.88) 70%, rgba(16,20,42,0));
    backdrop-filter:blur(10px);
    display:flex; align-items:center; gap:10px;
    border-bottom:1px solid var(--border-soft);
  }
  .brand-mark{
    width:42px; height:42px; border-radius:12px;
    background:#fff;
    box-shadow:0 0 0 1px rgba(255,255,255,0.08), 0 0 18px 2px rgba(242,169,59,0.45);
    display:flex; align-items:center; justify-content:center;
    flex:none; padding:4px; overflow:hidden;
  }
  .brand-mark img{ width:100%; height:100%; object-fit:contain; display:block; }
  .brand-text{flex:1; min-width:0;}
  .brand-text .name{font-family:var(--font-display); font-weight:600; font-size:16.5px; line-height:1.2; letter-spacing:0.1px;}
  .brand-text .sub{font-size:11.5px; color:var(--text-muted); margin-top:2px; display:flex; align-items:center; gap:6px;}
  .role-pill{
    font-size:10.5px; font-weight:700; letter-spacing:0.4px; text-transform:uppercase;
    padding:2px 8px; border-radius:20px; background:var(--accent-soft); color:var(--accent-2);
    border:1px solid rgba(242,169,59,0.3);
  }

  /* Notifications Bell */
  .notif-bell-btn{
    position:relative; background:var(--bg-elevated-2); border:1px solid var(--border);
    border-radius:10px; width:38px; height:38px; display:flex; align-items:center;
    justify-content:center; cursor:pointer; font-size:18px; color:var(--text);
  }
  .notif-badge{
    position:absolute; top:-4px; right:-4px; background:var(--danger); color:#fff;
    font-size:10px; font-weight:800; border-radius:10px; padding:2px 5px; min-width:16px; text-align:center;
  }

  /* Push Banner */
  .push-banner{
    background:var(--accent-soft); border:1px solid rgba(242,169,59,0.3);
    border-radius:12px; padding:12px 14px; margin-bottom:16px; display:flex;
    align-items:center; justify-content:space-between; gap:10px;
  }

  main{flex:1; padding:18px 18px 10px;}
  .section-title{
    font-family:var(--font-display); font-weight:600; font-size:22px; margin:4px 0 4px;
    display:flex; align-items:center; justify-content:space-between; gap:10px;
  }
  .section-sub{color:var(--text-muted); font-size:13px; margin:0 0 18px; line-height:1.5;}
  .card{
    background:var(--bg-elevated); border:1px solid var(--border);
    border-radius:var(--radius); padding:16px; margin-bottom:12px;
    box-shadow:var(--shadow); position:relative; cursor:pointer;
  }

  .badge{
    display:inline-flex; align-items:center; gap:5px; font-size:10.5px; font-weight:700; letter-spacing:.3px;
    text-transform:uppercase; padding:3px 9px; border-radius:20px; white-space:nowrap;
  }
  .badge.pending{background:var(--warning-soft); color:var(--accent-2);}
  .badge.notice{background:var(--accent-soft); color:var(--accent-2);}

  .btn{
    font-family:inherit; font-weight:700; font-size:13.5px; border:none; border-radius:12px;
    padding:12px 16px; cursor:pointer; display:inline-flex; align-items:center; justify-content:center; gap:8px;
  }
  .btn.primary{background:linear-gradient(180deg, var(--accent-2), var(--accent)); color:#251400; box-shadow:0 4px 16px rgba(242,169,59,0.35);}
  .btn.sm{padding:6px 12px; font-size:11.5px; border-radius:8px;}
  .btn.block{width:100%;}

  .reactions-toolbar{
    display:flex; align-items:center; gap:10px; margin-top:12px; padding-top:10px;
    border-top:1px solid var(--border-soft);
  }
  .rxn-btn{
    background:var(--bg-elevated-2); border:1px solid var(--border); color:var(--text-muted);
    border-radius:20px; padding:4px 12px; font-size:12px; font-weight:700; display:inline-flex;
    align-items:center; gap:6px; cursor:pointer;
  }
  .rxn-btn.active-like{ background:var(--success-soft); color:var(--success); border-color:rgba(52,179,152,0.4); }
  .rxn-btn.active-dislike{ background:var(--danger-soft); color:var(--danger); border-color:rgba(229,97,90,0.4); }

  label{display:block; font-size:12px; font-weight:700; color:var(--text-muted); margin:14px 0 6px; text-transform:uppercase; letter-spacing:.3px;}
  input[type=text], input[type=password], select, textarea{
    width:100%; background:var(--bg); border:1px solid var(--border); color:var(--text);
    border-radius:10px; padding:12px 13px; font-family:inherit; font-size:14.5px; outline:none;
  }
  textarea{resize:vertical; min-height:80px;}

  .poll-opt-btn{
    width:100%; text-align:left; padding:12px; border-radius:10px; background:var(--bg-elevated-2);
    border:1px solid var(--border); color:var(--text); margin-top:8px; cursor:pointer;
    display:flex; justify-content:space-between; align-items:center; position:relative; overflow:hidden;
  }
  .poll-progress-bar{ position:absolute; top:0; left:0; bottom:0; background:var(--accent-soft); z-index:1; pointer-events:none; }
  .poll-opt-text{position:relative; z-index:2; font-weight:600; font-size:13.5px;}
  .poll-opt-count{position:relative; z-index:2; font-family:var(--font-mono); font-size:12px; color:var(--accent-2);}

  .modal-overlay{
    position:fixed; top:0; left:0; right:0; bottom:0; z-index:100;
    background:rgba(10,12,24,0.85); backdrop-filter:blur(8px);
    display:none; align-items:center; justify-content:center; padding:20px;
  }
  .modal-overlay.active{ display:flex; }
  .modal-card{
    background:var(--bg-elevated); border:1px solid var(--border);
    border-radius:var(--radius); padding:24px; max-width:480px; width:100%;
    box-shadow:var(--shadow); position:relative; max-height:85vh; overflow-y:auto;
  }
  .modal-close{
    position:absolute; top:16px; right:16px; background:var(--bg-elevated-2);
    color:var(--text-muted); border:1px solid var(--border); border-radius:50%;
    width:32px; height:32px; display:flex; align-items:center; justify-content:center;
    cursor:pointer; font-size:16px; font-weight:bold;
  }

  nav.tabbar{
    position:fixed; bottom:0; left:0; right:0; z-index:40;
    display:flex; justify-content:center;
    padding-bottom:env(safe-area-inset-bottom);
    background:linear-gradient(0deg, rgba(16,20,42,0.98), rgba(16,20,42,0.9));
    border-top:1px solid var(--border-soft); backdrop-filter:blur(10px);
  }
  .tabbar-inner{ max-width:520px; width:100%; display:flex; justify-content:space-around; padding:8px 6px; }
  .tab-btn{ background:none; border:none; color:var(--text-faint); cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:4px; padding:6px 4px; flex:1; }
  .tab-btn.active{color:var(--accent-2);}
  .tab-btn .lbl{font-size:11px; font-weight:700;}

  .onboard-wrap{min-height:100vh; display:flex; flex-direction:column; justify-content:center; padding:32px 24px; max-width:480px; margin:0 auto;}
  .onboard-title{font-family:var(--font-display); font-size:26px; font-weight:600; text-align:center; margin-bottom:6px;}
  .onboard-sub{text-align:center; color:var(--text-muted); font-size:13.5px; margin-bottom:30px;}
</style>
</head>
<body>

<div id="app"></div>

<!-- Detailed Modal View -->
<div id="modal-view" class="modal-overlay">
  <div class="modal-card">
    <button class="modal-close" onclick="closeModal()">✕</button>
    <div id="modal-body"></div>
  </div>
</div>

<script>
(function(){
  "use strict";

  const firebaseConfig = {
    apiKey: "AIzaSyA5jR_KvDtN52sIUQiYffXL_1pcoN5vNpk",
    authDomain: "rp-housing-society.firebaseapp.com",
    projectId: "rp-housing-society",
    storageBucket: "rp-housing-society.firebasestorage.app",
    messagingSenderId: "964175352040",
    appId: "1:964175352040:web:a5aadfe8bf9a6d53af395d",
    measurementId: "G-ZKW41KY8QX"
  };

  if (typeof firebase !== 'undefined' && !firebase.apps.length) {
    firebase.initializeApp(firebaseConfig);
  }
  const db = (typeof firebase !== 'undefined') ? firebase.firestore() : null;
  const messaging = (typeof firebase !== 'undefined' && firebase.messaging.isSupported()) ? firebase.messaging() : null;

  // App State - Auto restores session from browser storage
  let currentUser = JSON.parse(localStorage.getItem('rphs_user')) || null;
  let activeTab = 'announcements';
  let complaints = [];
  let notices = [];
  let polls = [];
  let notifications = [];

  const appEl = document.getElementById('app');

  function initPushNotifications() {
    if (!messaging) return;

    if (Notification.permission === 'granted') {
      saveDeviceToken();
    }

    messaging.onMessage((payload) => {
      new Notification(payload.notification.title, {
        body: payload.notification.body,
        icon: '/icon-192.png'
      });
      loadNotifications();
    });
  }

  function saveDeviceToken() {
    if (!messaging || !currentUser) return;
    messaging.getToken().then((currentToken) => {
      if (currentToken && db) {
        db.collection('fcm_tokens').doc(currentUser.name.toLowerCase().replace(/\s+/g, '_')).set({
          token: currentToken,
          user: currentUser.name,
          role: currentUser.role,
          updatedAt: new Date().toISOString()
        }, { merge: true });
      }
    }).catch((err) => console.log('Push token registration error:', err));
  }

  function render() {
    // If user profile exists, bypass onboarding completely
    if (!currentUser) {
      renderOnboarding();
      return;
    }

    const unreadCount = notifications.filter(n => !n.read && (n.target === currentUser.role || n.target === 'all' || n.target === currentUser.name)).length;

    appEl.innerHTML = `
      <header class="topbar">
        <div class="brand-mark">
          <img src="icon-192.png" alt="Logo" onerror="this.style.display='none'">
        </div>
        <div class="brand-text">
          <div class="name">Roshan Housing Society</div>
          <div class="sub">
            <span>${currentUser.name} ${currentUser.house ? '(' + currentUser.house + ')' : ''}</span>
            <span class="role-pill">${currentUser.role}</span>
          </div>
        </div>
        <button class="notif-bell-btn" onclick="openNotificationsModal()" title="Notifications">
          🔔
          ${unreadCount > 0 ? `<span class="notif-badge">${unreadCount}</span>` : ''}
        </button>
        <button class="btn sm" id="logout-btn" style="background:var(--bg-elevated-2); color:var(--text-muted);">Logout</button>
      </header>

      <main style="padding-bottom:20px;">
        ${('Notification' in window && Notification.permission !== 'granted') ? `
          <div class="push-banner">
            <span style="font-size:12.5px; font-weight:600; color:var(--accent-2);">Enable push notifications for instant alerts!</span>
            <button class="btn sm primary" onclick="requestPushPermission()">Enable</button>
          </div>
        ` : ''}

        ${renderContent()}
      </main>

      <nav class="tabbar">
        <div class="tabbar-inner">
          <button class="tab-btn ${activeTab==='announcements'?'active':''}" data-tab="announcements">
            <span class="lbl">Announcements</span>
          </button>
          <button class="tab-btn ${activeTab==='polls'?'active':''}" data-tab="polls">
            <span class="lbl">Polls</span>
          </button>
          <button class="tab-btn ${activeTab==='complaints'?'active':''}" data-tab="complaints">
            <span class="lbl">Complaints</span>
          </button>
        </div>
      </nav>
    `;

    bindGlobalEvents();
    loadData();
    initPushNotifications();
  }

  window.requestPushPermission = function() {
    Notification.requestPermission().then((permission) => {
      if (permission === 'granted') {
        saveDeviceToken();
      }
      render();
    });
  };

  function renderOnboarding() {
    appEl.innerHTML = `
      <div class="onboard-wrap">
        <div class="onboard-title">Roshan Pakistan Housing Society</div>
        <div class="onboard-sub">Create or access your resident account.</div>
        
        <form id="onboard-form">
          <label>Full Name</label>
          <input type="text" id="user-name" placeholder="e.g. Naveed Ahmed" required />

          <label>Account Role</label>
          <select id="user-role" required>
            <option value="resident">Resident / Member</option>
            <option value="admin">Admin</option>
          </select>

          <div id="house-num-wrap">
            <label>House / Plot Number</label>
            <input type="text" id="user-house" placeholder="e.g. House 42, Block B" />
          </div>

          <div id="pin-wrap" style="display:none;">
            <label id="pin-label">Admin Security PIN</label>
            <input type="password" id="admin-pin" placeholder="Enter 4-digit PIN" maxlength="4" />
          </div>

          <button type="submit" class="btn primary block" style="margin-top:20px;">Login & Stay Signed In</button>
        </form>
      </div>
    `;

    document.getElementById('user-role').addEventListener('change', (e) => {
      const val = e.target.value;
      document.getElementById('house-num-wrap').style.display = (val === 'admin') ? 'none' : 'block';
      document.getElementById('pin-wrap').style.display = (val === 'admin') ? 'block' : 'none';
    });

    document.getElementById('onboard-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const name = document.getElementById('user-name').value.trim();
      const role = document.getElementById('user-role').value;
      const adminId = name.toLowerCase().replace(/\s+/g, '_');
      
      if (role === 'admin') {
        const pinEntered = document.getElementById('admin-pin').value.trim();
        if (!pinEntered || pinEntered.length !== 4) {
          alert('Please enter a 4-digit PIN.');
          return;
        }

        let adminPinStore = JSON.parse(localStorage.getItem('rphs_admin_pins')) || {};

        if (db) {
          try {
            const adminDoc = await db.collection('admins').doc(adminId).get();
            if (adminDoc.exists) {
              if (adminDoc.data().pin !== pinEntered) { alert('Incorrect PIN.'); return; }
            } else {
              await db.collection('admins').doc(adminId).set({ pin: pinEntered, name: name });
            }
          } catch(err) {
            if (adminPinStore[adminId] && adminPinStore[adminId] !== pinEntered) { alert('Incorrect PIN.'); return; }
            adminPinStore[adminId] = pinEntered;
            localStorage.setItem('rphs_admin_pins', JSON.stringify(adminPinStore));
          }
        }
      }

      currentUser = {
        name: name,
        role: role,
        house: (role === 'admin') ? 'Admin Office' : document.getElementById('user-house').value.trim()
      };

      // Save permanently into LocalStorage
      localStorage.setItem('rphs_user', JSON.stringify(currentUser));
      render();
    });
  }

  function renderContent() {
    const isAdmin = (currentUser.role === 'admin');

    if (activeTab === 'announcements') {
      return `
        <div class="section-title">Notices & Announcements</div>
        <div class="section-sub">Official updates from society management.</div>
        
        ${isAdmin ? `
          <div class="card" style="cursor:default;">
            <div style="font-weight:700; margin-bottom:8px;">Post New Announcement</div>
            <form id="notice-form">
              <input type="text" id="notice-title" placeholder="Notice Title" required style="margin-bottom:8px;" />
              <textarea id="notice-desc" placeholder="Notice details..." required></textarea>
              <button type="submit" class="btn primary block" style="margin-top:10px;">Publish Notice</button>
            </form>
          </div>
        ` : ''}

        <div id="notices-list">Loading announcements...</div>
      `;
    }

    if (activeTab === 'polls') {
      return `
        <div class="section-title">Society Community Polls</div>
        <div class="section-sub">Cast your vote on ongoing decisions.</div>

        ${isAdmin ? `
          <div class="card" style="cursor:default;">
            <div style="font-weight:700; margin-bottom:8px;">Create New Poll</div>
            <form id="poll-form">
              <input type="text" id="poll-title" placeholder="Poll Question" required style="margin-bottom:8px;" />
              <input type="text" id="poll-opt1" placeholder="Option 1" required style="margin-bottom:6px;" />
              <input type="text" id="poll-opt2" placeholder="Option 2" required style="margin-bottom:8px;" />
              <button type="submit" class="btn primary block">Publish Poll</button>
            </form>
          </div>
        ` : ''}

        <div id="polls-list">Loading polls...</div>
      `;
    }

    if (activeTab === 'complaints') {
      return `
        <div class="section-title">${isAdmin ? 'Complaints Management' : 'File a Complaint'}</div>
        <div class="section-sub">${isAdmin ? 'Review and update status of resident requests.' : 'Submit issues directly to society admin.'}</div>

        ${!isAdmin ? `
          <div class="card" style="cursor:default;">
            <form id="complaint-form">
              <label>Issue Title</label>
              <input type="text" id="c-title" placeholder="e.g. Street Light Outage" required />

              <label>Category</label>
              <select id="c-category">
                <option value="Maintenance">Maintenance & Plumbing</option>
                <option value="Electricity">Electricity / Generator</option>
                <option value="Security">Security & Access</option>
                <option value="Sanitation">Sanitation & Garbage</option>
              </select>

              <label>Details</label>
              <textarea id="c-desc" placeholder="Describe the problem..." required></textarea>

              <button type="submit" class="btn primary block" style="margin-top:14px;">Submit Complaint</button>
            </form>
          </div>
        ` : ''}

        <div id="complaints-list">Loading complaints...</div>
      `;
    }
  }

  function bindGlobalEvents() {
    const logoutBtn = document.getElementById('logout-btn');
    if (logoutBtn) {
      logoutBtn.addEventListener('click', () => {
        localStorage.removeItem('rphs_user');
        currentUser = null;
        render();
      });
    }

    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        activeTab = e.currentTarget.getAttribute('data-tab');
        render();
      });
    });

    bindFormEvents();
  }

  function bindFormEvents() {
    const noticeForm = document.getElementById('notice-form');
    if (noticeForm) noticeForm.onsubmit = (e) => { e.preventDefault(); postNotice(); };

    const pollForm = document.getElementById('poll-form');
    if (pollForm) pollForm.onsubmit = (e) => { e.preventDefault(); postPoll(); };

    const complaintForm = document.getElementById('complaint-form');
    if (complaintForm) complaintForm.onsubmit = (e) => { e.preventDefault(); submitComplaint(); };
  }

  function loadData() {
    loadNotifications();
    if (activeTab === 'announcements') loadNotices();
    if (activeTab === 'polls') loadPolls();
    if (activeTab === 'complaints') loadComplaints();
  }

  function sendNotification(target, text) {
    const item = { target, text, time: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}), read: false, createdAt: new Date().toISOString() };
    if (db) {
      db.collection('notifications').add(item);
    } else {
      notifications.unshift(item);
      localStorage.setItem('rphs_notifs', JSON.stringify(notifications));
    }

    if (Notification.permission === 'granted') {
      new Notification("Roshan Housing Society", { body: text, icon: 'icon-192.png' });
    }
  }

  function loadNotifications() {
    if (db) {
      db.collection('notifications').orderBy('createdAt', 'desc').get().then(snapshot => {
        notifications = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
      }).catch(() => {
        notifications = JSON.parse(localStorage.getItem('rphs_notifs')) || [];
      });
    } else {
      notifications = JSON.parse(localStorage.getItem('rphs_notifs')) || [];
    }
  }

  window.openNotificationsModal = function() {
    const userNotifs = notifications.filter(n => n.target === currentUser.role || n.target === 'all' || n.target === currentUser.name);

    document.getElementById('modal-body').innerHTML = `
      <div style="font-family:var(--font-display); font-size:20px; font-weight:600; margin-bottom:12px;">Notifications</div>
      ${userNotifs.length ? userNotifs.map(n => `
        <div style="background:var(--bg-elevated-2); border:1px solid var(--border); padding:10px 12px; border-radius:10px; margin-bottom:8px;">
          <div style="font-size:13px; color:var(--text); line-height:1.4;">${n.text}</div>
          <div style="font-size:10.5px; color:var(--text-muted); margin-top:4px;">${n.time || 'Recently'}</div>
        </div>
      `).join('') : '<div style="color:var(--text-muted); text-align:center; padding:20px;">No notifications yet.</div>'}
    `;
    document.getElementById('modal-view').classList.add('active');
  };

  window.reactNotice = function(e, key, type) {
    if(e) e.stopPropagation();
    let n = notices.find((item, idx) => (item.id === key || idx == key));
    if (!n) return;

    if (!n.likes) n.likes = [];
    if (!n.dislikes) n.dislikes = [];

    const user = currentUser.name;
    const hasLiked = n.likes.includes(user);
    const hasDisliked = n.dislikes.includes(user);

    if (type === 'like') {
      if (hasLiked) { n.likes = n.likes.filter(u => u !== user); } 
      else { n.likes.push(user); n.dislikes = n.dislikes.filter(u => u !== user); }
    } else if (type === 'dislike') {
      if (hasDisliked) { n.dislikes = n.dislikes.filter(u => u !== user); } 
      else { n.dislikes.push(user); n.likes = n.likes.filter(u => u !== user); }
    }

    if (db && n.id) {
      db.collection('notices').doc(n.id).update({ likes: n.likes, dislikes: n.dislikes }).then(() => {
        loadNotices();
        if (document.getElementById('modal-view').classList.contains('active')) openNoticeModal(key);
      });
    } else {
      localStorage.setItem('rphs_notices', JSON.stringify(notices));
      renderNoticesList();
      if (document.getElementById('modal-view').classList.contains('active')) openNoticeModal(key);
    }
  };

  window.openNoticeModal = function(key) {
    let item = notices.find((n, idx) => (n.id === key || idx == key));
    if (!item) return;

    const likesCount = (item.likes || []).length;
    const dislikesCount = (item.dislikes || []).length;
    const userLiked = (item.likes || []).includes(currentUser.name);
    const userDisliked = (item.dislikes || []).includes(currentUser.name);

    document.getElementById('modal-body').innerHTML = `
      <div style="margin-bottom:10px;"><span class="badge notice">Official Notice</span></div>
      <div style="font-family:var(--font-display); font-size:20px; font-weight:600; margin-bottom:8px; line-height:1.3;">${item.title}</div>
      <div style="font-size:12px; color:var(--text-muted); margin-bottom:16px;">Published: ${item.date || 'Today'}</div>
      <div style="font-size:14.5px; color:#D6D9EC; line-height:1.6; white-space:pre-wrap;">${item.desc}</div>
      
      <div class="reactions-toolbar">
        <button class="rxn-btn ${userLiked ? 'active-like' : ''}" onclick="reactNotice(event, '${item.id || key}', 'like')">👍 ${likesCount}</button>
        <button class="rxn-btn ${userDisliked ? 'active-dislike' : ''}" onclick="reactNotice(event, '${item.id || key}', 'dislike')">👎 ${dislikesCount}</button>
      </div>
    `;
    document.getElementById('modal-view').classList.add('active');
  };

  window.openPollModal = function(key) {
    let p = polls.find((item, idx) => (item.id === key || idx == key));
    if (!p) return;

    const totalVotes = p.options.reduce((sum, opt) => sum + opt.votes, 0);
    const hasVoted = p.voters && p.voters.includes(currentUser.name);

    document.getElementById('modal-body').innerHTML = `
      <div style="margin-bottom:10px;"><span class="badge pending">Community Poll</span></div>
      <div style="font-family:var(--font-display); font-size:19px; font-weight:600; margin-bottom:16px; line-height:1.3;">${p.title}</div>
      ${p.options.map((opt, oIndex) => {
        const pct = totalVotes > 0 ? Math.round((opt.votes / totalVotes) * 100) : 0;
        return `
          <button class="poll-opt-btn" onclick="votePoll('${p.id || key}', ${oIndex})">
            <div class="poll-progress-bar" style="width:${pct}%;"></div>
            <span class="poll-opt-text">${opt.text}</span>
            <span class="poll-opt-count">${pct}% (${opt.votes})</span>
          </button>
        `;
      }).join('')}
      <div style="font-size:12px; color:var(--text-muted); margin-top:14px;">
        Total Votes Cast: ${totalVotes} ${hasVoted ? '• (You have voted)' : ''}
      </div>
    `;
    document.getElementById('modal-view').classList.add('active');
  };

  window.closeModal = function() {
    document.getElementById('modal-view').classList.remove('active');
  };

  function postNotice() {
    const title = document.getElementById('notice-title').value.trim();
    const desc = document.getElementById('notice-desc').value.trim();
    if (!title || !desc) return;

    const item = { title, desc, date: new Date().toLocaleDateString(), likes: [], dislikes: [], createdAt: new Date().toISOString() };

    if (db) {
      db.collection('notices').add(item).then(() => {
        sendNotification('resident', `📢 New Announcement: "${title}"`);
        document.getElementById('notice-form').reset();
        loadNotices();
      });
    }
  }

  function loadNotices() {
    if (db) {
      db.collection('notices').orderBy('createdAt', 'desc').get().then(snapshot => {
        notices = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
        renderNoticesList();
      });
    }
  }

  function renderNoticesList() {
    const el = document.getElementById('notices-list');
    if (!el) return;
    if (!notices.length) { el.innerHTML = '<div class="card" style="text-align:center; color:var(--text-muted); cursor:default;">No announcements posted yet.</div>'; return; }

    el.innerHTML = notices.map((n, idx) => {
      const itemKey = n.id ? n.id : idx;
      const likesCount = (n.likes || []).length;
      const dislikesCount = (n.dislikes || []).length;
      const userLiked = (n.likes || []).includes(currentUser.name);
      const userDisliked = (n.dislikes || []).includes(currentUser.name);

      return `
        <div class="card" onclick="openNoticeModal('${itemKey}')">
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
            <span class="badge notice">Official Notice</span>
            <span style="font-size:11px; color:var(--text-muted);">${n.date || 'Today'}</span>
          </div>
          <div style="font-weight:700; font-size:16px; margin-bottom:6px;">${n.title}</div>
          <div style="font-size:13.5px; color:#D6D9EC; line-height:1.4; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden;">${n.desc}</div>
          
          <div class="reactions-toolbar">
            <button class="rxn-btn ${userLiked ? 'active-like' : ''}" onclick="reactNotice(event, '${itemKey}', 'like')">👍 ${likesCount}</button>
            <button class="rxn-btn ${userDisliked ? 'active-dislike' : ''}" onclick="reactNotice(event, '${itemKey}', 'dislike')">👎 ${dislikesCount}</button>
          </div>
        </div>
      `;
    }).join('');
  }

  function postPoll() {
    const title = document.getElementById('poll-title').value.trim();
    const opt1 = document.getElementById('poll-opt1').value.trim();
    const opt2 = document.getElementById('poll-opt2').value.trim();
    if (!title || !opt1 || !opt2) return;

    const item = { title, options: [{text: opt1, votes: 0}, {text: opt2, votes: 0}], voters: [], createdAt: new Date().toISOString() };
    if (db) db.collection('polls').add(item).then(() => { sendNotification('resident', `🗳️ New Poll: "${title}"`); document.getElementById('poll-form').reset(); loadPolls(); });
  }

  function loadPolls() {
    if (db) db.collection('polls').orderBy('createdAt', 'desc').get().then(snapshot => { polls = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })); renderPollsList(); });
  }

  function renderPollsList() {
    const el = document.getElementById('polls-list');
    if (!el || !polls.length) return;
    el.innerHTML = polls.map((p, pIndex) => {
      const totalVotes = p.options.reduce((sum, opt) => sum + opt.votes, 0);
      const itemKey = p.id ? p.id : pIndex;
      return `
        <div class="card" onclick="openPollModal('${itemKey}')">
          <div style="font-weight:700; font-size:15px; margin-bottom:10px;">${p.title}</div>
          ${p.options.map((opt, oIndex) => {
            const pct = totalVotes > 0 ? Math.round((opt.votes / totalVotes) * 100) : 0;
            return `
              <button class="poll-opt-btn" onclick="event.stopPropagation(); votePoll('${itemKey}', ${oIndex})">
                <div class="poll-progress-bar" style="width:${pct}%;"></div>
                <span class="poll-opt-text">${opt.text}</span>
                <span class="poll-opt-count">${pct}% (${opt.votes})</span>
              </button>
            `;
          }).join('')}
        </div>
      `;
    }).join('');
  }

  window.votePoll = function(pollIdentifier, optIndex) {
    let poll = polls.find((p, idx) => (p.id === pollIdentifier || idx == pollIdentifier));
    if (!poll || (poll.voters && poll.voters.includes(currentUser.name))) return alert('Already voted.');

    if (!poll.voters) poll.voters = [];
    poll.voters.push(currentUser.name);
    poll.options[optIndex].votes += 1;

    sendNotification('admin', `📊 ${currentUser.name} voted on poll: "${poll.title}"`);
    if (db && poll.id) db.collection('polls').doc(poll.id).update({ options: poll.options, voters: poll.voters }).then(() => loadPolls());
  };

  function submitComplaint() {
    const title = document.getElementById('c-title').value.trim();
    const category = document.getElementById('c-category').value;
    const desc = document.getElementById('c-desc').value.trim();
    if (!title || !desc) return;

    const newComplaint = { title, category, desc, resident: currentUser.name, house: currentUser.house || 'N/A', status: 'Pending', createdAt: new Date().toISOString() };
    if (db) db.collection('complaints').add(newComplaint).then(() => { sendNotification('admin', `⚠️ New Complaint from ${currentUser.name}: "${title}"`); alert('Submitted!'); document.getElementById('complaint-form').reset(); loadComplaints(); });
  }

  function loadComplaints() {
    if (db) db.collection('complaints').orderBy('createdAt', 'desc').get().then(snapshot => { complaints = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })); renderComplaintsList(); });
  }

  function renderComplaintsList() {
    const el = document.getElementById('complaints-list');
    if (!el || !complaints.length) return;
    el.innerHTML = complaints.map((c) => `
      <div class="card" style="cursor:default;">
        <div style="display:flex; justify-content:space-between;"><div style="font-weight:700;">${c.title}</div><span class="badge pending">${c.status}</span></div>
        <div style="font-size:12px; color:var(--text-muted);">${c.category} • By ${c.resident}</div>
        <div style="font-size:13.5px; margin-top:6px;">${c.desc}</div>
      </div>
    `).join('');
  }

  // Launch initial render
  render();
})();
</script>
</body>
</html>
