<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<title>Roshan Pakistan Housing Society</title>
<meta name="theme-color" content="#10142A" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Roshan RPHS" />
<meta name="mobile-web-app-capable" content="yes" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<!-- Firebase Compatibility SDKs -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-messaging-compat.js"></script>

<!-- jsPDF for Admin PDF Export & Receipts -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
  :root{
    --bg:#10142A;
    --bg-elevated:#171C3B;
    --bg-elevated-2:#1E2447;
    --bg-elevated-3:#242B54;
    --accent:#F2A93B;
    --accent-2:#FFC670;
    --accent-soft:rgba(242,169,59,0.14);
    --text:#F1F2F9;
    --text-muted:#9AA0C3;
    --text-faint:#6B7099;
    --success:#34B398;
    --success-soft:rgba(52,179,152,0.14);
    --danger:#E5615A;
    --danger-soft:rgba(229,97,90,0.14);
    --warning:#F2A93B;
    --warning-soft:rgba(242,169,59,0.14);
    --info:#6E8FF2;
    --info-soft:rgba(110,143,242,0.14);
    --border:rgba(255,255,255,0.08);
    --border-soft:rgba(255,255,255,0.05);
    --radius:16px;
    --radius-sm:10px;
    --shadow:0 8px 30px rgba(0,0,0,0.35);
    --font-display:'Fraunces', serif;
    --font-body:'Manrope', -apple-system, BlinkMacSystemFont, sans-serif;
    --font-mono:'JetBrains Mono', monospace;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    background:
      radial-gradient(circle at 20% -10%, rgba(242,169,59,0.10), transparent 45%),
      radial-gradient(circle at 90% 0%, rgba(110,143,242,0.08), transparent 40%),
      var(--bg);
    color:var(--text);
    font-family:var(--font-body);
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  #app{
    max-width:520px;
    margin:0 auto;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    position:relative;
    padding-bottom:calc(78px + env(safe-area-inset-bottom));
  }
  a{color:inherit;}
  button{font-family:inherit;}
  ::selection{background:var(--accent-soft);}

  .topbar{
    position:sticky; top:0; z-index:30;
    padding:calc(16px + env(safe-area-inset-top)) 18px 14px;
    background:linear-gradient(180deg, rgba(16,20,42,0.97), rgba(16,20,42,0.88) 70%, rgba(16,20,42,0));
    backdrop-filter:blur(10px);
    display:flex; align-items:center; gap:10px;
    border-bottom:1px solid var(--border-soft);
  }
  .brand-mark{
    width:42px; height:42px; border-radius:12px;
    background:#fff;
    box-shadow:0 0 0 1px rgba(255,255,255,0.08), 0 0 18px 2px rgba(242,169,59,0.45);
    display:flex; align-items:center; justify-content:center;
    flex:none; padding:4px; overflow:hidden;
  }
  .brand-mark img{ width:100%; height:100%; object-fit:contain; display:block; }
  .brand-text{flex:1; min-width:0;}
  .brand-text .name{font-family:var(--font-display); font-weight:600; font-size:16.5px; line-height:1.2; letter-spacing:0.1px;}
  .brand-text .sub{font-size:11.5px; color:var(--text-muted); margin-top:2px; display:flex; align-items:center; gap:6px;}
  .role-pill{
    font-size:10.5px; font-weight:700; letter-spacing:0.4px; text-transform:uppercase;
    padding:2px 8px; border-radius:20px; background:var(--accent-soft); color:var(--accent-2);
    border:1px solid rgba(242,169,59,0.3);
  }

  .notif-bell-btn{
    position:relative; background:var(--bg-elevated-2); border:1px solid var(--border);
    border-radius:10px; width:38px; height:38px; display:flex; align-items:center;
    justify-content:center; cursor:pointer; font-size:18px; color:var(--text);
  }
  .notif-badge{
    position:absolute; top:-4px; right:-4px; background:var(--danger); color:#fff;
    font-size:10px; font-weight:800; border-radius:10px; padding:2px 5px; min-width:16px; text-align:center;
  }

  .push-banner{
    background:var(--accent-soft); border:1px solid rgba(242,169,59,0.3);
    border-radius:12px; padding:12px 14px; margin-bottom:16px; display:flex;
    align-items:center; justify-content:space-between; gap:10px;
  }

  main{flex:1; padding:18px 18px 10px;}
  .section-title{
    font-family:var(--font-display); font-weight:600; font-size:22px; margin:4px 0 4px;
    display:flex; align-items:center; justify-content:space-between; gap:10px;
  }
  .section-sub{color:var(--text-muted); font-size:13px; margin:0 0 18px; line-height:1.5;}
  .card{
    background:var(--bg-elevated); border:1px solid var(--border);
    border-radius:var(--radius); padding:16px; margin-bottom:12px;
    box-shadow:var(--shadow); position:relative; cursor:pointer;
  }

  .ticket-no{
    font-family:var(--font-mono); font-size:11px; color:var(--accent-2);
    background:var(--accent-soft); padding:2px 6px; border-radius:4px; font-weight:600;
  }

  .badge{
    display:inline-flex; align-items:center; gap:5px; font-size:10.5px; font-weight:700; letter-spacing:.3px;
    text-transform:uppercase; padding:3px 9px; border-radius:20px; white-space:nowrap;
  }
  .badge.pending, .badge.unpaid{background:var(--warning-soft); color:var(--accent-2);}
  .badge.assigned, .badge.in-progress{background:var(--info-soft); color:var(--info);}
  .badge.resolved, .badge.paid, .badge.past{background:var(--success-soft); color:var(--success);}
  .badge.closed, .badge.cancelled{background:rgba(255,255,255,0.1); color:var(--text-muted);}
  .badge.notice{background:var(--accent-soft); color:var(--accent-2);}
  .badge.overdue{background:var(--danger-soft); color:var(--danger); border:1px solid rgba(229,97,90,0.3);}

  .btn{
    font-family:inherit; font-weight:700; font-size:13.5px; border:none; border-radius:12px;
    padding:12px 16px; cursor:pointer; display:inline-flex; align-items:center; justify-content:center; gap:8px;
  }
  .btn.primary{background:linear-gradient(180deg, var(--accent-2), var(--accent)); color:#251400; box-shadow:0 4px 16px rgba(242,169,59,0.35);}
  .btn.secondary{background:var(--bg-elevated-2); color:var(--text); border:1px solid var(--border);}
  .btn.danger{background:var(--danger); color:#fff;}
  .btn.sm{padding:6px 12px; font-size:11.5px; border-radius:8px;}
  .btn.block{width:100%;}

  label{display:block; font-size:12px; font-weight:700; color:var(--text-muted); margin:14px 0 6px; text-transform:uppercase; letter-spacing:.3px;}
  input[type=text], input[type=number], input[type=date], input[type=email], input[type=password], select, textarea{
    width:100%; background:var(--bg); border:1px solid var(--border); color:var(--text);
    border-radius:10px; padding:12px 13px; font-family:inherit; font-size:14.5px; outline:none;
  }
  textarea{resize:vertical; min-height:80px;}

  .modal-overlay{
    position:fixed; top:0; left:0; right:0; bottom:0; z-index:100;
    background:rgba(10,12,24,0.85); backdrop-filter:blur(8px);
    display:none; align-items:center; justify-content:center; padding:20px;
  }
  .modal-overlay.active{ display:flex; }
  .modal-card{
    background:var(--bg-elevated); border:1px solid var(--border);
    border-radius:var(--radius); padding:24px; max-width:480px; width:100%;
    box-shadow:var(--shadow); position:relative; max-height:85vh; overflow-y:auto;
  }
  .modal-close{
    position:absolute; top:16px; right:16px; background:var(--bg-elevated-2);
    color:var(--text-muted); border:1px solid var(--border); border-radius:50%;
    width:32px; height:32px; display:flex; align-items:center; justify-content:center;
    cursor:pointer; font-size:16px; font-weight:bold;
  }

  nav.tabbar{
    position:fixed; bottom:0; left:0; right:0; z-index:40;
    display:flex; justify-content:center;
    padding-bottom:env(safe-area-inset-bottom);
    background:linear-gradient(0deg, rgba(16,20,42,0.98), rgba(16,20,42,0.9));
    border-top:1px solid var(--border-soft); backdrop-filter:blur(10px);
  }
  .tabbar-inner{ max-width:520px; width:100%; display:flex; justify-space-around; padding:8px 4px; overflow-x:auto; scrollbar-width:none; }
  .tab-btn{ background:none; border:none; color:var(--text-faint); cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:4px; padding:6px 4px; flex:1; min-width:50px; }
  .tab-btn.active{color:var(--accent-2);}
  .tab-btn .lbl{font-size:10px; font-weight:700;}

  .onboard-wrap{min-height:100vh; display:flex; flex-direction:column; justify-content:center; padding:32px 24px; max-width:480px; margin:0 auto;}
  .onboard-title{font-family:var(--font-display); font-size:26px; font-weight:600; text-align:center; margin-bottom:6px;}
  .onboard-sub{text-align:center; color:var(--text-muted); font-size:13.5px; margin-bottom:24px;}
  .toggle-auth-mode{text-align:center; margin-top:16px; font-size:13px; color:var(--accent-2); cursor:pointer; text-decoration:underline;}

  /* UI Modules Styles */
  .metrics-grid { display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; margin-bottom:16px; }
  .metric-card { background:var(--bg-elevated-2); border:1px solid var(--border); border-radius:12px; padding:12px 8px; text-align:center; }
  .metric-card .val { font-size:13px; font-weight:800; color:var(--text); margin-top:4px; font-family:var(--font-mono); }
  .metric-card .lbl { font-size:10px; font-weight:700; color:var(--text-muted); text-transform:uppercase; letter-spacing:0.4px; }
  
  .filter-chips { display:flex; gap:6px; overflow-x:auto; padding-bottom:8px; margin-bottom:12px; scrollbar-width:none; }
  .chip { background:var(--bg-elevated-2); border:1px solid var(--border); color:var(--text-muted); border-radius:20px; padding:6px 14px; font-size:11.5px; font-weight:700; white-space:nowrap; cursor:pointer; }
  .chip.active { background:var(--accent-soft); color:var(--accent-2); border-color:rgba(242,169,59,0.4); }

  .summary-banner { background:var(--bg-elevated-2); border:1px solid var(--border); border-radius:12px; padding:12px; margin-bottom:14px; font-size:12px; color:var(--text-muted); line-height:1.5; }
  
  .progress-bar-bg { background:var(--bg-elevated-2); border-radius:10px; height:10px; overflow:hidden; position:relative; margin:8px 0; border:1px solid var(--border); }
  .progress-bar-fill { background:linear-gradient(90deg, var(--accent), var(--accent-2)); height:100%; border-radius:10px; transition:width 0.3s ease; }
</style>
</head>
<body>

<div id="app"></div>

<!-- Modal Container -->
<div id="modal-view" class="modal-overlay">
  <div class="modal-card">
    <button class="modal-close" onclick="closeModal()">✕</button>
    <div id="modal-body"></div>
  </div>
</div>

<script>
(function(){
  "use strict";

  function escapeHtml(str) {
    if (!str) return '';
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#039;');
  }

  function formatPKR(val) {
    const num = Number(val) || 0;
    return 'PKR ' + num.toLocaleString('en-PK');
  }

  const firebaseConfig = {
    apiKey: "AIzaSyA5jR_KvDtN52sIUQiYffXL_1pcoN5vNpk",
    authDomain: "rp-housing-society.firebaseapp.com",
    projectId: "rp-housing-society",
    storageBucket: "rp-housing-society.firebasestorage.app",
    messagingSenderId: "964175352040",
    appId: "1:964175352040:web:a5aadfe8bf9a6d53af395d",
    measurementId: "G-ZKW41KY8QX"
  };

  let db = null;
  let auth = null;
  let messaging = null;

  try {
    if (typeof firebase !== 'undefined') {
      if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
      db = firebase.firestore();
      auth = firebase.auth();

      firebase.messaging.isSupported().then(supported => {
        if (supported) {
          messaging = firebase.messaging();
          initPushMessaging();
        }
      }).catch(err => console.log("Messaging unsupported:", err));
    }
  } catch(e) {
    console.error("Firebase Init Error:", e);
  }

  // Application State Variables
  let currentUserProfile = null;
  let registrationInProgress = false;
  let isAuthModeLogin = true;
  let activeTab = 'notices';
  let notifications = [];
  let pendingResidents = [];
  let allResidents = [];
  let noticesList = [];
  let pollsList = [];
  let ticketsList = [];
  let billsList = [];
  let fundsList = [];

  // Filter States
  let billFilter = 'All';
  let ticketMonthFilter = 'All';
  let ticketStatusFilter = 'All';

  const appEl = document.getElementById('app');

  // Observer
  if (auth) {
    auth.onAuthStateChanged(async (user) => {
      if (registrationInProgress) return; 

      if (user) {
        try {
          const userDoc = await db.collection('users').doc(user.uid).get();
          if (userDoc.exists) {
            currentUserProfile = { uid: user.uid, email: user.email, ...userDoc.data() };
            saveDeviceToken();
          } else {
            currentUserProfile = null;
            await auth.signOut();
          }
        } catch(e) {
          console.error("Failed fetching user profile:", e);
        }
      } else {
        currentUserProfile = null;
      }
      render();
    });
  }

  function initPushMessaging() {
    if (!messaging) return;
    if (Notification.permission === 'granted') {
      saveDeviceToken();
    }
    messaging.onMessage((payload) => {
      new Notification(payload.notification.title, {
        body: payload.notification.body,
        icon: '/icon-192.png'
      });
      loadNotifications();
    });
  }

  function saveDeviceToken() {
    if (!messaging || !currentUserProfile || !auth.currentUser) return;
    messaging.getToken().then((currentToken) => {
      if (currentToken && db) {
        db.collection('fcm_tokens').doc(auth.currentUser.uid).set({
          token: currentToken,
          uid: auth.currentUser.uid,
          name: currentUserProfile.name,
          role: currentUserProfile.role,
          updatedAt: firebase.firestore.FieldValue.serverTimestamp()
        }, { merge: true }).catch(err => console.error("FCM Token Save Error:", err));
      }
    }).catch((err) => console.log('Push token registration error:', err));
  }

  function render() {
    if (!auth || !auth.currentUser || !currentUserProfile) {
      renderOnboarding();
      return;
    }

    if (currentUserProfile.role === 'resident' && !auth.currentUser.emailVerified) {
      renderEmailVerificationScreen();
      return;
    }

    if (currentUserProfile.role === 'resident' && !currentUserProfile.biodataSubmitted) {
      renderBiodataFormScreen();
      return;
    }

    if (currentUserProfile.role === 'resident' && currentUserProfile.approved !== true) {
      renderPendingApprovalScreen();
      return;
    }

    const unreadCount = notifications.filter(n => !n.read).length;
    const isAdmin = currentUserProfile.role === 'admin';

    appEl.innerHTML = `
      <header class="topbar">
        <div class="brand-mark">
          <img src="icon-192.png" alt="Logo" onerror="this.style.display='none'">
        </div>
        <div class="brand-text">
          <div class="name">Roshan Housing Society</div>
          <div class="sub">
            <span>${escapeHtml(currentUserProfile.name)} ${currentUserProfile.house ? '(' + escapeHtml(currentUserProfile.house) + ')' : ''}</span>
            <span class="role-pill">${escapeHtml(currentUserProfile.role)}</span>
          </div>
        </div>
        <button class="notif-bell-btn" onclick="openNotificationsModal()" title="Notifications">
          🔔
          ${unreadCount > 0 ? `<span class="notif-badge">${unreadCount}</span>` : ''}
        </button>
        <button class="btn sm" id="logout-btn" style="background:var(--bg-elevated-2); color:var(--text-muted);">Logout</button>
      </header>

      <main style="padding-bottom:20px;">
        ${('Notification' in window && Notification.permission !== 'granted') ? `
          <div class="push-banner">
            <span style="font-size:12.5px; font-weight:600; color:var(--accent-2);">Enable push notifications for instant alerts!</span>
            <button class="btn sm primary" onclick="requestPushPermission()">Enable</button>
          </div>
        ` : ''}

        ${renderContent()}
      </main>

      <nav class="tabbar">
        <div class="tabbar-inner">
          <button class="tab-btn ${activeTab==='notices'?'active':''}" data-tab="notices">
            <span class="lbl">Notice</span>
          </button>
          <button class="tab-btn ${activeTab==='polls'?'active':''}" data-tab="polls">
            <span class="lbl">Polls</span>
          </button>
          <button class="tab-btn ${activeTab==='tickets'?'active':''}" data-tab="tickets">
            <span class="lbl">Complaints</span>
          </button>
          <button class="tab-btn ${activeTab==='bills'?'active':''}" data-tab="bills">
            <span class="lbl">Bills</span>
          </button>
          <button class="tab-btn ${activeTab==='funds'?'active':''}" data-tab="funds">
            <span class="lbl">Funds</span>
          </button>
          ${isAdmin ? `
            <button class="tab-btn ${activeTab==='biodata'?'active':''}" data-tab="biodata">
              <span class="lbl">Residents</span>
            </button>
            <button class="tab-btn ${activeTab==='approvals'?'active':''}" data-tab="approvals">
              <span class="lbl">Approvals</span>
            </button>
          ` : `
            <button class="tab-btn ${activeTab==='biodata'?'active':''}" data-tab="biodata">
              <span class="lbl">Profile</span>
            </button>
          `}
        </div>
      </nav>
    `;

    bindGlobalEvents();
    loadData();
  }

  function renderEmailVerificationScreen() {
    appEl.innerHTML = `
      <div class="onboard-wrap">
        <div class="onboard-title">Verify Your Email</div>
        <div class="onboard-sub">A verification link has been sent to <strong>${escapeHtml(auth.currentUser.email)}</strong>. Please verify your email to proceed.</div>
        
        <div class="card" style="text-align:center; padding:20px; cursor:default;">
          <div style="font-size:36px; margin-bottom:10px;">📧</div>
          <div style="font-size:13.5px; color:var(--text-muted);">Check your inbox and spam folder. Once verified, click below.</div>
        </div>

        <button class="btn primary block" id="check-verification-btn" style="margin-top:16px;">I Have Verified My Email</button>
        <button class="btn secondary block" id="resend-verification-btn" style="margin-top:8px;">Resend Email Link</button>
        <button class="btn danger block" id="logout-verification-btn" style="margin-top:8px;">Sign Out</button>
      </div>
    `;

    document.getElementById('check-verification-btn').addEventListener('click', async () => {
      await auth.currentUser.reload();
      if (auth.currentUser.emailVerified) {
        render();
      } else {
        alert("Email is not verified yet. Please check your inbox.");
      }
    });

    document.getElementById('resend-verification-btn').addEventListener('click', async () => {
      try {
        await auth.currentUser.sendEmailVerification();
        alert("Verification email resent!");
      } catch(err) {
        alert("Error sending verification email: " + err.message);
      }
    });

    document.getElementById('logout-verification-btn').addEventListener('click', () => auth.signOut());
  }

  function renderBiodataFormScreen() {
    appEl.innerHTML = `
      <div class="onboard-wrap" style="max-width:520px; padding:20px 16px;">
        <div class="onboard-title">Complete Resident Biodata</div>
        <div class="onboard-sub">Please fill out your official society resident record to proceed.</div>

        <div class="card" style="cursor:default; padding:20px;">
          <form id="biodata-form">
            <label>Full Name</label>
            <input type="text" id="bio-name" value="${escapeHtml(currentUserProfile.name || '')}" required />

            <label>CNIC Number (e.g. 35202-1234567-1)</label>
            <input type="text" id="bio-cnic" placeholder="35202-1234567-1" required />

            <label>Cell Number</label>
            <input type="text" id="bio-phone" value="${escapeHtml(currentUserProfile.phone || '')}" placeholder="+92 300 1234567" required />

            <label>House / Plot Number</label>
            <input type="text" id="bio-house" value="${escapeHtml(currentUserProfile.house || '')}" placeholder="House 42, Block B" required />

            <label>Blood Group</label>
            <select id="bio-blood" required>
              <option value="">Select Blood Group</option>
              <option value="A+">A+</option>
              <option value="A-">A-</option>
              <option value="B+">B+</option>
              <option value="B-">B-</option>
              <option value="AB+">AB+</option>
              <option value="AB-">AB-</option>
              <option value="O+">O+</option>
              <option value="O-">O-</option>
            </select>

            <label>Occupancy Type</label>
            <select id="bio-occupancy" required>
              <option value="Owner">Owner</option>
              <option value="Tenant">Tenant</option>
            </select>

            <label>Family Members / Dependents Details</label>
            <textarea id="bio-family" placeholder="List names and ages of family members living with you..." required></textarea>

            <button type="submit" class="btn primary block" style="margin-top:20px;">Save & Submit Biodata</button>
          </form>
        </div>
        <button class="btn secondary block" onclick="auth.signOut()" style="margin-top:10px;">Sign Out</button>
      </div>
    `;

    document.getElementById('biodata-form').addEventListener('submit', async (e) => {

  // --- SUBCOLLECTION NOTIFICATION SYSTEM ---
  async function sendNotification(targetUid, title, body, type = 'info') {
    if (!db || !targetUid) return;
    try {
      await db.collection('users')
        .doc(targetUid)
        .collection('notifications')
        .add({
          title: title,
          body: body,
          text: body,
          type: type,
          read: false,
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });
    } catch (err) {
      console.error("Targeted Notification failed:", err);
    }
  }

  async function broadcastNotification(title, body) {
    if (!db) return;
    try {
      const snap = await db.collection('users').where('approved', '==', true).get();
      const batchPromises = snap.docs.map(userDoc => sendNotification(userDoc.id, title, body, 'notice'));
      await Promise.all(batchPromises);
    } catch (e) {
      console.error("Broadcast failed:", e);
    }
  }

  function loadNotifications() {
    if (db && auth.currentUser) {
      db.collection('users')
        .doc(auth.currentUser.uid)
        .collection('notifications')
        .orderBy('createdAt', 'desc')
        .limit(20)
        .get()
        .then(snapshot => {
          notifications = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
          renderUnreadBadge();
        })
        .catch(err => console.error("Notifs load error:", err));
    }
  }

  function renderUnreadBadge() {
    const unreadCount = notifications.filter(n => !n.read).length;
    const bellBtn = document.querySelector('.notif-bell-btn');
    if (bellBtn) {
      const existingBadge = bellBtn.querySelector('.notif-badge');
      if (existingBadge) existingBadge.remove();
      if (unreadCount > 0) {
        bellBtn.innerHTML += `<span class="notif-badge">${unreadCount}</span>`;
      }
    }
  }

  window.openNotificationsModal = async function() {
    document.getElementById('modal-body').innerHTML = `
      <div style="font-family:var(--font-display); font-size:20px; font-weight:600; margin-bottom:12px;">Notifications</div>
      ${notifications.length ? notifications.map(n => `
        <div style="background:var(--bg-elevated-2); border:1px solid var(--border); padding:10px 12px; border-radius:10px; margin-bottom:8px;">
          ${n.title ? `<div style="font-weight:700; font-size:13px; color:var(--accent-2);">${escapeHtml(n.title)}</div>` : ''}
          <div style="font-size:13px; color:var(--text); line-height:1.4;">${escapeHtml(n.text || n.body)}</div>
        </div>
      `).join('') : '<div style="color:var(--text-muted); text-align:center; padding:20px;">No notifications yet.</div>'}
    `;
    document.getElementById('modal-view').classList.add('active');

    const unreadDocs = notifications.filter(n => !n.read);
    if (unreadDocs.length && db && auth.currentUser) {
      const batch = db.batch();
      unreadDocs.forEach(n => {
        const ref = db.collection('users').doc(auth.currentUser.uid).collection('notifications').doc(n.id);
        batch.update(ref, { read: true });
      });
      await batch.commit().catch(e => console.error("Error marking notifs read:", e));
      loadNotifications();
    }
  };

  window.closeModal = function() {
    document.getElementById('modal-view').classList.remove('active');
  };

  // --- POLLS ---
  function loadPolls() {
    if (!db) return;
    db.collection('polls').orderBy('createdAt', 'desc').get().then(snapshot => {
      pollsList = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
      renderPollsList();
    }).catch(e => console.error("Error loading polls:", e));
  }

  function renderPollsList() {
    const listEl = document.getElementById('polls-list');
    if (!listEl) return;
    if (!pollsList.length) {
      listEl.innerHTML = '<div class="card" style="text-align:center; color:var(--text-muted);">No active polls available.</div>';
      return;
    }

    const userId = auth.currentUser.uid;

    listEl.innerHTML = pollsList.map(poll => {
      const votes = poll.votes || {};
      const hasVoted = userId in votes;
      const userVote = votes[userId];
      const options = poll.options || [];
      
      const totalVotes = Object.keys(votes).length;

      const counts = options.map((opt, idx) => {
        let count = 0;
        Object.values(votes).forEach(v => { if (v === idx) count++; });
        return count;
      });

      return `
        <div class="card" style="cursor:default;">
          <div style="font-weight:700; font-size:16px; color:var(--accent-2); margin-bottom:6px;">${escapeHtml(poll.question)}</div>
          <div style="font-size:12px; color:var(--text-muted); margin-bottom:14px;">Total Votes: ${totalVotes}</div>

          <div style="display:flex; flex-direction:column; gap:8px;">
            ${options.map((opt, idx) => {
              const count = counts[idx];
              const pct = totalVotes > 0 ? Math.round((count / totalVotes) * 100) : 0;
              const isSelected = userVote === idx;

              return `
                <div style="background:var(--bg-elevated-2); border:1px solid ${isSelected ? 'var(--accent)' : 'var(--border)'}; border-radius:10px; padding:10px 12px; position:relative; overflow:hidden;">
                  <div style="position:absolute; top:0; left:0; bottom:0; width:${pct}%; background:var(--accent-soft); z-index:0;"></div>
                  <div style="display:flex; justify-content:space-between; align-items:center; position:relative; z-index:1;">
                    <span style="font-size:13.5px; font-weight:${isSelected?'700':'500'};">${escapeHtml(opt)}</span>
                    <div style="display:flex; align-items:center; gap:10px;">
                      <span style="font-size:12px; color:var(--text-muted);">${pct}% (${count})</span>
                      ${!hasVoted ? `<button class="btn sm primary" onclick="votePoll('${poll.id}', ${idx})">Vote</button>` : ''}
                    </div>
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        </div>
      `;
    }).join('');
  }

  window.openCreatePollModal = function() {
    document.getElementById('modal-body').innerHTML = `
      <div style="font-family:var(--font-display); font-size:20px; font-weight:600; margin-bottom:12px;">Create New Poll</div>
      <form id="poll-form">
        <label>Question</label>
        <input type="text" id="poll-question" placeholder="Ask society residents..." required />
        <label>Option 1</label>
        <input type="text" id="poll-opt-0" placeholder="Option A" required />
        <label>Option 2</label>
        <input type="text" id="poll-opt-1" placeholder="Option B" required />
        <label>Option 3 (Optional)</label>
        <input type="text" id="poll-opt-2" placeholder="Option C" />
        <button type="submit" class="btn primary block" style="margin-top:16px;">Publish Poll</button>
      </form>
    `;
    document.getElementById('modal-view').classList.add('active');

    document.getElementById('poll-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const question = document.getElementById('poll-question').value.trim();
      const opt0 = document.getElementById('poll-opt-0').value.trim();
      const opt1 = document.getElementById('poll-opt-1').value.trim();
      const opt2 = document.getElementById('poll-opt-2').value.trim();

      const options = [opt0, opt1];
      if (opt2) options.push(opt2);

      try {
        await db.collection('polls').add({
          question,
          options,
          votes: {},
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });
        await broadcastNotification("New Poll Available", question);
        closeModal();
        loadPolls();
      } catch(err) {
        alert("Error creating poll: " + err.message);
      }
    });
  };

  window.votePoll = async function(pollId, optionIndex) {
    if (!db || !auth.currentUser) return;
    try {
      const ref = db.collection('polls').doc(pollId);
      await db.runTransaction(async (transaction) => {
        const doc = await transaction.get(ref);
        if (!doc.exists) throw "Poll does not exist!";
        const data = doc.data();
        const votes = data.votes || {};
        votes[auth.currentUser.uid] = optionIndex;
        transaction.update(ref, { votes: votes });
      });
      loadPolls();
    } catch(err) {
      alert("Error casting vote: " + err);
    }
  };

  // --- TICKETS / COMPLAINTS DIRECTORY & EXPORTS ---
  function loadTickets() {
    if (!db) return;
    let query = db.collection('tickets').orderBy('createdAt', 'desc');
    if (currentUserProfile.role !== 'admin') {
      query = query.where('uid', '==', auth.currentUser.uid);
    }
    query.get().then(snapshot => {
      ticketsList = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
      renderTicketsList();

  window.applyTicketFilters = function() {
    const monthEl = document.getElementById('ticket-month-filter');
    const statusEl = document.getElementById('ticket-status-filter');
    if (monthEl) ticketMonthFilter = monthEl.value;
    if (statusEl) ticketStatusFilter = statusEl.value;
    renderTicketsList();
  };

  function getFilteredTickets() {
    return ticketsList.filter(t => {
      if (ticketStatusFilter !== 'All' && t.status !== ticketStatusFilter) return false;

      if (ticketMonthFilter !== 'All' && t.createdAt) {
        const date = t.createdAt.toDate ? t.createdAt.toDate() : new Date(t.createdAt);
        const mm = String(date.getMonth() + 1).padStart(2, '0');
        const yyyy = date.getFullYear();
        const key = `${mm}-${yyyy}`;
        if (key !== ticketMonthFilter) return false;
      }
      return true;
    });
  }

  function renderTicketsList() {
    const listEl = document.getElementById('tickets-list');
    if (!listEl) return;

    const isAdmin = currentUserProfile.role === 'admin';
    const filtered = isAdmin ? getFilteredTickets() : ticketsList;

    if (isAdmin) {
      const pending = filtered.filter(t => t.status === 'pending').length;
      const inProgress = filtered.filter(t => t.status === 'in-progress').length;
      const resolved = filtered.filter(t => t.status === 'resolved').length;
      const closed = filtered.filter(t => t.status === 'closed').length;

      const summaryText = `Showing ${filtered.length} of ${ticketsList.length} complaints — Pending: ${pending} | In Progress: ${inProgress} | Resolved: ${resolved} | Closed: ${closed}`;
      const summaryEl = document.getElementById('tickets-summary-text');
      if (summaryEl) summaryEl.innerText = summaryText;
    }

    if (!filtered.length) {
      listEl.innerHTML = '<div class="card" style="text-align:center; color:var(--text-muted);">No complaints match the filter selection.</div>';
      return;
    }

    listEl.innerHTML = filtered.map(t => `
      <div class="card" style="cursor:default;">
        <div style="display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:6px;">
          <div>
            <span class="ticket-no">${escapeHtml(t.ticketNo || 'TICKET')}</span>
            <span style="font-weight:700; font-size:15px; color:var(--accent-2); margin-left:6px;">${escapeHtml(t.category)}</span>

          <span class="badge ${t.status || 'pending'}">${escapeHtml(t.status || 'Pending')}</span>
        </div>
        <div style="font-size:13px; color:var(--text); line-height:1.4; margin-bottom:8px;">${escapeHtml(t.description)}</div>
        <div style="font-size:11.5px; color:var(--text-muted);">House: ${escapeHtml(t.house || 'N/A')} | Resident: ${escapeHtml(t.name || 'N/A')}</div>
        ${t.department ? `<div style="font-size:11.5px; color:var(--info); margin-top:4px;">Assigned Dept: ${escapeHtml(t.department)}</div>` : ''}

        <div style="display:flex; gap:8px; margin-top:12px;">

          ${isAdmin ? `<button class="btn sm secondary" onclick="exportSingleComplaintPDF('${t.id}')">Export PDF</button>` : ''}
        </div>

    `).join('');

  window.exportFilteredComplaintsPDF = function() {
    const filtered = getFilteredTickets();
    try {
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF();

      doc.setFont("helvetica", "bold");
      doc.setFontSize(16);
      doc.text("Roshan Housing Society - Complaints Summary Report", 14, 18);
      
      doc.setFontSize(10);
      doc.setFont("helvetica", "normal");
      doc.text(`Generated: ${new Date().toLocaleDateString()} | Filter: Month (${ticketMonthFilter}), Status (${ticketStatusFilter})`, 14, 25);
      doc.line(14, 28, 196, 28);

      let y = 36;
      filtered.forEach((t, i) => {
        if (y > 270) { doc.addPage(); y = 20; }
        doc.setFont("helvetica", "bold");
        doc.text(`${i+1}. [${t.ticketNo || 'TICKET'}] ${t.category} - ${t.status ? t.status.toUpperCase() : 'PENDING'}`, 14, y);
        y += 6;
        doc.setFont("helvetica", "normal");
        doc.text(`Resident: ${t.name || 'N/A'} (${t.house || 'N/A'}) | Dept: ${t.department || 'Unassigned'}`, 14, y);
        y += 6;
        const splitDesc = doc.splitTextToSize(`Details: ${t.description}`, 180);
        doc.text(splitDesc, 14, y);
        y += (splitDesc.length * 5) + 6;
      });

      doc.save(`Complaints_Report_${ticketMonthFilter}_${ticketStatusFilter}.pdf`);
    } catch(err) {
      alert("Error generating PDF: " + err.message);
    }
  };

  // --- MAINTENANCE BILLS MODULE ---
  function loadBills() {
    if (!db) return;
    let query = db.collection('bills').orderBy('createdAt', 'desc');
    if (currentUserProfile.role !== 'admin') {
      query = query.where('uid', '==', auth.currentUser.uid);
    }
    query.get().then(snapshot => {
      billsList = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
      
      // Auto-evaluate Overdue statuses
      const todayStr = new Date().toISOString().split('T')[0];
      billsList.forEach(b => {
        if (b.status === 'unpaid' && b.dueDate && b.dueDate < todayStr) {
          b.isOverdue = true;
        }
      });

      if (currentUserProfile.role === 'admin') {
        updateAdminBillMetrics();
      } else {
        updateResidentBillBanner();
      }
      renderBillsList();
    }).catch(e => console.error("Error loading bills:", e));
  }

  function updateAdminBillMetrics() {
    let billed = 0;
    let collected = 0;
    let outstanding = 0;

    billsList.forEach(b => {
      const amt = Number(b.amount) || 0;
      if (b.status !== 'cancelled') {
        billed += amt;
        if (b.status === 'paid') {
          collected += amt;
        } else {
          outstanding += amt;
        }
      }
    });

    const bEl = document.getElementById('metric-billed');
    const cEl = document.getElementById('metric-collected');
    const oEl = document.getElementById('metric-outstanding');

    if (bEl) bEl.innerText = formatPKR(billed);
    if (cEl) cEl.innerText = formatPKR(collected);
    if (oEl) oEl.innerText = formatPKR(outstanding);
  }

  function updateResidentBillBanner() {
    let outstanding = 0;
    billsList.forEach(b => {
      if (b.status === 'unpaid') {
        outstanding += (Number(b.amount) || 0);
      }
    });
    const oEl = document.getElementById('resident-outstanding-val');
    if (oEl) oEl.innerText = formatPKR(outstanding);
  }

          <div style="display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:6px;">
            <div style="font-weight:700; font-size:16.5px; color:var(--accent-2);">${escapeHtml(f.title)}</div>
            <span class="badge ${f.status === 'closed' ? 'closed' : 'notice'}">${escapeHtml(f.status || 'Active')}</span>
          </div>

          <div style="font-size:13px; color:var(--text); line-height:1.4; margin-bottom:12px;">${escapeHtml(f.reason)}</div>

          <div style="background:var(--bg-elevated-2); padding:12px; border-radius:12px; border:1px solid var(--border); margin-bottom:12px;">
            <div style="display:flex; justify-content:space-between; font-size:12px; font-weight:700; color:var(--text-muted); margin-bottom:4px;">
              <span>Raised: ${formatPKR(collected)}</span>
              <span>Target: ${formatPKR(target)}</span>
            </div>
            <div class="progress-bar-bg">
              <div class="progress-bar-fill" style="width:${pct}%;"></div>
            </div>
            <div style="display:flex; justify-content:space-between; align-items:center; font-size:11px; color:var(--text-faint); margin-top:4px;">
              <span>${pct}% Completed</span>
              ${f.deadline ? `<span>Deadline: ${escapeHtml(f.deadline)}</span>` : ''}
            </div>
          </div>

          <div style="display:flex; gap:8px;">
            ${isAdmin ? `
              <button class="btn sm primary block" onclick="openRecordContributionModal('${f.id}')">+ Record Contribution</button>
            ` : `
              <button class="btn sm primary block" onclick="triggerResidentPayNow()">Contribute Now</button>
            `}
          </div>
        </div>
      `;
    }).join('');
  }

  window.openCreateFundModal = function() {
    document.getElementById('modal-body').innerHTML = `
      <div style="font-family:var(--font-display); font-size:20px; font-weight:600; margin-bottom:12px;">Start New Community Fund</div>
      <form id="fund-form">
        <label>Fund Title</label>
        <input type="text" id="fund-title" placeholder="e.g. Security CCTV Upgrade Fund" required />

        <label>Target Amount (PKR)</label>
        <input type="number" id="fund-target" placeholder="150000" required min="1" />

        <label>Reason / Fund Description</label>
        <textarea id="fund-reason" placeholder="Explain the purpose of this fund drive..." required></textarea>

        <label>Target Deadline (Optional)</label>
        <input type="date" id="fund-deadline" />

        <button type="submit" class="btn primary block" style="margin-top:16px;">Publish Fund Drive</button>
      </form>
    `;
    document.getElementById('modal-view').classList.add('active');

    document.getElementById('fund-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const title = document.getElementById('fund-title').value.trim();
      const targetAmount = Number(document.getElementById('fund-target').value);
      const reason = document.getElementById('fund-reason').value.trim();
      const deadline = document.getElementById('fund-deadline').value;

      try {
        await db.collection('funds').add({
          title,
          targetAmount,
          collectedAmount: 0,
          reason,
          deadline,
          status: 'active',
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });
        await broadcastNotification("New Community Fund Drive", `A new fund "${title}" has been launched. Target: PKR ${targetAmount.toLocaleString()}`);
        closeModal();
        loadFunds();
      } catch(err) {
        alert("Error launching fund: " + err.message);
      }
    });
  };

  window.openRecordContributionModal = async function(fundId) {
    const f = fundsList.find(item => item.id === fundId);
    if (!f) return;

    let resDocs = [];
    try {
      const snap = await db.collection('users').where('approved', '==', true).get();
      resDocs = snap.docs.map(doc => ({ uid: doc.id, ...doc.data() }));
    } catch(e) { console.error(e); }

    document.getElementById('modal-body').innerHTML = `
      <div style="font-family:var(--font-display); font-size:20px; font-weight:600; margin-bottom:12px;">Record Fund Contribution</div>
      <div style="font-size:13px; color:var(--text-muted); margin-bottom:14px;">Fund: <strong>${escapeHtml(f.title)}</strong></div>

      <form id="contrib-form">
        <label>Contributor Resident</label>
        <select id="contrib-resident" required>
          <option value="">-- Select Resident --</option>
          ${resDocs.map(r => `<option value="${r.uid}">${escapeHtml(r.name)} (${escapeHtml(r.house || 'N/A')})</option>`).join('')}
        </select>

        <label>Contributed Amount (PKR)</label>
        <input type="number" id="contrib-amount" placeholder="5000" required min="1" />

        <label>Payment Reference / Receipt Note</label>
        <input type="text" id="contrib-ref" placeholder="e.g. Cash / Bank Reference" required />

        <button type="submit" class="btn primary block" style="margin-top:16px;">Add Contribution</button>
      </form>
    `;
    document.getElementById('modal-view').classList.add('active');

    document.getElementById('contrib-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const residentUid = document.getElementById('contrib-resident').value;
      const amount = Number(document.getElementById('contrib-amount').value);
      const refNote = document.getElementById('contrib-ref').value.trim();

      const res = resDocs.find(item => item.uid === residentUid);

      try {
        const fundRef = db.collection('funds').doc(fundId);
        await db.runTransaction(async (transaction) => {
          const doc = await transaction.get(fundRef);
          if (!doc.exists) throw "Fund drive does not exist!";
          const currentCollected = Number(doc.data().collectedAmount) || 0;
          transaction.update(fundRef, {
            collectedAmount: currentCollected + amount
          });
        });

        await db.collection('fund_contributions').add({
          fundId,
          fundTitle: f.title,
          uid: residentUid,
          name: res ? res.name : 'Resident',
          house: res ? res.house : '',
          amount,
          refNote,
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });

        await sendNotification(residentUid, "Fund Contribution Acknowledged", `Thank you! Your contribution of PKR ${amount} for "${f.title}" has been recorded.`, 'success');

        closeModal();
        loadFunds();
      } catch(err) {
        alert("Error saving contribution: " + err.message);
      }
    });
  };

  // --- BIODATA EDITING ---
  window.openEditBiodataModal = function() {
    document.getElementById('modal-body').innerHTML = `
      <div style="font-family:var(--font-display); font-size:20px; font-weight:600; margin-bottom:12px;">Update Biodata</div>
      <form id="edit-bio-form">
        <label>Full Name</label>
        <input type="text" id="edit-bio-name" value="${escapeHtml(currentUserProfile.name || '')}" required />

        <label>CNIC Number</label>
        <input type="text" id="edit-bio-cnic" value="${escapeHtml(currentUserProfile.cnic || '')}" required />

        <label>Cell Number</label>
        <input type="text" id="edit-bio-phone" value="${escapeHtml(currentUserProfile.phone || '')}" required />

        <label>House / Plot Number</label>
        <input type="text" id="edit-bio-house" value="${escapeHtml(currentUserProfile.house || '')}" required />

        <label>Blood Group</label>
        <select id="edit-bio-blood" required>
          <option value="A+" ${currentUserProfile.bloodGroup==='A+'?'selected':''}>A+</option>
          <option value="A-" ${currentUserProfile.bloodGroup==='A-'?'selected':''}>A-</option>
          <option value="B+" ${currentUserProfile.bloodGroup==='B+'?'selected':''}>B+</option>
          <option value="B-" ${currentUserProfile.bloodGroup==='B-'?'selected':''}>B-</option>
          <option value="AB+" ${currentUserProfile.bloodGroup==='AB+'?'selected':''}>AB+</option>
          <option value="AB-" ${currentUserProfile.bloodGroup==='AB-'?'selected':''}>AB-</option>
          <option value="O+" ${currentUserProfile.bloodGroup==='O+'?'selected':''}>O+</option>
          <option value="O-" ${currentUserProfile.bloodGroup==='O-'?'selected':''}>O-</option>
        </select>

        <label>Occupancy Type</label>
        <select id="edit-bio-occupancy" required>
          <option value="Owner" ${currentUserProfile.occupancyType==='Owner'?'selected':''}>Owner</option>
          <option value="Tenant" ${currentUserProfile.occupancyType==='Tenant'?'selected':''}>Tenant</option>
        </select>

        <label>Family Members / Dependents Details</label>
        <textarea id="edit-bio-family" required>${escapeHtml(currentUserProfile.familyDetails || '')}</textarea>

        <button type="submit" class="btn primary block" style="margin-top:16px;">Save Changes</button>
      </form>
    `;
    document.getElementById('modal-view').classList.add('active');

    document.getElementById('edit-bio-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const name = document.getElementById('edit-bio-name').value.trim();
      const cnic = document.getElementById('edit-bio-cnic').value.trim();
      const phone = document.getElementById('edit-bio-phone').value.trim();
      const house = document.getElementById('edit-bio-house').value.trim();
      const bloodGroup = document.getElementById('edit-bio-blood').value;
      const occupancyType = document.getElementById('edit-bio-occupancy').value;
      const familyDetails = document.getElementById('edit-bio-family').value.trim();

      try {
        await db.collection('users').doc(auth.currentUser.uid).update({
          name, cnic, phone, house, bloodGroup, occupancyType, familyDetails
        });
        currentUserProfile = {
          ...currentUserProfile,
          name, cnic, phone, house, bloodGroup, occupancyType, familyDetails
        };
        closeModal();
        render();
      } catch(err) {
        alert("Error updating biodata: " + err.message);
      }
    });
  };

  // --- RESIDENTS DIRECTORY (ADMIN) ---
  function loadAllResidents() {
    if (!db) return;
    db.collection('users').where('approved', '==', true).get().then(snapshot => {
      allResidents = snapshot.docs.map(doc => ({ uid: doc.id, ...doc.data() }));
      renderResidentsList();
    }).catch(e => console.error("Error loading residents:", e));
  }

  function renderResidentsList() {
    const listEl = document.getElementById('residents-list');
    if (!listEl) return;
    if (!allResidents.length) {
      listEl.innerHTML = '<div class="card" style="text-align:center; color:var(--text-muted);">No approved residents found.</div>';
      return;
    }

    listEl.innerHTML = allResidents.map(r => `
      <div class="card" style="cursor:default;">
        <div style="display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:6px;">
          <div>
            <div style="font-weight:700; font-size:15px; color:var(--accent-2);">${escapeHtml(r.name)}</div>
            <div style="font-size:12.5px; color:var(--text-muted);">House: ${escapeHtml(r.house || 'N/A')}</div>
          </div>
          <button class="btn sm secondary" onclick="downloadResidentPDF('${r.uid}')">PDF Card</button>
        </div>
        <div style="font-size:12px; color:var(--text-muted); margin-top:4px;">CNIC: ${escapeHtml(r.cnic || 'N/A')} | Phone: ${escapeHtml(r.phone || 'N/A')}</div>
        <div style="font-size:12px; color:var(--text-muted);">Blood Group: ${escapeHtml(r.bloodGroup || 'N/A')} (${escapeHtml(r.occupancyType || 'N/A')})</div>
      </div>
    `).join('');
  }

  window.downloadResidentPDF = function(uid) {
    const r = allResidents.find(item => item.uid === uid);
    if (!r) return;

    try {
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF();

      doc.setFont("helvetica", "bold");
      doc.setFontSize(18);
      doc.text("Roshan Pakistan Housing Society", 105, 20, { align: "center" });

      doc.setFontSize(12);
      doc.setFont("helvetica", "normal");
      doc.text("Official Resident Biodata Record", 105, 28, { align: "center" });

      doc.line(20, 35, 190, 35);

      let y = 48;
      const addRow = (label, val) => {
        doc.setFont("helvetica", "bold");
        doc.text(label + ":", 25, y);
        doc.setFont("helvetica", "normal");
        doc.text(String(val || 'N/A'), 75, y);
        y += 10;
      };

      addRow("Full Name", r.name);
      addRow("House / Plot", r.house);
      addRow("CNIC Number", r.cnic);
      addRow("Phone Number", r.phone);
      addRow("Email Address", r.email);
      addRow("Blood Group", r.bloodGroup);
      addRow("Occupancy Type", r.occupancyType);

      y += 5;
      doc.setFont("helvetica", "bold");
      doc.text("Family Members / Dependents:", 25, y);
      y += 8;
      doc.setFont("helvetica", "normal");
      const splitFamily = doc.splitTextToSize(r.familyDetails || 'N/A', 160);
      doc.text(splitFamily, 25, y);

      doc.save(`Resident_${(r.house || 'Biodata').replace(/\s+/g, '_')}.pdf`);
    } catch(err) {
      alert("Error generating PDF: " + err.message);
    }
  };

  // --- APPROVALS ---
  function loadPendingResidents() {
    if (!db) return;
    db.collection('users').where('approved', '==', false).get().then(snapshot => {
      pendingResidents = snapshot.docs.map(doc => ({ uid: doc.id, ...doc.data() }));
      renderApprovalsList();
    }).catch(e => console.error("Error loading approvals:", e));
  }

  function renderApprovalsList() {
    const listEl = document.getElementById('approvals-list');
    if (!listEl) return;
    if (!pendingResidents.length) {
      listEl.innerHTML = '<div class="card" style="text-align:center; color:var(--text-muted);">No pending registration requests.</div>';
      return;
    }

    listEl.innerHTML = pendingResidents.map(r => `
      <div class="card" style="cursor:default;">
        <div style="font-weight:700; font-size:15px; color:var(--accent-2);">${escapeHtml(r.name)}</div>
        <div style="font-size:12.5px; color:var(--text-muted);">House: ${escapeHtml(r.house || 'N/A')}</div>
        <div style="font-size:12.5px; color:var(--text-muted);">Phone: ${escapeHtml(r.phone || 'N/A')}</div>
        <div style="font-size:12.5px; color:var(--text-muted);">Email: ${escapeHtml(r.email || 'N/A')}</div>
        <div style="font-size:12.5px; color:var(--text-muted);">Biodata Status: ${r.biodataSubmitted ? 'Submitted' : 'Pending'}</div>

        <div style="display:flex; gap:10px; margin-top:12px;">
          <button class="btn sm primary block" onclick="approveUser('${r.uid}')">Approve</button>
          <button class="btn sm danger block" onclick="rejectUser('${r.uid}')">Reject</button>
        </div>
      </div>
    `).join('');
  }

  window.approveUser = async function(uid) {
    try {
      await db.collection('users').doc(uid).update({ approved: true });
      await sendNotification(uid, "Account Approved", "Your account has been approved! You can now access your portal.", "success");
      loadPendingResidents();
    } catch(e) { alert("Error approving user: " + e.message); }
  };

  window.rejectUser = async function(uid) {
    if (!confirm("Are you sure you want to delete this registration request?")) return;
    try {
      await db.collection('users').doc(uid).delete();
      loadPendingResidents();
    } catch(e) { alert("Error deleting user: " + e.message); }
  };

})();
</script>
</body>
</html>
