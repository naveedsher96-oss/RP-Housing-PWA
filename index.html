  window.setExpenseFilter = function(key, value) {
    expenseFilter[key] = value || 'all';
    delete pageShown['expenses'];
    renderExpensesList();
  };

  function filteredExpenses() {
    const f = expenseFilter;
    return expensesList.filter(x => {
      if (f.month !== 'all' && !String(x.expenseDate || '').startsWith(f.month)) return false;
      if (f.category !== 'all' && (x.category || 'Other') !== f.category) return false;
      if (f.source !== 'all' && expenseSource(x) !== f.source) return false;
      return true;
    });
  }

  window.exportExpensesCSV = function() {
    if (!isStaff()) return;
    const rows = filteredExpenses().map(x => [
      expenseRefNo(x), x.expenseDate, x.category || 'Other', x.description, Number(x.amount || 0),
      expenseSourceLabel(x), x.enteredBy, x.decisionRef, isoDate(x.createdAt)
    ]);
    if (!rows.length) return toast("No expenses to export for the current filter.");
    downloadCSV(`RPHS_Expenses_${dateStamp()}.csv`,
      ['Ref', 'Date', 'Category', 'Description', 'Amount (PKR)', 'Paid From', 'Entered By', 'Board Ref', 'Recorded On'],
      rows, 'expenses_csv');
  };

  function renderExpensesList() {
    const listEl = document.getElementById('expenses-list');
    const sumEl = document.getElementById('expenses-summary');
    if (!listEl) return;

    const total = sumAmounts(expensesList);
    const thisMonth = new Date().toISOString().slice(0, 7);
    const monthTotal = sumAmounts(expensesList.filter(x => String(x.expenseDate || '').startsWith(thisMonth)));
    const billsAcct = billsAccountSummary(expenseSources.bills, expensesList, expenseSources.transfers);
    const fundsAcct = allFundsSummary(expenseSources.contribs, expensesList, expenseSources.transfers);

    if (sumEl) {
      sumEl.innerHTML = `
        <div class="stat-strip">
          <div class="stat-box"><div class="k">Bills Account Balance</div><div class="v" style="color:${balanceColor(billsAcct.balance)};">${formatMoney(billsAcct.balance)}</div><div style="font-size:13px; color:var(--text-faint); margin-top:2px;">${balanceBreakdown(billsAcct)}</div></div>
          <div class="stat-box"><div class="k">Funds Balance</div><div class="v" style="color:${balanceColor(fundsAcct.balance)};">${formatMoney(fundsAcct.balance)}</div><div style="font-size:13px; color:var(--text-faint); margin-top:2px;">${balanceBreakdown(fundsAcct)}</div></div>
        </div>
        <div class="stat-strip">
          <div class="stat-box"><div class="k">Total Spent</div><div class="v" style="color:var(--danger);">${formatMoney(total)}</div></div>
          <div class="stat-box"><div class="k">This Month</div><div class="v">${formatMoney(monthTotal)}</div></div>
          <div class="stat-box"><div class="k">Entries</div><div class="v">${expensesList.length}</div></div>
        </div>
      `;
    }

    const list = filteredExpenses();
    const filterSummary = document.getElementById('expense-filter-summary');
    if (filterSummary) filterSummary.textContent = `${list.length} of ${expensesList.length} expense(s) · ${formatMoney(sumAmounts(list))}`;

    if (!list.length) {
      listEl.innerHTML = `<div class="card" style="text-align:center; color:var(--text-muted);">${expensesList.length ? 'No expenses match the current filter.' : 'No expenses recorded yet.'}</div>`;
      return;
    }

    listEl.innerHTML = pageOf('expenses', list, renderExpensesList).map(x => `
      <div class="card" onclick="openExpenseDetailModal('${x.id}')">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:4px;">
          <span style="font-weight:700; font-size:14.5px; color:var(--accent-2);">${escapeHtml(x.category || 'Other')}</span>
          <span class="amount" style="color:var(--danger);">${formatMoney(x.amount)}</span>
        </div>
        <div style="font-size:13px; margin-bottom:4px; white-space:pre-wrap;">${escapeHtml(x.description || '')}</div>
        <div style="font-size:13px; margin-bottom:4px;"><span style="color:var(--text-faint);">Paid from:</span> <span style="color:${expenseSource(x) === 'fund' ? 'var(--info)' : 'var(--accent-2)'}; font-weight:600;">${escapeHtml(expenseSourceLabel(x))}</span></div>
        <div style="font-size:13px; color:var(--text-faint);">${escapeHtml(x.expenseDate || '')} · Entered by ${escapeHtml(x.enteredBy || 'Management')}${x.decisionRef ? ' · Board ref: ' + escapeHtml(x.decisionRef) : ''}</div>
        <div style="margin-top:12px; display:flex; gap:8px;">
          <button class="btn sm secondary" onclick="event.stopPropagation(); downloadExpensePDF('${x.id}')">Receipt PDF</button>
          <span style="flex:1;"></span>
          ${currentUserProfile.role === 'admin' ? `<button class="dots-btn" onclick="event.stopPropagation(); openCardMenu('expense', '${x.id}')" aria-label="More actions">${icon('dots')}</button>` : ''}
        </div>
      </div>
    `).join('') + showMoreButton('expenses', list.length);
  }

  function expenseRefNo(x) {
    return 'EXP-' + String(x.id || '').slice(-6).toUpperCase();
  }

  window.openExpenseDetailModal = function(expenseId) {
    const x = expensesList.find(item => item.id === expenseId);
    if (!x) return;
    const isAdmin = currentUserProfile.role === 'admin';
    const fromFund = expenseSource(x) === 'fund';
    const row = (label, val, style = '') => `<div style="display:flex; justify-content:space-between; gap:12px; margin-bottom:8px;"><span style="font-size:13px; color:var(--text-muted); white-space:nowrap;">${label}</span><span style="font-size:13.5px; text-align:right; ${style}">${val}</span></div>`;

    document.getElementById('modal-body').innerHTML = `
      <div style="display:flex; justify-content:space-between; align-items:center; gap:10px; padding-right:44px; margin-bottom:12px;">
        <span class="ticket-no">${escapeHtml(expenseRefNo(x))}</span>
        <span class="badge ${fromFund ? 'assigned' : 'notice'}">${fromFund ? 'Fund' : 'Bills account'}</span>
      </div>
      <div style="font-family:var(--font-display); font-size:18px; font-weight:600; color:var(--accent-2); margin-bottom:4px;">${escapeHtml(x.category || 'Other')}</div>
      <div style="font-size:13px; color:var(--text-muted); margin-bottom:14px;">Expense dated ${escapeHtml(formatDate(x.expenseDate))}</div>

      <div style="background:var(--bg-elevated-2); border:1px solid var(--border); border-radius:10px; padding:14px; margin-bottom:14px;">
        ${row('Amount', `<span class="amount" style="color:var(--danger);">${formatMoney(x.amount)}</span>`)}
        ${row('Paid From', escapeHtml(expenseSourceLabel(x)), `color:${fromFund ? 'var(--info)' : 'var(--accent-2)'}; font-weight:600;`)}
        ${row('Expense Date', escapeHtml(formatDate(x.expenseDate)))}
        ${row('Recorded On', escapeHtml(formatDate(x.createdAt)))}
        ${row('Entered By', escapeHtml(x.enteredBy || 'Management'))}
        ${x.decisionRef ? row('Board Reference', escapeHtml(x.decisionRef)) : ''}
      </div>

      <div style="font-size:13px; text-transform:uppercase; letter-spacing:.4px; color:var(--text-faint); font-weight:700; margin-bottom:6px;">Details</div>
      <div style="font-size:13.5px; line-height:1.55; margin-bottom:16px; white-space:pre-wrap;">${escapeHtml(x.description || 'No details recorded.')}</div>

      <button class="btn secondary block" onclick="downloadExpensePDF('${x.id}')" style="margin-bottom:10px;">Download Receipt PDF</button>
      ${isAdmin ? `<button class="btn danger block" onclick="closeModal(); archiveExpense('${x.id}')">Remove Expense</button>` : ''}
    `;
    openModal();
  };

  window.downloadExpensePDF = async function(expenseId) {
    const x = expensesList.find(item => item.id === expenseId);
    if (!x) return;

    try {
      const { jsPDF } = await ensureJsPDF();
      const doc = new jsPDF();

      doc.setFont("helvetica", "bold");
      doc.setFontSize(18);
      doc.text("Roshan Pakistan Housing Society", 105, 20, { align: "center" });
      doc.setFontSize(12);
      doc.setFont("helvetica", "normal");
      doc.text("Expense Receipt", 105, 28, { align: "center" });
      doc.line(20, 35, 190, 35);

      let y = 48;
      const addRow = (label, val) => {
        doc.setFont("helvetica", "bold");
        doc.text(label + ":", 25, y);
        doc.setFont("helvetica", "normal");
        doc.text(String(val || 'N/A'), 85, y);
        y += 10;
      };

      addRow("Reference", expenseRefNo(x));
      addRow("Category", x.category);
      addRow("Amount", formatMoney(x.amount));
      addRow("Paid From", expenseSourceLabel(x));
      addRow("Expense Date", formatDate(x.expenseDate));
      addRow("Recorded On", formatDate(x.createdAt));
      addRow("Entered By", x.enteredBy || 'Management');
      if (x.decisionRef) addRow("Board Reference", x.decisionRef);

      y += 5;
      doc.setFont("helvetica", "bold");
      doc.text("Details:", 25, y);
      y += 8;
      doc.setFont("helvetica", "normal");
      doc.text(doc.splitTextToSize(x.description || 'N/A', 160), 25, y);

      doc.setFontSize(9);
      doc.setTextColor(120);
      doc.text(`Generated ${new Date().toLocaleString()} by ${currentUserProfile.name || 'RPHS app'}`, 105, 285, { align: "center" });

      doc.save(`Expense_${expenseRefNo(x)}_${String(x.expenseDate || '').replace(/[^0-9-]/g, '') || 'record'}.pdf`);
    } catch(err) {
      toast("Error generating PDF: " + err.message);
    }
  };

  window.openAddExpenseModal = async function() {
    if (currentUserProfile.role !== 'admin') return;
    const modalBody = document.getElementById('modal-body');
    modalBody.innerHTML = `
      <div style="font-family:var(--font-display); font-size:20px; font-weight:600; margin-bottom:12px;">Add Expense</div>
      <div style="color:var(--text-muted); font-size:13.5px;">Loading account balances…</div>
    `;
    openModal();

    // Always read fresh balances so the Pay From list reflects the latest
    // verified bills / contributions, even if the tab was opened a while ago.
    try {
      await fetchExpenseData();
    } catch (err) {
      console.error("Error loading expense sources:", err);
      modalBody.innerHTML = `
        <div style="font-family:var(--font-display); font-size:20px; font-weight:600; margin-bottom:12px;">Add Expense</div>
        <div class="card" style="cursor:default; color:var(--danger);">Could not load account balances: ${escapeHtml(err.message || String(err))}</div>
        <button class="btn secondary block" style="margin-top:12px;" onclick="openAddExpenseModal()">Retry</button>
      `;
      return;
    }
    if (!document.getElementById('modal-view').classList.contains('active')) return;
    renderExpensesList();

    const billsAcct = billsAccountSummary(expenseSources.bills, expensesList, expenseSources.transfers);
    const fundRows = expenseSources.funds
      .map(f => ({ f, s: fundSummary(f.id, expenseSources.contribs, expensesList, expenseSources.transfers) }))
      .sort((a, b) => b.s.balance - a.s.balance);
    const sourceOptions = [
      { value: 'bills', label: 'Bills account', sub: `Balance ${formatMoney(billsAcct.balance)}`, initials: '₨', avatarClass: 'cat', group: 'Pooled bill payments' },
      ...fundRows.map(({ f, s }) => ({ value: `fund:${f.id}`, label: f.title || 'Fund', sub: `Balance ${formatMoney(s.balance)}`, tag: (f.status || 'active') !== 'active' ? 'closed' : '', initials: '◈', avatarClass: 'staff', group: 'Community funds' }))
    ];
    modalBody.innerHTML = `
      <div style="font-family:var(--font-display); font-size:20px; font-weight:600; margin-bottom:12px;">Add Expense</div>
      <form id="expense-form">
        <label>Pay From</label>
        ${pickerHtml('exp-source', sourceOptions, { searchPlaceholder: 'Search funds…' })}
        <div style="font-size:13px; color:var(--text-faint); margin:-6px 0 10px;">
          Bills account = ${formatMoney(billsAcct.collected)} from ${expenseSources.bills.filter(b => b.status === 'paid').length} paid bill(s) minus ${formatMoney(billsAcct.spent)} spent${billsAcct.transferredIn || billsAcct.transferredOut ? `, ${billsAcct.transferredIn >= billsAcct.transferredOut ? 'plus' : 'minus'} ${formatMoney(Math.abs(billsAcct.transferredIn - billsAcct.transferredOut))} net transfers` : ''}.
          ${fundRows.length ? `${fundRows.length} fund(s) listed — each shows verified contributions minus spending from that fund.` : 'No community funds found — start one in the Funds tab to spend from it.'}
        </div>
        <label>Category</label>
        <select id="exp-category" required>
          ${EXPENSE_CATEGORIES.map(c => `<option value="${c}">${c}</option>`).join('')}
        </select>
        <label>Details / Note (required)</label>
        <textarea id="exp-desc" placeholder="What was this expense for, who/what it went to, receipt no., who approved it..." required minlength="10"></textarea>
        <label>Amount (PKR)</label>
        <input type="number" id="exp-amount" placeholder="e.g. 15000" required min="1" />
        <label>Expense Date</label>
        <input type="date" id="exp-date" value="${new Date().toISOString().slice(0,10)}" required />
        <label>Board Approval Reference (optional)</label>
        <input type="text" id="exp-decision" placeholder="e.g. Board decision title / ID" />
        <button type="submit" class="btn primary block" style="margin-top:16px;">Record Expense</button>
      </form>
    `;
    openModal();

    document.getElementById('expense-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const category = document.getElementById('exp-category').value;
      const description = document.getElementById('exp-desc').value.trim();
      const amount = Number(document.getElementById('exp-amount').value);
      const expenseDate = document.getElementById('exp-date').value;
      const decisionRef = document.getElementById('exp-decision').value.trim();
      const sourceVal = document.getElementById('exp-source').value;
      if (!amount || amount <= 0) { toast("Please enter a valid amount."); return; }
      if (description.length < 10) { toast("Please write a detailed note for this expense (at least 10 characters)."); return; }

      let source = 'bills', fundId = '', fundTitle = '', available = billsAcct.balance, sourceName = 'Bills account';
      if (sourceVal.startsWith('fund:')) {
        fundId = sourceVal.slice(5);
        const f = expenseSources.funds.find(item => item.id === fundId);
        if (!f) { toast("Selected fund not found. Please reload and try again."); return; }
        source = 'fund';
        fundTitle = f.title || 'Fund';
        available = fundSummary(fundId, expenseSources.contribs, expensesList, expenseSources.transfers).balance;
        sourceName = `Fund: ${fundTitle}`;
      }
      if (amount > available) {
        toast(`Only ${formatMoney(available)} is available in ${sourceName}. Reduce the amount or choose another source.`);
        return;
      }

      try {
        const ref = await db.collection('expenses').add({
          category, description, amount, currency: 'PKR', expenseDate, decisionRef,
          source, fundId, fundTitle,
          enteredBy: currentUserProfile.name,
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });
        logAudit('expense', ref.id, 'create', `${category} expense of ${formatMoney(amount)} paid from ${sourceName}`);
        closeModal();
        loadExpenses();
      } catch(err) {
        toast("Error recording expense: " + err.message);
      }
    });
  };

  window.archiveExpense = async function(id) {
    const x = expensesList.find(item => item.id === id);
    if (!(await confirmSheet({ title: 'Cancel this expense?', body: `${x ? x.category : ''} expense of ${x ? formatMoney(x.amount) : ''}. It will be archived (kept for audit).`, okLabel: 'Cancel expense', cancelLabel: 'Keep it', danger: true }))) return;
    logAudit('expense', id, 'soft_delete', x ? `${x.category} ${formatMoney(x.amount)} (${expenseSourceLabel(x)})` : '');
    archiveRecord('expenses', id, loadExpenses);
  };

  // --- ACCOUNT TRANSFERS (ADMIN) ---
  // Moves money between the Bills account and Funds. A transfer is a ledger
  // entry (never edited or deleted); mistakes are reversed with an opposite transfer.
  function refreshMoneyViews() {
    if (document.getElementById('bills-list')) loadBills();
    if (document.getElementById('funds-list')) loadFunds();
    if (document.getElementById('expenses-list')) loadExpenses();
    if (document.getElementById('dashboard-body')) loadDashboard();
  }

  // direction 'bills': Bills account -> chosen Fund; direction 'fund': chosen Fund -> Bills account.
  window.openTransferModal = async function(direction) {
    if (currentUserProfile.role !== 'admin') return;
    const modalBody = document.getElementById('modal-body');
    const toBills = direction === 'fund';
    const heading = toBills ? 'Transfer to Bills Account' : 'Transfer to Fund';
    modalBody.innerHTML = `
      <div style="font-family:var(--font-display); font-size:20px; font-weight:600; margin-bottom:12px;">${heading}</div>
      <div style="color:var(--text-muted); font-size:13.5px;">Loading account balances…</div>
    `;
    openModal();

    try {
      await fetchExpenseData();
    } catch (err) {
      console.error("Error loading transfer sources:", err);
      modalBody.innerHTML = `
        <div style="font-family:var(--font-display); font-size:20px; font-weight:600; margin-bottom:12px;">${heading}</div>
        <div class="card" style="cursor:default; color:var(--danger);">Could not load account balances: ${escapeHtml(err.message || String(err))}</div>
        <button class="btn secondary block" style="margin-top:12px;" onclick="openTransferModal('${direction}')">Retry</button>
      `;
      return;
    }
    if (!document.getElementById('modal-view').classList.contains('active')) return;

    const { bills, funds, contribs, transfers } = expenseSources;
    const billsAcct = { type: 'bills', fundId: '', title: 'Bills account', summary: billsAccountSummary(bills, expensesList, transfers) };
    const fundAccts = funds.map(f => ({
      type: 'fund', fundId: f.id, title: f.title || 'Fund', closed: (f.status || 'active') !== 'active',
      summary: fundSummary(f.id, contribs, expensesList, transfers)
    })).sort((a, b) => Number(a.closed) - Number(b.closed) || a.title.localeCompare(b.title));
    const label = a => (a.type === 'fund' ? `Fund: ${a.title}${a.closed ? ' (closed)' : ''}` : a.title);
    const optionText = a => `${label(a)} — balance ${formatMoney(a.summary.balance)}`;

    if (!fundAccts.length) {
      modalBody.innerHTML = `
        <div style="font-family:var(--font-display); font-size:20px; font-weight:600; margin-bottom:12px;">${heading}</div>
        <div class="card" style="cursor:default; color:var(--text-muted);">No community funds exist yet. Start one in the Funds tab first.</div>
      `;
      return;
    }
    const fundOptions = fundAccts.map((a, i) => `<option value="${a.fundId}" ${i === 0 ? 'selected' : ''}>${escapeHtml(optionText(a))}</option>`).join('');
    const pickedFund = () => fundAccts.find(a => a.fundId === document.getElementById('tr-fund').value);
    const getFrom = () => toBills ? pickedFund() : billsAcct;
    const getTo = () => toBills ? billsAcct : pickedFund();

    modalBody.innerHTML = `
      <div style="font-family:var(--font-display); font-size:20px; font-weight:600; margin-bottom:12px;">${heading}</div>
      <form id="transfer-form">
        <label>From</label>
        ${toBills
          ? `<select id="tr-fund" required>${fundOptions}</select>`
          : `<input type="text" value="${escapeHtml(optionText(billsAcct))}" disabled />`}
        <label>To</label>
        ${toBills
          ? `<input type="text" value="${escapeHtml(optionText(billsAcct))}" disabled />`
          : `<select id="tr-fund" required>${fundOptions}</select>`}
        <label>Amount (PKR)</label>
        <input type="number" id="tr-amount" placeholder="e.g. 5000" required min="1" />
        <div id="tr-available" style="font-size:13px; color:var(--text-faint); margin:-6px 0 10px;"></div>
        <label>Reason / Note (required)</label>
        <textarea id="tr-note" placeholder="Why is this money being moved, who approved it, any reference..." required minlength="10"></textarea>
        <label>Transfer Date</label>
        <input type="date" id="tr-date" value="${new Date().toISOString().slice(0,10)}" required />
        <button type="submit" class="btn primary block" style="margin-top:16px;">Confirm Transfer</button>
        <div style="font-size:13px; color:var(--text-faint); margin-top:8px; text-align:center;">Transfers are permanent ledger entries. To undo one, transfer the amount back.</div>
      </form>
    `;

    const showAvailable = () => {
      const from = getFrom();
      document.getElementById('tr-available').textContent = `Available in ${label(from)}: ${formatMoney(from.summary.balance)}`;
      document.getElementById('tr-amount').max = Math.max(0, from.summary.balance);
    };
    showAvailable();
    document.getElementById('tr-fund').addEventListener('change', showAvailable);

    document.getElementById('transfer-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const from = getFrom(), to = getTo();
      const amount = Number(document.getElementById('tr-amount').value);
      const note = document.getElementById('tr-note').value.trim();
      const transferDate = document.getElementById('tr-date').value;
      if (!from || !to) { toast("Please choose a fund."); return; }
      if (!amount || amount <= 0) { toast("Please enter a valid amount."); return; }
      if (note.length < 10) { toast("Please write a detailed note for this transfer (at least 10 characters)."); return; }
      if (amount > from.summary.balance) {
        toast(`Only ${formatMoney(from.summary.balance)} is available in ${label(from)}. Reduce the amount.`);
        return;
      }
      if (!(await confirmSheet({ title: `Transfer ${formatMoney(amount)}?`, body: `From ${label(from)} to ${label(to)}.`, okLabel: 'Transfer' }))) return;

      const submitBtn = e.target.querySelector('button[type="submit"]');
      submitBtn.disabled = true;
      try {
        const ref = await db.collection('transfers').add({
          fromType: from.type, fromFundId: from.fundId, fromFundTitle: from.type === 'fund' ? from.title : '',
          toType: to.type, toFundId: to.fundId, toFundTitle: to.type === 'fund' ? to.title : '',
          amount, currency: 'PKR', note, transferDate,
          enteredBy: currentUserProfile.name,
          enteredByUid: auth.currentUser.uid,
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });
        logAudit('transfer', ref.id, 'create', `${formatMoney(amount)} moved from ${label(from)} to ${label(to)}: ${note}`);
        closeModal();
        refreshMoneyViews();
      } catch(err) {
        submitBtn.disabled = false;
        toast("Error recording transfer: " + err.message);
      }
    });
  };

  // --- VOLUNTEER PROGRAMS ---
  function showLoadError(elId, e) {
    const el = document.getElementById(elId);
    if (el) el.innerHTML = `<div class="card" style="cursor:default; color:var(--danger);">Could not load data: ${escapeHtml(e.message || String(e))}</div>`;
  }

  function loadVolunteers() {
    if (!db) return;
    db.collection('volunteer_programs').get().then(snapshot => {
      volunteersList = snapshot.docs
        .map(doc => ({ id: doc.id, ...doc.data() }))
        .filter(p => !p.isDeleted)
        .sort((a, b) => {
          const da = toDate(a.createdAt), dbb = toDate(b.createdAt);
          return (dbb ? dbb.getTime() : 0) - (da ? da.getTime() : 0);
        });
      renderVolunteersBody();
    }).catch(e => { console.error("Error loading volunteer programs:", e); showLoadError('volunteers-body', e); });
  }

  function renderVolunteersBody() {
    const el = document.getElementById('volunteers-body');
    if (!el) return;
    const isAdmin = currentUserProfile.role === 'admin';

    if (!volunteersList.length) {
      el.innerHTML = `<div class="card" style="text-align:center; color:var(--text-muted);">${isAdmin ? 'No volunteer programs yet. Start one to invite residents.' : 'No volunteer programs announced yet. Check back soon!'}</div>`;
      return;
    }

    el.innerHTML = volunteersList.map(p => {
      const parts = p.participants || [];
      const joined = parts.some(x => x.uid === auth.currentUser.uid);
      const active = p.status !== 'closed';
      return `
      <div class="card" style="cursor:default;">
        <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:10px; margin-bottom:6px;">
          <div style="font-weight:700; font-size:15.5px; color:var(--accent-2);">${escapeHtml(p.title)}</div>
          <span class="badge ${active ? 'resolved' : 'closed'}">${active ? 'Active' : 'Closed'}</span>
        </div>
        <div style="font-size:13px; line-height:1.5; white-space:pre-wrap; margin-bottom:8px;">${escapeHtml(p.description || '')}</div>
        ${p.schedule ? `<div style="font-size:13px; color:var(--text-muted); margin-bottom:6px;">📅 ${escapeHtml(p.schedule)}</div>` : ''}
        <div style="font-size:13px; color:var(--text-muted); margin-bottom:8px;">🤝 ${parts.length} volunteer${parts.length === 1 ? '' : 's'} joined</div>
        ${isStaff() && parts.length ? `
          <div style="background:var(--bg-elevated-2); border:1px solid var(--border); border-radius:10px; padding:10px 12px; margin-bottom:10px;">
            ${parts.map(x => `<div style="font-size:13px; margin-bottom:3px;"><strong>${escapeHtml(x.name)}</strong> <span style="color:var(--text-muted);">— ${escapeHtml(x.house || 'N/A')}${x.phone ? ' · ' + escapeHtml(x.phone) : ''}</span></div>`).join('')}
          </div>` : ''}
        ${!isStaff() && active ? (joined
          ? `<button class="btn sm secondary" onclick="leaveProgram('${p.id}')">Leave program</button> <span style="font-size:13px; color:var(--success); margin-left:8px;">✔ You have joined</span>`
          : `<button class="btn sm primary" onclick="joinProgram('${p.id}')">Join as Volunteer</button>`) : ''}
        ${!isStaff() && !active && joined ? '<span style="font-size:13px; color:var(--text-muted);">You volunteered in this program.</span>' : ''}
        ${isAdmin ? `<div style="margin-top:10px; display:flex; gap:8px; justify-content:flex-end;">
          <button class="dots-btn" onclick="event.stopPropagation(); openCardMenu('program', '${p.id}')" aria-label="More actions">${icon('dots')}</button>
        </div>` : ''}
      </div>`;
    }).join('');
  }

  window.openStartProgramModal = function() {
    if (currentUserProfile.role !== 'admin') return;
    document.getElementById('modal-body').innerHTML = `
      <div style="font-family:var(--font-display); font-size:20px; font-weight:600; margin-bottom:12px;">Start Volunteer Program</div>
      <form id="program-form">
        <label>Program Title</label>
        <input type="text" id="prog-title" placeholder="e.g. Ramzan Food Distribution" required />
        <label>Description — what will volunteers do?</label>
        <textarea id="prog-desc" placeholder="Describe the work, who it helps and what is needed..." required></textarea>
        <label>Schedule / Timing (optional)</label>
        <input type="text" id="prog-schedule" placeholder="e.g. Every Sunday 9am, main gate" />
        <button type="submit" class="btn primary block" style="margin-top:16px;">Start & Notify Residents</button>
      </form>
    `;
    openModal();

    document.getElementById('program-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const title = document.getElementById('prog-title').value.trim();
      try {
        const ref = await db.collection('volunteer_programs').add({
          title,
          description: document.getElementById('prog-desc').value.trim(),
          schedule: document.getElementById('prog-schedule').value.trim(),
          status: 'active',
          participants: [],
          createdBy: currentUserProfile.name,
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });
        logAudit('volunteer_program', ref.id, 'create', `Program "${title}" started`);
        await broadcastNotification(`Volunteer Program: ${title}`, `A new volunteer program has started — open the Volunteers tab to join.`, 'volunteers');
        closeModal();
        loadVolunteers();
      } catch(err) {
        toast("Error starting program: " + err.message);
      }
    });
  };

  window.joinProgram = async function(id) {
    const p = volunteersList.find(item => item.id === id);
    if (!p || p.status === 'closed') return;
    try {
      const snap = await db.collection('volunteer_programs').doc(id).get();
      const cur = snap.exists ? (snap.data().participants || []) : [];
      if (cur.some(x => x.uid === auth.currentUser.uid)) { loadVolunteers(); return; }
      cur.push({
        uid: auth.currentUser.uid,
        name: currentUserProfile.name,
        house: currentUserProfile.house || '',
        phone: currentUserProfile.phone || '',
        joinedAt: new Date().toISOString()
      });
      await db.collection('volunteer_programs').doc(id).update({ participants: cur });
      logAudit('volunteer_program', id, 'update', `${currentUserProfile.name} joined "${p.title}"`);
      await notifyAdmins("New Volunteer", `${currentUserProfile.name} (${currentUserProfile.house || 'N/A'}) joined "${p.title}".`, 'info');
      loadVolunteers();
    } catch(err) {
      toast("Error joining program: " + err.message);
    }
  };

  window.leaveProgram = async function(id) {
    const p = volunteersList.find(item => item.id === id);
    if (!p) return;
    if (!(await confirmSheet({ title: 'Leave this program?', body: p.title, okLabel: 'Leave', danger: true }))) return;
    try {
      const snap = await db.collection('volunteer_programs').doc(id).get();
      const cur = (snap.exists ? (snap.data().participants || []) : []).filter(x => x.uid !== auth.currentUser.uid);
      await db.collection('volunteer_programs').doc(id).update({ participants: cur });
      logAudit('volunteer_program', id, 'update', `${currentUserProfile.name} left "${p.title}"`);
      loadVolunteers();
    } catch(err) {
      toast("Error leaving program: " + err.message);
    }
  };

  window.closeProgram = async function(id) {
    const p = volunteersList.find(item => item.id === id);
    if (!p || currentUserProfile.role !== 'admin') return;
    if (!(await confirmSheet({ title: 'Close this program?', body: `"${p.title}": residents will no longer be able to join.`, okLabel: 'Close program', danger: true }))) return;
    try {
      await db.collection('volunteer_programs').doc(id).update({ status: 'closed' });
      logAudit('volunteer_program', id, 'update', `Program "${p.title}" closed with ${(p.participants || []).length} volunteers`);
      loadVolunteers();
    } catch(err) {
      toast("Error closing program: " + err.message);
    }
  };

  window.archiveProgram = async function(id) {
    const p = volunteersList.find(item => item.id === id);
    if (!(await confirmSheet({ title: 'Remove this program?', body: `"${p ? p.title : ''}" will be archived (kept for audit).`, okLabel: 'Remove', danger: true }))) return;
    logAudit('volunteer_program', id, 'soft_delete', p ? `Program "${p.title}"` : '');
    archiveRecord('volunteer_programs', id, loadVolunteers);
  };

  // --- REPORTS ---
  let reportsData = null;

  function loadReportsData() {
    if (!db) return;
    const billsQuery = isStaff()
      ? db.collection('bills')
      : db.collection('bills').where('uid', '==', auth.currentUser.uid);
    Promise.all([
      billsQuery.get(),
      Promise.all(contribQueries()).then(mergeContribSnaps),
      db.collection('expenses').get()
    ]).then(([billsSnap, contribDocs, expSnap]) => {
      reportsData = {
        bills: billsSnap.docs.map(d => ({ id: d.id, ...d.data() })).filter(b => !b.isDeleted),
        contribs: contribDocs.filter(c => !c.isDeleted),
        expenses: expSnap.docs.map(d => ({ id: d.id, ...d.data() })).filter(x => !x.isDeleted)
      };
      renderReports();
    }).catch(e => {
      console.error("Error loading reports:", e);
      showLoadError('reports-body', e);
    });
  }

  function paymentRows() {
    // Unified payment list: paid bills + verified contributions
    const uid = auth.currentUser.uid;
    const staff = isStaff();
    const rows = [];
    reportsData.bills.filter(b => b.status === 'paid' && (staff || b.uid === uid)).forEach(b => rows.push({
      date: b.paidAt ? (toDate(b.paidAt) || new Date()).toISOString().slice(0,10) : '',
      name: b.name || '', house: b.house || '',
      type: 'Bill — ' + (b.category || 'Maintenance'),
      method: b.paymentMethod || '', amount: Number(b.amount || 0)
    }));
    reportsData.contribs.filter(c => c.status === 'verified' && (staff || c.uid === uid)).forEach(c => rows.push({
      date: c.paymentDate || (toDate(c.createdAt) ? toDate(c.createdAt).toISOString().slice(0,10) : ''),
      name: c.name || '', house: c.house || '',
      type: 'Fund — ' + (c.fundTitle || '') + (c.category ? ' (' + c.category + ')' : ''),
      method: c.paymentMethod || '', amount: Number(c.amount || 0)
    }));
    rows.sort((a, b) => String(b.date).localeCompare(String(a.date)));
    return rows;
  }

  let reportPeriod = null;
  window.setReportPeriod = function(p) { reportPeriod = p; renderReports(); };

  window.renderReports = function() {
    const el = document.getElementById('reports-body');
    if (!el || !reportsData) return;
    const staff = isStaff();

    let rows = paymentRows();
    const from = staff && document.getElementById('rep-from') ? document.getElementById('rep-from').value : '';
    const to = staff && document.getElementById('rep-to') ? document.getElementById('rep-to').value : '';
    const nameQ = staff && document.getElementById('rep-name') ? document.getElementById('rep-name').value.trim().toLowerCase() : '';
    const houseQ = staff && document.getElementById('rep-house') ? document.getElementById('rep-house').value.trim().toLowerCase() : '';
    if (from) rows = rows.filter(r => r.date >= from);
    if (to) rows = rows.filter(r => r.date <= to);
    if (nameQ) rows = rows.filter(r => r.name.toLowerCase().includes(nameQ));
    if (houseQ) rows = rows.filter(r => r.house.toLowerCase().includes(houseQ));

    // Monthly collections with running total
    const byMonth = {};
    paymentRows().forEach(r => {
      const m = String(r.date).slice(0, 7) || 'Unknown';
      byMonth[m] = (byMonth[m] || 0) + r.amount;
    });
    const months = Object.keys(byMonth).sort();
    let running = 0;
    const monthRows = months.map(m => { running += byMonth[m]; return { month: m, total: byMonth[m], running }; });

    // Fund utilization: contributions in vs expenses out, by category
    // Month chips: latest 3 months + year to date
    const now = new Date();
    const chipMonths = [0, 1, 2].map(i => monthKey(new Date(now.getFullYear(), now.getMonth() - i, 1)));
    const period = reportPeriod || 'ytd';
    const inPeriod = dateStr => {
      const s = String(dateStr || '');
      return period === 'ytd' ? s.slice(0, 4) === String(now.getFullYear()) : s.slice(0, 7) === period;
    };
    const collectedByCat = {};
    reportsData.contribs.filter(c => c.status === 'verified' && inPeriod(c.paymentDate || isoDate(c.createdAt))).forEach(c => {
      const cat = c.category || 'Other';
      collectedByCat[cat] = (collectedByCat[cat] || 0) + Number(c.amount || 0);
    });
    const spentByCat = {};
    reportsData.expenses.filter(x => inPeriod(x.expenseDate || isoDate(x.createdAt))).forEach(x => {
      const cat = x.category || 'Other';
      spentByCat[cat] = (spentByCat[cat] || 0) + Number(x.amount || 0);
    });
    const utilCats = [...new Set([...Object.keys(collectedByCat), ...Object.keys(spentByCat)])].sort();

    const sumObj = o => Object.values(o).reduce((s, v) => s + v, 0);
    el.innerHTML = `
      <div class="chip-row">
        ${chipMonths.map(k => `<button class="chip ${period === k ? 'active' : ''}" onclick="setReportPeriod('${k}')">${escapeHtml(MONTHS_SHORT[Number(k.slice(5)) - 1] + ' ' + k.slice(0, 4))}</button>`).join('')}
        <button class="chip ${period === 'ytd' ? 'active' : ''}" onclick="setReportPeriod('ytd')">Year to date</button>
      </div>
      <div class="card" style="cursor:default;">
        <div style="display:flex; justify-content:space-between; align-items:center; gap:8px; margin-bottom:8px;">
          <div style="font-weight:700; font-size:15px;">Fund utilization by category</div>
          <button class="btn sm secondary" onclick="exportReportPDF()">${icon('file')} PDF</button>
        </div>
        <div style="font-size:13px; color:var(--text-faint); margin-bottom:8px;">${period === 'ytd' ? 'Year to date' : escapeHtml(monthLabel(period))} · ${staff ? 'verified contributions in, expenses out' : 'category totals only, no names'} · PKR</div>
        ${utilCats.length ? `
          <div class="table-wrap"><table class="rep">
            <thead><tr><th>Category</th><th class="r">In</th><th class="r">Out</th></tr></thead>
            <tbody>
              ${utilCats.map(cat => `<tr><td>${escapeHtml(cat)}</td><td class="r" style="color:var(--success);">${(collectedByCat[cat] || 0).toLocaleString('en-PK')}</td><td class="r" style="color:var(--danger);">${(spentByCat[cat] || 0).toLocaleString('en-PK')}</td></tr>`).join('')}
              <tr style="font-weight:800;"><td>Total</td><td class="r">${sumObj(collectedByCat).toLocaleString('en-PK')}</td><td class="r">${sumObj(spentByCat).toLocaleString('en-PK')}</td></tr>
            </tbody>
          </table></div>
        ` : '<div style="text-align:center; color:var(--text-muted); padding:10px 0;">No fund activity in this period.</div>'}
      </div>

      <div class="section-title" style="font-size:15px; margin-top:18px;">${staff ? 'Payments' : 'My Payments'} (${rows.length})</div>
      ${rows.length ? rows.slice(0, 100).map(r => `
        <div class="card" style="cursor:default; padding:12px 14px;">
          <div style="display:flex; justify-content:space-between; align-items:center;">
            <span style="font-size:14px; font-weight:700;">${staff ? escapeHtml(r.name) + ' · <span class="nowrap">' + escapeHtml(houseLabel(r.house)) + '</span>' : escapeHtml(r.type)}</span>
            <span class="amount" style="color:var(--success);">${formatMoney(r.amount)}</span>
          </div>
          <div style="font-size:13px; color:var(--text-faint);">${escapeHtml(formatDate(r.date))}${staff ? ' · ' + escapeHtml(r.type) : ''}${r.method ? ' · ' + escapeHtml(r.method) : ''}</div>
        </div>
      `).join('') : '<div class="card" style="text-align:center; color:var(--text-muted); cursor:default;">No payments found.</div>'}

      <div class="section-title" style="font-size:15px; margin-top:18px;">Monthly Collections</div>
      ${monthRows.length ? `
        <div class="card" style="cursor:default;">
          <div class="table-wrap"><table class="rep">
            <thead><tr><th>Month</th><th class="r">Collected</th><th class="r">Running total</th></tr></thead>
            <tbody>
              ${monthRows.map(m => `<tr><td>${/^\d{4}-\d{2}$/.test(m.month) ? escapeHtml(monthLabel(m.month)) : escapeHtml(m.month)}</td><td class="r">${m.total.toLocaleString('en-PK')}</td><td class="r" style="color:var(--text-muted);">${m.running.toLocaleString('en-PK')}</td></tr>`).join('')}
            </tbody>
          </table></div>
        </div>
      ` : '<div class="card" style="text-align:center; color:var(--text-muted); cursor:default;">No collections yet.</div>'}

      <button class="btn secondary block" style="margin-top:14px;" onclick="exportReportPDF()">Export Report as PDF</button>
    `;
  };

  window.exportReportPDF = async function() {
    if (!reportsData) return;
    const staff = isStaff();
    try {
      const { jsPDF } = await ensureJsPDF();
      const doc = new jsPDF();
      doc.setFont("helvetica", "bold");
      doc.setFontSize(16);
      doc.text("Roshan Pakistan Housing Society", 105, 18, { align: "center" });
      doc.setFontSize(12);
      doc.setFont("helvetica", "normal");
      doc.text(staff ? "Society Finance Report" : "My Payments Report", 105, 26, { align: "center" });
      doc.setFontSize(9);
      doc.text(`Generated ${new Date().toLocaleString()} by ${currentUserProfile.name}`, 105, 32, { align: "center" });
      doc.line(15, 36, 195, 36);

      let y = 44;
      const line = (txt, bold) => {
        if (y > 280) { doc.addPage(); y = 20; }
        doc.setFont("helvetica", bold ? "bold" : "normal");
        doc.setFontSize(bold ? 11 : 9.5);
        doc.text(String(txt).slice(0, 110), 15, y);
        y += bold ? 8 : 6;
      };

      line(staff ? "Payments" : "My Payments", true);
      paymentRows().slice(0, 200).forEach(r => {
        line(`${r.date}  ${staff ? r.name + ' (' + (r.house || 'N/A') + ')  ' : ''}${r.type}  ${r.method ? '[' + r.method + ']  ' : ''}${formatMoney(r.amount)}`);
      });

      y += 4;
      line("Monthly Collections", true);
      const byMonth = {};
      paymentRows().forEach(r => { const m = String(r.date).slice(0, 7) || 'Unknown'; byMonth[m] = (byMonth[m] || 0) + r.amount; });
      let running = 0;
      Object.keys(byMonth).sort().forEach(m => { running += byMonth[m]; line(`${m}   ${formatMoney(byMonth[m])}   (running total ${formatMoney(running)})`); });

      y += 4;
      line("Fund Utilization by Category", true);
      const collectedByCat = {}, spentByCat = {};
      reportsData.contribs.filter(c => c.status === 'verified').forEach(c => { const cat = c.category || 'Other'; collectedByCat[cat] = (collectedByCat[cat] || 0) + Number(c.amount || 0); });
      reportsData.expenses.forEach(x => { const cat = x.category || 'Other'; spentByCat[cat] = (spentByCat[cat] || 0) + Number(x.amount || 0); });
      [...new Set([...Object.keys(collectedByCat), ...Object.keys(spentByCat)])].sort().forEach(cat => {
        line(`${cat}   collected ${formatMoney(collectedByCat[cat] || 0)}   spent ${formatMoney(spentByCat[cat] || 0)}`);
      });

      const fileName = staff ? 'RPHS_Finance_Report.pdf' : 'My_Payments_Report.pdf';
      doc.save(fileName);

      db.collection('report_exports').add({
        reportType: staff ? 'finance_report' : 'member_payments',
        generatedBy: currentUserProfile.name,
        generatedByUid: auth.currentUser.uid,
        role: currentUserProfile.role,
        fileName,
        generatedAt: firebase.firestore.FieldValue.serverTimestamp()
      }).catch(e => console.error("Export log failed:", e));
      logAudit('report', '', 'create', `PDF export: ${fileName}`);
    } catch(err) {
      toast("Error generating report PDF: " + err.message);
    }
  };

  // --- BOARD DECISIONS & 3-OF-5 VOTING ---
  function loadDecisions() {
    if (!db) return;
    db.collection('decisions').get().then(snapshot => {
      decisionsList = sortDecisions(snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })).filter(d => !d.isDeleted));
      renderDecisionsList();
    }).catch(e => { console.error("Error loading decisions:", e); showLoadError('decisions-list', e); });
  }

  // Newest first, each with a short code (DEC-001 is the oldest item).
  function sortDecisions(list) {
    const time = x => { const d = toDate(x.createdAt); return d ? d.getTime() : 0; };
    const asc = list.slice().sort((a, b) => time(a) - time(b));
    asc.forEach((d, i) => { d.code = 'DEC-' + String(i + 1).padStart(3, '0'); });
    return asc.reverse();
  }

  function decisionCard(d) {
    const votes = d.votes || [];
    const endorse = votes.filter(v => v.choice === 'endorse').length;
    const oppose = votes.filter(v => v.choice === 'reject').length;
    const need = d.requiredVotes || 3;
    const seats = Math.max(5, votes.length);
    const notVoted = Math.max(0, seats - votes.length);
    const myVote = votes.find(v => v.uid === auth.currentUser.uid);
    const status = d.status || 'pending';
    const pill = status === 'approved' ? '<span class="badge paid">Approved</span>'
      : status === 'rejected' ? '<span class="badge overdue">Rejected</span>'
      : `<span class="badge pending">${Math.min(endorse, need)} of ${need} to pass</span>`;
    const segs = votes.filter(v => v.choice === 'endorse').map(() => '<i class="y"></i>')
      .concat(votes.filter(v => v.choice === 'reject').map(() => '<i class="n"></i>'))
      .concat(Array(notVoted).fill('<i></i>')).slice(0, seats).join('');
    const isAdmin = currentUserProfile.role === 'admin';
    return `
      <div class="card" style="cursor:default;">
        <div style="display:flex; justify-content:space-between; align-items:center; gap:8px; margin-bottom:6px;">
          <span class="ticket-no">${escapeHtml(d.code || 'DEC')}</span>
          <span style="display:flex; align-items:center; gap:6px;">${pill}${isAdmin ? `<button class="dots-btn" onclick="openDecisionMenu('${d.id}')" aria-label="More actions">${icon('dots')}</button>` : ''}</span>
        </div>
        <div style="font-weight:700; font-size:16px;">${escapeHtml(d.title || '')}</div>
        ${d.description ? `<div style="font-size:14px; color:var(--text-muted); margin-top:4px; white-space:pre-wrap; line-height:1.5;">${escapeHtml(d.description)}</div>` : ''}
        <div class="vote-bar" style="grid-template-columns:repeat(${seats},1fr);" aria-label="${endorse} endorse, ${oppose} oppose, ${notVoted} not voted">${segs}</div>
        <div style="font-size:13px; color:var(--text-faint);">${endorse} endorse · ${oppose} oppose · ${notVoted} not voted · ${escapeHtml(d.uploadedBy || 'Admin')} · ${escapeHtml(formatDate(d.createdAt))}</div>
        ${votes.length ? `<details style="margin-top:6px;"><summary style="font-size:13px; color:var(--accent-2); cursor:pointer;">Who voted</summary><div style="font-size:13px; color:var(--text-muted); margin-top:4px; line-height:1.6;">${votes.map(v => `${escapeHtml(v.name)}: ${v.choice === 'endorse' ? 'endorsed' : 'opposed'}${v.reason ? ' (' + escapeHtml(v.reason) + ')' : ''}`).join('<br/>')}</div></details>` : ''}
        ${status === 'pending' && isBoard() && !myVote ? `
          <div style="display:flex; gap:8px; margin-top:12px;">
            <button class="btn sm primary block" onclick="castVote('${d.id}', 'endorse')">${icon('check')} Endorse</button>
            <button class="btn sm secondary block" onclick="castVote('${d.id}', 'reject')">Oppose…</button>
          </div>
        ` : ''}
        ${myVote ? `<div style="font-size:14px; font-weight:600; color:${myVote.choice === 'endorse' ? 'var(--success)' : 'var(--danger)'}; margin-top:10px;">You ${myVote.choice === 'endorse' ? 'endorsed' : 'opposed'} this.</div>` : ''}
        ${d.finalizedAt ? `<div style="font-size:13px; color:var(--text-faint); margin-top:4px;">Decided ${escapeHtml(formatDate(d.finalizedAt))}</div>` : ''}
      </div>
    `;
  }

  function renderDecisionsList() {
    const el = document.getElementById('decisions-list');
    if (!el) return;
    if (!decisionsList.length) {
      el.innerHTML = '<div class="card" style="text-align:center; color:var(--text-muted);">No items have been queued for a Board vote yet.</div>';
      return;
    }
    const open = decisionsList.filter(d => (d.status || 'pending') === 'pending');
    const decided = decisionsList.filter(d => (d.status || 'pending') !== 'pending');
    el.innerHTML = `
      <div class="group-h">Open · ${open.length}</div>
      ${open.length ? open.map(decisionCard).join('') : '<div class="card" style="cursor:default; color:var(--text-muted);">Nothing is waiting for a vote.</div>'}
      ${decided.length ? `<div class="group-h">Decided · ${decided.length}</div>${decided.map(decisionCard).join('')}` : ''}
    `;
  }

  window.openDecisionMenu = function(id) {
    const d = decisionsList.find(x => x.id === id);
    if (!d) return;
    menuSheet(d.title, [{ label: 'Remove from queue', icon: 'trash', danger: true, run: () => archiveDecision(id) }]);
  };

  window.archiveDecision = async function(decisionId) {
    if (currentUserProfile.role !== 'admin') return;
    const d = decisionsList.find(item => item.id === decisionId);
    if (!d) return;
    if (!(await confirmSheet({ title: 'Remove from the Board queue?', body: `"${d.title || 'this item'}" will be archived.`, okLabel: 'Remove', danger: true }))) return;
    try {
      await db.collection('decisions').doc(decisionId).update({
        isDeleted: true,
        deletedAt: firebase.firestore.FieldValue.serverTimestamp(),
        deletedBy: currentUserProfile.name
      });
      logAudit('decision', decisionId, 'archive', `Removed from Board queue: ${d.title || ''}`);
      loadDecisions();
    } catch(err) {
      toast("Error removing item: " + err.message);
    }
  };

  window.openCreateDecisionModal = function() {
    if (currentUserProfile.role !== 'admin') return;
    document.getElementById('modal-body').innerHTML = `
      <div style="font-family:var(--font-display); font-size:20px; font-weight:600; margin-bottom:12px;">Queue Item for Board Vote</div>
      <form id="decision-form">
        <label>Type</label>
        <select id="dec-type" required>
          <option value="opinion">Opinion / General Decision</option>
          <option value="expense">Expense Approval</option>
          <option value="account">Account Details Change</option>
          <option value="board_change">Board Membership Change</option>
        </select>
        <label>Title</label>
        <input type="text" id="dec-title" placeholder="e.g. Approve gate repair expense" required />
        <label>Description — what is being decided?</label>
        <textarea id="dec-desc" placeholder="Full details for the Board..." required></textarea>
        <button type="submit" class="btn primary block" style="margin-top:16px;">Send to Board (3-of-5 vote)</button>
      </form>
    `;
    openModal();

    document.getElementById('decision-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      try {
        await createDecision({

  };

  async function createDecision(data) {
    const ref = await db.collection('decisions').add({
      ...data,
      requiredVotes: 3,
      status: 'pending',
      votes: [],
      uploadedBy: currentUserProfile.name,
      uploadedByUid: auth.currentUser.uid,
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    logAudit('decision', ref.id, 'create', `${data.type}: ${data.title}`);
    await notifyBoardMembers("New Item for Board Vote", `"${data.title}" has been queued for your vote. Open Board Votes to endorse or oppose.`);
    return ref;
  }

  async function notifyBoardMembers(title, body) {
    try {
      const [roleSnap, flagSnap] = await Promise.all([
        db.collection('users').where('role', '==', 'board').get(),
        db.collection('users').where('boardMember', '==', true).get()
      ]);
      const ids = [...new Set(roleSnap.docs.concat(flagSnap.docs).map(d => d.id))];
      await Promise.all(ids.map(id => sendNotification(id, title, body, 'info')));
    } catch(e) {
      console.error("Error notifying board:", e);
    }
  }

  window.castVote = async function(decisionId, choice) {
    if (!isBoard()) return;
    const d = decisionsList.find(item => item.id === decisionId);
    if (!d || d.status !== 'pending') return;
    const votes = d.votes || [];
    if (votes.find(v => v.uid === auth.currentUser.uid)) { toast("You have already voted on this item."); return; }

    const reasonRequired = d.type === 'membership' || d.type === 'suspension';
    let reason = '';
    if (choice === 'reject' || reasonRequired) {
      reason = await promptSheet({
        title: choice === 'reject' ? 'Oppose this item?' : 'Endorse this item?',
        body: d.title || '',
        label: reasonRequired ? 'Reason (required)' : 'Reason the Board will see' + (choice === 'reject' ? '' : ' (optional)'),
        multiline: true,
        required: reasonRequired || choice === 'reject',
        okLabel: choice === 'reject' ? 'Oppose' : 'Endorse',
        danger: choice === 'reject'
      });
      if (reason === null) return;
    } else if (!(await confirmSheet({ title: 'Endorse this item?', body: d.title || '', okLabel: 'Endorse' }))) {
      return;
    }

    const newVotes = [...votes, {
      uid: auth.currentUser.uid,
      name: currentUserProfile.name,
      choice,
      reason,
      votedAt: new Date().toISOString()
    }];

    const endorse = newVotes.filter(v => v.choice === 'endorse').length;
    const oppose = newVotes.filter(v => v.choice === 'reject').length;
    const quorum = d.requiredVotes || 3;
    const finalStatus = endorse >= quorum ? 'approved' : (oppose >= quorum ? 'rejected' : 'pending');

    try {
      const update = { votes: newVotes };
      if (finalStatus !== 'pending') {
        update.status = finalStatus;
        update.finalizedAt = firebase.firestore.FieldValue.serverTimestamp();
      }
      await db.collection('decisions').doc(decisionId).update(update);
      logAudit('decision', decisionId, 'update', `${currentUserProfile.name} voted ${choice}${finalStatus !== 'pending' ? ' — auto-tagged ' + finalStatus + ' at quorum' : ''}`);
      if (finalStatus !== 'pending') {
        await applyDecisionOutcome({ ...d, votes: newVotes }, finalStatus);
      }
      toast('Vote recorded');
      if (activeTab === 'dashboard') render(); else loadDecisions();
    } catch(err) {
      toast("Error casting vote: " + err.message);
    }
  };

  async function applyDecisionOutcome(d, finalStatus) {
    const reasons = (d.votes || []).filter(v => v.reason).map(v => v.reason).join('; ');
    try {
      if (d.type === 'membership' && d.refUid) {
        if (finalStatus === 'approved') {
          await db.collection('users').doc(d.refUid).update({ approved: true, membershipStatus: 'approved', statusReason: reasons });
          await sendNotification(d.refUid, "Membership Approved", "The Board has approved your membership. Welcome to the society!", "success");
        } else {
          await db.collection('users').doc(d.refUid).update({ approved: false, membershipStatus: 'rejected', statusReason: reasons });
          await sendNotification(d.refUid, "Membership Decision", `The Board did not approve your membership.${reasons ? ' Reason: ' + reasons : ''}`, "error");
        }
      } else if (d.type === 'suspension' && d.refUid) {
        if (finalStatus === 'approved') {
          await db.collection('users').doc(d.refUid).update({ suspended: true, membershipStatus: 'suspended', statusReason: reasons });
          await sendNotification(d.refUid, "Membership Suspended", `Your membership has been suspended by the Board.${reasons ? ' Reason: ' + reasons : ''}`, "error");
        }
      }
      logAudit('decision', d.id, 'update', `Outcome applied: ${d.type} ${finalStatus}`);
      await notifyAdmins(`Board Decision Final: ${d.title}`, `The Board has ${finalStatus} "${d.title}" (${(d.votes || []).length} votes cast).`, finalStatus === 'approved' ? 'success' : 'error');
    } catch(e) {
      console.error("Error applying decision outcome:", e);
    }
  }

  // --- AUDIT & ARCHIVE (STAFF) ---
  function loadArchiveAndAudit() {
    if (!db || !isStaff()) return;
    const archived = c => db.collection(c).where('isDeleted', '==', true).get();
    Promise.all([
      archived('bills'),
      archived('funds'),
      archived('tickets'),
      archived('expenses'),
      db.collection('audit_log').orderBy('timestamp', 'desc').limit(100).get()
    ]).then(([bills, funds, tickets, expenses, audit]) => {
      archivedRecords = [];
      const collect = (snap, type, label) => snap.docs
        .map(doc => ({ id: doc.id, ...doc.data() }))
        .forEach(x => archivedRecords.push({ type, label: label(x), record: x }));
      collect(bills, 'bills', b => `Bill ${b.billNo || b.id} — ${b.name || ''} ${formatMoney(b.amount)}`);
      collect(funds, 'funds', f => `Fund "${f.title || ''}"`);
      collect(tickets, 'tickets', t => `Complaint ${t.ticketNo || t.id} — ${t.subject || ''}`);
      collect(expenses, 'expenses', x => `Expense ${x.category || ''} ${formatMoney(x.amount)}`);

      auditList = audit.docs
        .map(doc => ({ id: doc.id, ...doc.data() }))
        .sort((a, b) => {
          const da = toDate(a.timestamp), dbb = toDate(b.timestamp);
          return (dbb ? dbb.getTime() : 0) - (da ? da.getTime() : 0);
        })
        .slice(0, 100);
      renderArchiveAndAudit();
    }).catch(e => { console.error("Error loading archive/audit:", e); showLoadError('archive-list', e); showLoadError('audit-list', e); });
  }

  const AUDIT_FILTERS = [['all', 'All'], ['money', 'Money'], ['members', 'Members'], ['board', 'Board'], ['notices', 'Notices']];
  const AUDIT_GROUPS = {
    money: ['bill', 'bills', 'fund', 'funds', 'contribution', 'expense', 'expenses', 'transfer', 'settings', 'report'],
    members: ['member', 'user', 'users'],
    board: ['decision'],
    notices: ['announcement', 'poll', 'volunteer_program', 'ticket', 'tickets']
  };
  const AUDIT_DOT = { money: 'var(--success)', members: 'var(--info)', board: 'var(--accent)', notices: '#B37FEB' };
  let auditFilter = 'all';
  function auditGroup(type) {
    return Object.keys(AUDIT_GROUPS).find(g => AUDIT_GROUPS[g].includes(String(type || ''))) || 'notices';
  }
  window.setAuditFilter = function(k) {
    auditFilter = k;
    delete pageShown['audit'];
    document.querySelectorAll('[data-audit]').forEach(c => c.classList.toggle('active', c.getAttribute('data-audit') === k));
    renderArchiveAndAudit();
  };
  const AUDIT_VERB = { create: 'Created', update: 'Updated', archive: 'Removed', restore: 'Restored', delete: 'Deleted', notify: 'Reminder sent' };

  function renderArchiveAndAudit() {
    const archEl = document.getElementById('archive-list');
    const audEl = document.getElementById('audit-list');
    if (archEl) {
      archEl.innerHTML = archivedRecords.length ? archivedRecords.map(a => `
        <div class="card" style="cursor:default;">
          <div style="font-size:13.5px; font-weight:700; margin-bottom:4px;">${escapeHtml(a.label)}</div>
          <div style="font-size:13px; color:var(--text-faint);">Archived ${escapeHtml(formatDate(a.record.deletedAt))} by ${escapeHtml(a.record.deletedBy || 'Management')}</div>
          ${currentUserProfile.role === 'admin' || isSuperAdmin() ? `<button class="btn sm secondary" style="margin-top:8px;" onclick="restoreRecord('${a.type}', '${a.record.id}')">Restore</button>` : ''}
        </div>
      `).join('') : '<div class="card" style="text-align:center; color:var(--text-muted); cursor:default;">No archived records.</div>';
    }
    if (audEl) {
      const shown = auditList.filter(a => auditFilter === 'all' || auditGroup(a.entityType) === auditFilter);
      audEl.innerHTML = shown.length ? `
        <div class="card" style="cursor:default; padding:4px 14px;">
          ${pageOf('audit', shown, renderArchiveAndAudit).map(a => `
            <div style="display:flex; gap:10px; padding:10px 0; border-bottom:1px solid var(--border-soft);">
              <span style="width:8px; height:8px; border-radius:50%; background:${AUDIT_DOT[auditGroup(a.entityType)]}; flex:none; margin-top:7px;"></span>
              <div style="min-width:0;">
                <div style="font-size:14px;"><b>${escapeHtml(AUDIT_VERB[a.action] || a.action || '')}</b> <span style="color:var(--text-muted);">${escapeHtml(String(a.entityType || '').replace(/_/g, ' '))}</span></div>
                <div style="font-size:14px; overflow-wrap:anywhere;">${escapeHtml(a.details || '')}</div>
                <div style="font-size:13px; color:var(--text-faint);">${escapeHtml(a.performedBy || '')}${a.role ? ' (' + escapeHtml(a.role) + ')' : ''} · ${escapeHtml(formatDate(a.timestamp))}</div>
              </div>
            </div>
          `).join('')}
          ${showMoreButton('audit', shown.length)}
        </div>
      ` : `<div class="card" style="text-align:center; color:var(--text-muted); cursor:default;">${auditList.length ? 'No changes of this kind yet.' : 'No audit entries yet.'}</div>`;
    }
  }

  window.restoreRecord = async function(collection, id) {
    if (currentUserProfile.role !== 'admin' && !isSuperAdmin()) return;
    if (!(await confirmSheet({ title: 'Restore this record?', body: 'It will reappear in its normal list.', okLabel: 'Restore' }))) return;
    try {
      await db.collection(collection).doc(id).update({ isDeleted: false, restoredAt: firebase.firestore.FieldValue.serverTimestamp(), restoredBy: currentUserProfile.name });
      logAudit(collection, id, 'restore', 'Record restored from archive');
      toast('Record restored');
      loadArchiveAndAudit();
    } catch(err) {
      toast("Error restoring record: " + err.message);
    }
  };

  // --- RESIDENTS DIRECTORY (ADMIN) ---
  function loadAllResidents() {
    if (!db) return;
    db.collection('users').where('approved', '==', true).get().then(snapshot => {
      allResidents = snapshot.docs.map(doc => ({ uid: doc.id, ...doc.data() }));
      renderResidentsList();
    }).catch(e => console.error("Error loading residents:", e));
  }

  window.setResidentSearch = function(value) {
    residentSearch = String(value || '').trim().toLowerCase();
    delete pageShown['residents'];
    renderResidentsList();
  };

  function filteredResidents() {
    const sorted = allResidents.slice().sort((a, b) =>
      String(a.house || '').localeCompare(String(b.house || ''), undefined, { numeric: true, sensitivity: 'base' })
      || String(a.name || '').localeCompare(String(b.name || '')));
    if (!residentSearch) return sorted;
    return sorted.filter(r => [r.name, r.house, r.phone, r.cnic, r.email, r.role].map(v => String(v || '').toLowerCase()).join(' ').includes(residentSearch));
  }

  window.exportResidentsCSV = function() {
    if (!isStaff()) return;
    const rows = filteredResidents().map(r => [
      r.name, r.house, r.role, r.phone, r.cnic, r.email, r.bloodGroup, r.occupancyType, r.familyDetails,
      r.suspended ? 'Suspended' : 'Active', r.billExempt ? 'Exempt' : 'Included', isoDate(r.createdAt)
    ]);
    if (!rows.length) return toast("No residents to export.");
    downloadCSV(`RPHS_Residents_${dateStamp()}.csv`,
      ['Name', 'House', 'Role', 'Phone', 'CNIC', 'Email', 'Blood Group', 'Occupancy', 'Family', 'Status', 'Recurring Bill', 'Registered'],
      rows, 'residents_csv');
  };

    if (!list.length) {
      listEl.innerHTML = `<div class="card" style="text-align:center; color:var(--text-muted);">${allResidents.length ? 'No residents match your search.' : 'No approved residents found.'}</div>`;

          <div style="flex:1; min-width:0;">
            <div style="font-weight:700; font-size:15px;">${escapeHtml(r.name)}</div>

        </div>

        ${r.billExempt ? '<div style="font-size:13px; color:var(--accent-2); margin-top:4px;">Exempt from recurring bill' + (r.billExemptReason ? ': ' + escapeHtml(r.billExemptReason) : '') + '</div>' : ''}

  window.openResidentMenu = function(uid) {
    const r = allResidents.find(x => x.uid === uid);
    if (!r) return;
    const isAdmin = currentUserProfile.role === 'admin';
    const manage = canSuspend() && r.role === 'resident';
    menuSheet(r.name, [

      isAdmin && { label: 'Biodata card (PDF)', icon: 'file', run: () => downloadResidentPDF(uid) },
      isAdmin && { label: 'Edit details', icon: 'edit', run: () => openEditResidentModal(uid) },
      isAdmin && r.role === 'resident' && { label: r.billExempt ? 'Include in recurring bill' : 'Exempt from recurring bill', icon: 'receipt', run: () => setBillExempt(uid, !r.billExempt) },
      manage && (r.suspended
        ? { label: 'Lift suspension', icon: 'usercheck', run: () => unsuspendResident(uid) }
        : { label: 'Suspend membership', icon: 'x', danger: true, run: () => suspendResident(uid) })
    ]);
  };

  window.openResidentProfile = function(uid) {
    const r = allResidents.find(x => x.uid === uid);
    if (!r) return;
    const row = (k, v) => `<div style="display:flex; justify-content:space-between; gap:12px; padding:9px 0; border-top:1px solid var(--border);"><span style="color:var(--text-muted);">${k}</span><span style="font-weight:600; text-align:right; overflow-wrap:anywhere;">${escapeHtml(v || 'N/A')}</span></div>`;
    document.getElementById('modal-body').innerHTML = `
      <div style="display:flex; align-items:center; gap:12px; margin-bottom:12px;">
        <span class="picker-avatar" style="width:46px; height:46px;">${escapeHtml(initialsOf2(r.name))}</span>
        <div><div style="font-family:var(--font-display); font-size:20px; font-weight:600;">${escapeHtml(r.name)}</div>
        <div style="color:var(--text-muted); font-size:14px;">${escapeHtml(houseLabel(r.house))}${r.suspended ? ' · <span style="color:var(--danger);">Suspended</span>' : ''}</div></div>
      </div>
      ${row('Phone', r.phone)}${row('Email', r.email)}${row('CNIC', r.cnic)}${row('Blood group', r.bloodGroup)}${row('Owner / tenant', r.occupancyType)}
      ${r.statusReason ? row('Status note', r.statusReason) : ''}
    `;
    openModal();
  };

  window.openEditResidentModal = function(uid) {
    const r = allResidents.find(x => x.uid === uid);
    if (!r || currentUserProfile.role !== 'admin') return;
    document.getElementById('modal-body').innerHTML = `
      <div style="font-family:var(--font-display); font-size:20px; font-weight:600; margin-bottom:12px;">Edit details</div>
      <form id="edit-res-form">
        <label for="er-name">Full name</label>
        <input type="text" id="er-name" value="${escapeHtml(r.name || '')}" required />
        <label for="er-house">House</label>
        <input type="text" id="er-house" value="${escapeHtml(r.house || '')}" required />
        <label for="er-phone">Phone</label>
        <input type="tel" id="er-phone" value="${escapeHtml(r.phone || '')}" />
        <button type="submit" class="btn primary block" style="margin-top:16px;">Save details</button>
      </form>
    `;
    openModal();
    document.getElementById('edit-res-form').addEventListener('submit', async (ev) => {
      ev.preventDefault();
      const data = {
        name: document.getElementById('er-name').value.trim(),
        house: document.getElementById('er-house').value.trim(),
        phone: document.getElementById('er-phone').value.trim()
      };
      try {
        await db.collection('users').doc(uid).update(data);
        logAudit('member', uid, 'update', `Details edited: ${data.name} (${data.house})`);
        Object.assign(r, data);
        closeModal();
        toast('Details saved');
        renderResidentsList();
      } catch (err) {
        toast('Error saving details: ' + err.message);
      }
    });
  };

  window.downloadResidentPDF = async function(uid) {
    const r = allResidents.find(item => item.uid === uid);
    if (!r) return;

    try {
      const { jsPDF } = await ensureJsPDF();
      const doc = new jsPDF();

      doc.setFont("helvetica", "bold");
      doc.setFontSize(18);
      doc.text("Roshan Pakistan Housing Society", 105, 20, { align: "center" });

      doc.setFontSize(12);
      doc.setFont("helvetica", "normal");
      doc.text("Official Resident Biodata Record", 105, 28, { align: "center" });

      doc.line(20, 35, 190, 35);

      let y = 48;
      const addRow = (label, val) => {
        doc.setFont("helvetica", "bold");
        doc.text(label + ":", 25, y);
        doc.setFont("helvetica", "normal");
        doc.text(String(val || 'N/A'), 75, y);
        y += 10;
      };

      addRow("Full Name", r.name);
      addRow("House / Plot", r.house);
      addRow("CNIC Number", r.cnic);
      addRow("Phone Number", r.phone);
      addRow("Email Address", r.email);
      addRow("Blood Group", r.bloodGroup);
      addRow("Occupancy Type", r.occupancyType);

      y += 5;
      doc.setFont("helvetica", "bold");
      doc.text("Family Members / Dependents:", 25, y);
      y += 8;
      doc.setFont("helvetica", "normal");
      const splitFamily = doc.splitTextToSize(r.familyDetails || 'N/A', 160);
      doc.text(splitFamily, 25, y);

      doc.save(`Resident_${(r.house || 'Biodata').replace(/\s+/g, '_')}.pdf`);
    } catch(err) {
      toast("Error generating PDF: " + err.message);
    }
  };

  // --- APPROVALS ---
  function loadPendingResidents() {
    if (!db) return;
    db.collection('users').where('approved', '==', false).get().then(snapshot => {
      pendingResidents = snapshot.docs
        .map(doc => ({ uid: doc.id, ...doc.data() }))
        .filter(r => r.membershipStatus !== 'rejected');
      renderApprovalsList();
    }).catch(e => console.error("Error loading approvals:", e));
  }

  function renderApprovalsList() {
    const listEl = document.getElementById('approvals-list');
    if (!listEl) return;
    if (!pendingResidents.length) {
      listEl.innerHTML = '<div class="card" style="text-align:center; color:var(--text-muted);">No pending registration requests.</div>';
      return;
    }

    listEl.innerHTML = pendingResidents.map(r => `
      <div class="card" style="cursor:default;">
        <div style="display:flex; align-items:center; gap:12px;">
          <span class="picker-avatar" style="flex:none;">${escapeHtml(initialsOf2(r.name))}</span>
          <div style="min-width:0;">
            <div style="font-weight:700; font-size:15px;">${escapeHtml(r.name)}</div>
            <div style="font-size:13px; color:var(--text-muted);"><span class="nowrap">${escapeHtml(houseLabel(r.house))}</span>${r.occupancyType ? ' · ' + escapeHtml(r.occupancyType) : ''}${r.phone ? ' · <span class="nowrap">' + escapeHtml(r.phone) + '</span>' : ''}</div>
          </div>
        </div>
        <div style="font-size:13px; color:var(--text-faint); margin-top:6px;">${escapeHtml(r.email || '')}${r.biodataSubmitted ? '' : ' · biodata not submitted yet'}</div>
        <div style="display:flex; gap:10px; margin-top:12px;">
          <button class="btn sm primary block" onclick="approveUser('${r.uid}')">Approve</button>
          <button class="btn sm secondary block" onclick="rejectUser('${r.uid}')">Decline…</button>
        </div>
      </div>
    `).join('');
  }

  window.approveUser = async function(uid) {
    const r = pendingResidents.find(item => item.uid === uid);
    try {
      await db.collection('users').doc(uid).update({ approved: true, membershipStatus: 'approved', statusReason: '' });
      logAudit('member', uid, 'update', `Membership approved: ${r ? r.name : uid}`);
      await sendNotification(uid, "Account Approved", "Your account has been approved! You can now access your portal.", "success");
      toast('Resident approved and notified');
      loadPendingResidents();
    } catch(e) { toast("Error approving user: " + e.message); }
  };

  window.rejectUser = async function(uid) {
    const r = pendingResidents.find(item => item.uid === uid);
    try {
      const reason = await promptSheet({ title: `Decline ${r ? r.name : 'this application'}?`, body: 'They will be told their application was not approved.', label: 'Reason they will see (optional)', multiline: true, okLabel: 'Decline', danger: true });
      if (reason === null) return;
      const note = reason.trim();
      await db.collection('users').doc(uid).update({ approved: false, membershipStatus: 'rejected', statusReason: note });
      logAudit('member', uid, 'update', `Membership rejected: ${r ? r.name : uid}${note ? ' — ' + note : ''}`);
      await sendNotification(uid, "Membership Decision", `Your membership application was not approved.${note ? ' Reason: ' + note : ''}`, "error");
      loadPendingResidents();
    } catch(e) { toast("Error rejecting user: " + e.message); }
  };

  function canSuspend() {
    return currentUserProfile && (currentUserProfile.role === 'admin' || isSuperAdmin());
  }

  window.suspendResident = async function(uid) {
    if (!canSuspend()) return;
    const r = allResidents.find(item => item.uid === uid);
    if (!r) return;
    const input = await promptSheet({ title: `Suspend ${r.name}?`, body: 'They will be signed out and see the reason below. You can lift it later.', label: 'Reason they will see (optional)', multiline: true, okLabel: 'Suspend membership', danger: true });
    if (input === null) return;
    const reason = input.trim();
    try {
      await db.collection('users').doc(uid).update({ suspended: true, membershipStatus: 'suspended', statusReason: reason });
      logAudit('member', uid, 'update', `Membership suspended: ${r.name}${reason ? ' — ' + reason : ''}`);
      await sendNotification(uid, "Membership Suspended", `Your membership has been suspended by the management.${reason ? ' Reason: ' + reason : ''}`, "error");
      toast('Membership suspended');
      loadAllResidents();
    } catch(e) { toast("Error suspending resident: " + e.message); }
  };

  window.unsuspendResident = async function(uid) {
    if (!canSuspend()) return;
    const r = allResidents.find(item => item.uid === uid);
    if (!r || !(await confirmSheet({ title: `Lift ${r.name}'s suspension?`, body: 'They can sign in and use the app again.', okLabel: 'Lift suspension' }))) return;
    try {
      await db.collection('users').doc(uid).update({ suspended: false, membershipStatus: 'approved' });
      logAudit('member', uid, 'update', `Suspension lifted: ${r.name}`);
      await sendNotification(uid, "Suspension Lifted", "Your membership suspension has been lifted. Welcome back!", "success");
      toast('Suspension lifted');
      loadAllResidents();
    } catch(e) { toast("Error: " + e.message); }
  };

  // Exempt members are skipped by the 1st-of-month recurring bill; manual bills still work.
  window.setBillExempt = async function(uid, exempt) {
    if (!canSuspend()) return;
    const r = allResidents.find(item => item.uid === uid);
    if (!r) return;
    let reason = '';
    if (exempt) {
      const input = await promptSheet({ title: `Stop billing ${r.name}?`, body: 'They are left out of the recurring monthly bill until you include them again.', label: 'Reason (optional)', multiline: true, okLabel: 'Exempt from bill' });
      if (input === null) return;
      reason = input.trim();
    } else if (!(await confirmSheet({ title: `Bill ${r.name} again?`, body: 'They are included in the recurring monthly bill from next month.', okLabel: 'Include again' }))) {
      return;
    }
    try {
      await db.collection('users').doc(uid).update({ billExempt: exempt, billExemptReason: exempt ? reason : '' });
      logAudit('member', uid, 'update', exempt
        ? `Exempted from recurring bill: ${r.name}${reason ? ' — ' + reason : ''}`
        : `Included in recurring bill again: ${r.name}`);
      loadAllResidents();
    } catch(e) { toast("Error updating recurring bill exemption: " + e.message); }
  };

})();
</script>
</body>
</html>
