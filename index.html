  // --- SUBCOLLECTION NOTIFICATION SYSTEM ---
  // Every notification carries a category so the centre can filter by it and
  // residents can mute push for categories they don't care about (they still
  // appear in the centre). Emergency broadcasts are never muted.
  const NOTIF_CATEGORIES = [
    ['emergency', 'Emergency', '🚨'],
    ['bills', 'Bills & Payments', '💳'],
    ['notices', 'Announcements', '📢'],
    ['polls', 'Polls', '📊'],
    ['funds', 'Community Funds', '💰'],
    ['complaints', 'Complaints', '🛠️'],
    ['volunteers', 'Volunteers', '🤝'],
    ['membership', 'Membership', '👤'],
    ['general', 'Other', '🔔']
  ];
  const MUTABLE_CATEGORIES = ['bills', 'notices', 'polls', 'funds', 'complaints', 'volunteers'];

  function inferNotifCategory(title) {
    const t = String(title || '').toLowerCase();
    if (/emergency/.test(t)) return 'emergency';
    if (/bill|payment|maintenance|proof/.test(t)) return 'bills';
    if (/contribution|fund/.test(t)) return 'funds';
    if (/poll/.test(t)) return 'polls';
    if (/announcement|comment/.test(t)) return 'notices';
    if (/complaint|ticket/.test(t)) return 'complaints';
    if (/volunteer/.test(t)) return 'volunteers';
    if (/membership|account|suspension|approved/.test(t)) return 'membership';
    return 'general';
  }
  function notifCategory(n) { return n.category || inferNotifCategory(n.title); }
  function notifCategoryMeta(cat) {
    return NOTIF_CATEGORIES.find(c => c[0] === cat) || NOTIF_CATEGORIES[NOTIF_CATEGORIES.length - 1];
  }

  async function sendNotification(targetUid, title, body, type = 'info', category) {
    if (!db || !targetUid) return;
    try {
      await db.collection('users')
        .doc(targetUid)
        .collection('notifications')
        .add({
          title: title,
          body: body,
          text: body,
          type: type,
          category: category || inferNotifCategory(title),
          read: false,
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });
    } catch (err) {
      console.error("Targeted Notification failed:", err);
    }
  }

  async function broadcastNotification(title, body, category) {
    if (!db) return;
    try {
      const snap = await db.collection('users').where('approved', '==', true).get();
      const batchPromises = snap.docs.map(userDoc => sendNotification(userDoc.id, title, body, 'notice', category));
      await Promise.all(batchPromises);
    } catch (e) {
      console.error("Broadcast failed:", e);
    }
  }

  const NOTIF_LIMIT = 60;
  let notifFilter = 'all';
  let notifView = 'list'; // 'list' | 'settings'

  function notificationsQuery() {
    return db.collection('users').doc(auth.currentUser.uid).collection('notifications').orderBy('createdAt', 'desc').limit(NOTIF_LIMIT);
  }

  let notifsLoadedAt = 0;
  function loadNotifications(force) {
    if (!db || !auth.currentUser) return;
    if (!force && Date.now() - notifsLoadedAt < 30000) { renderUnreadBadge(); return; }
    notifsLoadedAt = Date.now();
    fetchFast(notificationsQuery(), snapshot => {
      notifications = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
      renderUnreadBadge();
      if (document.getElementById('notif-list')) renderNotificationsModal();
    }).catch(err => console.error("Notifs load error:", err));
  }

  function unreadNotifCount() { return notifications.filter(n => !n.read).length; }

  function renderUnreadBadge() {
    const unreadCount = unreadNotifCount();
    const bellBtn = document.querySelector('.notif-bell-btn');
    if (bellBtn) {
      const existingBadge = bellBtn.querySelector('.notif-badge');
      if (existingBadge) existingBadge.remove();
      if (unreadCount > 0) {
        bellBtn.innerHTML += `<span class="notif-badge">${unreadCount}</span>`;
      }
    }
  }

  function timeAgo(value) {
    const d = toDate(value);
    if (!d) return '';
    const mins = Math.round((Date.now() - d.getTime()) / 60000);
    if (mins < 1) return 'just now';
    if (mins < 60) return mins + ' min ago';
    const hrs = Math.round(mins / 60);
    if (hrs < 24) return hrs + ' hr' + (hrs === 1 ? '' : 's') + ' ago';
    const days = Math.round(hrs / 24);
    if (days < 7) return days + ' day' + (days === 1 ? '' : 's') + ' ago';
    return formatDate(d);
  }

  function mutedCategories() {
    return Array.isArray(currentUserProfile && currentUserProfile.mutedCategories) ? currentUserProfile.mutedCategories : [];
  }

  window.openNotificationsModal = function() {
    notifView = 'list';
    renderNotificationsModal();
    openModal();
    loadNotifications(true);
  };

  function renderNotificationsModal() {
    const body = document.getElementById('modal-body');
    if (!body) return;
    const unread = unreadNotifCount();
    const muted = mutedCategories();
    const counts = {};
    notifications.forEach(n => { const c = notifCategory(n); counts[c] = (counts[c] || 0) + 1; });
    const list = notifFilter === 'all' ? notifications
      : notifFilter === 'unread' ? notifications.filter(n => !n.read)
      : notifications.filter(n => notifCategory(n) === notifFilter);
    const page = pageOf('notifs', list, renderNotificationsModal);

    const head = `
      <div style="display:flex; justify-content:space-between; align-items:center; gap:10px; padding-right:44px; margin-bottom:12px;">
        <div>
          <div style="font-family:var(--font-display); font-size:20px; font-weight:600;">Notifications</div>
          <div style="font-size:13px; color:var(--text-muted);">${unread ? `${unread} unread` : 'All caught up'}${muted.length ? ` · ${muted.length} muted` : ''}</div>
        </div>
        <button class="btn sm ${notifView === 'settings' ? 'primary' : 'secondary'}" onclick="toggleNotifSettings()" title="Notification settings">⚙️ Settings</button>
      </div>`;

    if (notifView === 'settings') {
      body.innerHTML = head + `
        <div class="card" style="margin-bottom:10px;">
          <div style="font-weight:700; font-size:13.5px; margin-bottom:4px;">Push alerts</div>
          <div style="font-size:13px; color:var(--text-muted); margin-bottom:8px;">Turn off a category to stop phone alerts for it. Muted items still appear here in the centre. Emergency alerts are always delivered.</div>
          ${NOTIF_CATEGORIES.filter(c => MUTABLE_CATEGORIES.includes(c[0])).map(([key, label, ico]) => `
            <div class="mute-row">
              <span>${ico} ${label}</span>
              <button class="switch ${muted.includes(key) ? '' : 'on'}" onclick="toggleNotifMute('${key}')" aria-label="Toggle ${label} alerts"></button>
            </div>`).join('')}
        </div>
        <div style="display:flex; gap:8px;">
          <button class="btn sm secondary" style="flex:1;" onclick="clearReadNotifications()">Clear read notifications</button>
          <button class="btn sm secondary" style="flex:1;" onclick="toggleNotifSettings()">Back to list</button>
        </div>`;
      return;
    }

    const chips = [['all', 'All', notifications.length], ['unread', 'Unread', unread]]
      .concat(NOTIF_CATEGORIES.filter(c => counts[c[0]]).map(c => [c[0], c[2] + ' ' + c[1], counts[c[0]]]));

    body.innerHTML = head + `
      <div class="chip-row" style="margin-bottom:10px;">
        ${chips.map(([key, label, n]) => `<span class="chip ${notifFilter === key ? 'active' : ''}" onclick="setNotifFilter('${key}')">${label}${n ? ` · ${n}` : ''}</span>`).join('')}
      </div>
      ${unread ? `<button class="btn sm secondary" style="width:100%; margin-bottom:10px;" onclick="markAllNotificationsRead()">✓ Mark all as read</button>` : ''}
      <div id="notif-list">
        ${page.length ? page.map(n => {
          const meta = notifCategoryMeta(notifCategory(n));
          return `
          <div class="notif-item ${n.read ? '' : 'unread'}" onclick="toggleNotificationRead('${n.id}')">
            ${n.title ? `<div style="font-weight:700; font-size:13px; color:${n.read ? 'var(--text)' : 'var(--accent-2)'};">${escapeHtml(n.title)}</div>` : ''}
            <div style="font-size:13px; color:var(--text-muted); line-height:1.4; white-space:pre-wrap;">${escapeHtml(n.text || n.body || '')}</div>
            <div class="meta"><span class="notif-cat">${meta[2]} ${escapeHtml(meta[1])}</span><span>${timeAgo(n.createdAt)}${n.read ? '' : ' · tap to mark read'}</span></div>
          </div>`;
        }).join('') : `<div style="color:var(--text-muted); text-align:center; padding:20px;">${notifFilter === 'unread' ? 'No unread notifications.' : 'No notifications yet.'}</div>`}
        ${showMoreButton('notifs', list.length)}
      </div>`;
  }

  window.setNotifFilter = function(key) { notifFilter = key; delete pageShown['notifs']; renderNotificationsModal(); };
  window.toggleNotifSettings = function() { notifView = notifView === 'settings' ? 'list' : 'settings'; renderNotificationsModal(); };

  function notifRef(id) {
    return db.collection('users').doc(auth.currentUser.uid).collection('notifications').doc(id);
  }

  window.toggleNotificationRead = async function(id) {
    const n = notifications.find(item => item.id === id);
    if (!n || !db || !auth.currentUser) return;
    n.read = !n.read;
    renderUnreadBadge();
    renderNotificationsModal();
    try { await notifRef(id).update({ read: n.read }); }
    catch (e) { console.error("Error updating notification:", e); }
  };

  window.markAllNotificationsRead = async function() {
    const unreadDocs = notifications.filter(n => !n.read);
    if (!unreadDocs.length || !db || !auth.currentUser) return;
    unreadDocs.forEach(n => { n.read = true; });
    renderUnreadBadge();
    renderNotificationsModal();
    try {
      for (let i = 0; i < unreadDocs.length; i += 400) {
        const batch = db.batch();
        unreadDocs.slice(i, i + 400).forEach(n => batch.update(notifRef(n.id), { read: true }));
        await batch.commit();
      }
    } catch (e) { console.error("Error marking notifs read:", e); }
  };

  window.clearReadNotifications = async function() {
    const readDocs = notifications.filter(n => n.read);
    if (!readDocs.length) { toast("There are no read notifications to clear."); return; }
    if (!(await confirmSheet({ title: `Delete ${readDocs.length} read notification${readDocs.length === 1 ? '' : 's'}?`, body: 'Unread ones are kept.', okLabel: 'Delete', danger: true }))) return;
    notifications = notifications.filter(n => !n.read);
    renderNotificationsModal();
    try {
      for (let i = 0; i < readDocs.length; i += 400) {
        const batch = db.batch();
        readDocs.slice(i, i + 400).forEach(n => batch.delete(notifRef(n.id)));
        await batch.commit();
      }
    } catch (e) { console.error("Error clearing notifications:", e); }
    loadNotifications(true);
  };

  window.toggleNotifMute = async function(category) {
    if (!db || !auth.currentUser || !currentUserProfile) return;
    const muted = mutedCategories().slice();
    const idx = muted.indexOf(category);
    if (idx >= 0) muted.splice(idx, 1); else muted.push(category);
    currentUserProfile.mutedCategories = muted;
    renderNotificationsModal();
    try { await db.collection('users').doc(auth.currentUser.uid).update({ mutedCategories: muted }); }
    catch (e) { console.error("Error saving notification settings:", e); toast("Could not save notification settings: " + e.message); }
  };

  window.closeModal = function() {
    closeUiSheet(null);
    document.getElementById('modal-view').classList.remove('active');
  };

  // --- ANNOUNCEMENTS ---
  // --- ADMIN REMOVE / ARCHIVE ---
  // Announcements are deleted permanently; bills, funds and complaints are
  // archived (soft-deleted) so financial/audit records are retained.
  async function archiveRecord(collection, id, reload) {
    if (currentUserProfile.role !== 'admin') return;
    try {
      await db.collection(collection).doc(id).update({
        isDeleted: true,
        deletedAt: firebase.firestore.FieldValue.serverTimestamp(),
        deletedBy: currentUserProfile.name
      });
      logAudit(collection, id, 'soft_delete', 'Record archived by admin');
      closeModal();
      reload();
    } catch(err) {
      toast("Error removing record: " + err.message);
    }
  }

  // Announcements and polls: admin, superadmin and board members may publish.
  // Admin/superadmin may delete any; a board member may delete their own posts.
  function canPublish() {
    return !!currentUserProfile
      && (currentUserProfile.role === 'admin' || isSuperAdmin() || isBoard());
  }

  function canDeletePost(doc) {
    if (!currentUserProfile || !doc) return false;
    if (currentUserProfile.role === 'admin' || isSuperAdmin()) return true;
    return isBoard() && !!auth.currentUser && doc.createdBy === auth.currentUser.uid;
  }

  function publisherFields() {
    return {
      createdBy: auth.currentUser.uid,
      createdByName: currentUserProfile.name || '',
      createdByRole: isBoard() && currentUserProfile.role !== 'admin' && !isSuperAdmin() ? 'board' : 'management'
    };
  }

  function postedByLabel(doc) {
    if (doc.summaryMonth) return 'Auto-generated by RPHS Finance';
    return doc.createdByRole === 'board' ? 'Posted by Board' : 'Posted by Management';
  }

  window.deleteNotice = async function(id) {
    const n = noticesList.find(item => item.id === id);
    if (!canDeletePost(n)) return;
    if (!(await confirmSheet({ title: 'Delete this announcement?', body: `"${n ? n.title : ''}" will be deleted permanently.`, okLabel: 'Delete', danger: true }))) return;
    try {
      await db.collection('announcements').doc(id).delete();
      logAudit('announcement', id, 'update', `Announcement "${n ? n.title : ''}" permanently deleted`);
      loadNotices();
    } catch(err) {
      toast("Error deleting announcement: " + err.message);
    }
  };

  window.deletePoll = async function(id) {
    const p = pollsList.find(item => item.id === id);
    if (!canDeletePost(p)) return;
    if (!(await confirmSheet({ title: 'Delete this poll?', body: `"${p ? p.question : ''}" and all its votes will be deleted permanently.`, okLabel: 'Delete', danger: true }))) return;
    try {
      await db.collection('polls').doc(id).delete();
      logAudit('poll', id, 'update', `Poll "${p ? p.question : ''}" permanently deleted`);
      loadPolls();
    } catch(err) {
      toast("Error deleting poll: " + err.message);
    }
  };

  window.archiveTicket = async function(id) {
    const t = ticketsList.find(item => item.id === id);
    if (!(await confirmSheet({ title: `Remove complaint ${t ? t.ticketNo : ''}?`, body: 'It will be archived (kept for audit) and hidden from the list.', okLabel: 'Remove', danger: true }))) return;
    archiveRecord('tickets', id, loadTickets);
  };

  window.archiveBill = async function(id) {
    const b = billsList.find(item => item.id === id);
    if (!(await confirmSheet({ title: `Cancel bill ${b ? b.billNo : ''}?`, body: 'It will be archived (kept for audit) and hidden from the list.', okLabel: 'Cancel bill', cancelLabel: 'Keep bill', danger: true }))) return;
    archiveRecord('bills', id, loadBills);
  };

  window.archiveFund = async function(id) {
    const f = fundsList.find(item => item.id === id);
    if (!(await confirmSheet({ title: 'Remove this fund?', body: `"${f ? f.title : ''}" will be archived (kept for audit) along with its contribution records.`, okLabel: 'Remove', danger: true }))) return;
    archiveRecord('funds', id, loadFunds);
  };

  function loadNotices() {
    if (!db) return;
    fetchFast(db.collection('announcements').orderBy('createdAt', 'desc'), async (snapshot, fromCache) => {
      noticesList = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })).filter(n => !n.isDeleted);
      if (fromCache) { renderNoticesList(); return; }
      const threads = await Promise.all(noticesList.map(n =>
        db.collection('announcements').doc(n.id).collection('comments').orderBy('createdAt', 'asc').get()
          .then(s => s.docs.map(d => ({ id: d.id, ...d.data() })))
          .catch(e => { console.error("Error loading comments:", e); return []; })
      ));
      noticeComments = {};
      noticesList.forEach((n, i) => { noticeComments[n.id] = threads[i]; });
      renderNoticesList();
    }).catch(e => { console.error("Error loading notices:", e); showLoadError('notices-list', e); });
  }

  // Approved residents, staff and board members may comment on announcements.
  function canComment() {
    if (!currentUserProfile) return false;
    if (isStaff() || isBoard()) return true;
    return currentUserProfile.role === 'resident' && currentUserProfile.approved === true && currentUserProfile.suspended !== true;
  }

  function canDeleteComment(notice, c) {
    if (!auth.currentUser || !c) return false;
    return c.uid === auth.currentUser.uid || canDeletePost(notice);
  }

  function commentsAllowed(n) {
    return n.allowComments !== false;
  }

  function commentAuthorTag(c) {
    if (c.role === 'board') return '<span class="badge notice" style="font-size:13px; padding:1px 6px; margin-left:6px;">Board</span>';
    if (c.role === 'management') return '<span class="badge verified" style="font-size:13px; padding:1px 6px; margin-left:6px;">Management</span>';
    return '';
  }

  function renderCommentThread(n) {
    const comments = noticeComments[n.id] || [];
    const open = openCommentThreads.has(n.id);
    const count = comments.length;
    const toggleLabel = `${count ? count : 'No'} comment${count === 1 ? '' : 's'}${commentsAllowed(n) ? '' : ' · closed'}`;
    if (!open) {
      return `<button class="btn sm secondary" style="margin-top:12px;" onclick="toggleComments('${n.id}')">&#128172; ${toggleLabel}</button>`;
    }
    const items = comments.length ? comments.map(c => `
      <div style="background:var(--bg-elevated-2); border:1px solid var(--border); border-radius:10px; padding:8px 10px; margin-bottom:6px;">
        <div style="display:flex; justify-content:space-between; align-items:center; gap:8px;">
          <div style="font-size:13px; font-weight:700; color:var(--text);">${escapeHtml(c.name || 'Resident')}${commentAuthorTag(c)}</div>
          <div style="font-size:13px; color:var(--text-faint); white-space:nowrap;">${escapeHtml(formatDate(c.createdAt))}</div>
        </div>
        <div style="font-size:13px; color:var(--text); line-height:1.45; white-space:pre-wrap; margin-top:3px;">${escapeHtml(c.text || '')}</div>
        ${canDeleteComment(n, c) ? `<button class="btn sm danger" style="margin-top:6px; padding:3px 8px; font-size:13px;" onclick="deleteComment('${n.id}','${c.id}')">Delete</button>` : ''}
      </div>`).join('')
      : '<div style="font-size:13px; color:var(--text-muted); padding:6px 0;">No comments yet. Be the first to respond.</div>';
    const composer = !commentsAllowed(n)
      ? '<div style="font-size:13px; color:var(--text-faint); margin-top:6px;">Comments are closed on this announcement.</div>'
      : canComment()
        ? `<form onsubmit="return postComment(event,'${n.id}')" style="margin-top:8px;">
            <textarea id="comment-input-${n.id}" placeholder="Write a comment..." required maxlength="500" style="min-height:56px; margin-top:0;"></textarea>
            <div style="display:flex; justify-content:flex-end; margin-top:6px;"><button type="submit" class="btn sm primary">Post Comment</button></div>
          </form>`
        : '';
    return `
      <div style="margin-top:12px; border-top:1px solid var(--border); padding-top:10px;">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
          <div style="font-size:13px; font-weight:700; color:var(--text-muted);">&#128172; ${toggleLabel}</div>
          <div style="display:flex; gap:6px;">
            ${canDeletePost(n) ? `<button class="btn sm secondary" style="padding:3px 8px; font-size:13px;" onclick="toggleCommentsAllowed('${n.id}')">${commentsAllowed(n) ? 'Close comments' : 'Reopen comments'}</button>` : ''}
            <button class="btn sm secondary" style="padding:3px 8px; font-size:13px;" onclick="toggleComments('${n.id}')">Hide</button>
          </div>
        </div>
        ${items}
        ${composer}
      </div>`;
  }

  window.toggleComments = function(id) {
    if (openCommentThreads.has(id)) openCommentThreads.delete(id); else openCommentThreads.add(id);
    renderNoticesList();
  };

  window.toggleCommentsAllowed = async function(id) {
    const n = noticesList.find(item => item.id === id);
    if (!n || !canDeletePost(n)) return;
    const next = !commentsAllowed(n);
    try {
      await db.collection('announcements').doc(id).update({ allowComments: next });
      logAudit('announcement', id, 'update', `Comments ${next ? 'reopened' : 'closed'} on "${n.title}"`);
      loadNotices();
    } catch(err) {
      toast("Error updating announcement: " + err.message);
    }
  };

  window.postComment = async function(e, id) {
    e.preventDefault();
    const n = noticesList.find(item => item.id === id);
    if (!n || !commentsAllowed(n) || !canComment()) return false;
    const input = document.getElementById(`comment-input-${id}`);
    const text = (input ? input.value : '').trim();
    if (!text) return false;
    const btn = e.target.querySelector('button[type=submit]');
    if (btn) btn.disabled = true;
    const role = currentUserProfile.role === 'admin' || isSuperAdmin() ? 'management' : (isBoard() ? 'board' : 'resident');
    try {
      await db.collection('announcements').doc(id).collection('comments').add({
        uid: auth.currentUser.uid,
        name: currentUserProfile.name || 'Resident',
        role,
        text,
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      });
      if (n.createdBy && n.createdBy !== auth.currentUser.uid) {
        sendNotification(n.createdBy, `New comment on "${n.title}"`, `${currentUserProfile.name || 'A resident'}: ${text.length > 120 ? text.slice(0, 117) + '...' : text}`, 'info');
      }
      loadNotices();
    } catch(err) {
      if (btn) btn.disabled = false;
      toast("Error posting comment: " + err.message);
    }
    return false;
  };

  window.deleteComment = async function(noticeId, commentId) {
    const n = noticesList.find(item => item.id === noticeId);
    const c = (noticeComments[noticeId] || []).find(item => item.id === commentId);
    if (!canDeleteComment(n, c)) return;
    if (!(await confirmSheet({ title: 'Delete this comment?', okLabel: 'Delete', danger: true }))) return;
    try {
      await db.collection('announcements').doc(noticeId).collection('comments').doc(commentId).delete();
      loadNotices();
    } catch(err) {
      toast("Error deleting comment: " + err.message);
    }
  };

  function renderNoticesList() {
    const listEl = document.getElementById('notices-list');
    if (!listEl) return;
    if (!noticesList.length) {
      listEl.innerHTML = '<div class="card" style="text-align:center; color:var(--text-muted);">No announcements posted yet.</div>';
      return;
    }

    listEl.innerHTML = noticesList.map(n => `
      <div class="card" style="cursor:default;">
        <div style="display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:8px;">
          <div style="font-weight:700; font-size:16px; color:var(--accent-2);">${escapeHtml(n.title)}</div>
          ${isStaff() || canDeletePost(n) ? `<button class="dots-btn" onclick="openNoticeMenu('${n.id}')" aria-label="More actions">${icon('dots')}</button>` : ''}
        </div>
        <div style="font-size:13.5px; color:var(--text); line-height:1.5; white-space:pre-wrap;">${escapeHtml(n.content)}</div>
        <div style="font-size:13px; color:var(--text-faint); margin-top:10px;">${postedByLabel(n)}${n.createdAt ? ' · ' + escapeHtml(formatDate(n.createdAt)) : ''}</div>
        ${n.summaryMonth ? `<div style="display:flex; gap:8px; margin-top:10px;">
          <button class="btn sm secondary block" onclick="openMonthlySummaryModal('${escapeHtml(n.summaryMonth)}')">📊 Breakdown</button>
          <button class="btn sm secondary block" onclick="downloadMonthlySummaryPDF('${escapeHtml(n.summaryMonth)}')">📄 PDF</button>
        </div>` : ''}
        <div style="display:flex; gap:8px; flex-wrap:wrap; align-items:center;">
          ${renderCommentThread(n)}
          ${isStaff() ? `<button class="btn sm secondary" style="margin-top:12px;" onclick="shareNoticeOnWhatsApp('${n.id}')">${icon('share')} Share on WhatsApp</button>` : ''}
        </div>
      </div>
    `).join('');
  }

  // WhatsApp sharing uses a plain wa.me link (no number, no paid API):
  // WhatsApp opens and the admin picks the residents' group.
  function noticeWhatsAppText(title, content) {
    return `*${title}*\n\n${content}\n\n- RPHS Management`;
  }
  function openWhatsAppShare(text) {
    const url = 'https://wa.me/?text=' + encodeURIComponent(text);
    const w = window.open(url, '_blank');
    if (w) return;
    // Pop-up blocked (e.g. after a slow save): ask for one more tap.
    confirmSheet({ title: 'Share on WhatsApp', body: 'Open WhatsApp and pick your residents\u2019 group.', okLabel: 'Open WhatsApp' })
      .then(ok => { if (ok) window.location.href = url; });
  }
  window.shareNoticeOnWhatsApp = function(id) {
    const n = noticesList.find(x => x.id === id);
    if (n) openWhatsAppShare(noticeWhatsAppText(n.title || '', n.content || ''));
  };
  // ⋯ menus on list cards: destructive items are red and confirm first.
  window.openCardMenu = function(kind, id) {
    const menus = {
      poll: () => ['Poll', [{ label: 'Delete poll', icon: 'trash', danger: true, run: () => deletePoll(id) }]],
      ticket: () => ['Complaint', [
        { label: 'View complaint', icon: 'eye', run: () => openTicketDetailModal(id) },
        { label: 'Export PDF', icon: 'file', run: () => downloadTicketPDF(id) },
        { label: 'Remove complaint', icon: 'trash', danger: true, run: () => archiveTicket(id) }
      ]],
      fund: () => ['Fund', [{ label: 'Remove fund', icon: 'trash', danger: true, run: () => archiveFund(id) }]],
      expense: () => ['Expense', [
        { label: 'View receipt', icon: 'file', run: () => downloadExpensePDF(id) },
        { label: 'View details', icon: 'eye', run: () => openExpenseDetailModal(id) },
        { label: 'Cancel expense', icon: 'trash', danger: true, run: () => archiveExpense(id) }
      ]],
      program: () => {
        const p = volunteersList.find(x => x.id === id);
        const active = !p || p.status !== 'closed';
        return ['Program', [
          active && { label: 'Close program', icon: 'x', run: () => closeProgram(id) },
          { label: 'Remove program', icon: 'trash', danger: true, run: () => archiveProgram(id) }
        ]];
      }
    };
    const m = menus[kind] && menus[kind]();
    if (m) menuSheet(m[0], m[1]);
  };

  window.openNoticeMenu = function(id) {
    const n = noticesList.find(x => x.id === id);
    if (!n) return;
    menuSheet(n.title, [
      isStaff() && { label: 'Share on WhatsApp', icon: 'share', run: () => shareNoticeOnWhatsApp(id) },
      canDeletePost(n) && { label: 'Delete announcement', icon: 'trash', danger: true, run: () => deleteNotice(id) }
    ]);
  };

  window.openPostNoticeModal = function() {
    document.getElementById('modal-body').innerHTML = `
      <div style="font-family:var(--font-display); font-size:20px; font-weight:600; margin-bottom:12px;">New Announcement</div>
      <form id="notice-form">
        <label>Title</label>
        <input type="text" id="notice-title" placeholder="Notice Title" required />
        <label>Content / Circular</label>
        <textarea id="notice-content" placeholder="Write announcement details..." required></textarea>
        <label style="display:flex; align-items:center; gap:8px; margin-top:12px; cursor:pointer;">
          <input type="checkbox" id="notice-allow-comments" checked style="width:auto; margin:0;" />
          <span>Allow residents to comment</span>
        </label>
        <label style="display:flex; align-items:center; gap:8px; margin-top:12px; cursor:pointer;">
          <input type="checkbox" id="notice-share-wa" checked style="width:auto; margin:0;" />
          <span>Also share on WhatsApp after posting</span>
        </label>
        <button type="submit" class="btn primary block" style="margin-top:16px;">Post to everyone</button>
      </form>
    `;
    openModal();

    document.getElementById('notice-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const title = document.getElementById('notice-title').value.trim();
      const content = document.getElementById('notice-content').value.trim();
      const allowComments = document.getElementById('notice-allow-comments').checked;
      const shareWa = document.getElementById('notice-share-wa').checked;

      try {
        await db.collection('announcements').add({
          title,
          content,
          allowComments,
          ...publisherFields(),
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });
        await broadcastNotification("New Announcement: " + title, content, 'notices');
        closeModal();
        loadNotices();
        toast('Announcement posted');
        if (shareWa) openWhatsAppShare(noticeWhatsAppText(title, content));
      } catch(err) {
        toast("Error publishing notice: " + err.message);
      }
    });
  };

  // --- POLLS ---
  function loadPolls() {
    if (!db) return;
    fetchFast(db.collection('polls').orderBy('createdAt', 'desc'), snapshot => {
      pollsList = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
      renderPollsList();
    }).catch(e => console.error("Error loading polls:", e));
  }

  function renderPollsList() {
    const listEl = document.getElementById('polls-list');
    if (!listEl) return;
    if (!pollsList.length) {
      listEl.innerHTML = '<div class="card" style="text-align:center; color:var(--text-muted);">No active polls available.</div>';
      return;
    }

    const userId = auth.currentUser.uid;

    listEl.innerHTML = pollsList.map(poll => {
      const votes = poll.votes || {};
      const hasVoted = userId in votes;
      const userVote = votes[userId];
      const options = poll.options || [];
      
      const totalVotes = Object.keys(votes).length;

      // Tally counts
      const counts = options.map((opt, idx) => {
        let count = 0;
        Object.values(votes).forEach(v => { if (v === idx) count++; });
        return count;
      });

      return `
        <div class="card" style="cursor:default;">
          <div style="font-weight:700; font-size:16px; color:var(--accent-2); margin-bottom:6px;">${escapeHtml(poll.question)}</div>
          <div style="font-size:13px; color:var(--text-muted); margin-bottom:14px;">Total Votes: ${totalVotes} · ${postedByLabel(poll)}</div>

          <div style="display:flex; flex-direction:column; gap:8px;">
            ${options.map((opt, idx) => {
              const count = counts[idx];
              const pct = totalVotes > 0 ? Math.round((count / totalVotes) * 100) : 0;
              const isSelected = userVote === idx;

              return `
                <div style="background:var(--bg-elevated-2); border:1px solid ${isSelected ? 'var(--accent)' : 'var(--border)'}; border-radius:10px; padding:10px 12px; position:relative; overflow:hidden;">
                  <div style="position:absolute; top:0; left:0; bottom:0; width:${pct}%; background:var(--accent-soft); z-index:0;"></div>
                  <div style="display:flex; justify-content:space-between; align-items:center; position:relative; z-index:1;">
                    <span style="font-size:13.5px; font-weight:${isSelected?'700':'500'};">${escapeHtml(opt)}</span>
                    <div style="display:flex; align-items:center; gap:10px;">
                      <span style="font-size:13px; color:var(--text-muted);">${pct}% (${count})</span>
                      ${!hasVoted ? `<button class="btn sm primary" onclick="votePoll('${poll.id}', ${idx})">Vote</button>` : ''}
                    </div>
                  </div>
                </div>
              `;
            }).join('')}
          </div>
          ${canDeletePost(poll) ? `<div style="display:flex; justify-content:flex-end; margin-top:8px;"><button class="dots-btn" onclick="event.stopPropagation(); openCardMenu('poll', '${poll.id}')" aria-label="More actions">${icon('dots')}</button></div>` : ''}
        </div>
      `;
    }).join('');
  }

  window.openCreatePollModal = function() {
    document.getElementById('modal-body').innerHTML = `
      <div style="font-family:var(--font-display); font-size:20px; font-weight:600; margin-bottom:12px;">Create New Poll</div>
      <form id="poll-form">
        <label>Question</label>
        <input type="text" id="poll-question" placeholder="Ask society residents..." required />
        <label>Option 1</label>
        <input type="text" id="poll-opt-0" placeholder="Option A" required />
        <label>Option 2</label>
        <input type="text" id="poll-opt-1" placeholder="Option B" required />
        <label>Option 3 (Optional)</label>
        <input type="text" id="poll-opt-2" placeholder="Option C" />
        <button type="submit" class="btn primary block" style="margin-top:16px;">Publish Poll</button>
      </form>
    `;
    openModal();

    document.getElementById('poll-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const question = document.getElementById('poll-question').value.trim();
      const opt0 = document.getElementById('poll-opt-0').value.trim();
      const opt1 = document.getElementById('poll-opt-1').value.trim();
      const opt2 = document.getElementById('poll-opt-2').value.trim();

          createdAt: firebase.firestore.FieldValue.serverTimestamp()

  window.votePoll = async function(pollId, optionIndex) {
    if (!db || !auth.currentUser) return;
    try {
      const ref = db.collection('polls').doc(pollId);
      await db.runTransaction(async (transaction) => {
        const doc = await transaction.get(ref);
        if (!doc.exists) throw "Poll does not exist!";
        const data = doc.data();
        const votes = data.votes || {};
        votes[auth.currentUser.uid] = optionIndex;
        transaction.update(ref, { votes: votes });
      });
      loadPolls();
    } catch(err) {
      toast("Error casting vote: " + err);

  // --- TICKETS / COMPLAINTS DIRECTORY ---
  function loadTickets() {
    if (!db) return;
    let query = db.collection('tickets').orderBy('createdAt', 'desc');
    if (currentUserProfile.role !== 'admin') {
      query = query.where('uid', '==', auth.currentUser.uid);
    }
    fetchFast(query, snapshot => {
      ticketsList = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })).filter(t => !t.isDeleted);
      renderTicketsList();
    }).catch(e => { console.error("Error loading tickets:", e); showLoadError('tickets-list', e); });
  }

  function monthKey(date) {
    if (!date) return '';
    return date.getFullYear() + '-' + String(date.getMonth() + 1).padStart(2, '0');
  }

  function monthLabel(key) {
    const [y, m] = key.split('-');
    const names = ['January','February','March','April','May','June','July','August','September','October','November','December'];
    return names[Number(m) - 1] + ' ' + y;
  }

  function toDate(value) {
    if (!value) return null;
    if (typeof value.toDate === 'function') return value.toDate();
    const d = new Date(value);
    return isNaN(d.getTime()) ? null : d;
  }

  const MONTHS_SHORT = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  function formatDate(value) {
    const d = toDate(value);
    return d ? `${d.getDate()} ${MONTHS_SHORT[d.getMonth()]} ${d.getFullYear()}` : 'N/A';
  }

  // One label per status, used on every pill.
  const STATUS_LABELS = {
    unpaid: 'Due', overdue: 'Overdue', paid: 'Paid', submitted: 'In review', pending: 'Pending',
    'in-progress': 'In progress', assigned: 'Assigned', resolved: 'Resolved', closed: 'Closed',
    cancelled: 'Cancelled', verified: 'Verified', rejected: 'Rejected', approved: 'Approved', active: 'Active'
  };
  function statusLabel(status) {
    const k = String(status || 'pending').toLowerCase();
    return STATUS_LABELS[k] || (k.charAt(0).toUpperCase() + k.slice(1).replace(/-/g, ' '));
  }

  function lastTwelveMonths() {
    const keys = [];
    const now = new Date();
    for (let i = 0; i < 12; i++) {
      keys.push(monthKey(new Date(now.getFullYear(), now.getMonth() - i, 1)));
    }
    return keys;
  }

          <select id="ticket-filter-status" onchange="setTicketFilters()" style="flex:1;">
            <option value="all" ${ticketFilterStatus==='all'?'selected':''}>All statuses</option>
            <option value="pending" ${ticketFilterStatus==='pending'?'selected':''}>Pending</option>

  window.downloadTicketsReportPDF = async function() {
    const list = filteredTickets();

    }

    try {
      const { jsPDF } = await ensureJsPDF();
      const doc = new jsPDF();

      doc.setFont("helvetica", "bold");
      doc.setFontSize(16);
      doc.text("Roshan Pakistan Housing Society", 105, 18, { align: "center" });
      doc.setFontSize(12);
      doc.setFont("helvetica", "normal");
      doc.text("Complaints Report", 105, 26, { align: "center" });

      doc.text(`Generated: ${new Date().toLocaleString('en-GB')}   |   Total: ${list.length}`, 105, 39, { align: "center" });
      doc.line(15, 44, 195, 44);

      let y = 52;
      doc.setFontSize(10);

      doc.text("Ticket", 15, y);
      doc.text("Date", 45, y);
      doc.text("House", 72, y);

        doc.text(formatDate(t.createdAt), 45, y);

        doc.text(doc.splitTextToSize(String(t.category || '-'), 54), 112, y);

  // --- CSV EXPORT ---
  function csvCell(v) {
    const str = v === null || v === undefined ? '' : String(v);
    return /[",\r\n]/.test(str) ? '"' + str.replace(/"/g, '""') + '"' : str;
  }
  function dateStamp(d) {
    d = d || new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }
  function isoDate(value) {
    const d = toDate(value);
    return d ? dateStamp(d) : '';
  }
  function downloadCSV(fileName, headers, rows, reportType) {
    const lines = [headers].concat(rows).map(r => r.map(csvCell).join(','));
    const blob = new Blob(['\ufeff' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = fileName;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
    logExport(reportType, fileName);
  }
  function logExport(reportType, fileName) {
    if (!db || !currentUserProfile) return;
    db.collection('report_exports').add({
      reportType,
      generatedBy: currentUserProfile.name,
      generatedByUid: auth.currentUser.uid,
      role: currentUserProfile.role,
      fileName,
      generatedAt: firebase.firestore.FieldValue.serverTimestamp()
    }).catch(e => console.error("Export log failed:", e));
    logAudit('report', '', 'create', `Export: ${fileName}`);
  }

  function formatMoney(amount) {
    return 'PKR ' + Number(amount || 0).toLocaleString('en-PK');

  function billStatus(b) {
    const status = b.status || 'unpaid';
    if (status === 'unpaid') {
      const due = toDate(b.dueDate);
      if (due && due < new Date(new Date().toDateString())) return 'overdue';
    }
    return status;
  }

  // settings/recurringBill is read by the issueMonthlyRecurringBills Cloud
  // Function on the 1st of every month; "Issue now" writes runRequest, which the
  // runRecurringBillsOnRequest trigger performs and clears.
  const RECURRING_DEFAULTS = { enabled: false, amount: 500, category: 'Monthly Maintenance', dueDay: 20, notes: '' };

  function loadRecurringBillCard() {
    Promise.all([
      db.collection('settings').doc('recurringBill').get(),
      db.collection('users').where('billExempt', '==', true).get()
    ]).then(([doc, exSnap]) => {
      recurringSettings = { ...RECURRING_DEFAULTS, ...(doc.exists ? doc.data() : {}) };
      recurringExempt = exSnap.docs.map(d => ({ uid: d.id, ...d.data() })).filter(u => u.approved === true);
      renderRecurringBillCard();
    }).catch(e => { console.error("Error loading recurring bill settings:", e); showLoadError('recurring-bill-card', e); });
  }

  function ordinal(n) {
    const s = ['th', 'st', 'nd', 'rd'], v = n % 100;
    return n + (s[(v - 20) % 10] || s[v] || s[0]);
  }

    const el = document.getElementById('recurring-bill-card');
    if (!el || currentUserProfile.role !== 'admin' || !recurringSettings) return;
    const s = recurringSettings;
    const last = s.lastRun;
    const lastAt = last ? toDate(last.at) : null;
    const pending = !!(s.runRequest && s.runRequest.month);
    el.innerHTML = `
      <div class="filter-bar">
        <div style="display:flex; justify-content:space-between; align-items:center; gap:8px;">
          <label style="margin:0;">Recurring Monthly Bill</label>

        </div>
        <div style="display:flex; justify-content:space-between; align-items:baseline; margin-top:8px;">
          <span style="font-size:13px; color:var(--text-muted);">${escapeHtml(s.category)}</span>

        </div>
        <div style="font-size:13px; color:var(--text-faint); margin-top:4px;">

        </div>

  window.openIssueRecurringNowModal = function() {
    if (currentUserProfile.role !== 'admin' || !recurringSettings || !(Number(recurringSettings.amount) > 0)) return;
    const s = recurringSettings;
    const today = new Date();
    const thisKey = monthKey(today);
    const nextKey = monthKey(new Date(today.getFullYear(), today.getMonth() + 1, 1));
    const dueFor = (key) => {
      const due = `${key}-${String(Number(s.dueDay) || 20).padStart(2, '0')}`;
      const todayKey = `${thisKey}-${String(today.getDate()).padStart(2, '0')}`;
      if (due >= todayKey) return due;
      const d = new Date(today.getFullYear(), today.getMonth(), today.getDate() + 7);
      return `${monthKey(d)}-${String(d.getDate()).padStart(2, '0')}`;
    };
    document.getElementById('modal-body').innerHTML = `
      <div style="font-family:var(--font-display); font-size:20px; font-weight:600; margin-bottom:4px;">Issue Recurring Bills Now</div>
      <div style="font-size:13px; color:var(--text-muted); margin-bottom:14px;">Creates a ${escapeHtml(s.category)} bill of <b>${formatMoney(s.amount)}</b> for every approved resident who does not already have a bill for the chosen month. Anyone already billed or paid for that month is skipped; exempt members are skipped.</div>
      <form id="recurring-now-form">
        <label>Billing Month</label>
        ${pickerHtml('rec-now-month', [
          { value: thisKey, label: monthLabel(thisKey), sub: 'Current month', initials: '📅', avatarClass: 'cat' },
          { value: nextKey, label: monthLabel(nextKey), sub: 'Next month (in advance)', initials: '📆', avatarClass: 'cat' }
        ], { value: thisKey, searchable: false })}
        <label>Due Date</label>
        <input type="date" id="rec-now-due" value="${dueFor(thisKey)}" required />
        <div style="font-size:13px; color:var(--text-faint); margin-top:4px;">Defaults to the ${ordinal(Number(s.dueDay) || 20)}; if that has already passed, one week from today.</div>
        <button type="submit" class="btn primary block" style="margin-top:16px;">Issue Bills & Notify Residents</button>
      </form>
    `;
    openModal();
    pickerOnChange('rec-now-month', (val) => { document.getElementById('rec-now-due').value = dueFor(val); });

    document.getElementById('recurring-now-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const month = document.getElementById('rec-now-month').value;
      const dueDate = document.getElementById('rec-now-due').value;
      if (!dueDate) { toast("Please choose a due date."); return; }
      if (!(await confirmSheet({ title: `Issue ${monthLabel(month)} bills?`, body: `${formatMoney(s.amount)} per house, due ${formatDate(dueDate)}.`, okLabel: 'Issue bills' }))) return;
      try {
        await db.collection('settings').doc('recurringBill').set({
          runRequest: { month, dueDate, by: currentUserProfile.name, at: firebase.firestore.FieldValue.serverTimestamp() }
        }, { merge: true });
        logAudit('settings', 'recurringBill', 'update', `Recurring bills for ${monthLabel(month)} requested (due ${dueDate})`);
        closeModal();
        loadRecurringBillCard();
        setTimeout(() => { loadBills(); }, 6000);
      } catch(err) {
        toast("Error requesting bill run: " + err.message);
      }
    });
  };

  // Admin-only card on the Bills tab: the pooled Bills account (all paid bills)
  // with its balance, a Transfer-to-Fund action and the transfer history.
  function loadBillsAccountCard() {
    Promise.all([db.collection('expenses').get(), db.collection('transfers').get()]).then(([expSnap, trSnap]) => {
      billsAccountData = {
        loaded: true,
        expenses: expSnap.docs.map(d => ({ id: d.id, ...d.data() })).filter(x => !x.isDeleted),

      };
      renderBillsAccountCard();

      chip.classList.toggle('active', chip.getAttribute('data-filter') === filter);

  function renderBillFilterBar() {
    return `
      <div class="filter-bar">
        <label for="bill-search">Find bills</label>
        <div style="display:flex; gap:8px;">
          <input type="search" id="bill-search" placeholder="Name, house or bill no." value="${escapeHtml(billSearch)}" oninput="setBillSearch(this.value)" style="flex:1.4; min-width:0;" />
          <select onchange="setBillMonth(this.value)" style="flex:1; min-width:0;">
            <option value="all" ${billFilterMonth==='all'?'selected':''}>All months</option>

          </select>

        <div id="bill-filter-summary" style="font-size:13px; color:var(--text-muted); margin-top:10px;"></div>
      </div>

  window.setBillSearch = function(value) {
    billSearch = String(value || '').trim().toLowerCase();
    delete pageShown['bills'];
    renderBillsList();
  };
  window.setBillMonth = function(value) {
    billFilterMonth = value || 'all';
    delete pageShown['bills'];
    renderBillsList();
  };

  function billInMonth(b, key) {
    if (key === 'all') return true;
    if (b.period === monthLabel(key)) return true;
    const due = toDate(b.dueDate);
    return !!due && monthKey(due) === key;
  }

  function currentBillFilter() {
    if (billFilterStatus) return billFilterStatus;
    return currentUserProfile.role === 'admin' ? 'needs' : 'all';
  }
  function billMatchesChip(b, f) {
    const st = billStatus(b);
    if (f === 'all') return true;
    if (f === 'needs') return st === 'overdue' || st === 'submitted';
    if (f === 'topay') return st === 'unpaid' || st === 'overdue';
    return st === f;
  }

  function filteredBills() {
    const f = currentBillFilter();
    return billsList.filter(b => {
      if (!billMatchesChip(b, f)) return false;
      if (!billInMonth(b, billFilterMonth)) return false;
      if (billSearch) {
        const hay = [b.name, b.house, b.billNo, b.category, b.period].map(v => String(v || '').toLowerCase()).join(' ');
        if (!hay.includes(billSearch)) return false;
      }
      return true;
    });
  }

  function isOutstanding(b) {
    const st = billStatus(b);
    return st === 'unpaid' || st === 'overdue' || st === 'submitted';
  }

  window.exportBillsCSV = function() {
    if (!isStaff()) return;
    const rows = filteredBills().map(b => [
      b.billNo, b.name, b.house, b.category, b.period, Number(b.amount || 0), billStatus(b),
      isoDate(b.createdAt), isoDate(b.dueDate), b.status === 'paid' ? isoDate(b.paidAt) : '',
      b.paymentRef, b.paymentMethod, b.verifiedBy, b.issuedBy, b.notes
    ]);
    if (!rows.length) return toast("No bills to export for the current filter.");
    downloadCSV(`RPHS_Bills_${dateStamp()}.csv`,
      ['Bill No', 'Resident', 'House', 'Category', 'Period', 'Amount (PKR)', 'Status', 'Issued', 'Due', 'Paid On', 'Payment Ref', 'Method', 'Verified By', 'Issued By', 'Notes'],
      rows, 'bills_csv');
  };

  // --- DEFAULTERS (STAFF) ---
  // One row per resident with unpaid/overdue bills (proofs under review are not
  // counted as defaulting). Phone numbers come from the residents directory.
  function ensureResidents() {
    if (allResidents.length) return Promise.resolve(allResidents);
    return db.collection('users').where('approved', '==', true).get().then(snapshot => {
      allResidents = snapshot.docs.map(doc => ({ uid: doc.id, ...doc.data() }));
      return allResidents;
    });
  }

  function defaultersList() {
    const byKey = {};
    billsList.forEach(b => {
      const st = billStatus(b);
      if (st !== 'unpaid' && st !== 'overdue') return;
      const key = b.uid || ('house:' + (b.house || b.name || b.id));
      const d = byKey[key] || (byKey[key] = { key, uid: b.uid || '', name: b.name || 'Unknown', house: b.house || 'N/A', bills: [], total: 0, overdue: 0, oldestDue: null });
      d.bills.push(b);
      d.total += Number(b.amount || 0);
      if (st === 'overdue') d.overdue += 1;
      const due = toDate(b.dueDate);
      if (due && (!d.oldestDue || due < d.oldestDue)) d.oldestDue = due;
    });
    return Object.values(byKey).map(d => {
      const r = allResidents.find(x => x.uid === d.uid);
      d.phone = r && r.phone ? String(r.phone) : '';
      d.periods = [...new Set(d.bills.map(b => b.period || formatDate(b.dueDate)))];
      return d;
    }).sort((a, b) => b.total - a.total || b.bills.length - a.bills.length);
  }

  function houseLabel(house) {
    const h = String(house || 'N/A').trim();
    return /^(house|plot|flat|shop)\b/i.test(h) || h === 'N/A' ? h : 'House ' + h;
  }

  function defaulterMessage(d) {
    return `Dear ${d.name}, your RPHS maintenance of ${formatMoney(d.total)} for ${d.periods.join(', ')} (${houseLabel(d.house)}) is outstanding. Please pay to the society account and upload your payment proof in the RPHS app. Thank you - Management`;
  }

  function whatsappLink(phone, text) {
    let digits = String(phone || '').replace(/\D/g, '');
    if (digits.startsWith('0')) digits = '92' + digits.slice(1);
    return `https://wa.me/${digits}?text=${encodeURIComponent(text)}`;
  }

  window.openDefaultersModal = async function() {
    if (!isStaff()) return;
    document.getElementById('modal-body').innerHTML = '<div style="color:var(--text-muted); padding:10px 0;">Loading defaulters…</div>';
    openModal();
    try { await Promise.all([ensureResidents(), ensureBillsLoaded()]); } catch (e) { console.error("Defaulters load failed:", e); }
    renderDefaultersModal();
  };

  function renderDefaultersModal() {
    const body = document.getElementById('modal-body');
    if (!body) return;
    const list = defaultersList();
    const overdue = list.filter(d => d.overdue).sort(byHouse);
    const dueSoon = list.filter(d => !d.overdue).sort(byHouse);
    const overdueTotal = overdue.reduce((s, d) => s + d.bills.filter(b => billStatus(b) === 'overdue').reduce((a, b) => a + Number(b.amount || 0), 0), 0);
    const isAdmin = currentUserProfile.role === 'admin';

    const row = d => `
      <div class="card" style="cursor:default; padding:12px 14px;">
        <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:8px;">
          <div style="min-width:0;">
            <div style="font-weight:700; font-size:15px;">${escapeHtml(d.name)}</div>
            <div style="font-size:13px; color:var(--text-muted);"><span class="nowrap">${escapeHtml(houseLabel(d.house))}</span>${d.phone ? ' · <span class="nowrap">' + escapeHtml(d.phone) + '</span>' : ''}</div>
          </div>
          <div style="text-align:right; flex-shrink:0;">
            <div class="money" style="font-weight:800; color:${d.overdue ? 'var(--danger)' : 'var(--text)'};">${formatMoney(d.total)}</div>
            <div style="font-size:13px; color:var(--text-faint);">${d.bills.length} bill${d.bills.length === 1 ? '' : 's'}</div>
          </div>
        </div>
        <div style="font-size:13px; color:var(--text-faint); margin-top:6px;">${escapeHtml(d.periods.join(', '))}${d.oldestDue ? ' · ' + (d.overdue ? 'overdue since ' : 'due ') + escapeHtml(formatDate(d.oldestDue)) : ''}</div>
        ${isAdmin ? `<div style="display:flex; gap:6px; flex-wrap:wrap; margin-top:10px;">
          ${d.uid ? `<button class="btn sm secondary" onclick="remindDefaulter('${d.key}')">${icon('bell')} Remind in app</button>` : ''}
          ${d.phone ? `<button class="btn sm secondary" onclick="whatsappDefaulter('${d.key}')">WhatsApp</button>` : ''}
          ${d.uid ? `<button class="btn sm secondary" onclick="downloadResidentStatement('${d.uid}')">Statement</button>` : ''}
        </div>` : ''}
      </div>`;

    body.innerHTML = `
      <div style="margin-bottom:10px;">
        <div style="font-family:var(--font-display); font-size:20px; font-weight:600;">Defaulters</div>
        <div style="font-size:14px; color:var(--text-muted); line-height:1.5;">Only bills past their due date count. Bills due later this month are listed separately.</div>
      </div>
      ${overdue.length ? `
        <button class="btn primary block" onclick="shareDefaultersText()">${icon('share')} Share overdue list on WhatsApp</button>
        <details style="margin:8px 0 4px;">
          <summary style="font-size:14px; color:var(--accent-2); cursor:pointer;">Preview the WhatsApp message</summary>
          <pre style="white-space:pre-wrap; font-family:var(--font-body); font-size:14px; background:var(--bg-elevated-2); border:1px solid var(--border); border-radius:12px; padding:12px; margin:8px 0 0;">${escapeHtml(defaultersText())}</pre>
        </details>
        <div style="display:flex; gap:8px; margin:10px 0 4px;">
          ${isAdmin ? `<button class="btn sm secondary" style="flex:1;" onclick="remindAllDefaulters()">${icon('bell')} Remind all in app</button>` : ''}
          <button class="btn sm secondary" style="flex:1;" onclick="exportDefaultersCSV()">Export CSV</button>
        </div>
      ` : ''}
      <div class="group-h" style="color:var(--danger);">Overdue · ${overdue.length} house${overdue.length === 1 ? '' : 's'}${overdue.length ? ` · <span class="money">${formatMoney(overdueTotal)}</span>` : ''}</div>
      ${overdue.length ? overdue.map(row).join('') : '<div class="card" style="cursor:default; color:var(--success);">No house is overdue.</div>'}
      ${dueSoon.length ? `<div class="group-h">Due soon · ${dueSoon.length} house${dueSoon.length === 1 ? '' : 's'}</div>${dueSoon.map(row).join('')}` : ''}
    `;
  }

  function byHouse(a, b) {
    return String(a.house || '').localeCompare(String(b.house || ''), 'en', { numeric: true, sensitivity: 'base' });

  // --- RESIDENT STATEMENT (PDF) ---
  // Full billing history for one house with a running balance, plus verified
  // fund contributions. Residents can only pull their own; staff any resident.
  window.downloadResidentStatement = async function(uid) {
    uid = uid || auth.currentUser.uid;
    if (uid !== auth.currentUser.uid && !isStaff()) return;
    try {
      const [{ jsPDF }, billsSnap, contribSnap, userDoc] = await Promise.all([
        ensureJsPDF(),
        db.collection('bills').where('uid', '==', uid).get(),
        db.collection('fund_contributions').where('uid', '==', uid).get(),
        db.collection('users').doc(uid).get()
      ]);
      const time = v => { const d = toDate(v); return d ? d.getTime() : 0; };
      const bills = billsSnap.docs.map(d => ({ id: d.id, ...d.data() }))
        .filter(b => !b.isDeleted && b.status !== 'cancelled')
        .sort((a, b) => time(a.createdAt) - time(b.createdAt));
      const contribs = contribSnap.docs.map(d => ({ id: d.id, ...d.data() }))
        .filter(c => !c.isDeleted && c.status === 'verified')
        .sort((a, b) => String(a.paymentDate || isoDate(a.createdAt)).localeCompare(String(b.paymentDate || isoDate(b.createdAt))));
      const profile = userDoc.exists ? userDoc.data() : {};
      const name = profile.name || (bills[0] && bills[0].name) || 'Resident';
      const house = profile.house || (bills[0] && bills[0].house) || 'N/A';

      const billed = sumAmounts(bills);
      const paid = sumAmounts(bills.filter(b => b.status === 'paid'));
      const inReview = sumAmounts(bills.filter(b => b.status === 'submitted'));
      const outstanding = billed - paid;
      const contributed = sumAmounts(contribs);

      const doc = new jsPDF();
      const pageH = doc.internal.pageSize.getHeight();
      let y = 0;
      const header = () => {
        doc.setFont("helvetica", "bold"); doc.setFontSize(16);
        doc.text("Roshan Pakistan Housing Society", 105, 16, { align: "center" });
        doc.setFont("helvetica", "normal"); doc.setFontSize(11);
        doc.text("Resident Account Statement", 105, 23, { align: "center" });
        doc.setFontSize(9);
        doc.text(`${name}  |  ${houseLabel(house)}  |  Generated ${formatDate(new Date())} by ${currentUserProfile.name}`, 105, 29, { align: "center" });
        doc.line(15, 33, 195, 33);
        y = 42;
      };
      const room = h => { if (y + h > pageH - 14) { doc.addPage(); header(); } };
      const heading = t => { room(16); y += 3; doc.setFont("helvetica", "bold"); doc.setFontSize(11.5); doc.text(t, 15, y); y += 7; };
      const cols = (defs, values, bold) => {
        room(7);
        doc.setFont("helvetica", bold ? "bold" : "normal"); doc.setFontSize(8.5);
        defs.forEach((c, i) => doc.text(String(values[i] === undefined || values[i] === null ? '' : values[i]).slice(0, c.max || 80), c.x, y, { align: c.align || 'left' }));
        y += 6;
      };
      const rule = () => { doc.setDrawColor(200); doc.line(15, y - 4, 195, y - 4); doc.setDrawColor(0); };
      const kv = (k, v, bold) => cols([{ x: 15 }, { x: 110, align: 'right' }], [k, v], bold);
      header();

      heading("Summary");
      kv("Total billed", formatMoney(billed));
      kv("Total paid", formatMoney(paid));
      if (inReview) kv("Proof under review", formatMoney(inReview));
      kv("Outstanding", formatMoney(outstanding), true);
      kv("Verified fund contributions", formatMoney(contributed));

      heading("Maintenance Bills");
      const BILL_COLS = [{ x: 15, max: 12 }, { x: 34, max: 14 }, { x: 62, max: 20 }, { x: 100, max: 11 }, { x: 143, align: 'right' }, { x: 148, max: 12 }, { x: 195, align: 'right' }];
      cols(BILL_COLS, ['Issued', 'Bill No', 'Period', 'Status', 'Amount', 'Paid On', 'Balance'], true);
      rule();
      let balance = 0;
      if (!bills.length) cols([{ x: 15 }], ['No bills issued to this house yet.']);
      bills.forEach(b => {
        if (b.status !== 'paid') balance += Number(b.amount || 0);
        cols(BILL_COLS, [formatDate(b.createdAt), b.billNo || '', b.period || b.category || '', billStatus(b), formatMoney(b.amount), b.status === 'paid' ? formatDate(b.paidAt) : '-', formatMoney(balance)]);
      });
      rule();
      cols(BILL_COLS, ['', '', '', 'Total', formatMoney(billed), 'Outstanding', formatMoney(outstanding)], true);

      heading("Fund Contributions (verified)");
      const CONTRIB_COLS = [{ x: 15, max: 12 }, { x: 40, max: 26 }, { x: 95, max: 14 }, { x: 130, max: 22 }, { x: 195, align: 'right' }];
      cols(CONTRIB_COLS, ['Date', 'Fund', 'Category', 'Method / Ref', 'Amount'], true);
      rule();
      if (!contribs.length) cols([{ x: 15 }], ['No verified contributions on record.']);
      contribs.forEach(c => cols(CONTRIB_COLS, [c.paymentDate || formatDate(c.createdAt), c.fundTitle || 'Fund', c.category || '', [c.paymentMethod, c.paymentRef].filter(Boolean).join(' '), formatMoney(c.amount)]));
      rule();
      cols(CONTRIB_COLS, ['', '', '', 'Total', formatMoney(contributed)], true);

      room(14);
      y += 4;
      doc.setFont("helvetica", "italic"); doc.setFontSize(8);
      doc.text("Outstanding = billed - paid; bills with payment proof under review stay outstanding until management verifies them. Cancelled bills are excluded.", 15, y, { maxWidth: 180 });

      const fileName = `Statement_${String(house).replace(/[^A-Za-z0-9]+/g, '_')}_${dateStamp()}.pdf`;
      doc.save(fileName);
      logExport('resident_statement', fileName);
    } catch (err) {
      toast("Error generating statement: " + err.message);
    }
  };

  // --- PAYMENT PROOF (UPLOAD + VERIFY) ---
  const PROOF_MAX_PDF_BYTES = 650 * 1024;

  function readProofFile(file) {
    return new Promise((resolve, reject) => {
      if (!file) return reject(new Error("Please choose a file."));
      const isImage = file.type === 'image/png' || file.type === 'image/jpeg';
      const isPdf = file.type === 'application/pdf';
      if (!isImage && !isPdf) return reject(new Error("Only PNG, JPEG or PDF files are allowed."));

      if (isPdf) {
        if (file.size > PROOF_MAX_PDF_BYTES) return reject(new Error("PDF is too large (max 650 KB). Please upload a screenshot image instead."));
        const reader = new FileReader();
        reader.onload = () => resolve({ dataUrl: reader.result, type: 'pdf', name: file.name });
        reader.onerror = () => reject(new Error("Could not read the file."));
        reader.readAsDataURL(file);
        return;
      }

      const img = new Image();
      const url = URL.createObjectURL(file);
      img.onload = () => {
        URL.revokeObjectURL(url);
        const maxSide = 1280;
        const scale = Math.min(1, maxSide / Math.max(img.width, img.height));
        const canvas = document.createElement('canvas');
        canvas.width = Math.round(img.width * scale);
        canvas.height = Math.round(img.height * scale);
        canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
        const dataUrl = canvas.toDataURL('image/jpeg', 0.75);
        if (dataUrl.length > 950 * 1024) return reject(new Error("Image is too large even after compression. Please crop it and try again."));
        resolve({ dataUrl, type: 'image', name: file.name });
      };
      img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("Could not read the image file.")); };
      img.src = url;
    });
  }

  window.viewProofFile = function(kind, id) {
    const record = kind === 'bill'
      ? billsList.find(item => item.id === id)
      : fundContribsList.find(item => item.id === id);
    if (!record || !record.proofData) return;
    try {
      const parts = record.proofData.split(',');
      const mime = parts[0].match(/data:([^;]+)/)[1];
      const bytes = atob(parts[1]);
      const arr = new Uint8Array(bytes.length);
      for (let i = 0; i < bytes.length; i++) arr[i] = bytes.charCodeAt(i);
      window.open(URL.createObjectURL(new Blob([arr], { type: mime })), '_blank');
    } catch(err) {
      toast("Could not open the proof file: " + err.message);
    }
  };

  // --- CUSTOM PICKER (styled replacement for <select>) ---
  // pickerHtml() renders a hidden input (#id, holds the value) plus a trigger
  // and an inline searchable options panel; read the value from #id as usual.
  // option: { value, label, sub, initials, avatarClass, tag, group }
  const pickerRegistry = {};

  function initialsOf(name) {
    const parts = String(name || '').replace(/\(.*?\)/g, '').trim().split(/\s+/).filter(Boolean);
    if (!parts.length) return '?';
    return ((parts[0][0] || '') + (parts.length > 1 ? parts[parts.length - 1][0] : '')).toUpperCase();
  }

  function pickerAvatarHtml(o) {
    return `<span class="picker-avatar ${o.avatarClass || ''}">${escapeHtml(o.initials || initialsOf(o.label))}</span>`;
  }

  function pickerTriggerInner(o, placeholder) {
    if (!o) return `<span class="picker-avatar cat">?</span><span class="picker-text"><span class="picker-main" style="color:var(--text-faint); font-weight:600;">${escapeHtml(placeholder)}</span></span>`;
    return `${pickerAvatarHtml(o)}<span class="picker-text"><span class="picker-main">${escapeHtml(o.label)}</span>${o.sub ? `<span class="picker-sub">${escapeHtml(o.sub)}</span>` : ''}</span>`;
  }

  function pickerOptionsHtml(id, options, selected, query) {
    const q = String(query || '').trim().toLowerCase();
    const visible = q ? options.filter(o => `${o.label} ${o.sub || ''} ${o.tag || ''}`.toLowerCase().includes(q)) : options;
    if (!visible.length) return `<div class="picker-empty">No matches for “${escapeHtml(query)}”</div>`;
    let lastGroup = null;
    return visible.map(o => {
      let head = '';
      if (o.group && o.group !== lastGroup) {
        lastGroup = o.group;
        const count = visible.filter(v => v.group === o.group).length;
        head = `<div class="picker-group"><span>${escapeHtml(o.group)}</span><span>${count}</span></div>`;
      }
      return head + `
        <button type="button" class="picker-opt ${o.value === selected ? 'selected' : ''}" data-value="${escapeHtml(o.value)}" onclick="pickerSelect('${id}', this.dataset.value)">
          ${pickerAvatarHtml(o)}
          <span class="picker-text"><span class="picker-main">${escapeHtml(o.label)}</span>${o.sub ? `<span class="picker-sub">${escapeHtml(o.sub)}</span>` : ''}</span>
          ${o.tag ? `<span class="picker-tag">${escapeHtml(o.tag)}</span>` : ''}
          <span class="picker-check">✓</span>
        </button>`;
    }).join('');
  }

  function pickerHtml(id, options, opts = {}) {
    const selected = opts.value !== undefined ? opts.value : (options[0] ? options[0].value : '');
    const placeholder = opts.placeholder || 'Select…';
    pickerRegistry[id] = { options, selected, placeholder, searchable: opts.searchable !== false && options.length > 6, searchPlaceholder: opts.searchPlaceholder || 'Search…' };
    const cur = options.find(o => o.value === selected);
    const reg = pickerRegistry[id];
    return `
      <div class="picker" id="picker-${id}">
        <input type="hidden" id="${id}" value="${escapeHtml(selected)}" />
        <button type="button" class="picker-trigger" id="picker-trigger-${id}" onclick="pickerToggle('${id}')" aria-haspopup="listbox">
          ${pickerTriggerInner(cur, placeholder)}
          <span class="picker-chev"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg></span>
        </button>
        <div class="picker-panel" role="listbox">
          ${reg.searchable ? `<div class="picker-search-wrap"><input type="search" class="picker-search" id="picker-search-${id}" placeholder="${escapeHtml(reg.searchPlaceholder)}" autocomplete="off" oninput="pickerFilter('${id}', this.value)" /></div>` : ''}
          <div class="picker-list" id="picker-list-${id}">${pickerOptionsHtml(id, options, selected, '')}</div>
        </div>
      </div>`;
  }

  window.pickerToggle = function(id) {
    const el = document.getElementById(`picker-${id}`);
    if (!el) return;
    const opening = !el.classList.contains('open');
    document.querySelectorAll('.picker.open').forEach(p => p.classList.remove('open'));
    if (!opening) return;
    el.classList.add('open');
    const search = document.getElementById(`picker-search-${id}`);
    if (search) { search.value = ''; pickerFilter(id, ''); setTimeout(() => search.focus(), 30); }
    const sel = el.querySelector('.picker-opt.selected');
    if (sel) sel.scrollIntoView({ block: 'nearest' });
  };

  window.pickerFilter = function(id, query) {
    const reg = pickerRegistry[id];
    const list = document.getElementById(`picker-list-${id}`);
    if (!reg || !list) return;
    list.innerHTML = pickerOptionsHtml(id, reg.options, reg.selected, query);
  };

  window.pickerSelect = function(id, value) {
    const reg = pickerRegistry[id];
    const el = document.getElementById(`picker-${id}`);
    if (!reg || !el) return;
    reg.selected = value;
    const cur = reg.options.find(o => o.value === value);
    document.getElementById(id).value = value;
    const trigger = document.getElementById(`picker-trigger-${id}`);
    trigger.innerHTML = pickerTriggerInner(cur, reg.placeholder) + trigger.querySelector('.picker-chev').outerHTML;
    el.classList.remove('open');
    pickerFilter(id, '');
    if (typeof reg.onChange === 'function') reg.onChange(value, cur);
  };

  function pickerOnChange(id, fn) {
    if (pickerRegistry[id]) pickerRegistry[id].onChange = fn;
  }

    document.querySelectorAll('.picker.open').forEach(p => { if (!p.contains(e.target)) p.classList.remove('open'); });

  // --- COMMUNITY FUNDS ---
  function contribQueries() {
    // Staff can read all contributions; residents can only read verified ones
    // (for fund totals) plus their own — collection-wide reads are denied by rules.
    if (isStaff()) return [db.collection('fund_contributions').get()];
    return [
      db.collection('fund_contributions').where('status', '==', 'verified').get(),
      db.collection('fund_contributions').where('uid', '==', auth.currentUser.uid).get()
    ];
  }

  function mergeContribSnaps(snaps) {
    const map = {};
    snaps.forEach(snap => snap.docs.forEach(doc => { map[doc.id] = { id: doc.id, ...doc.data() }; }));
    return Object.values(map);
  }

  window.exportContributionsCSV = function() {
    if (!isStaff()) return;
    const rows = fundContribsList.filter(c => !c.isDeleted).map(c => [
      c.fundTitle, c.category, c.name, c.house, Number(c.amount || 0), c.status || 'submitted',
      c.paymentDate || isoDate(c.createdAt), c.paymentMethod, c.paymentRef, c.verifiedBy || c.recordedBy, isoDate(c.createdAt)
    ]);
    if (!rows.length) return toast("No contributions to export yet. Open the Funds tab first so they load.");
    downloadCSV(`RPHS_Contributions_${dateStamp()}.csv`,
      ['Fund', 'Fund Category', 'Contributor', 'House', 'Amount (PKR)', 'Status', 'Payment Date', 'Method', 'Ref', 'Verified By', 'Submitted On'],
      rows, 'contributions_csv');
  };

  function loadFunds() {
    if (!db || !auth.currentUser) return;
    Promise.all([
      db.collection('funds').get(),
      Promise.all(contribQueries()).then(mergeContribSnaps),
      db.collection('expenses').get(),
      db.collection('transfers').get()
    ]).then(([fundsSnap, contribDocs, expSnap, transfersSnap]) => {
      fundExpensesList = expSnap.docs.map(d => ({ id: d.id, ...d.data() })).filter(x => !x.isDeleted);
      fundTransfersList = transfersSnap.docs.map(d => ({ id: d.id, ...d.data() })).filter(t => !t.isDeleted);
      fundsList = fundsSnap.docs
        .map(doc => ({ id: doc.id, ...doc.data() }))
        .filter(f => !f.isDeleted)
        .sort((a, b) => {
          const da = toDate(a.createdAt), dbb = toDate(b.createdAt);
          return (dbb ? dbb.getTime() : 0) - (da ? da.getTime() : 0);
        });
      fundContribsList = contribDocs
        .sort((a, b) => {
          const da = toDate(a.createdAt), dbb = toDate(b.createdAt);
          return (dbb ? dbb.getTime() : 0) - (da ? da.getTime() : 0);
        });
      renderFundsList();
    }).catch(e => { console.error("Error loading funds:", e); showLoadError('funds-list', e); });
  }

  function fundVerifiedTotal(fundId) {
    return fundContribsList.filter(c => c.fundId === fundId && c.status === 'verified').reduce((s, c) => s + Number(c.amount || 0), 0);
  }

  function renderFundsList() {
    const listEl = document.getElementById('funds-list');
    if (!listEl) return;
    const isAdmin = currentUserProfile.role === 'admin';

    const summaryEl = document.getElementById('funds-summary');
    if (summaryEl && isAdmin) {
      const acct = allFundsSummary(fundContribsList, fundExpensesList, fundTransfersList);
      const pendingCount = fundContribsList.filter(c => c.status === 'submitted').length;
      summaryEl.innerHTML = `
        <div class="stat-strip">
          <div class="stat-box"><div class="k">Active Funds</div><div class="v">${fundsList.filter(f => (f.status || 'active') === 'active').length}</div></div>
          <div class="stat-box"><div class="k">Collected</div><div class="v" style="color:var(--success);">${formatMoney(acct.collected)}</div></div>
          <div class="stat-box"><div class="k">To Verify</div><div class="v" style="color:${pendingCount ? 'var(--info)' : 'var(--text)'};">${pendingCount}</div></div>
        </div>
        <div class="stat-strip">
          <div class="stat-box"><div class="k">Spent From Funds</div><div class="v" style="color:var(--danger);">${formatMoney(acct.spent)}</div></div>
          <div class="stat-box"><div class="k">Funds Balance</div><div class="v" style="color:${balanceColor(acct.balance)};">${formatMoney(acct.balance)}</div>${acct.transferredIn || acct.transferredOut ? `<div style="font-size:13px; color:var(--text-faint); margin-top:2px;">${formatMoney(acct.transferredIn)} in · ${formatMoney(acct.transferredOut)} out via transfers</div>` : ''}</div>
        </div>
      `;
    }

    if (!fundsList.length) {
      listEl.innerHTML = `<div class="card" style="text-align:center; color:var(--text-muted);">${isAdmin ? 'No funds started yet. Use "+ Start Fund" to raise one.' : 'No community funds are running right now.'}</div>`;
      return;
    }

    listEl.innerHTML = fundsList.map(f => {
      const status = f.status || 'active';
      const collected = fundVerifiedTotal(f.id);
      const acct = fundSummary(f.id, fundContribsList, fundExpensesList, fundTransfersList);
      const target = Number(f.targetAmount || 0);
      const pct = target > 0 ? Math.min(100, Math.round(collected / target * 100)) : 0;
      const contributors = new Set(fundContribsList.filter(c => c.fundId === f.id && c.status === 'verified').map(c => c.uid)).size;
      const myPending = fundContribsList.filter(c => c.fundId === f.id && c.uid === auth.currentUser.uid && c.status === 'submitted').length;
      const pendingCount = fundContribsList.filter(c => c.fundId === f.id && c.status === 'submitted').length;

      return `
        <div class="card" onclick="openFundDetailModal('${f.id}')">
          <div style="display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:6px;">
            <span style="font-weight:700; font-size:15px; color:var(--accent-2);">${escapeHtml(f.title || 'Fund')}</span>
            <span class="badge ${status}">${escapeHtml(statusLabel(status))}</span>
          </div>
          <div style="font-size:13px; color:var(--text-muted); line-height:1.5; margin-bottom:8px;">${escapeHtml((f.purpose || '').slice(0, 120))}${(f.purpose || '').length > 120 ? '…' : ''}</div>
          ${target > 0 ? `
            <div class="progress"><div class="fill" style="width:${pct}%;"></div></div>
            <div style="display:flex; justify-content:space-between; font-size:13px;">
              <span style="font-family:var(--font-mono); color:var(--success);">${formatMoney(collected)}</span>
              <span style="color:var(--text-faint);">${pct}% of ${formatMoney(target)}</span>
            </div>
          ` : `<div style="font-size:13px;"><span style="color:var(--text-faint);">Collected:</span> <span style="font-family:var(--font-mono); color:var(--success);">${formatMoney(collected)}</span></div>`}
          <div style="display:flex; gap:14px; font-size:13px; margin-top:6px;">
            <span><span style="color:var(--text-faint);">Spent:</span> <span style="font-family:var(--font-mono); color:var(--danger);">${formatMoney(acct.spent)}</span></span>
            <span><span style="color:var(--text-faint);">Balance:</span> <span style="font-family:var(--font-mono); color:${balanceColor(acct.balance)}; font-weight:600;">${formatMoney(acct.balance)}</span></span>
          </div>
          <div style="font-size:13px; color:var(--text-faint); margin-top:6px;">${contributors} contributor(s) · Started ${escapeHtml(formatDate(f.createdAt))}${f.deadline ? ' · Deadline ' + escapeHtml(formatDate(f.deadline)) : ''}${isAdmin && pendingCount ? ` · <span style="color:var(--info);">${pendingCount} awaiting verification</span>` : ''}${!isAdmin && myPending ? ' · <span style="color:var(--info);">Your contribution is under review</span>' : ''}</div>
          ${isAdmin ? `<div style="display:flex; justify-content:flex-end; margin-top:6px;"><button class="dots-btn" onclick="event.stopPropagation(); openCardMenu('fund', '${f.id}')" aria-label="More actions">${icon('dots')}</button></div>` : ''}
        </div>
      `;
    }).join('');
  }

  window.openCreateFundModal = function() {
    if (currentUserProfile.role !== 'admin') return;

    document.getElementById('modal-body').innerHTML = `
      <div style="font-family:var(--font-display); font-size:20px; font-weight:600; margin-bottom:12px;">Start a Community Fund</div>
      <form id="fund-form">
        <label>Fund Title</label>
        <input type="text" id="fund-title" placeholder="e.g. Mosque Renovation Fund" required />
        <label>Fund Category</label>
        <select id="fund-category" required>
          ${FUND_CATEGORIES.map(c => `<option value="${c}">${c}</option>`).join('')}

        <label>What is this fund for & why is it needed?</label>
        <textarea id="fund-purpose" placeholder="Explain the purpose and why the society needs it..." required></textarea>
        <label>Target Amount (PKR, optional)</label>
        <input type="number" id="fund-target" placeholder="e.g. 250000" min="1" />
        <label>Target Deadline (optional)</label>
