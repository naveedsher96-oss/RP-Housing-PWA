<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<title>Roshan Pakistan Housing Society</title>
<meta name="theme-color" content="#10142A" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Roshan RPHS" />
<meta name="mobile-web-app-capable" content="yes" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<!-- Firebase (free tier) powers the shared data for this app once hosted on a real website -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
  :root{
    --bg:#10142A;
    --bg-elevated:#171C3B;
    --bg-elevated-2:#1E2447;
    --bg-elevated-3:#242B54;
    --accent:#F2A93B;
    --accent-2:#FFC670;
    --accent-soft:rgba(242,169,59,0.14);
    --text:#F1F2F9;
    --text-muted:#9AA0C3;
    --text-faint:#6B7099;
    --success:#34B398;
    --success-soft:rgba(52,179,152,0.14);
    --danger:#E5615A;
    --danger-soft:rgba(229,97,90,0.14);
    --warning:#F2A93B;
    --warning-soft:rgba(242,169,59,0.14);
    --info:#6E8FF2;
    --info-soft:rgba(110,143,242,0.14);
    --border:rgba(255,255,255,0.08);
    --border-soft:rgba(255,255,255,0.05);
    --radius:16px;
    --radius-sm:10px;
    --shadow:0 8px 30px rgba(0,0,0,0.35);
    --font-display:'Fraunces', serif;
    --font-body:'Manrope', -apple-system, BlinkMacSystemFont, sans-serif;
    --font-mono:'JetBrains Mono', monospace;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    background:
      radial-gradient(circle at 20% -10%, rgba(242,169,59,0.10), transparent 45%),
      radial-gradient(circle at 90% 0%, rgba(110,143,242,0.08), transparent 40%),
      var(--bg);
    color:var(--text);
    font-family:var(--font-body);
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  #app{
    max-width:520px;
    margin:0 auto;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    position:relative;
    padding-bottom:calc(78px + env(safe-area-inset-bottom));
  }
  a{color:inherit;}
  button{font-family:inherit;}
  ::selection{background:var(--accent-soft);}

  /* ---------- Header ---------- */
  .topbar{
    position:sticky; top:0; z-index:30;
    padding:calc(16px + env(safe-area-inset-top)) 18px 14px;
    background:linear-gradient(180deg, rgba(16,20,42,0.97), rgba(16,20,42,0.88) 70%, rgba(16,20,42,0));
    backdrop-filter:blur(10px);
    display:flex; align-items:center; gap:12px;
    border-bottom:1px solid var(--border-soft);
  }
  .brand-mark{
    width:42px; height:42px; border-radius:12px;
    background:#fff;
    box-shadow:0 0 0 1px rgba(255,255,255,0.08), 0 0 18px 2px rgba(242,169,59,0.45);
    display:flex; align-items:center; justify-content:center;
    flex:none; padding:4px; overflow:hidden;
  }
  .brand-mark img{ width:100%; height:100%; object-fit:contain; display:block; }
  .brand-text{flex:1; min-width:0;}
  .brand-text .name{font-family:var(--font-display); font-weight:600; font-size:16.5px; line-height:1.2; letter-spacing:0.1px;}
  .brand-text .sub{font-size:11.5px; color:var(--text-muted); margin-top:2px; display:flex; align-items:center; gap:6px;}
  .role-pill{
    font-size:10.5px; font-weight:700; letter-spacing:0.4px; text-transform:uppercase;
    padding:2px 8px; border-radius:20px; background:var(--accent-soft); color:var(--accent-2);
    border:1px solid rgba(242,169,59,0.3);
  }
  .icon-btn{
    width:38px; height:38px; border-radius:12px; border:1px solid var(--border);
    background:var(--bg-elevated); color:var(--text-muted); display:flex; align-items:center; justify-content:center;
    cursor:pointer; flex:none; transition:transform .15s ease, background .15s ease, color .15s ease;
  }
  .icon-btn:active{transform:scale(0.92);}
  .icon-btn.spinning svg{animation:spin 0.8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}

  /* ---------- Main / sections ---------- */
  main{flex:1; padding:18px 18px 10px;}
  .section-title{
    font-family:var(--font-display); font-weight:600; font-size:22px; margin:4px 0 4px;
    display:flex; align-items:center; justify-content:space-between; gap:10px;
  }
  .section-sub{color:var(--text-muted); font-size:13px; margin:0 0 18px; line-height:1.5;}
  .card{
    background:var(--bg-elevated);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:16px;
    margin-bottom:12px;
    box-shadow:var(--shadow);
  }
  .card + .card{margin-top:12px;}
  .row{display:flex; align-items:center; gap:10px;}
  .row.between{justify-content:space-between;}
  .stat-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:18px;}
  .stat-card{
    background:var(--bg-elevated); border:1px solid var(--border); border-radius:var(--radius-sm);
    padding:14px; position:relative; overflow:hidden;
  }
  .stat-card .glow{position:absolute; top:-20px; right:-20px; width:70px; height:70px; border-radius:50%; background:radial-gradient(circle, rgba(242,169,59,0.25), transparent 70%);}
  .stat-card .num{font-family:var(--font-mono); font-size:26px; font-weight:600; color:var(--accent-2);}
  .stat-card .lbl{font-size:11.5px; color:var(--text-muted); margin-top:2px;}
  .quick-actions{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:6px;}
  .qa-btn{
    background:var(--bg-elevated); border:1px solid var(--border); border-radius:var(--radius-sm);
    padding:14px 12px; text-align:left; cursor:pointer; color:var(--text); font-family:inherit;
    display:flex; flex-direction:column; gap:8px; transition:background .15s ease, transform .1s ease;
  }
  .qa-btn:active{transform:scale(0.97);}
  .qa-btn svg{color:var(--accent);}
  .qa-btn .t{font-size:13px; font-weight:700;}
  .qa-btn .d{font-size:11px; color:var(--text-muted); line-height:1.3;}

  h1,h2,h3,p{margin:0;}
  .empty-state{
    text-align:center; padding:40px 16px; color:var(--text-muted);
  }
  .empty-state .icon{color:var(--text-faint); margin-bottom:10px;}
  .empty-state .t{font-family:var(--font-display); font-size:16px; color:var(--text); margin-bottom:4px;}
  .empty-state .d{font-size:12.5px; line-height:1.5;}

  .badge{
    display:inline-flex; align-items:center; gap:5px; font-size:10.5px; font-weight:700; letter-spacing:.3px;
    text-transform:uppercase; padding:3px 9px; border-radius:20px; white-space:nowrap;
  }
  .badge.open, .badge.pending, .badge.due{background:var(--warning-soft); color:var(--accent-2);}
  .badge.progress{background:var(--info-soft); color:#A9BCF7;}
  .badge.resolved, .badge.approved, .badge.paid{background:var(--success-soft); color:#6BD9BE;}
  .badge.rejected, .badge.overdue{background:var(--danger-soft); color:#F19A95;}
  .badge.closed{background:rgba(255,255,255,0.08); color:var(--text-muted);}
  .badge .dot{width:5px; height:5px; border-radius:50%; background:currentColor; box-shadow:0 0 6px currentColor;}

  .list-item{border-top:1px solid var(--border-soft); padding:12px 0;}
  .list-item:first-child{border-top:none; padding-top:2px;}
  .list-title{font-weight:700; font-size:14.5px; margin-bottom:3px;}
  .list-meta{font-size:11.5px; color:var(--text-muted);}
  .list-body{font-size:13px; color:#D6D9EC; line-height:1.5; margin-top:6px;}

  .pin-flag{color:var(--accent); flex:none;}

  /* buttons */
  .btn{
    font-family:inherit; font-weight:700; font-size:13.5px; border:none; border-radius:12px;
    padding:12px 16px; cursor:pointer; display:inline-flex; align-items:center; justify-content:center; gap:8px;
    transition:transform .1s ease, opacity .15s ease;
  }
  .btn:active{transform:scale(0.97);}
  .btn.primary{background:linear-gradient(180deg, var(--accent-2), var(--accent)); color:#251400; box-shadow:0 4px 16px rgba(242,169,59,0.35);}
  .btn.secondary{background:var(--bg-elevated-2); color:var(--text); border:1px solid var(--border);}
  .btn.danger{background:var(--danger-soft); color:#F19A95; border:1px solid rgba(229,97,90,0.3);}
  .btn.success{background:var(--success-soft); color:#6BD9BE; border:1px solid rgba(52,179,152,0.3);}
  .btn.block{width:100%;}
  .btn.sm{padding:8px 12px; font-size:12.5px; border-radius:9px;}
  .btn:disabled{opacity:.45; cursor:not-allowed;}
  .btn-row{display:flex; gap:8px; margin-top:12px; flex-wrap:wrap;}

  .fab{
    position:fixed; right:calc(50% - 260px + 18px); bottom:calc(90px + env(safe-area-inset-bottom));
    width:54px; height:54px; border-radius:50%; border:none; cursor:pointer;
    background:linear-gradient(180deg, var(--accent-2), var(--accent));
    box-shadow:0 6px 22px rgba(242,169,59,0.5);
    display:flex; align-items:center; justify-content:center; color:#251400; z-index:25;
  }
  @media (max-width:559px){ .fab{right:18px;} }
  .fab:active{transform:scale(0.94);}

  /* form elements */
  label{display:block; font-size:12px; font-weight:700; color:var(--text-muted); margin:14px 0 6px; text-transform:uppercase; letter-spacing:.3px;}
  label:first-child{margin-top:0;}
  input[type=text], input[type=number], input[type=date], input[type=time], input[type=tel], select, textarea{
    width:100%; background:var(--bg); border:1px solid var(--border); color:var(--text);
    border-radius:10px; padding:12px 13px; font-family:inherit; font-size:14.5px; outline:none;
    transition:border-color .15s ease;
  }
  input:focus, select:focus, textarea:focus{border-color:var(--accent);}
  textarea{resize:vertical; min-height:80px;}
  .radio-group{display:flex; gap:8px; flex-wrap:wrap;}
  .radio-chip{
    flex:1; min-width:100px; text-align:center; padding:11px 10px; border-radius:10px; border:1px solid var(--border);
    background:var(--bg); font-size:13px; font-weight:700; cursor:pointer; color:var(--text-muted);
  }
  .radio-chip.active{background:var(--accent-soft); border-color:var(--accent); color:var(--accent-2);}
  .checkbox-row{display:flex; align-items:center; gap:9px; margin-top:14px; font-size:13px; color:var(--text);}
  .checkbox-row input{width:18px; height:18px; accent-color:var(--accent);}
  .hint{font-size:11.5px; color:var(--text-faint); margin-top:6px; line-height:1.5;}
  .error-text{font-size:12px; color:#F19A95; margin-top:8px;}

  /* poll bars */
  .poll-option{margin-bottom:10px;}
  .poll-option-bar-bg{background:var(--bg); border-radius:8px; overflow:hidden; height:34px; position:relative; border:1px solid var(--border);}
  .poll-option-bar-fill{height:100%; background:linear-gradient(90deg, rgba(242,169,59,0.35), rgba(242,169,59,0.55)); display:flex; align-items:center;}
  .poll-option-label{position:absolute; left:12px; top:0; height:100%; display:flex; align-items:center; font-size:12.5px; font-weight:700; z-index:2;}
  .poll-option-pct{position:absolute; right:12px; top:0; height:100%; display:flex; align-items:center; font-family:var(--font-mono); font-size:12px; z-index:2; color:var(--text-muted);}
  .poll-btn{
    display:block; width:100%; text-align:left; background:var(--bg); border:1px solid var(--border); color:var(--text);
    padding:12px 14px; border-radius:10px; font-family:inherit; font-size:13.5px; font-weight:600; cursor:pointer; margin-bottom:8px;
  }
  .poll-btn:active{background:var(--bg-elevated-2);}

  /* modal */
  .modal-backdrop{
    position:fixed; inset:0; background:rgba(6,8,20,0.72); backdrop-filter:blur(3px); z-index:100;
    display:flex; align-items:flex-end; justify-content:center;
    animation:fadeIn .18s ease;
  }
  @keyframes fadeIn{from{opacity:0;} to{opacity:1;}}
  .modal-sheet{
    width:100%; max-width:520px; background:var(--bg-elevated); border-radius:22px 22px 0 0;
    padding:20px 20px calc(24px + env(safe-area-inset-bottom)); max-height:88vh; overflow-y:auto;
    animation:slideUp .22s cubic-bezier(.2,.8,.3,1);
    border:1px solid var(--border); border-bottom:none;
  }
  @keyframes slideUp{from{transform:translateY(30px); opacity:0;} to{transform:translateY(0); opacity:1;}}
  .modal-handle{width:38px; height:4px; border-radius:3px; background:var(--border); margin:0 auto 16px;}
  .modal-title{font-family:var(--font-display); font-size:19px; font-weight:600; margin-bottom:2px;}

  /* bottom nav */
  nav.tabbar{
    position:fixed; bottom:0; left:0; right:0; z-index:40;
    display:flex; justify-content:center;
    padding-bottom:env(safe-area-inset-bottom);
    background:linear-gradient(0deg, rgba(16,20,42,0.98), rgba(16,20,42,0.9));
    border-top:1px solid var(--border-soft);
    backdrop-filter:blur(10px);
  }
  .tabbar-inner{
    max-width:520px; width:100%; display:flex; overflow-x:auto; scrollbar-width:none; gap:2px; padding:8px 6px;
  }
  .tabbar-inner::-webkit-scrollbar{display:none;}
  .tab-btn{
    flex:1 0 auto; min-width:64px; background:none; border:none; color:var(--text-faint); cursor:pointer;
    display:flex; flex-direction:column; align-items:center; gap:4px; padding:6px 4px; border-radius:12px; position:relative;
  }
  .tab-btn.active{color:var(--accent-2);}
  .tab-btn .lbl{font-size:9.5px; font-weight:700; letter-spacing:.2px;}
  .tab-dot{position:absolute; top:2px; right:14px; width:7px; height:7px; border-radius:50%; background:var(--accent); box-shadow:0 0 6px var(--accent);}

  .toast{
    position:fixed; bottom:calc(90px + env(safe-area-inset-bottom)); left:50%; transform:translateX(-50%);
    background:var(--bg-elevated-3); border:1px solid var(--border); color:var(--text); padding:11px 18px;
    border-radius:30px; font-size:13px; font-weight:600; z-index:200; box-shadow:var(--shadow);
    display:flex; align-items:center; gap:8px; animation:toastIn .25s ease;
  }
  @keyframes toastIn{from{opacity:0; transform:translate(-50%, 10px);} to{opacity:1; transform:translate(-50%,0);}}

  /* onboarding */
  .onboard-wrap{min-height:100vh; display:flex; flex-direction:column; justify-content:center; padding:32px 24px; max-width:480px; margin:0 auto;}
  .onboard-logo{width:84px; height:84px; border-radius:20px; margin:0 auto 22px; background:#fff; box-shadow:0 0 0 1px rgba(255,255,255,0.08), 0 0 40px 6px rgba(242,169,59,0.4); display:flex; align-items:center; justify-content:center; padding:8px; overflow:hidden;}
  .onboard-logo img{ width:100%; height:100%; object-fit:contain; display:block; }
  .onboard-title{font-family:var(--font-display); font-size:26px; font-weight:600; text-align:center; margin-bottom:6px;}
  .onboard-sub{text-align:center; color:var(--text-muted); font-size:13.5px; margin-bottom:30px; line-height:1.5;}

  .link-btn{background:none; border:none; color:var(--accent-2); font-size:12.5px; font-weight:700; cursor:pointer; padding:6px 0; font-family:inherit;}

  .divider{height:1px; background:var(--border-soft); margin:16px 0;}

  ::-webkit-scrollbar{width:0px;}
</style>
</head>

    try{
      const raw = localStorage.getItem('roshan_' + key);
      return raw !== null ? JSON.parse(raw) : fallback;
    }catch(e){ return fallback; }
  }
  if(!db) return fallback;
  try{
    const doc = await db.collection(SOCIETY_COLLECTION).doc(key).get();
    if(doc.exists && doc.data() && doc.data().value !== undefined){
      try{ return JSON.parse(doc.data().value); }catch(e){ return doc.data().value; }
    }
    return fallback;
  }catch(e){ console.error('firestore read failed', key, e); return fallback; }
}
async function saveKey(key, shared, value){
  if(!shared){
    try{
      localStorage.setItem('roshan_' + key, JSON.stringify(value));
      return true;
    }catch(e){ return false; }
  }
  if(!db) return false;
  try{
    await db.collection(SOCIETY_COLLECTION).doc(key).set({value: JSON.stringify(value)});
    return true;
  }catch(e){ console.error('firestore write failed', key, e); return false; }
}

let state = {

  adminPin:null,
  notices:[], complaints:[], bills:[], bookings:[], polls:[], visitors:[], facilities:[],

  loading:true,
  onboardStep:'welcome',  // welcome -> details -> adminpin
  onboardData:{name:'', flat:'', role:'resident', pin:''},
  modal:null,             // {type, payload}
  toast:null
};

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
function nowISO(){ return new Date().toISOString(); }
function fmtDate(iso){
  if(!iso) return '';
  const d = new Date(iso);
  return d.toLocaleDateString('en-GB', {day:'numeric', month:'short', year:'numeric'});
}
function fmtDateTime(iso){
  if(!iso) return '';
  const d = new Date(iso);
  return d.toLocaleDateString('en-GB',{day:'numeric',month:'short'}) + ', ' + d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
}
function timeAgo(iso){
  const diff = (Date.now() - new Date(iso).getTime())/1000;
  if(diff < 60) return 'just now';
  if(diff < 3600) return Math.floor(diff/60)+'m ago';
  if(diff < 86400) return Math.floor(diff/3600)+'h ago';
  if(diff < 86400*7) return Math.floor(diff/86400)+'d ago';
  return fmtDate(iso);
}
function money(n){
  n = Number(n)||0;
  return 'Rs ' + n.toLocaleString('en-PK');
}
function showToast(msg){
  state.toast = msg;
  render();
  clearTimeout(showToast._t);
  showToast._t = setTimeout(()=>{ state.toast=null; render(); }, 2200);
}
function closeModal(){ state.modal = null; render(); }
function openModal(type, payload){ state.modal = {type, payload: payload||{}}; render(); }

/* ============ INIT / LOAD ============ */
async function init(){
  if(!FIREBASE_CONFIGURED){ renderSetupNeeded(); return; }
  state.profile = await loadKey('profile', false, null);
  await refreshAll(true);
  state.loading = false;
  render();
  setInterval(()=>{ if(!state.modal) refreshAll(false); }, 20000);
}
async function refreshAll(isInitial){
  const [adminPin, notices, complaints, bills, bookings, polls, visitors, facilities] = await Promise.all([
    loadKey('admin-pin', true, null),
    loadKey('notices', true, []),
    loadKey('complaints', true, []),
    loadKey('bills', true, []),
    loadKey('bookings', true, []),
    loadKey('polls', true, []),
    loadKey('visitors', true, []),
    loadKey('facilities', true, null),
  ]);
  state.adminPin = adminPin;
  state.notices = notices || [];
  state.complaints = complaints || [];
  state.bills = bills || [];
  state.bookings = bookings || [];
  state.polls = polls || [];
  state.visitors = visitors || [];
  if(facilities === null){
    state.facilities = ['Community Hall','Gym','Guest Parking','Garden Lawn'];
    saveKey('facilities', true, state.facilities);
  } else {
    state.facilities = facilities;
  }
  if(!isInitial) render();
}
async function manualRefresh(){
  const btn = document.getElementById('refreshBtn');
  if(btn) btn.classList.add('spinning');
  await refreshAll(false);
  if(btn) btn.classList.remove('spinning');
  showToast('Updated');
}

/* ============ RENDER SHELL ============ */
const TABS = [
  {id:'home', label:'Home', icon:'home'},
  {id:'notices', label:'Notices', icon:'bell'},
  {id:'complaints', label:'Complaints', icon:'wrench'},
  {id:'bills', label:'Bills', icon:'receipt'},
  {id:'book', label:'Book', icon:'calendar'},
  {id:'polls', label:'Polls', icon:'chart'},
  {id:'visitors', label:'Visitors', icon:'shield'},
  {id:'settings', label:'Settings', icon:'settings'}
];

function hasNoticeUnread(){
  if(!state.profile) return false;
  const seen = state.profile.lastSeenNotice || '1970-01-01';
  return state.notices.some(n=>n.date > seen);
}
function myOpenComplaints(){
  if(!state.profile) return [];
  return state.complaints.filter(c=> state.profile.role==='admin' ? c.status!=='resolved' : (c.flat===state.profile.flat));
}
function myDueBills(){
  if(!state.profile) return [];
  return state.bills.filter(b=> state.profile.role==='admin' ? b.status==='due' : (b.flat===state.profile.flat && b.status!=='paid'));
}

function render(){
  const root = document.getElementById('app');
  if(state.loading){
    root.innerHTML = `<div class="onboard-wrap"><div class="onboard-logo"><img src="${LOGO_DATA_URI}" alt="RP logo"/></div><div class="onboard-sub" style="text-align:center;">Loading your society...</div></div>`;
    return;
  }
  if(!state.profile){
    root.innerHTML = renderOnboarding();
    bindOnboardEvents();
    return;
  }
  let mainHtml = '';
  switch(state.tab){
    case 'home': mainHtml = renderHome(); break;
    case 'notices': mainHtml = renderNotices(); break;
    case 'complaints': mainHtml = renderComplaints(); break;
    case 'bills': mainHtml = renderBills(); break;
    case 'book': mainHtml = renderBook(); break;
    case 'polls': mainHtml = renderPolls(); break;
    case 'visitors': mainHtml = renderVisitors(); break;
    case 'settings': mainHtml = renderSettings(); break;
  }
  const tabbar = `
    <nav class="tabbar"><div class="tabbar-inner">
      ${TABS.map(t=>`
        <button class="tab-btn ${state.tab===t.id?'active':''}" data-action="go-tab" data-tab="${t.id}">
          ${t.id==='notices' && hasNoticeUnread() ? '<span class="tab-dot"></span>' : ''}
          ${icon(t.icon,21)}
          <span class="lbl">${t.label}</span>
        </button>
      `).join('')}
    </div></nav>
  `;
  root.innerHTML = `
    <div class="topbar">
      <div class="brand-mark"><img src="${LOGO_DATA_URI}" alt="RP logo"/></div>
      <div class="brand-text">
        <div class="name">Roshan Pakistan Housing Society</div>
        <div class="sub">${escapeHtml(state.profile.flat)} <span class="role-pill">${state.profile.role==='admin'?'Committee':'Resident'}</span></div>
      </div>
      <button class="icon-btn" id="refreshBtn" data-action="refresh">${icon('refresh',18)}</button>
    </div>
    <main>${mainHtml}</main>
    ${tabbar}
    ${state.modal ? renderModal() : ''}
    ${state.toast ? `<div class="toast">${icon('info',15)} ${escapeHtml(state.toast)}</div>` : ''}
  `;
  bindMainEvents();
}

/* ============ HOME ============ */

  const recentNotices = [...state.notices].sort(sortByPinnedDate).slice(0,3);

    <div class="quick-actions">
      <button class="qa-btn" data-action="go-tab" data-tab="complaints">${icon('wrench',22)}<div class="t">Raise a complaint</div><div class="d">Report a maintenance issue</div></button>
      <button class="qa-btn" data-action="go-tab" data-tab="book">${icon('calendar',22)}<div class="t">Book a facility</div><div class="d">Hall, gym, parking &amp; more</div></button>
      <button class="qa-btn" data-action="go-tab" data-tab="bills">${icon('receipt',22)}<div class="t">Check bills</div><div class="d">${isAdmin?'Manage maintenance dues':'View &amp; confirm payments'}</div></button>

function emptyState(iconName, title, desc){
  return `<div class="empty-state"><div class="icon">${icon(iconName,34,1.4)}</div><div class="t">${title}</div><div class="d">${desc}</div></div>`;
}
function sortByPinnedDate(a,b){
  if(!!b.pinned - !!a.pinned !== 0) return (!!b.pinned) - (!!a.pinned);
  return new Date(b.date) - new Date(a.date);
}

/* ============ POLLS ============ */
function renderPolls(){
  const isAdmin = state.profile.role==='admin';
  const list = [...state.polls].sort((a,b)=> new Date(b.date)-new Date(a.date));
  return `
    <div class="section-title">Polls &amp; Voting ${isAdmin? `<button class="icon-btn" data-action="new-poll">${icon('plus',18)}</button>`:''}</div>
    <p class="section-sub">Society decisions, made together.</p>
    ${list.length===0? `<div class="card">${emptyState('chart','No polls yet', isAdmin? 'Create a poll using the + button above.' : "The committee hasn't opened any polls yet.")}</div>` :
    list.map(p=>{
      const totalVotes = p.options.reduce((s,o)=>s+o.votes,0);
      const hasVoted = (p.voters||[]).includes(state.profile.id);
      const showResults = hasVoted || p.closed || isAdmin;
      return `
        <div class="card">
          <div class="row between">
            <div class="list-title" style="font-size:15.5px;">${escapeHtml(p.question)}</div>
            <span class="badge ${p.closed?'closed':'progress'}">${p.closed?'Closed':'Active'}</span>
          </div>
          <div class="list-meta" style="margin-bottom:12px;">${totalVotes} vote${totalVotes===1?'':'s'} · ${fmtDate(p.date)}</div>
          ${showResults?
            p.options.map(o=>{
              const pct = totalVotes? Math.round(o.votes/totalVotes*100) : 0;
              return `<div class="poll-option"><div class="poll-option-bar-bg"><div class="poll-option-bar-fill" style="width:${pct}%;"></div><div class="poll-option-label">${escapeHtml(o.text)}</div><div class="poll-option-pct">${pct}% · ${o.votes}</div></div></div>`;

            :

          }
          ${isAdmin && !p.closed? `<div class="btn-row"><button class="btn sm secondary" data-action="close-poll" data-id="${p.id}">Close poll</button></div>`:''}
        </div>
      `;
    }).join('')}
  `;
}

/* ============ EVENT BINDING ============ */
function bindOnboardEvents(){
  document.body.onclick = async function(e){
    const t = e.target.closest('[data-action]');
    if(!t) return;
    const action = t.dataset.action;
    if(action==='onboard-next-welcome'){ state.onboardStep='details'; render(); }
    if(action==='onboard-role'){ state.onboardData.role = t.dataset.role; render(); }
    if(action==='onboard-back'){ state.onboardStep='welcome'; render(); }
    if(action==='onboard-next-details'){
      const name = document.getElementById('ob-name').value.trim();
      const flat = document.getElementById('ob-flat').value.trim();
      if(!name || !flat){ showToastSimple('Please enter your name and flat number'); return; }
      state.onboardData.name = name; state.onboardData.flat = flat;
      if(state.onboardData.role==='resident'){
        finishOnboarding();
      } else {
        state.onboardStep='adminpin'; state.onboardError=null; render();
      }
    }
    if(action==='onboard-back-pin'){ state.onboardStep='details'; render(); }
    if(action==='onboard-finish'){
      const pin = document.getElementById('ob-pin').value.trim();
      if(!pin || pin.length<4){ state.onboardError='PIN must be at least 4 characters.'; render(); return; }
      if(state.adminPin){
        if(pin !== state.adminPin){ state.onboardError='Incorrect PIN. Ask your committee for the correct one.'; render(); return; }
      } else {
        state.adminPin = pin;
        await saveKey('admin-pin', true, pin);
      }
      state.onboardData.pin = pin;
      finishOnboarding();
    }
  };
}
function showToastSimple(msg){
  const el = document.createElement('div');
  el.className='toast'; el.style.position='fixed'; el.style.top='20px'; el.style.left='50%'; el.style.transform='translateX(-50%)'; el.style.bottom='auto';
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(()=>el.remove(), 2200);
}
async function finishOnboarding(){
  const d = state.onboardData;
  state.profile = {id: uid(), name:d.name, flat:d.flat, role:d.role, lastSeenNotice: nowISO()};
  await saveKey('profile', false, state.profile);
  state.tab='home';
  render();
}

function bindMainEvents(){
  document.body.onclick = async function(e){
    const backdrop = e.target.closest('[data-action="backdrop-close"]');
    if(backdrop && e.target === backdrop){ closeModal(); return; }
    const t = e.target.closest('[data-action]');
    if(!t) return;
    const action = t.dataset.action;
    const id = t.dataset.id;

    if(action==='go-tab'){ state.tab = t.dataset.tab; render(); return; }
    if(action==='refresh'){ manualRefresh(); return; }

    if(action==='new-notice') return openModal('new-notice');
    if(action==='save-notice'){
      const title = document.getElementById('m-title').value.trim();
      const body = document.getElementById('m-body').value.trim();
      if(!title || !body) return showToast('Please fill in both fields');
      state.notices.unshift({id:uid(), title, body, pinned: document.getElementById('m-pinned').checked, date: nowISO(), author: state.profile.name});
      await saveKey('notices', true, state.notices);
      closeModal(); showToast('Notice posted');
      return;
    }
    if(action==='delete-notice'){
      state.notices = state.notices.filter(n=>n.id!==id);
      await saveKey('notices', true, state.notices);
      render(); showToast('Notice removed');
      return;
    }

    if(action==='new-complaint') return openModal('new-complaint');
    if(action==='save-complaint'){
      const category = document.getElementById('m-category').value;
      const description = document.getElementById('m-desc').value.trim();
      if(!description) return showToast('Please describe the issue');
      state.complaints.unshift({id:uid(), category, description, status:'open', date: nowISO(), flat: state.profile.flat, response:''});
      await saveKey('complaints', true, state.complaints);
      closeModal(); showToast('Complaint submitted');
      return;
    }
    if(action==='complaint-status'){
      const c = state.complaints.find(x=>x.id===id);
      if(c){ c.status = t.dataset.status; await saveKey('complaints', true, state.complaints); render(); showToast('Status updated'); }
      return;
    }
    if(action==='respond-complaint') return openModal('respond-complaint', {id});
    if(action==='save-response'){
      const c = state.complaints.find(x=>x.id===id);
      if(c){ c.response = document.getElementById('m-response').value.trim(); await saveKey('complaints', true, state.complaints); closeModal(); showToast('Note saved'); }
      return;
    }

    if(action==='new-bill') return openModal('new-bill');
    if(action==='save-bill'){
      const flat = document.getElementById('m-flat').value.trim();
      const month = document.getElementById('m-month').value.trim();
      const amount = document.getElementById('m-amount').value;
      const dueDate = document.getElementById('m-duedate').value;
      if(!flat || !month || !amount || !dueDate) return showToast('Please fill in all fields');
      if(flat.toUpperCase()==='ALL'){
        const flats = Array.from(new Set([
          ...state.bills.map(b=>b.flat),
          ...state.complaints.map(c=>c.flat),
          ...state.bookings.map(b=>b.flat),
          ...state.visitors.map(v=>v.flat)
        ].filter(Boolean)));
        if(flats.length===0){ showToast('No known flats yet — add at least one bill manually first'); return; }
        flats.forEach(f=> state.bills.unshift({id:uid(), flat:f, month, amount, dueDate, status:'due', date: nowISO()}));
      } else {
        state.bills.unshift({id:uid(), flat, month, amount, dueDate, status:'due', date: nowISO()});
      }
      await saveKey('bills', true, state.bills);
      closeModal(); showToast('Bill(s) generated');
      return;
    }
    if(action==='bill-mark-paid'){
      const b = state.bills.find(x=>x.id===id);
      if(b){ b.status='paid'; await saveKey('bills', true, state.bills); render(); showToast('Marked as paid'); }
      return;
    }
    if(action==='bill-paid-request'){
      const b = state.bills.find(x=>x.id===id);
      if(b){ b.status='pending-confirmation'; await saveKey('bills', true, state.bills); render(); showToast('Committee notified'); }
      return;
    }
    if(action==='delete-bill'){
      state.bills = state.bills.filter(b=>b.id!==id);
      await saveKey('bills', true, state.bills);
      render(); showToast('Bill removed');
      return;
    }

    if(action==='new-booking') return openModal('new-booking');
    if(action==='save-booking'){
      const facility = document.getElementById('m-facility').value;
      const date = document.getElementById('m-date').value;
      const timeSlot = document.getElementById('m-timeslot').value.trim();
      const notes = document.getElementById('m-notes').value.trim();
      if(!date) return showToast('Please pick a date');
      state.bookings.unshift({id:uid(), facility, date, timeSlot, notes, status:'pending', flat: state.profile.flat});
      await saveKey('bookings', true, state.bookings);
      closeModal(); showToast('Booking request sent');
      return;
    }
    if(action==='booking-status'){
      const b = state.bookings.find(x=>x.id===id);
      if(b){ b.status = t.dataset.status; await saveKey('bookings', true, state.bookings); render(); showToast('Booking '+t.dataset.status); }
      return;
    }
    if(action==='manage-facilities') return openModal('manage-facilities');
    if(action==='add-facility'){
      const val = document.getElementById('m-newfacility').value.trim();
      if(!val) return;
      state.facilities.push(val);
      await saveKey('facilities', true, state.facilities);
      openModal('manage-facilities');
      return;
    }
    if(action==='remove-facility'){
      state.facilities.splice(Number(t.dataset.idx),1);
      await saveKey('facilities', true, state.facilities);
      openModal('manage-facilities');
      return;
    }

    if(action==='new-poll') return openModal('new-poll');
    if(action==='save-poll'){
      const question = document.getElementById('m-question').value.trim();
      const optsRaw = document.getElementById('m-options').value.split(/\r?\n/).map(s=>s.trim()).filter(Boolean);
      if(!question || optsRaw.length<2) return showToast('Add a question and at least 2 options');
      state.polls.unshift({id:uid(), question, options: optsRaw.map(text=>({text, votes:0})), voters:[], closed:false, date: nowISO()});
      await saveKey('polls', true, state.polls);
      closeModal(); showToast('Poll created');
      return;
    }
    if(action==='vote-poll'){
      const p = state.polls.find(x=>x.id===id);
      if(p && !p.closed && !(p.voters||[]).includes(state.profile.id)){
        p.options[Number(t.dataset.idx)].votes++;
        p.voters = p.voters || [];
        p.voters.push(state.profile.id);
        await saveKey('polls', true, state.polls);
        render(); showToast('Vote recorded');
      }
      return;
    }
    if(action==='close-poll'){
      const p = state.polls.find(x=>x.id===id);
      if(p){ p.closed = true; await saveKey('polls', true, state.polls); render(); showToast('Poll closed'); }
      return;
    }

    if(action==='new-visitor') return openModal('new-visitor');
    if(action==='save-visitor'){
      const name = document.getElementById('m-vname').value.trim();
      const flat = document.getElementById('m-vflat').value.trim();
      const purpose = document.getElementById('m-vpurpose').value.trim();
      if(!name || !flat) return showToast('Please fill in name and flat');
      state.visitors.unshift({id:uid(), name, flat, purpose: purpose||'Visit', timeIn: nowISO(), timeOut:null, loggedBy: state.profile.name});
      await saveKey('visitors', true, state.visitors);
      closeModal(); showToast('Visitor logged');
      return;
    }
    if(action==='visitor-checkout'){
      const v = state.visitors.find(x=>x.id===id);
      if(v){ v.timeOut = nowISO(); await saveKey('visitors', true, state.visitors); render(); showToast('Checked out'); }
      return;
    }

    if(action==='edit-profile') return openModal('edit-profile');
    if(action==='save-profile'){
      state.profile.name = document.getElementById('m-ename').value.trim() || state.profile.name;
      state.profile.flat = document.getElementById('m-eflat').value.trim() || state.profile.flat;
      await saveKey('profile', false, state.profile);
      closeModal(); showToast('Profile updated');
      return;
    }
    if(action==='change-pin') return openModal('change-pin');
    if(action==='save-pin'){
      const pin = document.getElementById('m-newpin').value.trim();
      if(!pin || pin.length<4) return showToast('PIN must be at least 4 characters');
      state.adminPin = pin;
      await saveKey('admin-pin', true, pin);
      closeModal(); showToast('PIN updated');
      return;
    }
    if(action==='switch-role'){
      state.profile = null;
      await saveKey('profile', false, null);
      state.onboardStep='welcome'; state.onboardData={name:'',flat:'',role:'resident',pin:''};
      render();
      return;
    }
  };
}

init();
})();
</script>
</body>
</html>
