  // --- ADMIN DASHBOARD ---
  const CHART_COLORS = ['#F2A93B', '#34B398', '#6E8FF2', '#E5615A', '#FFC670', '#9AA0C3', '#B37FEB', '#5AD8A6'];

  function svgDonut(segments, centerLabel, centerValue) {
    const total = segments.reduce((s, x) => s + x.value, 0);
    if (!total) return '<div style="text-align:center; color:var(--text-muted); font-size:13px; padding:20px 0;">No data yet.</div>';
    const R = 54, C = 2 * Math.PI * R;
    let offset = 0;
    const rings = segments.map((seg, i) => {
      const frac = seg.value / total;
      const dash = frac * C;
      const el = `<circle r="${R}" cx="70" cy="70" fill="none" stroke="${CHART_COLORS[i % CHART_COLORS.length]}" stroke-width="18" stroke-dasharray="${dash} ${C - dash}" stroke-dashoffset="${-offset}" transform="rotate(-90 70 70)"></circle>`;
      offset += dash;
      return el;
    }).join('');
    const legend = segments.map((seg, i) => `
      <div style="display:flex; align-items:center; gap:7px; font-size:12px; margin-bottom:5px;">
        <span style="width:10px; height:10px; border-radius:3px; background:${CHART_COLORS[i % CHART_COLORS.length]}; flex-shrink:0;"></span>
        <span style="color:var(--text-muted); flex:1;">${escapeHtml(seg.label)}</span>
        <span style="font-weight:600;">${seg.money === false ? seg.value : formatMoney(seg.value)}</span>
      </div>`).join('');
    return `
      <div style="display:flex; align-items:center; gap:16px; flex-wrap:wrap;">
        <svg width="140" height="140" viewBox="0 0 140 140" style="flex-shrink:0;">
          ${rings}
          <text x="70" y="65" text-anchor="middle" fill="var(--text-muted)" font-size="10">${escapeHtml(centerLabel || '')}</text>
          <text x="70" y="82" text-anchor="middle" fill="var(--text)" font-size="13" font-weight="700">${escapeHtml(centerValue || '')}</text>
        </svg>
        <div style="flex:1; min-width:130px;">${legend}</div>
      </div>`;
  }

  function svgBars(data) {
    if (!data.length || !data.some(d => d.value > 0)) return '<div style="text-align:center; color:var(--text-muted); font-size:13px; padding:20px 0;">No data yet.</div>';
    const max = Math.max(...data.map(d => d.value), 1);
    const W = 300, H = 130, bw = Math.min(34, (W - 10) / data.length - 10);
    const bars = data.map((d, i) => {
      const x = 10 + i * ((W - 10) / data.length);
      const h = Math.round((d.value / max) * 88);
      return `
        <rect x="${x}" y="${108 - h}" width="${bw}" height="${h}" rx="4" fill="var(--accent)" opacity="0.9"></rect>
        <text x="${x + bw / 2}" y="${102 - h}" text-anchor="middle" fill="var(--text-muted)" font-size="8.5">${d.value ? Math.round(d.value / 1000) + 'k' : ''}</text>
        <text x="${x + bw / 2}" y="${H - 8}" text-anchor="middle" fill="var(--text-faint)" font-size="9">${escapeHtml(d.label)}</text>`;
    }).join('');
    return `<svg width="100%" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">${bars}</svg>`;
  }

  function loadDashboard() {
    if (!db || !isStaff()) return;
    Promise.all([
      db.collection('users').get(),
      db.collection('bills').get(),
      db.collection('fund_contributions').get(),
      db.collection('expenses').get(),
      db.collection('tickets').get()
    ]).then(([usersSnap, billsSnap, contribsSnap, expSnap, ticketsSnap]) => {
      const users = usersSnap.docs.map(d => d.data());
      const bills = billsSnap.docs.map(d => d.data()).filter(b => !b.isDeleted);
      const contribs = contribsSnap.docs.map(d => d.data()).filter(c => !c.isDeleted);
      const expenses = expSnap.docs.map(d => d.data()).filter(x => !x.isDeleted);
      const tickets = ticketsSnap.docs.map(d => d.data()).filter(t => !t.isDeleted);
      renderDashboard({ users, bills, contribs, expenses, tickets });
    }).catch(e => {
      console.error("Error loading dashboard:", e);
      const el = document.getElementById('dashboard-body');
      if (el) el.innerHTML = `<div class="card" style="cursor:default; color:var(--danger);">Could not load dashboard data: ${escapeHtml(e.message)}</div>`;
    });
  }

  function renderDashboard(d) {
    const el = document.getElementById('dashboard-body');
    if (!el) return;

    const residents = d.users.filter(u => u.role === 'resident' && u.approved === true && u.suspended !== true).length;
    const pendingApprovals = d.users.filter(u => u.role === 'resident' && u.approved === false && u.membershipStatus !== 'rejected').length;

    const paidBills = d.bills.filter(b => b.status === 'paid');
    const unpaidBills = d.bills.filter(b => b.status === 'unpaid');
    const inReviewBills = d.bills.filter(b => b.status === 'submitted');
    const billed = d.bills.reduce((s, b) => s + Number(b.amount || 0), 0);
    const collectedBills = paidBills.reduce((s, b) => s + Number(b.amount || 0), 0);
    const verifiedContribs = d.contribs.filter(c => c.status === 'verified');
    const contribTotal = verifiedContribs.reduce((s, c) => s + Number(c.amount || 0), 0);
    const spentTotal = d.expenses.reduce((s, x) => s + Number(x.amount || 0), 0);
    const openTickets = d.tickets.filter(t => ['pending', 'in-progress'].includes(t.status)).length;

    // last 6 months collections (paid bills + verified contributions)
    const months = [];
    const now = new Date();
    for (let i = 5; i >= 0; i--) {
      const dt = new Date(now.getFullYear(), now.getMonth() - i, 1);
      months.push({ key: dt.getFullYear() + '-' + String(dt.getMonth() + 1).padStart(2, '0'), label: dt.toLocaleString('en', { month: 'short' }), value: 0 });
    }
    const addToMonth = (dateVal, amount) => {
      const dt = toDate(dateVal) || (typeof dateVal === 'string' && dateVal ? new Date(dateVal) : null);
      if (!dt || isNaN(dt)) return;
      const key = dt.getFullYear() + '-' + String(dt.getMonth() + 1).padStart(2, '0');
      const m = months.find(x => x.key === key);
      if (m) m.value += Number(amount || 0);
    };
    paidBills.forEach(b => addToMonth(b.paidAt || b.paymentDate, b.amount));
    verifiedContribs.forEach(c => addToMonth(c.paymentDate || c.createdAt, c.amount));

    // spend by category
    const spendCats = {};
    d.expenses.forEach(x => { const k = x.category || 'Other'; spendCats[k] = (spendCats[k] || 0) + Number(x.amount || 0); });
    const spendSegs = Object.entries(spendCats).map(([label, value]) => ({ label, value })).sort((a, b) => b.value - a.value).slice(0, 7);

    // contributions by category
    const contribCats = {};
    verifiedContribs.forEach(c => { const k = c.category || 'Other'; contribCats[k] = (contribCats[k] || 0) + Number(c.amount || 0); });
    const contribSegs = Object.entries(contribCats).map(([label, value]) => ({ label, value })).sort((a, b) => b.value - a.value).slice(0, 7);

    const stat = (label, value, color) => `
      <div style="background:var(--bg-elevated); border:1px solid var(--border); border-radius:var(--radius-sm); padding:12px 14px;">
        <div style="font-size:11px; color:var(--text-muted); margin-bottom:4px;">${label}</div>
        <div style="font-family:var(--font-display); font-size:18px; font-weight:700; color:${color || 'var(--text)'};">${value}</div>
      </div>`;

    el.innerHTML = `
      <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:14px;">
        ${stat('Approved Residents', residents)}
        ${stat('Pending Approvals', pendingApprovals, pendingApprovals ? 'var(--warning)' : 'var(--text)')}
        ${stat('Open Complaints', openTickets, openTickets ? 'var(--info)' : 'var(--text)')}
        ${stat('Proofs In Review', inReviewBills.length, inReviewBills.length ? 'var(--warning)' : 'var(--text)')}
        ${stat('Total Collected', formatMoney(collectedBills + contribTotal), 'var(--success)')}
        ${stat('Total Spent', formatMoney(spentTotal), 'var(--danger)')}
      </div>

      <div class="card" style="cursor:default; margin-bottom:14px;">
        <div style="font-weight:700; font-size:14px; margin-bottom:10px;">Monthly Collections — last 6 months</div>
        ${svgBars(months)}
      </div>

      <div class="card" style="cursor:default; margin-bottom:14px;">
        <div style="font-weight:700; font-size:14px; margin-bottom:10px;">Maintenance Bills</div>
        ${svgDonut([
          { label: 'Paid', value: paidBills.length, money: false },
          { label: 'Unpaid', value: unpaidBills.length, money: false },
          { label: 'In Review', value: inReviewBills.length, money: false }
        ].filter(s => s.value > 0), 'Billed', 'PKR ' + Math.round(billed / 1000) + 'k')}
      </div>

      <div class="card" style="cursor:default; margin-bottom:14px;">
        <div style="font-weight:700; font-size:14px; margin-bottom:10px;">Contributions by Category (verified)</div>
        ${svgDonut(contribSegs, 'Collected', 'PKR ' + Math.round(contribTotal / 1000) + 'k')}
      </div>

      <div class="card" style="cursor:default;">
        <div style="font-weight:700; font-size:14px; margin-bottom:10px;">Spending by Category</div>
        ${svgDonut(spendSegs, 'Spent', 'PKR ' + Math.round(spentTotal / 1000) + 'k')}
      </div>
    `;
  }

  // --- EXPENSES (STAFF) ---
  function loadExpenses() {
    if (!db || !isStaff()) return;
    db.collection('expenses').get().then(snapshot => {
      expensesList = snapshot.docs
        .map(doc => ({ id: doc.id, ...doc.data() }))
        .filter(x => !x.isDeleted)
        .sort((a, b) => String(b.expenseDate || '').localeCompare(String(a.expenseDate || '')));
      renderExpensesList();
    }).catch(e => { console.error("Error loading expenses:", e); showLoadError('expenses-list', e); });
  }

  function renderExpensesList() {
    const listEl = document.getElementById('expenses-list');
    const sumEl = document.getElementById('expenses-summary');
    if (!listEl) return;

    const total = expensesList.reduce((s, x) => s + Number(x.amount || 0), 0);
    const thisMonth = new Date().toISOString().slice(0, 7);
    const monthTotal = expensesList.filter(x => String(x.expenseDate || '').startsWith(thisMonth)).reduce((s, x) => s + Number(x.amount || 0), 0);

    if (sumEl) {
      sumEl.innerHTML = `
        <div class="stat-strip">
          <div class="stat-box"><div class="k">Total Spent</div><div class="v" style="color:var(--danger);">${formatMoney(total)}</div></div>
          <div class="stat-box"><div class="k">This Month</div><div class="v">${formatMoney(monthTotal)}</div></div>
          <div class="stat-box"><div class="k">Entries</div><div class="v">${expensesList.length}</div></div>
        </div>
      `;
    }

    if (!expensesList.length) {
      listEl.innerHTML = '<div class="card" style="text-align:center; color:var(--text-muted);">No expenses recorded yet.</div>';
      return;
    }

    listEl.innerHTML = expensesList.map(x => `
      <div class="card" style="cursor:default;">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:4px;">
          <span style="font-weight:700; font-size:14.5px; color:var(--accent-2);">${escapeHtml(x.category || 'Other')}</span>
          <span class="amount" style="color:var(--danger);">${formatMoney(x.amount)}</span>
        </div>
        <div style="font-size:13px; margin-bottom:4px; white-space:pre-wrap;">${escapeHtml(x.description || '')}</div>
        <div style="font-size:11.5px; color:var(--text-faint);">${escapeHtml(x.expenseDate || '')} · Entered by ${escapeHtml(x.enteredBy || 'Management')}${x.decisionRef ? ' · Board ref: ' + escapeHtml(x.decisionRef) : ''}</div>
        ${currentUserProfile.role === 'admin' ? `<button class="btn sm danger" style="margin-top:8px;" onclick="archiveExpense('${x.id}')">Remove</button>` : ''}
      </div>
    `).join('');
  }

  window.archiveExpense = function(id) {
    const x = expensesList.find(item => item.id === id);
    if (!confirm(`Remove this ${x ? x.category : ''} expense of ${x ? formatMoney(x.amount) : ''}? It will be archived (kept for audit).`)) return;

  // --- VOLUNTEER PROGRAMS ---
  function showLoadError(elId, e) {
    const el = document.getElementById(elId);
    if (el) el.innerHTML = `<div class="card" style="cursor:default; color:var(--danger);">Could not load data: ${escapeHtml(e.message || String(e))}</div>`;
  }

  function loadVolunteers() {
    if (!db) return;
    db.collection('volunteer_programs').get().then(snapshot => {
      volunteersList = snapshot.docs
        .map(doc => ({ id: doc.id, ...doc.data() }))
        .filter(p => !p.isDeleted)
        .sort((a, b) => {
          const da = toDate(a.createdAt), dbb = toDate(b.createdAt);
          return (dbb ? dbb.getTime() : 0) - (da ? da.getTime() : 0);
        });
      renderVolunteersBody();
    }).catch(e => { console.error("Error loading volunteer programs:", e); showLoadError('volunteers-body', e); });
  }

  function renderVolunteersBody() {
    const el = document.getElementById('volunteers-body');
    if (!el) return;
    const isAdmin = currentUserProfile.role === 'admin';

    if (!volunteersList.length) {
      el.innerHTML = `<div class="card" style="text-align:center; color:var(--text-muted);">${isAdmin ? 'No volunteer programs yet. Start one to invite residents.' : 'No volunteer programs announced yet. Check back soon!'}</div>`;
      return;
    }

    el.innerHTML = volunteersList.map(p => {
      const parts = p.participants || [];
      const joined = parts.some(x => x.uid === auth.currentUser.uid);
      const active = p.status !== 'closed';
      return `
      <div class="card" style="cursor:default;">
        <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:10px; margin-bottom:6px;">
          <div style="font-weight:700; font-size:15.5px; color:var(--accent-2);">${escapeHtml(p.title)}</div>
          <span class="badge ${active ? 'resolved' : 'closed'}">${active ? 'active' : 'closed'}</span>
        </div>
        <div style="font-size:13px; line-height:1.5; white-space:pre-wrap; margin-bottom:8px;">${escapeHtml(p.description || '')}</div>
        ${p.schedule ? `<div style="font-size:12.5px; color:var(--text-muted); margin-bottom:6px;">📅 ${escapeHtml(p.schedule)}</div>` : ''}
        <div style="font-size:12.5px; color:var(--text-muted); margin-bottom:8px;">🤝 ${parts.length} volunteer${parts.length === 1 ? '' : 's'} joined</div>
        ${isStaff() && parts.length ? `
          <div style="background:var(--bg-elevated-2); border:1px solid var(--border); border-radius:10px; padding:10px 12px; margin-bottom:10px;">
            ${parts.map(x => `<div style="font-size:12.5px; margin-bottom:3px;"><strong>${escapeHtml(x.name)}</strong> <span style="color:var(--text-muted);">— ${escapeHtml(x.house || 'N/A')}${x.phone ? ' · ' + escapeHtml(x.phone) : ''}</span></div>`).join('')}
          </div>` : ''}
        ${!isStaff() && active ? (joined
          ? `<button class="btn sm danger" onclick="leaveProgram('${p.id}')">Leave Program</button> <span style="font-size:12px; color:var(--success); margin-left:8px;">✔ You have joined</span>`
          : `<button class="btn sm primary" onclick="joinProgram('${p.id}')">Join as Volunteer</button>`) : ''}
        ${!isStaff() && !active && joined ? '<span style="font-size:12px; color:var(--text-muted);">You volunteered in this program.</span>' : ''}
        ${isAdmin ? `<div style="margin-top:10px; display:flex; gap:8px;">
          ${active ? `<button class="btn sm" onclick="closeProgram('${p.id}')">Close Program</button>` : ''}
          <button class="btn sm danger" onclick="archiveProgram('${p.id}')">Remove</button>
        </div>` : ''}
      </div>`;
    }).join('');
  }

  window.openStartProgramModal = function() {

        });

  window.joinProgram = async function(id) {
    const p = volunteersList.find(item => item.id === id);
    if (!p || p.status === 'closed') return;
    try {
      const snap = await db.collection('volunteer_programs').doc(id).get();
      const cur = snap.exists ? (snap.data().participants || []) : [];
      if (cur.some(x => x.uid === auth.currentUser.uid)) { loadVolunteers(); return; }
      cur.push({
        uid: auth.currentUser.uid,
        name: currentUserProfile.name,
        house: currentUserProfile.house || '',
        phone: currentUserProfile.phone || '',
        joinedAt: new Date().toISOString()
      });
      await db.collection('volunteer_programs').doc(id).update({ participants: cur });
      logAudit('volunteer_program', id, 'update', `${currentUserProfile.name} joined "${p.title}"`);
      await notifyAdmins("New Volunteer", `${currentUserProfile.name} (${currentUserProfile.house || 'N/A'}) joined "${p.title}".`, 'info');
      loadVolunteers();
    } catch(err) {
      alert("Error joining program: " + err.message);
    }
  };

  window.leaveProgram = async function(id) {
    const p = volunteersList.find(item => item.id === id);
    if (!p) return;
    if (!confirm(`Leave the program "${p.title}"?`)) return;
    try {
      const snap = await db.collection('volunteer_programs').doc(id).get();
      const cur = (snap.exists ? (snap.data().participants || []) : []).filter(x => x.uid !== auth.currentUser.uid);
      await db.collection('volunteer_programs').doc(id).update({ participants: cur });
      logAudit('volunteer_program', id, 'update', `${currentUserProfile.name} left "${p.title}"`);
      loadVolunteers();
    } catch(err) {
      alert("Error leaving program: " + err.message);
    }
  };

  window.closeProgram = async function(id) {
    const p = volunteersList.find(item => item.id === id);
    if (!p || currentUserProfile.role !== 'admin') return;
    if (!confirm(`Close the program "${p.title}"? Residents will no longer be able to join.`)) return;
    try {
      await db.collection('volunteer_programs').doc(id).update({ status: 'closed' });
      logAudit('volunteer_program', id, 'update', `Program "${p.title}" closed with ${(p.participants || []).length} volunteers`);
      loadVolunteers();
    } catch(err) {
      alert("Error closing program: " + err.message);
    }
  };

  window.archiveProgram = function(id) {
    const p = volunteersList.find(item => item.id === id);
    if (!confirm(`Remove the program "${p ? p.title : ''}"? It will be archived (kept for audit).`)) return;
    logAudit('volunteer_program', id, 'soft_delete', p ? `Program "${p.title}"` : '');
    archiveRecord('volunteer_programs', id, loadVolunteers);
  };

  // --- REPORTS ---
  let reportsData = null;

  function loadReportsData() {
    if (!db) return;
    const billsQuery = isStaff()
      ? db.collection('bills')
      : db.collection('bills').where('uid', '==', auth.currentUser.uid);
    Promise.all([
      billsQuery.get(),
      Promise.all(contribQueries()).then(mergeContribSnaps),
      db.collection('expenses').get()
    ]).then(([billsSnap, contribDocs, expSnap]) => {
      reportsData = {
        bills: billsSnap.docs.map(d => ({ id: d.id, ...d.data() })).filter(b => !b.isDeleted),
        contribs: contribDocs.filter(c => !c.isDeleted),
        expenses: expSnap.docs.map(d => ({ id: d.id, ...d.data() })).filter(x => !x.isDeleted)
      };
      renderReports();
    }).catch(e => {
      console.error("Error loading reports:", e);
      showLoadError('reports-body', e);
    });
  }

  function paymentRows() {
    // Unified payment list: paid bills + verified contributions
    const uid = auth.currentUser.uid;
    const staff = isStaff();
    const rows = [];
    reportsData.bills.filter(b => b.status === 'paid' && (staff || b.uid === uid)).forEach(b => rows.push({
      date: b.paidAt ? (toDate(b.paidAt) || new Date()).toISOString().slice(0,10) : '',
      name: b.name || '', house: b.house || '',
      type: 'Bill — ' + (b.category || 'Maintenance'),
      method: b.paymentMethod || '', amount: Number(b.amount || 0)
    }));
    reportsData.contribs.filter(c => c.status === 'verified' && (staff || c.uid === uid)).forEach(c => rows.push({
      date: c.paymentDate || (toDate(c.createdAt) ? toDate(c.createdAt).toISOString().slice(0,10) : ''),
      name: c.name || '', house: c.house || '',
      type: 'Fund — ' + (c.fundTitle || '') + (c.category ? ' (' + c.category + ')' : ''),
      method: c.paymentMethod || '', amount: Number(c.amount || 0)
    }));
    rows.sort((a, b) => String(b.date).localeCompare(String(a.date)));
    return rows;
  }

  window.renderReports = function() {
    const el = document.getElementById('reports-body');
    if (!el || !reportsData) return;
    const staff = isStaff();

    let rows = paymentRows();
    const from = staff && document.getElementById('rep-from') ? document.getElementById('rep-from').value : '';
    const to = staff && document.getElementById('rep-to') ? document.getElementById('rep-to').value : '';
    const nameQ = staff && document.getElementById('rep-name') ? document.getElementById('rep-name').value.trim().toLowerCase() : '';
    const houseQ = staff && document.getElementById('rep-house') ? document.getElementById('rep-house').value.trim().toLowerCase() : '';
    if (from) rows = rows.filter(r => r.date >= from);
    if (to) rows = rows.filter(r => r.date <= to);
    if (nameQ) rows = rows.filter(r => r.name.toLowerCase().includes(nameQ));
    if (houseQ) rows = rows.filter(r => r.house.toLowerCase().includes(houseQ));

    // Monthly collections with running total
    const byMonth = {};
    paymentRows().forEach(r => {
      const m = String(r.date).slice(0, 7) || 'Unknown';
      byMonth[m] = (byMonth[m] || 0) + r.amount;
    });
    const months = Object.keys(byMonth).sort();
    let running = 0;
    const monthRows = months.map(m => { running += byMonth[m]; return { month: m, total: byMonth[m], running }; });

    // Fund utilization: contributions in vs expenses out, by category
    const collectedByCat = {};
    reportsData.contribs.filter(c => c.status === 'verified').forEach(c => {
      const cat = c.category || 'Other';
      collectedByCat[cat] = (collectedByCat[cat] || 0) + Number(c.amount || 0);
    });
    const spentByCat = {};
    reportsData.expenses.forEach(x => {
      const cat = x.category || 'Other';
      spentByCat[cat] = (spentByCat[cat] || 0) + Number(x.amount || 0);
    });
    const utilCats = [...new Set([...Object.keys(collectedByCat), ...Object.keys(spentByCat)])].sort();

    el.innerHTML = `
      <div class="section-title" style="font-size:15px;">${staff ? 'Payments' : 'My Payments'} (${rows.length})</div>
      ${rows.length ? rows.slice(0, 100).map(r => `
        <div class="card" style="cursor:default; padding:12px 14px;">
          <div style="display:flex; justify-content:space-between; align-items:center;">
            <span style="font-size:13px; font-weight:700;">${staff ? escapeHtml(r.name) + ' — ' + escapeHtml(r.house || 'N/A') : escapeHtml(r.type)}</span>
            <span class="amount" style="color:var(--success);">${formatMoney(r.amount)}</span>
          </div>
          <div style="font-size:11.5px; color:var(--text-faint);">${escapeHtml(r.date)}${staff ? ' · ' + escapeHtml(r.type) : ''}${r.method ? ' · ' + escapeHtml(r.method) : ''}</div>
        </div>
      `).join('') : '<div class="card" style="text-align:center; color:var(--text-muted); cursor:default;">No payments found.</div>'}

      <div class="section-title" style="font-size:15px; margin-top:18px;">Monthly Collections</div>
      ${monthRows.length ? `
        <div class="card" style="cursor:default;">
          ${monthRows.map(m => `
            <div style="display:flex; justify-content:space-between; font-size:13px; padding:5px 0; border-bottom:1px solid var(--border-soft);">
              <span>${escapeHtml(m.month)}</span>
              <span style="font-family:var(--font-mono);">${formatMoney(m.total)}</span>
              <span style="font-family:var(--font-mono); color:var(--text-muted);">Σ ${formatMoney(m.running)}</span>
            </div>
          `).join('')}
        </div>
      ` : '<div class="card" style="text-align:center; color:var(--text-muted); cursor:default;">No collections yet.</div>'}

      <div class="section-title" style="font-size:15px; margin-top:18px;">Fund Utilization by Category</div>
      <div class="section-sub" style="margin-bottom:10px;">${staff ? 'Collected vs spent per category.' : 'Category totals only — contributor identities are never shown.'}</div>
      ${utilCats.length ? `
        <div class="card" style="cursor:default;">
          ${utilCats.map(cat => `
            <div style="display:flex; justify-content:space-between; font-size:13px; padding:5px 0; border-bottom:1px solid var(--border-soft);">
              <span>${escapeHtml(cat)}</span>
              <span style="font-family:var(--font-mono); color:var(--success);">+${formatMoney(collectedByCat[cat] || 0)}</span>
              <span style="font-family:var(--font-mono); color:var(--danger);">-${formatMoney(spentByCat[cat] || 0)}</span>
            </div>
          `).join('')}
        </div>
      ` : '<div class="card" style="text-align:center; color:var(--text-muted); cursor:default;">No fund activity yet.</div>'}

      <button class="btn secondary block" style="margin-top:14px;" onclick="exportReportPDF()">Export Report as PDF</button>
    `;
  };

  window.exportReportPDF = function() {
    if (!reportsData) return;
    const staff = isStaff();
    try {
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF();
      doc.setFont("helvetica", "bold");
      doc.setFontSize(16);
      doc.text("Roshan Pakistan Housing Society", 105, 18, { align: "center" });
      doc.setFontSize(12);
      doc.setFont("helvetica", "normal");
      doc.text(staff ? "Society Finance Report" : "My Payments Report", 105, 26, { align: "center" });
      doc.setFontSize(9);
      doc.text(`Generated ${new Date().toLocaleString()} by ${currentUserProfile.name}`, 105, 32, { align: "center" });
      doc.line(15, 36, 195, 36);

      let y = 44;
      const line = (txt, bold) => {
        if (y > 280) { doc.addPage(); y = 20; }
        doc.setFont("helvetica", bold ? "bold" : "normal");
        doc.setFontSize(bold ? 11 : 9.5);
        doc.text(String(txt).slice(0, 110), 15, y);
        y += bold ? 8 : 6;
      };

      line(staff ? "Payments" : "My Payments", true);
      paymentRows().slice(0, 200).forEach(r => {
        line(`${r.date}  ${staff ? r.name + ' (' + (r.house || 'N/A') + ')  ' : ''}${r.type}  ${r.method ? '[' + r.method + ']  ' : ''}${formatMoney(r.amount)}`);
      });

      y += 4;
      line("Monthly Collections", true);
      const byMonth = {};
      paymentRows().forEach(r => { const m = String(r.date).slice(0, 7) || 'Unknown'; byMonth[m] = (byMonth[m] || 0) + r.amount; });
      let running = 0;
      Object.keys(byMonth).sort().forEach(m => { running += byMonth[m]; line(`${m}   ${formatMoney(byMonth[m])}   (running total ${formatMoney(running)})`); });

      y += 4;
      line("Fund Utilization by Category", true);
      const collectedByCat = {}, spentByCat = {};
      reportsData.contribs.filter(c => c.status === 'verified').forEach(c => { const cat = c.category || 'Other'; collectedByCat[cat] = (collectedByCat[cat] || 0) + Number(c.amount || 0); });
      reportsData.expenses.forEach(x => { const cat = x.category || 'Other'; spentByCat[cat] = (spentByCat[cat] || 0) + Number(x.amount || 0); });
      [...new Set([...Object.keys(collectedByCat), ...Object.keys(spentByCat)])].sort().forEach(cat => {
        line(`${cat}   collected ${formatMoney(collectedByCat[cat] || 0)}   spent ${formatMoney(spentByCat[cat] || 0)}`);
      });

      const fileName = staff ? 'RPHS_Finance_Report.pdf' : 'My_Payments_Report.pdf';
      doc.save(fileName);

      db.collection('report_exports').add({
        reportType: staff ? 'finance_report' : 'member_payments',
        generatedBy: currentUserProfile.name,
        generatedByUid: auth.currentUser.uid,
        role: currentUserProfile.role,
        fileName,
        generatedAt: firebase.firestore.FieldValue.serverTimestamp()
      }).catch(e => console.error("Export log failed:", e));
      logAudit('report', '', 'create', `PDF export: ${fileName}`);
    } catch(err) {
      alert("Error generating report PDF: " + err.message);
    }
  };

  // --- BOARD DECISIONS & 3-OF-5 VOTING ---
  function loadDecisions() {
    if (!db) return;
    db.collection('decisions').get().then(snapshot => {
      decisionsList = snapshot.docs
        .map(doc => ({ id: doc.id, ...doc.data() }))
        .filter(d => !d.isDeleted)
        .sort((a, b) => {
          const da = toDate(a.createdAt), dbb = toDate(b.createdAt);
          return (dbb ? dbb.getTime() : 0) - (da ? da.getTime() : 0);
        });
      renderDecisionsList();
    }).catch(e => { console.error("Error loading decisions:", e); showLoadError('decisions-list', e); });
  }

  function renderDecisionsList() {
    const el = document.getElementById('decisions-list');
    if (!el) return;
    if (!decisionsList.length) {
      el.innerHTML = '<div class="card" style="text-align:center; color:var(--text-muted);">No items have been queued for a Board vote yet.</div>';
      return;
    }

    el.innerHTML = decisionsList.map(d => {
      const votes = d.votes || [];
      const endorse = votes.filter(v => v.choice === 'endorse').length;
      const oppose = votes.filter(v => v.choice === 'reject').length;
      const myVote = votes.find(v => v.uid === auth.currentUser.uid);
      const status = d.status || 'pending';
      const badgeClass = status === 'approved' ? 'paid' : (status === 'rejected' ? 'overdue' : 'pending');
      const reasonRequired = d.type === 'membership' || d.type === 'suspension';
      return `
        <div class="card" style="cursor:default;">
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:4px;">
            <span style="font-weight:700; font-size:14.5px; color:var(--accent-2);">${escapeHtml(d.title || '')}</span>
            <span class="badge ${badgeClass}">${escapeHtml(status)}</span>
          </div>
          <div style="font-size:12px; color:var(--text-muted); margin-bottom:6px;">Type: ${escapeHtml(d.type || 'opinion')} · Queued by ${escapeHtml(d.uploadedBy || '')} · ${escapeHtml(formatDate(d.createdAt))}</div>
          <div style="font-size:13px; margin-bottom:8px; white-space:pre-wrap;">${escapeHtml(d.description || '')}</div>
          <div style="font-size:12.5px; margin-bottom:6px;">
            <span style="color:var(--success);">Endorse: ${endorse}</span> · <span style="color:var(--danger);">Oppose: ${oppose}</span> · Needs ${d.requiredVotes || 3} to finalize
          </div>
          ${votes.length ? `<div style="font-size:11.5px; color:var(--text-faint); margin-bottom:6px;">${votes.map(v => `${escapeHtml(v.name)}: ${v.choice === 'endorse' ? '✔ endorsed' : '✘ opposed'}${v.reason ? ' — ' + escapeHtml(v.reason) : ''}`).join('<br/>')}</div>` : ''}
          ${status === 'pending' && isBoard() && !myVote ? `
            ${reasonRequired ? `<label style="font-size:12px;">Reason (required)</label><input type="text" id="vote-reason-${d.id}" placeholder="State your reason..." />` : ''}
            <div style="display:flex; gap:8px; margin-top:8px;">
              <button class="btn sm primary block" onclick="castVote('${d.id}', 'endorse')">Endorse</button>
              <button class="btn sm danger block" onclick="castVote('${d.id}', 'reject')">Oppose</button>
            </div>
          ` : ''}
          ${status === 'pending' && isBoard() && myVote ? `<div style="font-size:12px; color:var(--info);">You voted: ${myVote.choice === 'endorse' ? 'Endorse' : 'Oppose'}. Waiting for quorum.</div>` : ''}
          ${d.finalizedAt ? `<div style="font-size:11.5px; color:var(--text-faint); margin-top:4px;">Finalized ${escapeHtml(formatDate(d.finalizedAt))}</div>` : ''}
        </div>
      `;
    }).join('');
  }

  window.openCreateDecisionModal = function() {
    if (currentUserProfile.role !== 'admin') return;
    document.getElementById('modal-body').innerHTML = `
      <div style="font-family:var(--font-display); font-size:20px; font-weight:600; margin-bottom:12px;">Queue Item for Board Vote</div>
      <form id="decision-form">
        <label>Type</label>
        <select id="dec-type" required>
          <option value="opinion">Opinion / General Decision</option>
          <option value="expense">Expense Approval</option>
          <option value="account">Account Details Change</option>
          <option value="board_change">Board Membership Change</option>
        </select>
        <label>Title</label>
        <input type="text" id="dec-title" placeholder="e.g. Approve gate repair expense" required />
        <label>Description — what is being decided?</label>
        <textarea id="dec-desc" placeholder="Full details for the Board..." required></textarea>
        <button type="submit" class="btn primary block" style="margin-top:16px;">Send to Board (3-of-5 vote)</button>
      </form>
    `;
    document.getElementById('modal-view').classList.add('active');

    document.getElementById('decision-form').addEventListener('submit', async (e) => {

  async function createDecision(data) {
    const ref = await db.collection('decisions').add({
      ...data,
      requiredVotes: 3,
      status: 'pending',
      votes: [],
      uploadedBy: currentUserProfile.name,
      uploadedByUid: auth.currentUser.uid,
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    logAudit('decision', ref.id, 'create', `${data.type}: ${data.title}`);
    await notifyBoardMembers("New Item for Board Vote", `"${data.title}" has been queued for your vote. Open Board Votes to endorse or oppose.`);
    return ref;
  }

  async function notifyBoardMembers(title, body) {
    try {
      const [roleSnap, flagSnap] = await Promise.all([
        db.collection('users').where('role', '==', 'board').get(),
        db.collection('users').where('boardMember', '==', true).get()
      ]);
      const ids = [...new Set(roleSnap.docs.concat(flagSnap.docs).map(d => d.id))];
      await Promise.all(ids.map(id => sendNotification(id, title, body, 'info')));
    } catch(e) {
      console.error("Error notifying board:", e);
    }
  }

  window.castVote = async function(decisionId, choice) {
    if (!isBoard()) return;
    const d = decisionsList.find(item => item.id === decisionId);
    if (!d || d.status !== 'pending') return;
    const votes = d.votes || [];
    if (votes.find(v => v.uid === auth.currentUser.uid)) { alert("You have already voted on this item."); return; }

    const reasonRequired = d.type === 'membership' || d.type === 'suspension';
    let reason = '';
    const reasonEl = document.getElementById(`vote-reason-${decisionId}`);
    if (reasonEl) reason = reasonEl.value.trim();
    if (reasonRequired && !reason) { alert("A reason is mandatory for membership and suspension decisions."); return; }

    const newVotes = [...votes, {
      uid: auth.currentUser.uid,
      name: currentUserProfile.name,
      choice,
      reason,
      votedAt: new Date().toISOString()
    }];

    const endorse = newVotes.filter(v => v.choice === 'endorse').length;
    const oppose = newVotes.filter(v => v.choice === 'reject').length;
    const quorum = d.requiredVotes || 3;
    const finalStatus = endorse >= quorum ? 'approved' : (oppose >= quorum ? 'rejected' : 'pending');

    try {
      const update = { votes: newVotes };
      if (finalStatus !== 'pending') {
        update.status = finalStatus;
        update.finalizedAt = firebase.firestore.FieldValue.serverTimestamp();
      }
      await db.collection('decisions').doc(decisionId).update(update);
      logAudit('decision', decisionId, 'update', `${currentUserProfile.name} voted ${choice}${finalStatus !== 'pending' ? ' — auto-tagged ' + finalStatus + ' at quorum' : ''}`);
      if (finalStatus !== 'pending') {
        await applyDecisionOutcome({ ...d, votes: newVotes }, finalStatus);
      }
      loadDecisions();
    } catch(err) {
      alert("Error casting vote: " + err.message);
    }
  };

  async function applyDecisionOutcome(d, finalStatus) {
    const reasons = (d.votes || []).filter(v => v.reason).map(v => v.reason).join('; ');
    try {
      if (d.type === 'membership' && d.refUid) {
        if (finalStatus === 'approved') {
          await db.collection('users').doc(d.refUid).update({ approved: true, membershipStatus: 'approved', statusReason: reasons });
          await sendNotification(d.refUid, "Membership Approved", "The Board has approved your membership. Welcome to the society!", "success");
        } else {
          await db.collection('users').doc(d.refUid).update({ approved: false, membershipStatus: 'rejected', statusReason: reasons });
          await sendNotification(d.refUid, "Membership Decision", `The Board did not approve your membership.${reasons ? ' Reason: ' + reasons : ''}`, "error");
        }
      } else if (d.type === 'suspension' && d.refUid) {
        if (finalStatus === 'approved') {
          await db.collection('users').doc(d.refUid).update({ suspended: true, membershipStatus: 'suspended', statusReason: reasons });
          await sendNotification(d.refUid, "Membership Suspended", `Your membership has been suspended by the Board.${reasons ? ' Reason: ' + reasons : ''}`, "error");
        }
      }
      logAudit('decision', d.id, 'update', `Outcome applied: ${d.type} ${finalStatus}`);
      await notifyAdmins(`Board Decision Final: ${d.title}`, `The Board has ${finalStatus} "${d.title}" (${(d.votes || []).length} votes cast).`, finalStatus === 'approved' ? 'success' : 'error');
    } catch(e) {
      console.error("Error applying decision outcome:", e);
    }
  }

  // --- AUDIT & ARCHIVE (STAFF) ---
  function loadArchiveAndAudit() {
    if (!db || !isStaff()) return;
    Promise.all([
      db.collection('bills').get(),
      db.collection('funds').get(),
      db.collection('tickets').get(),
      db.collection('expenses').get(),
      db.collection('audit_log').get()
    ]).then(([bills, funds, tickets, expenses, audit]) => {
      archivedRecords = [];
      const collect = (snap, type, label) => snap.docs
        .map(doc => ({ id: doc.id, ...doc.data() }))
        .filter(x => x.isDeleted)
        .forEach(x => archivedRecords.push({ type, label: label(x), record: x }));
      collect(bills, 'bills', b => `Bill ${b.billNo || b.id} — ${b.name || ''} ${formatMoney(b.amount)}`);
      collect(funds, 'funds', f => `Fund "${f.title || ''}"`);
      collect(tickets, 'tickets', t => `Complaint ${t.ticketNo || t.id} — ${t.subject || ''}`);
      collect(expenses, 'expenses', x => `Expense ${x.category || ''} ${formatMoney(x.amount)}`);

      auditList = audit.docs
        .map(doc => ({ id: doc.id, ...doc.data() }))
        .sort((a, b) => {
          const da = toDate(a.timestamp), dbb = toDate(b.timestamp);
          return (dbb ? dbb.getTime() : 0) - (da ? da.getTime() : 0);
        })
        .slice(0, 100);
      renderArchiveAndAudit();
    }).catch(e => { console.error("Error loading archive/audit:", e); showLoadError('archive-list', e); showLoadError('audit-list', e); });
  }

  function renderArchiveAndAudit() {
    const archEl = document.getElementById('archive-list');
    const audEl = document.getElementById('audit-list');
    if (archEl) {
      archEl.innerHTML = archivedRecords.length ? archivedRecords.map(a => `
        <div class="card" style="cursor:default;">
          <div style="font-size:13.5px; font-weight:700; margin-bottom:4px;">${escapeHtml(a.label)}</div>
          <div style="font-size:11.5px; color:var(--text-faint);">Archived ${escapeHtml(formatDate(a.record.deletedAt))} by ${escapeHtml(a.record.deletedBy || 'Management')}</div>
          ${currentUserProfile.role === 'admin' ? `<button class="btn sm secondary" style="margin-top:8px;" onclick="restoreRecord('${a.type}', '${a.record.id}')">Restore</button>` : ''}
        </div>
      `).join('') : '<div class="card" style="text-align:center; color:var(--text-muted); cursor:default;">No archived records.</div>';
    }
    if (audEl) {
      audEl.innerHTML = auditList.length ? `
        <div class="card" style="cursor:default;">
          ${auditList.map(a => `
            <div style="font-size:12px; padding:6px 0; border-bottom:1px solid var(--border-soft);">
              <span style="color:var(--accent-2); font-weight:700;">${escapeHtml(a.action)}</span>
              <span style="color:var(--text-muted);">${escapeHtml(a.entityType)}</span>
              — ${escapeHtml(a.details || '')}
              <div style="font-size:10.5px; color:var(--text-faint);">${escapeHtml(formatDate(a.timestamp))} · ${escapeHtml(a.performedBy || '')} (${escapeHtml(a.role || '')})</div>
            </div>
          `).join('')}
        </div>
      ` : '<div class="card" style="text-align:center; color:var(--text-muted); cursor:default;">No audit entries yet.</div>';
    }
  }

  window.restoreRecord = async function(collection, id) {
    if (currentUserProfile.role !== 'admin') return;
    if (!confirm("Restore this record? It will reappear in its normal list.")) return;
    try {
      await db.collection(collection).doc(id).update({ isDeleted: false, restoredAt: firebase.firestore.FieldValue.serverTimestamp(), restoredBy: currentUserProfile.name });
      logAudit(collection, id, 'restore', 'Record restored from archive');
      loadArchiveAndAudit();
    } catch(err) {
      alert("Error restoring record: " + err.message);
    }
  };

  // --- RESIDENTS DIRECTORY (ADMIN) ---
  function loadAllResidents() {
    if (!db) return;
    db.collection('users').where('approved', '==', true).get().then(snapshot => {
      allResidents = snapshot.docs.map(doc => ({ uid: doc.id, ...doc.data() }));
      renderResidentsList();
    }).catch(e => console.error("Error loading residents:", e));
  }

  function renderResidentsList() {
    const listEl = document.getElementById('residents-list');
    if (!listEl) return;
    if (!allResidents.length) {
      listEl.innerHTML = '<div class="card" style="text-align:center; color:var(--text-muted);">No approved residents found.</div>';
      return;
    }

    listEl.innerHTML = allResidents.map(r => `
      <div class="card" style="cursor:default;">
        <div style="display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:6px;">
          <div>
            <div style="font-weight:700; font-size:15px; color:var(--accent-2);">${escapeHtml(r.name)}</div>
            <div style="font-size:12.5px; color:var(--text-muted);">House: ${escapeHtml(r.house || 'N/A')}</div>
          </div>
          <button class="btn sm secondary" onclick="downloadResidentPDF('${r.uid}')">PDF Card</button>
        </div>
        <div style="font-size:12px; color:var(--text-muted); margin-top:4px;">CNIC: ${escapeHtml(r.cnic || 'N/A')} | Phone: ${escapeHtml(r.phone || 'N/A')}</div>
        <div style="font-size:12px; color:var(--text-muted);">Blood Group: ${escapeHtml(r.bloodGroup || 'N/A')} (${escapeHtml(r.occupancyType || 'N/A')})</div>
        ${r.suspended ? '<div style="font-size:12px; color:var(--danger); margin-top:4px;">Suspended' + (r.statusReason ? ': ' + escapeHtml(r.statusReason) : '') + '</div>' : ''}
        ${currentUserProfile.role === 'admin' && r.role === 'resident' ? `
          <div style="margin-top:8px;">
            ${r.suspended
              ? `<button class="btn sm secondary" onclick="unsuspendResident('${r.uid}')">Lift Suspension</button>`
              : `<button class="btn sm danger" onclick="suspendResident('${r.uid}')">Suspend</button>`}
          </div>
        ` : ''}
      </div>
    `).join('');
  }

  window.downloadResidentPDF = function(uid) {
    const r = allResidents.find(item => item.uid === uid);
    if (!r) return;

    try {
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF();

      doc.setFont("helvetica", "bold");
      doc.setFontSize(18);
      doc.text("Roshan Pakistan Housing Society", 105, 20, { align: "center" });

      doc.setFontSize(12);
      doc.setFont("helvetica", "normal");
      doc.text("Official Resident Biodata Record", 105, 28, { align: "center" });

      doc.line(20, 35, 190, 35);

      let y = 48;
      const addRow = (label, val) => {
        doc.setFont("helvetica", "bold");
        doc.text(label + ":", 25, y);
        doc.setFont("helvetica", "normal");
        doc.text(String(val || 'N/A'), 75, y);
        y += 10;
      };

      addRow("Full Name", r.name);
      addRow("House / Plot", r.house);
      addRow("CNIC Number", r.cnic);
      addRow("Phone Number", r.phone);
      addRow("Email Address", r.email);
      addRow("Blood Group", r.bloodGroup);
      addRow("Occupancy Type", r.occupancyType);

      y += 5;
      doc.setFont("helvetica", "bold");
      doc.text("Family Members / Dependents:", 25, y);
      y += 8;
      doc.setFont("helvetica", "normal");
      const splitFamily = doc.splitTextToSize(r.familyDetails || 'N/A', 160);
      doc.text(splitFamily, 25, y);

      doc.save(`Resident_${(r.house || 'Biodata').replace(/\s+/g, '_')}.pdf`);
    } catch(err) {
      alert("Error generating PDF: " + err.message);
    }
  };

  // --- APPROVALS ---
  function loadPendingResidents() {
    if (!db) return;
    db.collection('users').where('approved', '==', false).get().then(snapshot => {
      pendingResidents = snapshot.docs
        .map(doc => ({ uid: doc.id, ...doc.data() }))
        .filter(r => r.membershipStatus !== 'rejected');
      renderApprovalsList();
    }).catch(e => console.error("Error loading approvals:", e));
  }

  function renderApprovalsList() {
    const listEl = document.getElementById('approvals-list');
    if (!listEl) return;
    if (!pendingResidents.length) {
      listEl.innerHTML = '<div class="card" style="text-align:center; color:var(--text-muted);">No pending registration requests.</div>';
      return;
    }

    listEl.innerHTML = pendingResidents.map(r => `
      <div class="card" style="cursor:default;">
        <div style="font-weight:700; font-size:15px; color:var(--accent-2);">${escapeHtml(r.name)}</div>
        <div style="font-size:12.5px; color:var(--text-muted);">House: ${escapeHtml(r.house || 'N/A')}</div>
        <div style="font-size:12.5px; color:var(--text-muted);">Phone: ${escapeHtml(r.phone || 'N/A')}</div>
        <div style="font-size:12.5px; color:var(--text-muted);">Email: ${escapeHtml(r.email || 'N/A')}</div>
        <div style="font-size:12.5px; color:var(--text-muted);">Biodata Status: ${r.biodataSubmitted ? 'Submitted' : 'Pending'}</div>

        <div style="display:flex; gap:10px; margin-top:12px;">
          <button class="btn sm primary block" onclick="approveUser('${r.uid}')">Approve</button>
          <button class="btn sm danger block" onclick="rejectUser('${r.uid}')">Reject</button>
        </div>
      </div>
    `).join('');
  }

  async function hasPendingDecision(type, refUid) {
    const snap = await db.collection('decisions').get();
    return snap.docs.some(d => {
      const x = d.data();
      return x.type === type && x.refUid === refUid && (x.status || 'pending') === 'pending' && !x.isDeleted;
    });
  }

  window.approveUser = async function(uid) {
    const r = pendingResidents.find(item => item.uid === uid);
    try {
      const boardCount = await getBoardMembersCount();
      if (boardCount >= 3) {
        if (await hasPendingDecision('membership', uid)) { alert("This membership is already awaiting a Board vote."); return; }
        await createDecision({
          type: 'membership',
          refUid: uid,
          title: `Membership: ${r ? r.name : uid}`,
          description: `Approve or reject the membership application of ${r ? r.name : ''} (House ${r ? (r.house || 'N/A') : 'N/A'}, ${r ? (r.email || '') : ''}). A reason is mandatory with each vote.`
        });
        alert("Sent to the Board for a 3-of-5 vote. The applicant will be notified once the Board decides.");
        loadPendingResidents();
        return;
      }
      const reason = prompt("Reason for approving this membership (required):");
      if (reason === null) return;
      if (!reason.trim()) { alert("A reason is required for every membership decision."); return; }
      await db.collection('users').doc(uid).update({ approved: true, membershipStatus: 'approved', statusReason: reason.trim() });
      logAudit('member', uid, 'update', `Membership approved: ${r ? r.name : uid} — ${reason.trim()}`);
      await sendNotification(uid, "Account Approved", "Your account has been approved! You can now access your portal.", "success");
      loadPendingResidents();
    } catch(e) { alert("Error approving user: " + e.message); }
  };

  window.rejectUser = async function(uid) {
    const r = pendingResidents.find(item => item.uid === uid);
    try {
      const boardCount = await getBoardMembersCount();
      if (boardCount >= 3) {
        if (await hasPendingDecision('membership', uid)) { alert("This membership is already awaiting a Board vote."); return; }
        await createDecision({
          type: 'membership',
          refUid: uid,
          title: `Membership: ${r ? r.name : uid}`,
          description: `Approve or reject the membership application of ${r ? r.name : ''} (House ${r ? (r.house || 'N/A') : 'N/A'}, ${r ? (r.email || '') : ''}). A reason is mandatory with each vote.`
        });
        alert("Sent to the Board for a 3-of-5 vote.");
        loadPendingResidents();
        return;
      }
      const reason = prompt("Reason for rejecting this membership (required):");
      if (reason === null) return;
      if (!reason.trim()) { alert("A reason is required for every membership decision."); return; }
      await db.collection('users').doc(uid).update({ approved: false, membershipStatus: 'rejected', statusReason: reason.trim() });
      logAudit('member', uid, 'update', `Membership rejected: ${r ? r.name : uid} — ${reason.trim()}`);
      await sendNotification(uid, "Membership Decision", `Your membership application was not approved. Reason: ${reason.trim()}`, "error");
      loadPendingResidents();
    } catch(e) { alert("Error rejecting user: " + e.message); }
  };

  window.suspendResident = async function(uid) {
    if (currentUserProfile.role !== 'admin') return;
    const r = allResidents.find(item => item.uid === uid);
    if (!r) return;
    try {
      const boardCount = await getBoardMembersCount();
      if (boardCount >= 3) {
        if (await hasPendingDecision('suspension', uid)) { alert("A suspension for this resident is already awaiting a Board vote."); return; }
        if (!confirm(`Send the suspension of ${r.name} to the Board for a 3-of-5 vote?`)) return;
        await createDecision({
          type: 'suspension',
          refUid: uid,
          title: `Suspension: ${r.name}`,
          description: `Suspend the membership of ${r.name} (House ${r.house || 'N/A'}). A reason is mandatory with each vote.`
        });
        alert("Sent to the Board for a vote.");
        return;
      }
      const reason = prompt(`Reason for suspending ${r.name} (required):`);
      if (reason === null) return;
      if (!reason.trim()) { alert("A reason is required for every suspension."); return; }
      await db.collection('users').doc(uid).update({ suspended: true, membershipStatus: 'suspended', statusReason: reason.trim() });
      logAudit('member', uid, 'update', `Membership suspended: ${r.name} — ${reason.trim()}`);
      await sendNotification(uid, "Membership Suspended", `Your membership has been suspended. Reason: ${reason.trim()}`, "error");
      loadAllResidents();
    } catch(e) { alert("Error suspending resident: " + e.message); }
  };

  window.unsuspendResident = async function(uid) {
    if (currentUserProfile.role !== 'admin') return;
    const r = allResidents.find(item => item.uid === uid);
    if (!r || !confirm(`Lift the suspension of ${r.name}?`)) return;
    try {
      await db.collection('users').doc(uid).update({ suspended: false, membershipStatus: 'approved' });
      logAudit('member', uid, 'update', `Suspension lifted: ${r.name}`);
      await sendNotification(uid, "Suspension Lifted", "Your membership suspension has been lifted. Welcome back!", "success");
      loadAllResidents();
    } catch(e) { alert("Error: " + e.message); }
  };

})();
</script>
</body>
</html>
