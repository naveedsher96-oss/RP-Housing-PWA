<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<title>Roshan Pakistan Housing Society</title>
<meta name="theme-color" content="#10142A" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Roshan RPHS" />

<!-- Firebase Compatibility SDKs -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<!-- jsPDF for Admin PDF Export -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
  :root{
    --bg:#10142A;
    --bg-elevated:#171C3B;
    --bg-elevated-2:#1E2447;
    --bg-elevated-3:#242B54;
    --accent:#F2A93B;
    --accent-2:#FFC670;
    --accent-soft:rgba(242,169,59,0.14);
    --text:#F1F2F9;
    --text-muted:#9AA0C3;
    --text-faint:#6B7099;
    --success:#34B398;
    --success-soft:rgba(52,179,152,0.14);
    --danger:#E5615A;
    --danger-soft:rgba(229,97,90,0.14);
    --warning:#F2A93B;
    --warning-soft:rgba(242,169,59,0.14);
    --info:#6E8FF2;
    --info-soft:rgba(110,143,242,0.14);
    --border:rgba(255,255,255,0.08);
    --border-soft:rgba(255,255,255,0.05);
    --radius:16px;
    --radius-sm:10px;
    --shadow:0 8px 30px rgba(0,0,0,0.35);
    --font-display:'Fraunces', serif;
    --font-body:'Manrope', -apple-system, BlinkMacSystemFont, sans-serif;
    --font-mono:'JetBrains Mono', monospace;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    background:
      radial-gradient(circle at 20% -10%, rgba(242,169,59,0.10), transparent 45%),
      radial-gradient(circle at 90% 0%, rgba(110,143,242,0.08), transparent 40%),
      var(--bg);
    color:var(--text);
    font-family:var(--font-body);
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  #app{
    max-width:520px;
    margin:0 auto;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    position:relative;
    padding-bottom:calc(78px + env(safe-area-inset-bottom));
  }
  a{color:inherit;}
  button{font-family:inherit;}
  ::selection{background:var(--accent-soft);}

  .topbar{
    position:sticky; top:0; z-index:30;
    padding:calc(16px + env(safe-area-inset-top)) 18px 14px;
    background:linear-gradient(180deg, rgba(16,20,42,0.97), rgba(16,20,42,0.88) 70%, rgba(16,20,42,0));
    backdrop-filter:blur(10px);
    display:flex; align-items:center; gap:10px;
    border-bottom:1px solid var(--border-soft);
  }
  .brand-mark{
    width:42px; height:42px; border-radius:12px;
    background:#fff;
    box-shadow:0 0 0 1px rgba(255,255,255,0.08), 0 0 18px 2px rgba(242,169,59,0.45);
    display:flex; align-items:center; justify-content:center;
    flex:none; padding:4px; overflow:hidden;
  }
  .brand-mark img{ width:100%; height:100%; object-fit:contain; display:block; }
  .brand-text{flex:1; min-width:0;}
  .brand-text .name{font-family:var(--font-display); font-weight:600; font-size:16.5px; line-height:1.2; letter-spacing:0.1px;}
  .brand-text .sub{font-size:11.5px; color:var(--text-muted); margin-top:2px; display:flex; align-items:center; gap:6px;}
  .role-pill{
    font-size:10.5px; font-weight:700; letter-spacing:0.4px; text-transform:uppercase;
    padding:2px 8px; border-radius:20px; background:var(--accent-soft); color:var(--accent-2);
    border:1px solid rgba(242,169,59,0.3);
  }

  .notif-bell-btn{
    position:relative; background:var(--bg-elevated-2); border:1px solid var(--border);
    border-radius:10px; width:38px; height:38px; display:flex; align-items:center;
    justify-content:center; cursor:pointer; font-size:18px; color:var(--text);
  }
  .notif-badge{
    position:absolute; top:-4px; right:-4px; background:var(--danger); color:#fff;
    font-size:10px; font-weight:800; border-radius:10px; padding:2px 5px; min-width:16px; text-align:center;
  }

  .push-banner{
    background:var(--accent-soft); border:1px solid rgba(242,169,59,0.3);
    border-radius:12px; padding:12px 14px; margin-bottom:16px; display:flex;
    align-items:center; justify-content:space-between; gap:10px;
  }

  main{flex:1; padding:18px 18px 10px;}
  .section-title{
    font-family:var(--font-display); font-weight:600; font-size:22px; margin:4px 0 4px;
    display:flex; align-items:center; justify-content:space-between; gap:10px;
  }
  .section-sub{color:var(--text-muted); font-size:13px; margin:0 0 18px; line-height:1.5;}
  .card{
    background:var(--bg-elevated); border:1px solid var(--border);
    border-radius:var(--radius); padding:16px; margin-bottom:12px;
    box-shadow:var(--shadow); position:relative; cursor:pointer;
  }

  .ticket-no{
    font-family:var(--font-mono); font-size:11px; color:var(--accent-2);
    background:var(--accent-soft); padding:2px 6px; border-radius:4px; font-weight:600;
  }

  .badge{
    display:inline-flex; align-items:center; gap:5px; font-size:10.5px; font-weight:700; letter-spacing:.3px;
    text-transform:uppercase; padding:3px 9px; border-radius:20px; white-space:nowrap;
  }
  .badge.pending{background:var(--warning-soft); color:var(--accent-2);}
  .badge.assigned{background:var(--info-soft); color:var(--info);}
  .badge.in-progress{background:var(--info-soft); color:var(--info);}
  .badge.resolved{background:var(--success-soft); color:var(--success);}
  .badge.closed{background:rgba(255,255,255,0.1); color:var(--text-muted);}
  .badge.notice{background:var(--accent-soft); color:var(--accent-2);}
  .badge.unpaid{background:var(--warning-soft); color:var(--accent-2);}
  .badge.paid{background:var(--success-soft); color:var(--success);}
  .badge.overdue{background:var(--danger-soft); color:var(--danger);}
  .badge.cancelled{background:rgba(255,255,255,0.1); color:var(--text-muted);}
  .badge.submitted{background:var(--info-soft); color:var(--info);}
  .badge.verified{background:var(--success-soft); color:var(--success);}
  .badge.rejected{background:var(--danger-soft); color:var(--danger);}
  .badge.active{background:var(--success-soft); color:var(--success);}

  .stat-strip{display:flex; gap:8px; margin-bottom:14px;}
  .stat-box{flex:1; background:var(--bg-elevated); border:1px solid var(--border); border-radius:var(--radius-sm); padding:10px 12px;}
  .stat-box .k{font-size:10.5px; text-transform:uppercase; letter-spacing:.4px; color:var(--text-faint); font-weight:700;}
  .stat-box .v{font-family:var(--font-mono); font-size:15px; font-weight:600; margin-top:4px;}

  .chip-row{display:flex; gap:8px; margin-bottom:14px; overflow-x:auto;}
  .chip{font-size:12px; font-weight:700; padding:6px 12px; border-radius:20px; border:1px solid var(--border); background:var(--bg-elevated-2); color:var(--text-muted); cursor:pointer; white-space:nowrap;}
  .chip.active{background:var(--accent-soft); color:var(--accent-2); border-color:rgba(242,169,59,0.35);}

  .amount{font-family:var(--font-mono); font-size:19px; font-weight:600; color:var(--text);}
  .due-card{background:linear-gradient(180deg, var(--bg-elevated-2), var(--bg-elevated)); border:1px solid rgba(242,169,59,0.28); border-radius:var(--radius); padding:16px; margin-bottom:14px;}
  .filter-bar{background:var(--bg-elevated); border:1px solid var(--border); border-radius:var(--radius-sm); padding:12px 14px; margin-bottom:14px;}
  .filter-bar label{margin-top:0;}

  input[type="file"]{width:100%; padding:10px 12px; margin-top:6px; background:var(--bg-elevated-2); border:1px solid var(--border); border-radius:var(--radius-sm); color:var(--text-muted); font-size:12.5px; font-family:var(--font-body);}
  input[type="file"]::file-selector-button{background:var(--bg-elevated-3); color:var(--text); border:1px solid var(--border); border-radius:8px; padding:6px 12px; margin-right:10px; font-size:12px; font-weight:700; cursor:pointer;}
  .proof-thumb{max-width:100%; border-radius:var(--radius-sm); border:1px solid var(--border); display:block; margin:8px 0;}
  .progress{height:8px; background:var(--bg-elevated-2); border:1px solid var(--border-soft); border-radius:6px; overflow:hidden; margin:8px 0 6px;}
  .progress .fill{height:100%; background:linear-gradient(90deg, var(--accent), var(--accent-2)); border-radius:6px;}

  .btn{
    font-family:inherit; font-weight:700; font-size:13.5px; border:none; border-radius:12px;
    padding:12px 16px; cursor:pointer; display:inline-flex; align-items:center; justify-content:center; gap:8px;
  }
  .btn.primary{background:linear-gradient(180deg, var(--accent-2), var(--accent)); color:#251400; box-shadow:0 4px 16px rgba(242,169,59,0.35);}
  .btn.secondary{background:var(--bg-elevated-2); color:var(--text); border:1px solid var(--border);}
  .btn.danger{background:var(--danger); color:#fff;}
  .btn.sm{padding:6px 12px; font-size:11.5px; border-radius:8px;}
  .btn.block{width:100%;}

  label{display:block; font-size:12px; font-weight:700; color:var(--text-muted); margin:14px 0 6px; text-transform:uppercase; letter-spacing:.3px;}
  input[type=text], input[type=number], input[type=date], input[type=email], input[type=password], select, textarea{
    width:100%; background:var(--bg); border:1px solid var(--border); color:var(--text);
    border-radius:10px; padding:12px 13px; font-family:inherit; font-size:14.5px; outline:none;
  }
  textarea{resize:vertical; min-height:80px;}

  .modal-overlay{
    position:fixed; top:0; left:0; right:0; bottom:0; z-index:100;
    background:rgba(10,12,24,0.85); backdrop-filter:blur(8px);
    display:none; align-items:center; justify-content:center; padding:20px;
  }
  .modal-overlay.active{ display:flex; }
  .modal-card{
    background:var(--bg-elevated); border:1px solid var(--border);
    border-radius:var(--radius); padding:24px; max-width:480px; width:100%;
    box-shadow:var(--shadow); position:relative; max-height:85vh; overflow-y:auto;
  }
  .modal-close{
    position:absolute; top:16px; right:16px; background:var(--bg-elevated-2);
    color:var(--text-muted); border:1px solid var(--border); border-radius:50%;
    width:32px; height:32px; display:flex; align-items:center; justify-content:center;
    cursor:pointer; font-size:16px; font-weight:bold;
  }

  nav.tabbar{
    position:fixed; bottom:0; left:0; right:0; z-index:40;
    display:flex; justify-content:center;
    padding-bottom:env(safe-area-inset-bottom);
    background:linear-gradient(0deg, rgba(16,20,42,0.98), rgba(16,20,42,0.9));
    border-top:1px solid var(--border-soft); backdrop-filter:blur(10px);
  }
  .tabbar-inner{ max-width:520px; width:100%; display:flex; justify-content:space-around; padding:8px 6px; }
  .tab-btn{ background:none; border:none; color:var(--text-faint); cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:4px; padding:6px 4px; flex:1; }
  .tab-btn.active{color:var(--accent-2);}
  .tab-btn .lbl{font-size:11px; font-weight:700;}

  .onboard-wrap{min-height:100vh; display:flex; flex-direction:column; justify-content:center; padding:32px 24px; max-width:480px; margin:0 auto;}
  .onboard-title{font-family:var(--font-display); font-size:26px; font-weight:600; text-align:center; margin-bottom:6px;}
  .onboard-sub{text-align:center; color:var(--text-muted); font-size:13.5px; margin-bottom:24px;}
  .toggle-auth-mode{text-align:center; margin-top:16px; font-size:13px; color:var(--accent-2); cursor:pointer; text-decoration:underline;}
  .auth-msg{border-radius:var(--radius-sm); padding:11px 13px; font-size:13px; font-weight:600; margin-bottom:14px; border:1px solid var(--border);}
  .auth-msg.error{background:var(--danger-soft); color:var(--danger);}
  .auth-msg.success{background:var(--success-soft); color:var(--success);}
  .auth-msg.info{background:var(--info-soft); color:var(--info);}

  .menu-btn{background:var(--bg-elevated-2); color:var(--text); border:1px solid var(--border); border-radius:var(--radius-sm); width:38px; height:38px; font-size:18px; cursor:pointer; display:flex; align-items:center; justify-content:center; flex-shrink:0;}
  .drawer-overlay{position:fixed; top:0; left:0; right:0; bottom:0; z-index:90; background:rgba(10,12,24,0.6); backdrop-filter:blur(3px); opacity:0; pointer-events:none; transition:opacity .25s ease;}
  .drawer-overlay.open{opacity:1; pointer-events:auto;}
  .drawer{position:fixed; top:0; bottom:0; left:0; z-index:95; width:260px; max-width:80vw; background:var(--bg-elevated); border-right:1px solid var(--border); transform:translateX(-105%); transition:transform .25s ease; display:flex; flex-direction:column; padding:18px 14px calc(18px + env(safe-area-inset-bottom));}
  .drawer.open{transform:translateX(0);}
  .drawer-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; padding:0 6px;}
  .drawer-title{font-family:var(--font-display); font-size:17px; font-weight:600; color:var(--accent-2);}
  .drawer-item{display:flex; align-items:center; gap:12px; width:100%; background:none; border:none; color:var(--text-muted); font-family:inherit; font-size:14.5px; font-weight:600; padding:12px 12px; border-radius:var(--radius-sm); cursor:pointer; text-align:left;}
  .drawer-item:hover{background:var(--bg-elevated-2);}
  .drawer-item.active{background:var(--accent-soft); color:var(--accent-2);}
  .drawer-item .ico{font-size:17px; width:22px; text-align:center;}
  .drawer-footer{margin-top:auto; border-top:1px solid var(--border-soft); padding-top:10px;}

  .fam-sect-title{font-family:var(--font-display); font-size:16px; font-weight:700; color:var(--accent-2); margin-top:22px; padding-top:14px; border-top:1px solid var(--border);}
  .fam-hint{font-size:12px; color:var(--text-muted); margin-top:4px;}
  .fam-member{background:var(--bg-elevated-2); border:1px solid var(--border); border-radius:12px; padding:12px 14px; margin-top:10px;}
  .fam-member .fam-head{display:flex; align-items:center; gap:10px; font-weight:700; font-size:14px; cursor:pointer;}
  .fam-member input[type=checkbox]{width:18px; height:18px; accent-color:var(--accent); margin:0;}
  .fam-grid2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .fam-add-btn{background:none; border:1px dashed var(--accent); color:var(--accent); border-radius:10px; padding:9px; width:100%; font-size:13px; font-weight:600; margin-top:10px; cursor:pointer;}
</style>
</head>
<body>

<div id="app"></div>

<!-- Modal Container -->
<div id="modal-view" class="modal-overlay">
  <div class="modal-card">
    <button class="modal-close" onclick="closeModal()">✕</button>
    <div id="modal-body"></div>
  </div>
</div>

<script>
(function(){
  "use strict";

  function escapeHtml(str) {
    if (!str) return '';
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#039;');
  }

  const firebaseConfig = {
    apiKey: "AIzaSyA5jR_KvDtN52sIUQiYffXL_1pcoN5vNpk",
    authDomain: "rp-housing-society.firebaseapp.com",
    projectId: "rp-housing-society",
    storageBucket: "rp-housing-society.firebasestorage.app",
    messagingSenderId: "964175352040",
    appId: "1:964175352040:web:a5aadfe8bf9a6d53af395d",
    measurementId: "G-ZKW41KY8QX"
  };

  let db = null;
  let auth = null;
  let messaging = null;

  // Web Push certificate key pair from Firebase Console → Project settings → Cloud Messaging → Web configuration.
  const FCM_VAPID_KEY = 'BPowhgKlPnW9Z-SKzoNRj-pbW7Q3P0oufZYePF3daGZ187M1umpFb211xzTNPUrgg8yNuhBvbKij65bIWBaRICM';

  try {
    if (typeof firebase !== 'undefined') {
      if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
      db = firebase.firestore();
      auth = firebase.auth();

      Promise.resolve(firebase.messaging.isSupported()).then(supported => {
        if (supported) {
          messaging = firebase.messaging();
          initPushMessaging();
        }
      }).catch(err => console.log("Messaging unsupported:", err));
    }
  } catch(e) {
    console.error("Firebase Init Error:", e);
  }

  // Application State Variables
  let currentUserProfile = null;
  let registrationInProgress = false;
  let authMode = 'login'; // 'login' | 'register' | 'reset'
  let authMessage = null; // { type: 'error'|'success'|'info', text }
  let wasSignedIn = false;
  let manualSignOut = false;
  let activeTab = 'notices';
  let notifications = [];
  let pendingResidents = [];
  let allResidents = [];
  let noticesList = [];
  let pollsList = [];
  let ticketsList = [];
  let billsList = [];
  let billFilterStatus = 'all';
  let societySettings = null;
  let fundsList = [];
  let fundContribsList = [];
  let ticketFilterMonth = 'all';
  let ticketFilterStatus = 'all';
  let expensesList = [];
  let volunteersList = [];
  let decisionsList = [];
  let auditList = [];
  let archivedRecords = [];
  let boardMembersCount = null;

  const FUND_CATEGORIES = ['Zakat', 'Khairat / Sadaqat', 'Welfare', 'Mosque', 'Sanitation', 'Funeral', 'Maintenance', 'Development', 'Other'];
  const PAYMENT_METHODS = ['Bank Transfer', 'EasyPaisa', 'JazzCash', 'Cash'];
  const EXPENSE_CATEGORIES = ['Utilities', 'Welfare', 'Maintenance', 'Sanitation', 'Security', 'Mosque', 'Events', 'Other'];

  function isStaff() {
    return currentUserProfile && ['admin', 'board', 'superadmin'].includes(currentUserProfile.role);
  }
  function isBoard() { return currentUserProfile && (currentUserProfile.role === 'board' || currentUserProfile.boardMember === true); }
  function isSuperAdmin() { return currentUserProfile && (currentUserProfile.role === 'superadmin' || currentUserProfile.superAdmin === true); }
  function roleLabel() {
    const extras = [];
    if (currentUserProfile.superAdmin === true && currentUserProfile.role !== 'superadmin') extras.push('super admin');
    if (currentUserProfile.boardMember === true && currentUserProfile.role !== 'board') extras.push('board');
    return currentUserProfile.role + (extras.length ? ' + ' + extras.join(' + ') : '');
  }

  // Immutable audit trail: every significant mutation is journaled here.
  function logAudit(entityType, entityId, action, details) {
    if (!db || !currentUserProfile) return Promise.resolve();
    return db.collection('audit_log').add({
      entityType,
      entityId: entityId || '',
      action,
      details: details || '',
      performedBy: currentUserProfile.name,
      performedByUid: auth.currentUser ? auth.currentUser.uid : '',
      role: currentUserProfile.role,
      timestamp: firebase.firestore.FieldValue.serverTimestamp()
    }).catch(err => console.error("Audit log write failed:", err));
  }

  async function getBoardMembersCount() {
    if (boardMembersCount !== null) return boardMembersCount;
    try {
      const [roleSnap, flagSnap] = await Promise.all([
        db.collection('users').where('role', '==', 'board').get(),
        db.collection('users').where('boardMember', '==', true).get()
      ]);
      const seen = {};
      roleSnap.docs.concat(flagSnap.docs).forEach(d => { seen[d.id] = d.data(); });
      boardMembersCount = Object.values(seen).filter(u => u.approved !== false).length;
    } catch(e) {
      console.error("Error counting board members:", e);
      boardMembersCount = 0;
    }
    return boardMembersCount;
  }

  const appEl = document.getElementById('app');

  // Observer
  if (auth) {
    auth.onAuthStateChanged(async (user) => {
      if (registrationInProgress) return; 

      if (user) {
        try {
          const userDoc = await db.collection('users').doc(user.uid).get();
          if (userDoc.exists) {
            currentUserProfile = { uid: user.uid, email: user.email, ...userDoc.data() };
            wasSignedIn = true;
            if (['admin', 'board'].includes(currentUserProfile.role) && activeTab === 'notices') activeTab = 'dashboard';
            saveDeviceToken();
          } else {
            currentUserProfile = null;
            authMessage = { type: 'error', text: 'No resident record was found for this account. Please register or contact the administrator.' };
            await auth.signOut();
            return;
          }
        } catch(e) {
          console.error("Failed fetching user profile:", e);
          currentUserProfile = null;
          authMessage = { type: 'error', text: friendlyAuthError(e) };
          try { await auth.signOut(); } catch(_) {}
          return;
        }
      } else {
        currentUserProfile = null;
        if (wasSignedIn) {
          authMessage = manualSignOut
            ? { type: 'success', text: 'You have been signed out successfully.' }
            : { type: 'info', text: 'Your session has expired. Please sign in again.' };
          wasSignedIn = false;
          manualSignOut = false;
          authMode = 'login';
        }
      }
      render();
    });
  }

  function initPushMessaging() {

  function saveDeviceToken() {
    if (!messaging || !currentUserProfile || !auth.currentUser) return;
    if (!FCM_VAPID_KEY) { console.log('FCM VAPID key not configured; push disabled.'); return; }
    navigator.serviceWorker.register('firebase-messaging-sw.js')
      .then(reg => messaging.getToken({ vapidKey: FCM_VAPID_KEY, serviceWorkerRegistration: reg }))
      .then((currentToken) => {
      if (currentToken && db) {
        db.collection('fcm_tokens').doc(auth.currentUser.uid).set({
          token: currentToken,
          uid: auth.currentUser.uid,
          name: currentUserProfile.name,
          role: currentUserProfile.role,
          updatedAt: firebase.firestore.FieldValue.serverTimestamp()
        }, { merge: true }).catch(err => console.error("FCM Token Save Error:", err));
      }
    }).catch((err) => console.log('Push token registration error:', err));
  }

  // --- BIOMETRIC (FINGERPRINT) SIGN-IN ---
  // The saved login is encrypted with a non-extractable AES key kept in IndexedDB and is
  // only used after the device's fingerprint/face check (WebAuthn platform authenticator).
  function bufToB64(buf) { return btoa(String.fromCharCode(...new Uint8Array(buf))); }
  function b64ToBuf(b64) { return Uint8Array.from(atob(b64), c => c.charCodeAt(0)).buffer; }
  function bioSupported() { return !!(window.PublicKeyCredential && navigator.credentials && window.isSecureContext && window.crypto && crypto.subtle); }
  function bioEnrolled() { try { return !!localStorage.getItem('bioCred'); } catch(_) { return false; } }

  function bioDB() {
    return new Promise((resolve, reject) => {
      const rq = indexedDB.open('rphs-bio', 1);
      rq.onupgradeneeded = () => rq.result.createObjectStore('keys');
      rq.onsuccess = () => resolve(rq.result);
      rq.onerror = () => reject(rq.error);
    });
  }
  async function bioStoreKey(key) {
    const d = await bioDB();
    return new Promise((resolve, reject) => {
      const tx = d.transaction('keys', 'readwrite');
      tx.objectStore('keys').put(key, 'aes');
      tx.oncomplete = resolve;
      tx.onerror = () => reject(tx.error);
    });
  }
  async function bioGetKey() {
    const d = await bioDB();
    return new Promise((resolve, reject) => {
      const rq = d.transaction('keys').objectStore('keys').get('aes');
      rq.onsuccess = () => resolve(rq.result || null);
      rq.onerror = () => reject(rq.error);
    });
  }
  async function bioDelKey() {
    const d = await bioDB();
    return new Promise((resolve) => {
      const tx = d.transaction('keys', 'readwrite');
      tx.objectStore('keys').delete('aes');
      tx.oncomplete = resolve;
      tx.onerror = resolve;
    });
  }

  async function enableBiometricSignIn(email, password) {
    const cred = await navigator.credentials.create({ publicKey: {
      challenge: crypto.getRandomValues(new Uint8Array(32)),
      rp: { name: 'Roshan Housing Society' },
      user: { id: crypto.getRandomValues(new Uint8Array(16)), name: email, displayName: email },
      pubKeyCredParams: [{ type:'public-key', alg:-7 }, { type:'public-key', alg:-257 }],
      authenticatorSelection: { authenticatorAttachment:'platform', userVerification:'required' },
      timeout: 60000
    }});
    const key = await crypto.subtle.generateKey({ name:'AES-GCM', length:256 }, false, ['encrypt','decrypt']);
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const ct = await crypto.subtle.encrypt({ name:'AES-GCM', iv }, key, new TextEncoder().encode(JSON.stringify({ email, password })));
    await bioStoreKey(key);
    localStorage.setItem('bioCred', JSON.stringify({ id: bufToB64(cred.rawId), iv: bufToB64(iv), ct: bufToB64(ct) }));
  }

  async function biometricSignIn() {
    const rec = JSON.parse(localStorage.getItem('bioCred'));
    await navigator.credentials.get({ publicKey: {
      challenge: crypto.getRandomValues(new Uint8Array(32)),
      allowCredentials: [{ type:'public-key', id: b64ToBuf(rec.id) }],
      userVerification: 'required',
      timeout: 60000
    }});
    const key = await bioGetKey();
    if (!key) throw new Error('Fingerprint data is missing on this device. Please sign in with your password.');
    const pt = await crypto.subtle.decrypt({ name:'AES-GCM', iv: b64ToBuf(rec.iv) }, key, b64ToBuf(rec.ct));
    const { email, password } = JSON.parse(new TextDecoder().decode(pt));
    await auth.signInWithEmailAndPassword(email, password);
  }

  window.disableBiometricSignIn = function() {

  function initFamilySection(containerId, family, otherDependents) {
    family = family || {};

      father: family.father || null,
      mother: family.mother || null,
      spouse: family.spouse || null,
      sons: Array.isArray(family.sons) ? family.sons.slice() : [],

  function drawFamilySection(containerId) {
    const st = familyStates[containerId];
    const el = document.getElementById(containerId);
    let html = `
      <div class="fam-sect-title">Family Members Living With You</div>
      <div class="fam-hint">Tick a box only for the family members who live with you, then fill their details.</div>`;

    FAMILY_SINGLES.forEach(([key, label]) => {
      const on = !!st[key];
      html += `
        <div class="fam-member">
          <label class="fam-head" style="margin:0; text-transform:none; font-size:14px; color:var(--text); letter-spacing:0;">
            <input type="checkbox" data-fam-toggle="${key}" ${on ? 'checked' : ''}> ${label}
          </label>
          ${on ? `<div>${famFieldsHTML(containerId + '-' + key, label + "'s", st[key], false)}</div>` : ''}
        </div>`;
    });

    FAMILY_MULTIS.forEach(([key, label]) => {
      const on = st[key].length > 0;
      html += `
        <div class="fam-member">
          <label class="fam-head" style="margin:0; text-transform:none; font-size:14px; color:var(--text); letter-spacing:0;">
            <input type="checkbox" data-fam-toggle="${key}" ${on ? 'checked' : ''}> ${label}(s)
          </label>

          ${on ? `<button type="button" class="fam-add-btn" data-fam-add="${key}">+ Add another ${label.toLowerCase()}</button>` : ''}
        </div>`;
    });

    html += `
      <label>Other Dependents (optional)</label>
      <textarea id="${containerId}-other" rows="2" placeholder="Anyone else living with you (e.g. brother, domestic staff)...">${escapeHtml(st.other)}</textarea>`;

    el.innerHTML = html;

    el.querySelectorAll('[data-fam-toggle]').forEach(cb => {
      cb.addEventListener('change', (e) => {
        syncFamilyInputs(containerId);
        const key = e.target.getAttribute('data-fam-toggle');
        if (FAMILY_SINGLES.some(([k]) => k === key)) {
          st[key] = e.target.checked ? { name:'', cnic:'', bloodGroup:'' } : null;
        } else {
          st[key] = e.target.checked ? [{ name:'', cnic:'', bloodGroup:'' }] : [];
        }
        drawFamilySection(containerId);
      });
    });
    el.querySelectorAll('[data-fam-add]').forEach(btn => {
      btn.addEventListener('click', () => {
        syncFamilyInputs(containerId);
        st[btn.getAttribute('data-fam-add')].push({ name:'', cnic:'', bloodGroup:'' });
        drawFamilySection(containerId);
      });
    });
  }

  function readFamMember(idBase) {
    const nameEl = document.getElementById(idBase + '-name');
    if (!nameEl) return null;
    return {
      name: nameEl.value.trim(),
      cnic: document.getElementById(idBase + '-cnic').value.trim(),
      bloodGroup: document.getElementById(idBase + '-blood').value
    };
  }

  function syncFamilyInputs(containerId) {
    const st = familyStates[containerId];
    FAMILY_SINGLES.forEach(([key]) => {
      if (st[key]) st[key] = readFamMember(containerId + '-' + key) || st[key];
    });
    FAMILY_MULTIS.forEach(([key]) => {
      st[key] = st[key].map((m, i) => readFamMember(containerId + '-' + key + '-' + i) || m);
    });
    const otherEl = document.getElementById(containerId + '-other');
    if (otherEl) st.other = otherEl.value.trim();
  }

  function familySummaryText(family, other) {
    family = family || {};
    const parts = [];
    const fmt = (label, m) => label + ': ' + m.name + (m.bloodGroup ? ' (' + m.bloodGroup + ')' : '') + (m.cnic ? ', CNIC ' + m.cnic : '');
    FAMILY_SINGLES.forEach(([key, label]) => { if (family[key] && family[key].name) parts.push(fmt(label, family[key])); });
    FAMILY_MULTIS.forEach(([key, label]) => (family[key] || []).forEach((m, i) => { if (m.name) parts.push(fmt(label + ' ' + (i+1), m)); }));
    if (other) parts.push('Other: ' + other);
    return parts.join('\n') || 'None';
  }

  function collectFamilySection(containerId) {
    syncFamilyInputs(containerId);
    const st = familyStates[containerId];
    const check = (label, m, cnicOptional) => {
      if (!m.name) throw new Error('Please enter the name for ' + label + ' (or untick the box).');
      if (!m.bloodGroup) throw new Error('Please select the blood group for ' + label + '.');
      if (!cnicOptional && !m.cnic) throw new Error('Please enter the CNIC for ' + label + '.');
    };
    FAMILY_SINGLES.forEach(([key, label]) => { if (st[key]) check(label, st[key], false); });
    FAMILY_MULTIS.forEach(([key, label]) => st[key].forEach((m, i) => check(label + ' ' + (i+1), m, true)));
    const family = { father: st.father, mother: st.mother, spouse: st.spouse, sons: st.sons, daughters: st.daughters };
    return { family, otherDependents: st.other, familyDetails: familySummaryText(family, st.other) };
  }

        return 'That email address is not valid. Please check it and try again.';
      case 'auth/user-not-found':
        return 'No account was found with this email. Please register first or check the email address.';
      case 'auth/wrong-password':
        return 'Incorrect password. Please try again or use "Forgot password?" to reset it.';
      case 'auth/invalid-credential':
      case 'auth/invalid-login-credentials':
        return 'Incorrect email or password. Please try again or use "Forgot password?" to reset it.';
      case 'auth/network-request-failed':
        return 'Network problem — could not reach the server. Please check your internet connection and try again.';
      case 'auth/too-many-requests':
        return 'Too many failed attempts. Please wait a few minutes and try again, or reset your password.';
      case 'auth/user-disabled':
        return 'This account has been disabled. Please contact the society administrator.';
      case 'auth/email-already-in-use':
        return 'An account with this email already exists. Please sign in instead.';
      case 'auth/weak-password':
        return 'Password is too weak. Please use at least 6 characters.';
      case 'auth/requires-recent-login':
        return 'For security, please sign in again to continue.';
      case 'auth/missing-password':
        return 'Please enter your password.';
      case 'unavailable':
        return 'Network problem — could not reach the server. Please check your internet connection and try again.';
      default:
        return (err && err.message) ? err.message : 'Something went wrong. Please try again.';
    }
  }

          <input type="email" id="auth-email" placeholder="e.g. resident@rphs.pk" required />

          ${!isReset ? `
            <label>Password</label>
            <input type="password" id="auth-password" placeholder="••••••••" required minlength="6" />
          ` : ''}

          ${(!isLogin && !isReset) ? `
            <label>Full Name</label>
            <input type="text" id="auth-name" placeholder="e.g. Naveed Ahmed" required />

            <div id="house-num-wrap">
              <label>House / Plot Number</label>
              <input type="text" id="auth-house" placeholder="e.g. House 42, Block B" required />
            </div>

            <div id="phone-wrap">
              <label>Phone Number</label>
              <input type="text" id="auth-phone" placeholder="e.g. +92 300 1234567" required />
            </div>
          ` : ''}

          <button type="submit" class="btn primary block" id="auth-submit-btn" style="margin-top:20px;">
            ${isReset ? 'Send Password Reset Email' : isLogin ? 'Sign In' : 'Register Resident Account'}
          </button>
        </form>

        ${(isLogin && bioSupported() && bioEnrolled()) ? `
          <button type="button" class="btn secondary block" id="bio-signin-btn" style="margin-top:12px;">🔒 Sign in with Fingerprint</button>
        ` : ''}

        ${isLogin ? `
          <div class="toggle-auth-mode" id="forgot-password-btn" style="margin-top:14px;">Forgot password?</div>
        ` : ''}

        <div class="toggle-auth-mode" id="toggle-auth-btn">
          ${isReset ? 'Back to Sign In' : isLogin ? "Don't have an account? Register here" : 'Already registered? Sign In'}
        </div>
      </div>
    `;

    function showAuthMessage(type, text) {
      authMessage = { type, text };
      document.getElementById('auth-msg-box').innerHTML =
        `<div class="auth-msg ${type}">${escapeHtml(text)}</div>`;
    }

    const toggleBtn = document.getElementById('toggle-auth-btn');
    if (toggleBtn) {
      toggleBtn.addEventListener('click', () => {
        authMode = (authMode === 'login') ? 'register' : 'login';
        authMessage = null;
        renderOnboarding();
      });
    }

    const bioBtn = document.getElementById('bio-signin-btn');
    if (bioBtn) {
      bioBtn.addEventListener('click', async () => {
        bioBtn.disabled = true;
        bioBtn.textContent = 'Waiting for fingerprint…';
        try {
          await biometricSignIn();
        } catch(err) {
          bioBtn.disabled = false;
          bioBtn.textContent = '🔒 Sign in with Fingerprint';
          if (err && (err.code === 'auth/wrong-password' || err.code === 'auth/invalid-credential' || err.code === 'auth/user-not-found')) {
            localStorage.removeItem('bioCred');
            bioDelKey();
            showAuthMessage('error', 'Your saved fingerprint login is out of date (password changed). Please sign in with your password to re-enable it.');
            renderOnboarding();
          } else if (err && err.name === 'NotAllowedError') {
            showAuthMessage('info', 'Fingerprint sign-in was cancelled.');
          } else {
            showAuthMessage('error', friendlyAuthError(err));
          }
        }
      });
    }

    const forgotBtn = document.getElementById('forgot-password-btn');
    if (forgotBtn) {
      forgotBtn.addEventListener('click', () => {
        authMode = 'reset';
        authMessage = null;
        renderOnboarding();
      });
    }

    document.getElementById('auth-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('auth-email').value.trim();
      const submitBtn = document.getElementById('auth-submit-btn');
      const originalLabel = submitBtn.textContent;

      function setLoading(label) {
        submitBtn.disabled = true;
        submitBtn.textContent = label;
      }
      function clearLoading() {
        submitBtn.disabled = false;
        submitBtn.textContent = originalLabel;
      }

      if (isReset) {
        setLoading('Sending reset email…');
        try {
          await auth.sendPasswordResetEmail(email);
          authMode = 'login';
          authMessage = { type: 'success', text: 'Password reset email sent to ' + email + '. Check your inbox (and spam folder), then sign in with your new password.' };
          renderOnboarding();
        } catch(err) {
          clearLoading();
          showAuthMessage('error', friendlyAuthError(err));
        }
        return;
      }

      const password = document.getElementById('auth-password').value.trim();

      if (isLogin) {
        setLoading('Signing in…');
        try {
          await auth.signInWithEmailAndPassword(email, password);
          authMessage = null;
          // Successful sign-in: onAuthStateChanged loads the profile and renders the app.
          if (bioSupported() && !bioEnrolled()) {
            setTimeout(async () => {
              try {
                if (confirm('Enable fingerprint sign-in on this device for faster access?')) {
                  await enableBiometricSignIn(email, password);
                  alert('Fingerprint sign-in enabled. Next time, tap "Sign in with Fingerprint".');
                }
              } catch(bioErr) { console.log('Biometric enrollment skipped:', bioErr); }
            }, 900);
          }
        } catch(err) {
          clearLoading();
          showAuthMessage('error', friendlyAuthError(err));
        }
      } else {
        const name = document.getElementById('auth-name').value.trim();
        const house = document.getElementById('auth-house').value.trim();
        const phone = document.getElementById('auth-phone').value.trim();

        registrationInProgress = true;
        setLoading('Creating account…');

        try {
          const cred = await auth.createUserWithEmailAndPassword(email, password);

          await db.collection('users').doc(cred.user.uid).set({
            name,
            email,
            role: 'resident',
            house,
            phone,
            approved: false,
            biodataSubmitted: false,
            createdAt: firebase.firestore.FieldValue.serverTimestamp()
          });

          currentUserProfile = {
            uid: cred.user.uid,
            email,
            name,
            house,
            phone,
            role: 'resident',
            approved: false,
            biodataSubmitted: false
          };

          registrationInProgress = false;
          wasSignedIn = true;
          authMessage = null;

          try {
            await cred.user.sendEmailVerification();
          } catch (verificationError) {
            console.error("Verification email dispatch failed:", verificationError);
            alert("Account created! However, sending the verification email failed. Please use 'Resend Email Link' on the next screen.");
          }

          render();

        } catch(err) {
          registrationInProgress = false;
          clearLoading();
          showAuthMessage('error', friendlyAuthError(err));
        }
      }
    });
  }

  // --- SUBCOLLECTION NOTIFICATION SYSTEM ---
  async function sendNotification(targetUid, title, body, type = 'info') {
    if (!db || !targetUid) return;
    try {
      await db.collection('users')
        .doc(targetUid)
        .collection('notifications')
        .add({
          title: title,
          body: body,
          text: body,
          type: type,
          read: false,
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });
    } catch (err) {
      console.error("Targeted Notification failed:", err);
    }
  }

  async function broadcastNotification(title, body) {
    if (!db) return;
    try {
      const snap = await db.collection('users').where('approved', '==', true).get();
      const batchPromises = snap.docs.map(userDoc => sendNotification(userDoc.id, title, body, 'notice'));
      await Promise.all(batchPromises);
    } catch (e) {
      console.error("Broadcast failed:", e);
    }
  }

  function loadNotifications() {
    if (db && auth.currentUser) {
      db.collection('users')
        .doc(auth.currentUser.uid)
        .collection('notifications')
        .orderBy('createdAt', 'desc')
        .limit(20)
        .get()
        .then(snapshot => {
          notifications = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
          renderUnreadBadge();
        })
        .catch(err => console.error("Notifs load error:", err));
    }
  }

  function renderUnreadBadge() {
    const unreadCount = notifications.filter(n => !n.read).length;
    const bellBtn = document.querySelector('.notif-bell-btn');
    if (bellBtn) {
      const existingBadge = bellBtn.querySelector('.notif-badge');
      if (existingBadge) existingBadge.remove();
      if (unreadCount > 0) {
        bellBtn.innerHTML += `<span class="notif-badge">${unreadCount}</span>`;
      }
    }
  }

  window.openNotificationsModal = async function() {
    document.getElementById('modal-body').innerHTML = `
      <div style="font-family:var(--font-display); font-size:20px; font-weight:600; margin-bottom:12px;">Notifications</div>
      ${notifications.length ? notifications.map(n => `
        <div style="background:var(--bg-elevated-2); border:1px solid var(--border); padding:10px 12px; border-radius:10px; margin-bottom:8px;">
          ${n.title ? `<div style="font-weight:700; font-size:13px; color:var(--accent-2);">${escapeHtml(n.title)}</div>` : ''}
          <div style="font-size:13px; color:var(--text); line-height:1.4;">${escapeHtml(n.text || n.body)}</div>
        </div>
      `).join('') : '<div style="color:var(--text-muted); text-align:center; padding:20px;">No notifications yet.</div>'}
    `;
    document.getElementById('modal-view').classList.add('active');

    // Mark as read in batch
    const unreadDocs = notifications.filter(n => !n.read);
    if (unreadDocs.length && db && auth.currentUser) {
      const batch = db.batch();
      unreadDocs.forEach(n => {
        const ref = db.collection('users').doc(auth.currentUser.uid).collection('notifications').doc(n.id);
        batch.update(ref, { read: true });
      });
      await batch.commit().catch(e => console.error("Error marking notifs read:", e));
      loadNotifications();
    }
  };

  window.closeModal = function() {
    document.getElementById('modal-view').classList.remove('active');
  };

  // --- ANNOUNCEMENTS ---
  // --- ADMIN REMOVE / ARCHIVE ---
  // Announcements are deleted permanently; bills, funds and complaints are
  // archived (soft-deleted) so financial/audit records are retained.
  async function archiveRecord(collection, id, reload) {
    if (currentUserProfile.role !== 'admin') return;
    try {
      await db.collection(collection).doc(id).update({
        isDeleted: true,
        deletedAt: firebase.firestore.FieldValue.serverTimestamp(),
        deletedBy: currentUserProfile.name
      });
      logAudit(collection, id, 'soft_delete', 'Record archived by admin');
      closeModal();
      reload();
    } catch(err) {
      alert("Error removing record: " + err.message);
    }
  }

  window.deleteNotice = async function(id) {
    if (currentUserProfile.role !== 'admin') return;
    const n = noticesList.find(item => item.id === id);
    if (!confirm(`Delete the announcement "${n ? n.title : ''}" permanently?`)) return;
    try {
      await db.collection('announcements').doc(id).delete();
      logAudit('announcement', id, 'update', `Announcement "${n ? n.title : ''}" permanently deleted`);
      loadNotices();
    } catch(err) {
      alert("Error deleting announcement: " + err.message);
    }
  };

  window.archiveTicket = function(id) {
    const t = ticketsList.find(item => item.id === id);
    if (!confirm(`Remove complaint ${t ? t.ticketNo : ''}? It will be archived (kept for audit) and hidden from the list.`)) return;
    archiveRecord('tickets', id, loadTickets);
  };

  window.archiveBill = function(id) {
    const b = billsList.find(item => item.id === id);
    if (!confirm(`Remove bill ${b ? b.billNo : ''}? It will be archived (kept for audit) and hidden from the list.`)) return;
    archiveRecord('bills', id, loadBills);
  };

  window.archiveFund = function(id) {
    const f = fundsList.find(item => item.id === id);
    if (!confirm(`Remove the fund "${f ? f.title : ''}"? It will be archived (kept for audit) along with its contribution records.`)) return;
    archiveRecord('funds', id, loadFunds);
  };

  function loadNotices() {
    if (!db) return;
    db.collection('announcements').orderBy('createdAt', 'desc').get().then(snapshot => {
      noticesList = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })).filter(n => !n.isDeleted);
      renderNoticesList();
    }).catch(e => { console.error("Error loading notices:", e); showLoadError('notices-list', e); });
  }

  function renderNoticesList() {
    const listEl = document.getElementById('notices-list');

  function loadPolls() {
    if (!db) return;
    db.collection('polls').orderBy('createdAt', 'desc').get().then(snapshot => {

  function renderPollsList() {
    const listEl = document.getElementById('polls-list');
    if (!listEl) return;
    if (!pollsList.length) {
      listEl.innerHTML = '<div class="card" style="text-align:center; color:var(--text-muted);">No active polls available.</div>';
      return;
    }

    const userId = auth.currentUser.uid;

    listEl.innerHTML = pollsList.map(poll => {
      const votes = poll.votes || {};
      const hasVoted = userId in votes;
      const userVote = votes[userId];
      const options = poll.options || [];
      
      const totalVotes = Object.keys(votes).length;

      // Tally counts
      const counts = options.map((opt, idx) => {
        let count = 0;
        Object.values(votes).forEach(v => { if (v === idx) count++; });
        return count;
      });

      return `
        <div class="card" style="cursor:default;">
          <div style="font-weight:700; font-size:16px; color:var(--accent-2); margin-bottom:6px;">${escapeHtml(poll.question)}</div>
          <div style="font-size:12px; color:var(--text-muted); margin-bottom:14px;">Total Votes: ${totalVotes}</div>

          <div style="display:flex; flex-direction:column; gap:8px;">
            ${options.map((opt, idx) => {
              const count = counts[idx];
              const pct = totalVotes > 0 ? Math.round((count / totalVotes) * 100) : 0;
              const isSelected = userVote === idx;

              return `
                <div style="background:var(--bg-elevated-2); border:1px solid ${isSelected ? 'var(--accent)' : 'var(--border)'}; border-radius:10px; padding:10px 12px; position:relative; overflow:hidden;">
                  <div style="position:absolute; top:0; left:0; bottom:0; width:${pct}%; background:var(--accent-soft); z-index:0;"></div>
                  <div style="display:flex; justify-content:space-between; align-items:center; position:relative; z-index:1;">
                    <span style="font-size:13.5px; font-weight:${isSelected?'700':'500'};">${escapeHtml(opt)}</span>
                    <div style="display:flex; align-items:center; gap:10px;">
                      <span style="font-size:12px; color:var(--text-muted);">${pct}% (${count})</span>
                      ${!hasVoted ? `<button class="btn sm primary" onclick="votePoll('${poll.id}', ${idx})">Vote</button>` : ''}
                    </div>
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        </div>
      `;
    }).join('');
  }

  window.votePoll = async function(pollId, optionIndex) {
    if (!db || !auth.currentUser) return;
    try {
      const ref = db.collection('polls').doc(pollId);
      await db.runTransaction(async (transaction) => {
        const doc = await transaction.get(ref);
        if (!doc.exists) throw "Poll does not exist!";
        const data = doc.data();
        const votes = data.votes || {};
        votes[auth.currentUser.uid] = optionIndex;
        transaction.update(ref, { votes: votes });
      });
      loadPolls();
    } catch(err) {
      alert("Error casting vote: " + err);

  };

  // --- TICKETS / COMPLAINTS DIRECTORY ---
  function loadTickets() {
    if (!db) return;
    let query = db.collection('tickets').orderBy('createdAt', 'desc');
    if (currentUserProfile.role !== 'admin') {
      query = query.where('uid', '==', auth.currentUser.uid);
    }
    query.get().then(snapshot => {

      renderTicketsList();
    }).catch(e => { console.error("Error loading tickets:", e); showLoadError('tickets-list', e); });
  }

  function monthKey(date) {
    if (!date) return '';
    return date.getFullYear() + '-' + String(date.getMonth() + 1).padStart(2, '0');
  }

  function monthLabel(key) {
    const [y, m] = key.split('-');
    const names = ['January','February','March','April','May','June','July','August','September','October','November','December'];
    return names[Number(m) - 1] + ' ' + y;
  }

  function toDate(value) {
    if (!value) return null;
    if (typeof value.toDate === 'function') return value.toDate();
    const d = new Date(value);
    return isNaN(d.getTime()) ? null : d;
  }

  function formatDate(value) {
    const d = toDate(value);
    return d ? d.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' }) : 'N/A';
  }

  function lastTwelveMonths() {
    const keys = [];
    const now = new Date();
    for (let i = 0; i < 12; i++) {
      keys.push(monthKey(new Date(now.getFullYear(), now.getMonth() - i, 1)));
    }
    return keys;
  }

            <option value="all" ${ticketFilterMonth==='all'?'selected':''}>All months</option>
            ${lastTwelveMonths().map(k => `<option value="${k}" ${ticketFilterMonth===k?'selected':''}>${monthLabel(k)}</option>`).join('')}
          </select>
          <select id="ticket-filter-status" onchange="setTicketFilters()" style="flex:1;">
            <option value="all" ${ticketFilterStatus==='all'?'selected':''}>All statuses</option>
            <option value="pending" ${ticketFilterStatus==='pending'?'selected':''}>Pending</option>

            <option value="resolved" ${ticketFilterStatus==='resolved'?'selected':''}>Resolved</option>
            <option value="closed" ${ticketFilterStatus==='closed'?'selected':''}>Closed</option>
          </select>
        </div>
        <div id="ticket-filter-summary" style="font-size:12px; color:var(--text-muted); margin-top:10px;"></div>
        <button class="btn sm secondary block" style="margin-top:10px;" onclick="downloadTicketsReportPDF()">Print / Export Filtered Report</button>
      </div>
    `;
  }

  function filteredTickets() {
    return ticketsList.filter(t => {
      if (ticketFilterStatus !== 'all' && (t.status || 'pending') !== ticketFilterStatus) return false;
      if (ticketFilterMonth !== 'all') {
        const d = toDate(t.createdAt);
        if (!d || monthKey(d) !== ticketFilterMonth) return false;
      }
      return true;
    });
  }

  window.setTicketFilters = function() {
    const monthEl = document.getElementById('ticket-filter-month');

  window.downloadTicketsReportPDF = function() {
    const list = filteredTickets();
    if (!list.length) {
      alert("No complaints match the current filter.");
      return;
    }

    try {
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF();

      doc.setFont("helvetica", "bold");
      doc.setFontSize(16);
      doc.text("Roshan Pakistan Housing Society", 105, 18, { align: "center" });
      doc.setFontSize(12);
      doc.setFont("helvetica", "normal");
      doc.text("Complaints Report", 105, 26, { align: "center" });
      doc.setFontSize(10);
      doc.text(`Period: ${ticketFilterMonth === 'all' ? 'All months' : monthLabel(ticketFilterMonth)}   |   Status: ${ticketFilterStatus === 'all' ? 'All' : ticketFilterStatus}`, 105, 33, { align: "center" });
      doc.text(`Generated: ${new Date().toLocaleString('en-GB')}   |   Total: ${list.length}`, 105, 39, { align: "center" });
      doc.line(15, 44, 195, 44);

      let y = 52;
      doc.setFontSize(10);
      doc.setFont("helvetica", "bold");
      doc.text("Ticket", 15, y);
      doc.text("Date", 45, y);
      doc.text("House", 72, y);
      doc.text("Category", 112, y);
      doc.text("Status", 168, y);
      y += 6;
      doc.setFont("helvetica", "normal");

      list.forEach(t => {
        if (y > 275) {
          doc.addPage();
          y = 20;
        }
        doc.text(String(t.ticketNo || '-'), 15, y);
        doc.text(formatDate(t.createdAt), 45, y);
        doc.text(doc.splitTextToSize(String(t.house || 'N/A'), 38), 72, y);
        doc.text(doc.splitTextToSize(String(t.category || '-'), 54), 112, y);
        doc.text(String(t.status || 'pending'), 168, y);
        y += 8;
      });

      doc.save(`Complaints_Report_${ticketFilterMonth === 'all' ? 'All' : ticketFilterMonth}.pdf`);
    } catch(err) {
      alert("Error generating report: " + err.message);
    }
  };

  window.downloadTicketPDF = function(ticketId) {
    const t = ticketsList.find(item => item.id === ticketId);

    try {
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF();

      doc.setFont("helvetica", "bold");
      doc.setFontSize(18);
      doc.text("Roshan Pakistan Housing Society", 105, 20, { align: "center" });

      doc.setFont("helvetica", "normal");
      doc.text("Official Complaint Record", 105, 28, { align: "center" });
      doc.line(20, 35, 190, 35);

      let y = 48;
      const addRow = (label, val) => {
        doc.setFont("helvetica", "bold");
        doc.text(label + ":", 25, y);
        doc.setFont("helvetica", "normal");
        doc.text(String(val || 'N/A'), 75, y);
        y += 10;

      addRow("Ticket Number", t.ticketNo);
      addRow("Lodged On", formatDate(t.createdAt));
      addRow("Resident", t.name);
      addRow("House / Plot", t.house);
      addRow("Category", t.category);
      addRow("Status", t.status || 'pending');
      addRow("Assigned Dept", t.department);

      y += 5;
      doc.setFont("helvetica", "bold");
      doc.text("Description:", 25, y);
      y += 8;
      doc.setFont("helvetica", "normal");
      doc.text(doc.splitTextToSize(t.description || 'N/A', 160), 25, y);

      doc.save(`Complaint_${(t.ticketNo || 'Record').replace(/\s+/g, '_')}.pdf`);

      alert("Error generating PDF: " + err.message);
    }
  };

    const status = b.status || 'unpaid';
    if (status === 'unpaid') {
      const due = toDate(b.dueDate);
      if (due && due < new Date(new Date().toDateString())) return 'overdue';
    }
    return status;
  }

  function loadBills() {
    if (!db || !auth.currentUser) return;
    const query = isStaff()
      ? db.collection('bills')
      : db.collection('bills').where('uid', '==', auth.currentUser.uid);

    query.get().then(snapshot => {
      billsList = snapshot.docs
        .map(doc => ({ id: doc.id, ...doc.data() }))
        .filter(b => !b.isDeleted)
        .sort((a, b) => {
          const da = toDate(a.createdAt), dbb = toDate(b.createdAt);
          return (dbb ? dbb.getTime() : 0) - (da ? da.getTime() : 0);
        });
      renderBillsList();
    }).catch(e => { console.error("Error loading bills:", e); showLoadError('bills-list', e); });

    loadSocietySettings().then(renderBankCard);

  // --- PAYMENT PROOF (UPLOAD + VERIFY) ---
  const PROOF_MAX_PDF_BYTES = 650 * 1024;

  function readProofFile(file) {
    return new Promise((resolve, reject) => {
      if (!file) return reject(new Error("Please choose a file."));
      const isImage = file.type === 'image/png' || file.type === 'image/jpeg';
      const isPdf = file.type === 'application/pdf';
      if (!isImage && !isPdf) return reject(new Error("Only PNG, JPEG or PDF files are allowed."));

      if (isPdf) {
        if (file.size > PROOF_MAX_PDF_BYTES) return reject(new Error("PDF is too large (max 650 KB). Please upload a screenshot image instead."));
        const reader = new FileReader();
        reader.onload = () => resolve({ dataUrl: reader.result, type: 'pdf', name: file.name });
        reader.onerror = () => reject(new Error("Could not read the file."));
        reader.readAsDataURL(file);
        return;
      }

      const img = new Image();
      const url = URL.createObjectURL(file);
      img.onload = () => {
        URL.revokeObjectURL(url);
        const maxSide = 1280;
        const scale = Math.min(1, maxSide / Math.max(img.width, img.height));
        const canvas = document.createElement('canvas');
        canvas.width = Math.round(img.width * scale);
        canvas.height = Math.round(img.height * scale);
        canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
        const dataUrl = canvas.toDataURL('image/jpeg', 0.75);
        if (dataUrl.length > 950 * 1024) return reject(new Error("Image is too large even after compression. Please crop it and try again."));
        resolve({ dataUrl, type: 'image', name: file.name });
      };
      img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("Could not read the image file.")); };
      img.src = url;
    });
  }

  function proofSectionHtml(kind, record) {
    if (!record.proofData) return '';
    return `
      <div style="margin-bottom:14px;">
        <label style="margin-top:0;">Payment Proof ${record.proofName ? '(' + escapeHtml(record.proofName) + ')' : ''}</label>
        ${record.proofType === 'image'
          ? `<img class="proof-thumb" src="${record.proofData}" alt="Payment proof" onclick="viewProofFile('${kind}', '${record.id}')" style="cursor:pointer;" />`
          : `<button class="btn sm secondary" style="margin-top:6px;" onclick="viewProofFile('${kind}', '${record.id}')">Open PDF Proof</button>`}
        ${record.paymentRef ? `<div style="font-size:12.5px; color:var(--text-muted); margin-top:6px;">Transaction Ref: <span style="font-family:var(--font-mono);">${escapeHtml(record.paymentRef)}</span></div>` : ''}
        ${record.proofUploadedAt ? `<div style="font-size:11.5px; color:var(--text-faint); margin-top:2px;">Uploaded: ${escapeHtml(formatDate(record.proofUploadedAt))}</div>` : ''}
      </div>
    `;
  }

  window.viewProofFile = function(kind, id) {
    const record = kind === 'bill'
      ? billsList.find(item => item.id === id)
      : fundContribsList.find(item => item.id === id);
    if (!record || !record.proofData) return;
    try {
      const parts = record.proofData.split(',');
      const mime = parts[0].match(/data:([^;]+)/)[1];
      const bytes = atob(parts[1]);
      const arr = new Uint8Array(bytes.length);
      for (let i = 0; i < bytes.length; i++) arr[i] = bytes.charCodeAt(i);
      window.open(URL.createObjectURL(new Blob([arr], { type: mime })), '_blank');
    } catch(err) {
      alert("Could not open the proof file: " + err.message);
    }
  };

          <label>Update Status</label>
          <select id="admin-bill-status">
            <option value="unpaid" ${(b.status||'unpaid')==='unpaid'?'selected':''}>Unpaid</option>
            <option value="submitted" ${b.status==='submitted'?'selected':''}>In Review</option>
            <option value="paid" ${b.status==='paid'?'selected':''}>Paid</option>
            <option value="cancelled" ${b.status==='cancelled'?'selected':''}>Cancelled</option>

        try {
          const update = { status: newStatus, paymentRef };
          if (newStatus === 'paid') update.paidAt = firebase.firestore.FieldValue.serverTimestamp();
          await db.collection('bills').doc(billId).update(update);

  window.markBillPaid = async function(billId) {
    const b = billsList.find(item => item.id === billId);
    if (!b || currentUserProfile.role !== 'admin') return;
    if (!confirm(`Mark ${b.billNo} (${formatMoney(b.amount)}) as paid?`)) return;

    try {
      await db.collection('bills').doc(billId).update({
        status: 'paid',
        paidAt: firebase.firestore.FieldValue.serverTimestamp()
      });
      logAudit('bill', billId, 'update', `Bill ${b.billNo} manually marked paid (${formatMoney(b.amount)})`);
      await sendNotification(b.uid, `Payment Received (${b.billNo})`, `Your payment of ${formatMoney(b.amount)} for ${b.period} has been recorded.`, 'success');
      loadBills();
    } catch(err) {
      alert("Error updating bill: " + err.message);
    }
  };

  window.downloadBillPDF = function(billId) {
    const b = billsList.find(item => item.id === billId);
    if (!b) return;
    const status = billStatus(b);

    try {
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF();

      doc.setFont("helvetica", "bold");
      doc.setFontSize(18);
      doc.text("Roshan Pakistan Housing Society", 105, 20, { align: "center" });
      doc.setFontSize(12);
      doc.setFont("helvetica", "normal");
      doc.text(status === 'paid' ? "Maintenance Payment Receipt" : "Maintenance Bill / Invoice", 105, 28, { align: "center" });
      doc.line(20, 35, 190, 35);

      let y = 48;
      const addRow = (label, val) => {
        doc.setFont("helvetica", "bold");
        doc.text(label + ":", 25, y);
        doc.setFont("helvetica", "normal");
        doc.text(String(val || 'N/A'), 85, y);
        y += 10;
      };

      addRow("Bill Number", b.billNo);
      addRow("Resident", b.name);
      addRow("House / Plot", b.house);
      addRow("Category", b.category);
      addRow("Billing Period", b.period);
      addRow("Amount", formatMoney(b.amount));
      addRow("Due Date", formatDate(b.dueDate));
      addRow("Status", status);
      if (status === 'paid') addRow("Paid On", formatDate(b.paidAt));
      if (b.paymentRef) addRow("Payment Reference", b.paymentRef);
      if (b.verifiedBy) addRow("Verified By", b.verifiedBy);
      if (b.proofData) addRow("Payment Proof", "On file" + (b.proofName ? " (" + b.proofName + ")" : ""));

      y += 5;
      doc.setFont("helvetica", "bold");
      doc.text("Notes:", 25, y);
      y += 8;
      doc.setFont("helvetica", "normal");
      doc.text(doc.splitTextToSize(b.notes || 'N/A', 160), 25, y);

      doc.save(`${status === 'paid' ? 'Receipt' : 'Bill'}_${(b.billNo || 'Record').replace(/\s+/g, '_')}.pdf`);
    } catch(err) {
      alert("Error generating PDF: " + err.message);
    }
  };

  // --- COMMUNITY FUNDS ---
  function contribQueries() {
    // Staff can read all contributions; residents can only read verified ones
    // (for fund totals) plus their own — collection-wide reads are denied by rules.
    if (isStaff()) return [db.collection('fund_contributions').get()];
    return [
      db.collection('fund_contributions').where('status', '==', 'verified').get(),
      db.collection('fund_contributions').where('uid', '==', auth.currentUser.uid).get()
    ];
  }

  function mergeContribSnaps(snaps) {
    const map = {};
    snaps.forEach(snap => snap.docs.forEach(doc => { map[doc.id] = { id: doc.id, ...doc.data() }; }));
    return Object.values(map);
  }

  function loadFunds() {
    if (!db || !auth.currentUser) return;
    Promise.all([
      db.collection('funds').get(),
      Promise.all(contribQueries()).then(mergeContribSnaps)
    ]).then(([fundsSnap, contribDocs]) => {
      fundsList = fundsSnap.docs
        .map(doc => ({ id: doc.id, ...doc.data() }))
        .filter(f => !f.isDeleted)
        .sort((a, b) => {
          const da = toDate(a.createdAt), dbb = toDate(b.createdAt);
          return (dbb ? dbb.getTime() : 0) - (da ? da.getTime() : 0);
        });
      fundContribsList = contribDocs
        .sort((a, b) => {
          const da = toDate(a.createdAt), dbb = toDate(b.createdAt);
          return (dbb ? dbb.getTime() : 0) - (da ? da.getTime() : 0);
        });
      renderFundsList();
    }).catch(e => { console.error("Error loading funds:", e); showLoadError('funds-list', e); });
  }

  function fundVerifiedTotal(fundId) {
    return fundContribsList.filter(c => c.fundId === fundId && c.status === 'verified').reduce((s, c) => s + Number(c.amount || 0), 0);
  }

  function renderFundsList() {
    const listEl = document.getElementById('funds-list');
    if (!listEl) return;
    const isAdmin = currentUserProfile.role === 'admin';

    const summaryEl = document.getElementById('funds-summary');
    if (summaryEl && isAdmin) {
      const totalCollected = fundContribsList.filter(c => c.status === 'verified').reduce((s, c) => s + Number(c.amount || 0), 0);
      const pendingCount = fundContribsList.filter(c => c.status === 'submitted').length;
      summaryEl.innerHTML = `
        <div class="stat-strip">
          <div class="stat-box"><div class="k">Active Funds</div><div class="v">${fundsList.filter(f => (f.status || 'active') === 'active').length}</div></div>
          <div class="stat-box"><div class="k">Collected</div><div class="v" style="color:var(--success);">${formatMoney(totalCollected)}</div></div>
          <div class="stat-box"><div class="k">To Verify</div><div class="v" style="color:${pendingCount ? 'var(--info)' : 'var(--text)'};">${pendingCount}</div></div>
        </div>
      `;
    }

    if (!fundsList.length) {
      listEl.innerHTML = `<div class="card" style="text-align:center; color:var(--text-muted);">${isAdmin ? 'No funds started yet. Use "+ Start Fund" to raise one.' : 'No community funds are running right now.'}</div>`;
      return;
    }

    listEl.innerHTML = fundsList.map(f => {
      const status = f.status || 'active';
      const collected = fundVerifiedTotal(f.id);
      const target = Number(f.targetAmount || 0);
      const pct = target > 0 ? Math.min(100, Math.round(collected / target * 100)) : 0;
      const contributors = new Set(fundContribsList.filter(c => c.fundId === f.id && c.status === 'verified').map(c => c.uid)).size;
      const myPending = fundContribsList.filter(c => c.fundId === f.id && c.uid === auth.currentUser.uid && c.status === 'submitted').length;
      const pendingCount = fundContribsList.filter(c => c.fundId === f.id && c.status === 'submitted').length;

      return `
        <div class="card" onclick="openFundDetailModal('${f.id}')">
          <div style="display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:6px;">
            <span style="font-weight:700; font-size:15px; color:var(--accent-2);">${escapeHtml(f.title || 'Fund')}</span>
            <span class="badge ${status}">${escapeHtml(status)}</span>
          </div>
          <div style="font-size:12.5px; color:var(--text-muted); line-height:1.5; margin-bottom:8px;">${escapeHtml((f.purpose || '').slice(0, 120))}${(f.purpose || '').length > 120 ? '…' : ''}</div>
          ${target > 0 ? `
            <div class="progress"><div class="fill" style="width:${pct}%;"></div></div>
            <div style="display:flex; justify-content:space-between; font-size:12px;">
              <span style="font-family:var(--font-mono); color:var(--success);">${formatMoney(collected)}</span>
              <span style="color:var(--text-faint);">${pct}% of ${formatMoney(target)}</span>
            </div>
          ` : `<div style="font-size:12.5px;"><span style="color:var(--text-faint);">Collected:</span> <span style="font-family:var(--font-mono); color:var(--success);">${formatMoney(collected)}</span></div>`}
          <div style="font-size:11.5px; color:var(--text-faint); margin-top:6px;">${contributors} contributor(s) · Started ${escapeHtml(formatDate(f.createdAt))}${f.deadline ? ' · Deadline ' + escapeHtml(formatDate(f.deadline)) : ''}${isAdmin && pendingCount ? ` · <span style="color:var(--info);">${pendingCount} awaiting verification</span>` : ''}${!isAdmin && myPending ? ' · <span style="color:var(--info);">Your contribution is under review</span>' : ''}</div>
          ${isAdmin ? `<button class="btn sm danger" style="margin-top:10px;" onclick="event.stopPropagation(); archiveFund('${f.id}')">Remove</button>` : ''}
        </div>
      `;
    }).join('');
  }

  window.openFundDetailModal = function(fundId) {

      </div>

      const paymentDate = document.getElementById('record-contrib-date').value;
      const r = residents.find(item => item.uid === uid);
      if (!amount || amount <= 0) { alert("Please enter a valid amount."); return; }

      try {
        await db.collection('fund_contributions').add({
          fundId: f.id,
          fundTitle: f.title,
          category: f.category || 'Other',
          uid,
          name: r ? r.name : '',
          house: r ? (r.house || '') : '',
          amount,
          currency: 'PKR',
          paymentRef,
          paymentMethod,
          paymentDate,
          proofData: '',
          proofType: '',
          proofName: '',
          status: 'verified',
          recordedBy: currentUserProfile.name,
          verifiedAt: firebase.firestore.FieldValue.serverTimestamp(),
          verifiedBy: currentUserProfile.name,
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });
        await sendNotification(uid, `Contribution Recorded (${f.title})`, `Management recorded your contribution of ${formatMoney(amount)}. Thank you for supporting the community!`, 'success');
        closeModal();
        loadFunds();
      } catch(err) {
        alert("Error recording contribution: " + err.message);
      }
    });

      });

      await sendNotification(c.uid, `Contribution Verified (${c.fundTitle})`, `Your contribution of ${formatMoney(c.amount)} has been verified. Thank you for supporting the community!`, 'success');
      closeModal();
      loadFunds();
    } catch(err) {
      alert("Error verifying contribution: " + err.message);

  window.rejectContribution = async function(contribId) {

  window.closeFund = async function(fundId) {
